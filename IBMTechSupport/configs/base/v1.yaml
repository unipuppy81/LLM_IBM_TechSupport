version: v1
experiment: base

model:
  name: Qwen2.5-1.5B-Instruct
  path: models/Qwen2.5-1.5B-Instruct
  dtype: float16

dataset:
  path: data/processed/val_clean.json
  expected_count: 135

inference:
  batch_size: 4
  max_new_tokens: 160
  do_sample: false
  num_beams: 1
  temperature: null
  top_p: null
  top_k: null

output:
  directory: evaluate_results/base/v1

prompt:
  system: You are an IBM technical support assistant. Answer technical questions using
    only your existing knowledge. If you cannot provide a reliable answer, respond
    with exactly INSUFFICIENT_INFORMATION. Otherwise, provide a concise technical
    answer in English.
  user_template: '{question}'
