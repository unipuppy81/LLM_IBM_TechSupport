 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This document will explain the steps necessary to create a group or role within the Cognos Namespace that can be used to assign only rights for Cognos Workspace Advanced and/or Cognos Workspace (or as they were formerly known in 10.1.1 / 10.1 Business Insight Advanced and/or Business Insight.). \n\nCAUSE\nIBM Cognos Licensing might require a Group of Users to be able to only access Cognos Workspace or Cognos Workspace Advanced (Business Insight or Business Insight Advanced).\n\nENVIRONMENT\nIBM Cognos Installation with Cognos Workspace (Business Insight) and Cognos Workspace Advanced (Business Insight Advanced).\n\nRESOLVING THE PROBLEM\nBased on the following steps the group or role will only have access to either Cognos Workspace (Business Insight) or Cognos Workspace Advanced (Business Insight Advanced). Even though the Role receives Traverse and Execute permissions for the Report Studio capability it will not be able to open Report Studio (this is only possible if you have Traverse and Execute permissions for the Professional User Interface Profile).\n\n\n\n\n\n"}, {"filename": "swg21568187.txt", "chunk_id": "doc_15827_chunk_0000", "text": "Title: IBM How to enable report templates for Cognos Workspace Advanced - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Report tempates are added to the templates.xml and resources.xml but do not show up in Cognos Workspace Advanced. \n\nSYMPTOM\nNo user defined report template in Cognos Workspace Advanced.\n\n\nCAUSE\nThe report template has to be enabled /referenced first to be available for Cognos Workspace Advanced. \n\nDIAGNOSING THE PROBLEM\nThe new report template in available for Report Studio but unavailable in Cognos Workspace Advanced.\n\nRESOLVING THE PROBLEM\nLike for Report Studio in the resources.xml, the new user defined report template has to be referenced as well for Cognos Workspace Advanced.\n\n\n\n\nThis can be done by editing the \"profile_bua_standalone.xml\" file locates in the folder [C10_Installation_Folder]\\webcontent\\pat\\profiles\\ . \n\nPrerequisite: the new template must be already added to the templates.xml \n\n \n\nSteps: \n\n* Open the profile_bua_standalone.xml using a text editor \n\n* Search for the listView section in the file\n\n* Add the reference to your new template: \n\n"}]}, {"id": "TRAIN_Q581", "question": "OOM exception thrown when trying to configure an ITCAM for WAS 7.2 Data Collector\n\nI am trying to configure an ITCAM for WAS 7.2.0.0.x DC using config.sh, but getting OOM exceptions, as following:\n\n./config.sh\n\nLog file name: /opt/IBM/ITM/dchome/7.2.0.0.10/data/config-trace.log.\n\nList of TCP/IP interfaces discovered:\n\n       1. ...\n     Enter a number [default is: 1]:\n     1\n     JVMDUMP039I Processing dump event \"systhrow\", detail \"java/lang/OutOfMemoryError\" at 2017/08/22 12:27:03 - please wait.\n....\n     java.lang.OutOfMemoryError: java.lang.OutOfMemoryError: Java heap space\n\nLooking at the javacore.txt files, I can see that this is the command throwing an OOM\n\n1CICMDLINE /opt/IBM/ITM/JRE/aix526/bin/java -classpath /opt/IBM/ITM/dchome/7.2.0.0.10/bin/jython/jython.jar:/opt/IBM/ITM/dchome/7.2.0.0.10/bin/lib/installbundle.jar -Xms256m -Xmx256m -Dpython.path=/opt/IBM/ITM/dchome/7.2.0.0.10/bin/lib:/opt/IBM/ITM/dchome/7.2.0.0.10/bin/lib org.python.util.jython /opt/IBM/ITM/dchome/7.2.0.0.10/bin/config.py\n\nHow could I solve this?", "answer": "Based on the retrieved documents, it seems that the OOM exception is occurring due to insufficient heap space being allocated for the JVM used by the WSAdmin tool during the configuration process. To resolve this issue, you should increase the jvmMaxMemory setting in the deployEar.xml file to allocate more memory to the wsadmin JVM. This can be done by adding the jvmMaxMemory parameter to each instance of \"<wsadmin>\" in the xml file.", "documents": [{"filename": "swg21959444.txt", "chunk_id": "doc_21647_chunk_0000", "text": "Title: IBM Configuration of the ITCAM agent on AIX leads to Java heap errors. - United States\n\nText:\nJAVA_OPTS CAMADALL CAMADINST java heap java.lang.OutOfMemoryError CFG5045E TECHNOTE (TROUBLESHOOTING)\n\nTHIS DOCUMENT APPLIES ONLY TO THE FOLLOWING LANGUAGE VERSION(S):\n US English \n\nPROBLEM(ABSTRACT)\n Configuration of the ITCAM agent on AIX leads to Java heap errors. \n\nSYMPTOM\nDuring configuration of the YN agent, you will see these errors: \n\njava.lang.OutOfMemoryError: Java heap space\nat org.python.core.PyException.tracebackHere(PyException.java:158)\nat org.python.core.PyException.tracebackHere(PyException.java:145)\nat org.python.core.PyTableCode.call(PyTableCode.java:169)\nat org.python.core.PyBaseCode.call(PyBaseCode.java:301)\nat org.python.core.PyBaseCode.call(PyBaseCode.java:141)\nat org.python.core.PyFunction.__call__(PyFunction.java:327)\nat org.python.core.PyFunction.__call__(PyFunction.java:322)\nat org.python.core.PyInstance.ifindfunction(PyInstance.java:168)\nat org.python.core.PyInstance.__findattr_ex__(PyInstance.java:148)\nat org.python.core.PyObject.__findattr__(PyObject.java:863)\nat org.python.core.PyInstance.invoke_ex(PyInstance.java:328)\n\n"}, {"filename": "swg21460411.txt", "chunk_id": "doc_14243_chunk_0003", "text": "oyment/xml/javacore.20110119.103351.1032252.0012.txt \n\n [wsadmin] JVMDUMP013I Processed dump event \"systhrow\", detail \"java/lang/OutOfMemoryError\". \n\n [wsadmin] WASX7017E: Exception received while running file \"/usr/WebSphere/CommerceServer70/config/deployment/scripts/deployEar.jacl\"; exception information: com.ibm.websphere.management.application.client.AppDeploymentException: com.ibm.websphere.management.application.client.AppDeploymentException: ADMA0092E: An unexpected exception occurred while preparing task EnsureMethodProtectionFor20EJB. Check the server machine First Failure Data Capture tool (FFDC) for more information. [Root exception is java.lang.OutOfMemoryError] \n\n [wsadmin] java.lang.OutOfMemoryError: java.lang.OutOfMemoryError\n\n\nDIAGNOSING THE PROBLEM\nThe deployEar_WC_instance_name.log is located here: \n\nWC_installdir/logs/update/actions/install/deployEar_WC_instance_name.log\n\n\nRESOLVING THE PROBLEM\nTo resolve this issue, increase the jvmMaxMemory setting in the deployEar.xml file to increase the maximum heap size for the wsadmin JVM, using the following steps: \n\n1. Open the <WCS_installdir>/config/deployment/xml/deployEar.xml file. \n\n2. Add the jvmMaxMemory parameter to each instance of \"<wsadmin\": \n\n \n\n"}, {"filename": "swg21973298.txt", "chunk_id": "doc_22599_chunk_0000", "text": "Title: IBM Content Navigator installer fails to launch with a java.lang.OutOfMemory error - United States\n\nText:\noutofmemory; java.lang.outofmemory; systhrow; JVMDUMP039I; JVMDUMP032I; configmgr.ini; .bin TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The IBM Content Navigator installer fails to launch, throwing a java.lang.OutOfMemory error. \n\nSYMPTOM\nThe installer (.bin file) fails with the following errors, seen on the command line\nJVMDUMP039I Processing dump event \"systhrow\", detail \"java/lang/OutOfMemoryError\" at 2015/12/10 8:49:17 - please wait.\nJVMDUMP032I JVM requested Heap dump using '/opt/filenet/P8/TEMPDIR/install.dir.8061160/heapdump.\n20151210.084917.8061160.0001.phd' in response to an event\nJVMDUMP010I Heap dump written to /opt/filenet/P8/TEMPDIR/install.dir. 8061160/heapdump.20151210.084917.8061160.0001.phd\n.... \n\nStack Trace:\njava.lang.OutOfMemoryError: Java heap space\nat java.io.UnixFileSystem.list(Native Method)\nat java.io.File.list(File.java:984)\"\n\n\n\nCAUSE\nThere is insufficient heap space available for the installer to run.\n\n\nENVIRONMENT\nThis issue is seen more often on AIX, Linux environments.\n\n\n\nRESOLVING THE PROBLEM\nTo resolve this issue, use one of the two solutions below: \n\n"}]}, {"id": "TRAIN_Q594", "question": "In WebSphere MQ, why am I getting AMQ9776, AMQ9777 Channel was blocked errors?\n\nIn WebSphere MQ, why am I getting AMQ9776, AMQ9777 Channel was blocked errors", "answer": "The errors AMQ9776 and AMQ9777 indicate that a channel was blocked due to multiplexing (sharing conversations) being enabled on the channel. This can happen if the active values of the channel match a record configured with USERSRC(NOACCESS), causing the channel to be blocked at the destination address. To resolve these issues, you should temporarily set the channel so that it does not use shared conversations by altering the channel definition with CHLTYPE(SVRCONN) SHARECNV(0).", "documents": [{"filename": "swg1SE67479.txt", "chunk_id": "doc_10350_chunk_0002", "text": "ion :- AMQ6125: internal MQ error\n   \n   Corresponding errors in the amqerr01.log are:\n   \n   - AMQ6125: An internal WebSphere MQ error has occurred.\n     EXPLANATION:\n     Cause . . . . . :   An internal error has occurred with\n     identifier X'20807594'...\n   - AMQ6184: An internal WebSphere MQ error has occurred.\n   - AMQ6118: An internal WebSphere MQ error has occurred\n     (X'20807594')\n   \n   \n   Additional Symptom(s) Search Keyword(s):\n   WSAS pubsub publish subscribe\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Temporarily set the channel so that it does not used shared\n   conversations:\n   ALTER CHANNEL(channel_name) CHLTYPE(SVRCONN) SHARECNV(0)\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   USERS AFFECTED:\n   IBM i users of MQSUB over a channel connection.\n   \n   \n   Platforms affected:\n   IBM iSeries\n   \n   ****************************************************************\n   PROBLEM DESCRIPTION:\n   The MQSUB call in MQ is transactional in nature and will attempt\n   to perform an internal commitment control when called. These\n   transactions may sometimes fail when performed over a channel\n   connection where multiplexing (Sharing Conversations) is\n   enabled.\n   \n"}, {"filename": "swg1IV60006.txt", "chunk_id": "doc_03685_chunk_0000", "text": "Title: IBM IV60006: MQ CLIENTS FAIL WITH 2035 (MQRC_NOT_AUTHORIZED) WHEN LONGUSERID IS NOT SET - United States\n\nText:\n  A FIX IS AVAILABLE\nFix Pack 7.1.0.6 for WebSphere MQ V7.1 [http://www-01.ibm.com/support/docview.wss?uid=swg24038863]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  MQ CLIENT fails with error 2035 (MQRC_NOT_AUTHORIZED) and\n   AMQ9777 error with\n   blank CLNTUSER will be generated by MQ 7.1/7.5 queue manager.\n   \n   AMQ9777: Channel was blocked\n   \n   EXPLANATION:\n   The inbound channel 'SYSTEM.DEF.SVRCONN' was blocked from\n   address\n   '127.0.0.1' because the active values of the channel matched a\n   record\n   configured with USERSRC(NOACCESS). The active values of the\n   channel were\n   'CLNTUSER()'.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  na\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   USERS AFFECTED:\n   Users using MQ clients that do not set LongUserId. This problem\n   likely to occur only because of a defect in MQ client that\n   results in a blank LongUserId.\n   \n   \n   Platforms affected:\n   MultiPlatform\n   \n"}, {"filename": "swg1IZ25614.txt", "chunk_id": "doc_04667_chunk_0000", "text": "Title: IBM IZ25614: WEBSPHERE MQ CHANNELS TERMINATE WITH AMQ9604 AND AMQ9208 AND GET FDCS WITH XC130003 AND RM031101 - United States\n\nText:\n  FIXES ARE AVAILABLE\nWebSphere MQ V6.0 Fix Pack 6.0.2.5 [http://www-01.ibm.com/support/docview.wss?uid=swg24020658]\nWebSphere MQ V7.0 for i5/OS Fix Pack 7.0.0.2 [http://www-01.ibm.com/support/docview.wss?uid=swg24022812]\nWebSphere MQ V7.0 Fix Pack 7.0.0.2 [http://www-01.ibm.com/support/docview.wss?uid=swg24022810]\nWebSphere MQ V7.0 Fix Pack 7.0.1.1 [http://www-01.ibm.com/support/docview.wss?uid=swg24024528]\nWebSphere MQ V7.0.1 function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function save(){localStorage.setItem(key,JSON.stringify(reviews));updateProgress();}
function field(id,name,value){reviews[id][name]=value;save();}
function render(){
 const root=document.getElementById('root');root.innerHTML='';
 cases.forEach((c,i)=>{let d=document.createElement('div');d.className='case';
 let docs=c.documents.map((x,j)=>`<details><summary>문서 ${j+1} · ${esc(x.filename)} · ${esc(x.chunk_id)}</summary><pre>${esc(x.text)}</pre></details>`).join('');
 let r=reviews[c.id];
 d.innerHTML=`<div class="id">${i+1}/${cases.length} · ${esc(c.id)}</div><p><b>질문</b></p><pre>${esc(c.question)}</pre><p><b>LLM 답변</b></p><pre>${esc(c.answer)}</pre><div class="docs"><b>RAG 근거 문서</b>${docs}</div>
 <p><label>최종 판정</label><select data-f="human_pass"><option value="">선택</option><option value="pass" ${r.human_pass==='pass'?'selected':''}>PASS</option><option value="fail" ${r.human_pass==='fail'?'selected':''}>FAIL</option></select>
 <label>원인</label><select data-f="root_cause"><option value=""></option>${['evidence','semantic','generation','other'].map(x=>`<option value="${x}" ${r.root_cause===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>위험도</label><select data-f="risk_level"><option value=""></option>${['low','medium','high'].map(x=>`<option value="${x}" ${r.risk_level===x?'selected':''}>${x}</option>`).join('')}</select></p>
