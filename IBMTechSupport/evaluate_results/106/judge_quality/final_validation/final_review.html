LITY DETAILS\nCVEID: CVE-2015-2013 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-2013]\nDESCRIPTION: IBM WebSphere MQ could allow a client to crash the channel agent when sending a specially crafted selection string.\nCVSS Base Score: 4.3\nCVSS Temporal Score: See http://xforce.iss.net/xforce/xfdb/103924 [http://xforce.iss.net/xforce/xfdb/103924] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:N/I:N/A:P) \n\nAFFECTED PRODUCTS AND VERSIONS\nIBM WebSphere MQ 7.0.1 \n\nIBM WebSphere MQ 7.0.1.12 and earlier maintenance levels\n\nREMEDIATION/FIXES\nApply the fix for APAR IV73860, which is shipped in IBM WebSphere MQ 7.0.1.13 [http://www-01.ibm.com/support/docview.wss?uid=swg21960691]\n\n"}, {"filename": "swg21696120.txt", "chunk_id": "doc_20781_chunk_0000", "text": "Title: IBM Security Bulletin: IBM WebSphere MQ potential denial of service vulnerability in command server (CVE-2014-4771) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There is a potential for a malicious user to increase the time it takes for the command server to process PCF response messages which could be exploited in such a way to cause a denial of service. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2014-4771 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-4771]\nDESCRIPTION: IBM WebSphere MQ could allow a malicious privileged user with access to put PCF inquiries to the command input queue, to craft a query that would create an artificially full reply queue. This would prevent other users from submitting queries to the system.\nCVSS Base Score: 2.1\nCVSS Temporal Score: See http://xforce.iss.net/xforce/xfdb/94842 [http://xforce.iss.net/xforce/xfdb/94842] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:H/Au:S/C:N/I:N/A:P) \n\nAFFECTED PRODUCTS AND VERSIONS\nAll IBM WebSphere MQ distributed server platforms are affected at the following releases; \n\n * IBM WebSphere MQ 7.0.1 server \n * IBM WebSphere MQ 7.1 server \n * IBM WebSphere MQ 7.5 server \n * IBM WebSphere MQ 8 server\n\n"}, {"filename": "swg22001468.txt", "chunk_id": "doc_24873_chunk_0000", "text": "Title: IBM Security Bulletin: IBM MQ and IBM WebSphere MQ Trace enablement could cause denial of service (CVE-2017-1117) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM MQ could allow an authenticated user to cause a denial of service to the MQXR channel when trace is enabled. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2017-1117 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-1117]\nDESCRIPTION: IBM WebSphere MQ could allow an authenticated user to cause a denial of service to the MQXR channel when trace is enabled.\nCVSS Base Score: 3.1\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/121155 [https://exchange.xforce.ibmcloud.com/vulnerabilities/121155] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:N/A:L) \n\nAFFECTED PRODUCTS AND VERSIONS\nIBM WebSphere MQ V7.5 \n\nIBM WebSphere MQ 7.5.0.0 - 7.5.0.7 maintenance levels\nIBM MQ V8.0 \nIBM MQ 8.0.0.0 - 8.0.0.5 maintenance levels\nIBM MQ V9 CD\nIBM MQ 9.0.1 only \n\nIBM MQ V9 LTS \n\nIBM MQ 9.0.0.0 only\n\nREMEDIATION/FIXES\nIBM WebSphere MQ V7.5 \n\nApply 7.5.0.8 [http://www-01.ibm.com/support/docview.wss?uid=swg22005413] maintenance level \n\n"}, {"filename": "swg21996156.txt", "chunk_id": "doc_24465_chunk_0001", "text": "* Security Bulletin: Denial of Service with WebSphere Application Server (CVE-2016-8919) [http://www-01.ibm.com/support/docview.wss?uid=swg21993797] \n * Security Bulletin: Potential vulnerability in IBM HTTP Server (CVE-2016-8743) [http://www-01.ibm.com/support/docview.wss?uid=swg21996847] \n * Security Bulletin: Potential Cross-site scripting vulnerability in WebSphere Application Server (CVE-2017-1121) [http://www-01.ibm.com/support/docview.wss?uid=swg21997743] \n * Security Bulletin: Multiple vulnerabilities in IBM® Java SDK affects WebSphere Application Server January 2017 CPU [http://www-01.ibm.com/support/docview.wss?uid=swg21998379] \n * Security Bulletin: Potential security vulnerability in WebSphere Application Server MQ JCA Resource adapter (CVE-2016-0360) [http://www-01.ibm.com/support/docview.wss?uid=swg21996748] \n * Security Bulletin: Privilege Escalation Vulnerability in WebSphere Application Server (CVE-2017-1151) [http://www-01.ibm.com/support/docview.wss?uid=swg21999293] \n\nfor vulnerability details and information about fixes. \nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}, {"filename": "swg21998648.txt", "chunk_id": "doc_24615_chunk_0000", "text": "Title: IBM Security Bulletin: IBM MQ and IBM WebSphere MQ invalid requests could cause denial of service to MQXR listener (CVE-2016-8986) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Invalid HTTP requests could cause a denial of service to the IBM MQ MQXR listener. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-8986 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-8986]\nDESCRIPTION: IBM WebSphere MQ could allow an authenticated user with access to the queue manager to bring down MQ channels using specially crafted HTTP requests.\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/118981 [https://exchange.xforce.ibmcloud.com/vulnerabilities/118981] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:L) \n\nAFFECTED PRODUCTS AND VERSIONS\nIBM WebSphere MQ V7.5 \n\nIBM WebSphere MQ 7.5.0.0 - 7.5.0.7 maintenance levels \n\nIBM MQ V8.0 \n\nIBM MQ 8.0.0.0 - 8.0.0.5 maintenance levels \n\nIBM MQ V9 CD \n\nIBM MQ 9.0.1 only \n\nIBM MQ V9 LTS \n\nIBM MQ 9.0.0.0 only\n\nREMEDIATION/FIXES\nIBM WebSphere MQ V7.5 \n\nApply 7.5.0.8 [http://www-01.ibm.com/support/docview.wss?uid=swg22005413] maintenance level \n\nIBM MQ V8.0 \n\n"}]}, {"id": "TRAIN_Q221", "question": "Case Analyzer is not working\n\n\n\nCaseAnalyzer is not working, no latest audit log although service is running\n\nError in log:\n\n\"CAPublisher c2dce3b9 [Error] Unexpected exception occurred while processing task CAPublisher for store CASTORE.; Exception: com.microsoft.sqlserver.jdbc.SQLServerException: The query processor ran out of internal resources and could not produce a query plan. This is a rare event and only expected for extremely complex queries or queries that reference a very large number of tables or partitions. Please simplify the query. If you believe you have received this message in error, contact Customer Support Services for more information.\"", "answer": "The problem with Case Analyzer not generating latest data despite the service being running is due to an unexpected exception occurring during the processing of tasks related to SQL Server. Specifically, it's happening because the query processor has run out of internal resources, which is unusual and typically occurs when dealing with extremely complex queries or referencing a very large number of tables or partitions.\n\nTo resolve this issue, the batch update mode should be updated to 'BATCH'. According to the provided documentation, updating the batch update mode to 'BATCH' can help eliminate the problem. Additionally, users are advised to refer to the linked article for further details on how to address this issue.", "documents": [{"filename": "swg22012121.txt", "chunk_id": "doc_25854_chunk_0000", "text": "Title: IBM Latest data are not generated in Case Analyzer - United States\n\nText:\ninternal resources TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n No latest data are generated in IBM Case Analyzer though service is running. \n\nSYMPTOM\nError in log: \n\n\"CAPublisher c2dce3b9 [Error] Unexpected exception occurred while processing task CAPublisher for store CASTORE.; Exception: com.microsoft.sqlserver.jdbc.SQLServerException: The query processor \nran out of internal resources and could not produce a query plan. This is a rare event and only expected for extremely complex queries or queries that reference a very large number of tables or partitions. \nPlease simplify the query. If you believe you have received this message in error, contact Customer Support Services for more information.\" \n\n\nRESOLVING THE PROBLEM\nThe batch update mode is causing the issue here. Update the batch update mode to ‘BATCH’ and see if you are still getting that issue. For more info, please check the below link. \nhttp://www-01.ibm.com/support/docview.wss?uid=swg22004617 [http://www-01.ibm.com/support/docview.wss?uid=swg22004617]"}]}, {"id": "TRAIN_Q222", "question": "Composite Platform Installation Tool (CPIT) does not support IBM Tivoli Directory Server (ITDS) 6.3 on Red Hat Enterprise Linux\n\n\n\nWhen use the CPIT to install the FileNet P8 platform, the installation is not successful and the error occurs at ITDS installation, refer to the detailed error in cpit_install_stderr.txt:\n\nOUTPUT>========================================== OUTPUT>Setting Directories... OUTPUT>Mon Aug 11 08:20:00 SGT 2014 OUTPUT>/opt/IBM/cpit/decompressed/TDS/tdsV6.3/tds ERROR>./install_tds.bin: line 1956: warning: here-document at line 1956 delimited by end-of-file (wanted `/dev/null') OUTPUT>ERROR: /opt/IBM/ldap/V6.3/sbin/idsldif2db not found. TDS installation failed. Process completed with exit code: 1 ERROR in InvokeScripts-function - Terminate the remaining scripts. ***Aborting InvokeScripts-Install function.", "answer": "The Composite Platform Installation Tool (CPIT) does not support installing IBM Tivoli Directory Server (ITDS) 6.3 on Red Hat Enterprise Linux 6.1. The specific error message indicates that the \"/opt/IBM/ldap/V6.3/sbin/idsldif2db\" file is missing during the ITDS installation process. This results in the \"TDS installation failed\" error and prevents the entire FileNet P8 platform installation from proceeding successfully.", "documents": [{"filename": "swg21683906.txt", "chunk_id": "doc_19991_chunk_0000", "text": "Title: IBM Composite Platform Installation Tool (CPIT) does not support IBM Tivoli Directory Server (ITDS) 6.3 on Red Hat Enterprise Linux (RHEL) 6.1. - United States\n\nText:\nCPIT; Linux; idsldif2db TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When use the CPIT to install the FileNet P8 platform, the installation is not successful and the error occurs at ITDS installation, refer to the detailed error in cpit_install_stderr.txt:\n\nOUTPUT>========================================== \nOUTPUT>Setting Directories... \nOUTPUT>Mon Aug 11 08:20:00 SGT 2014 \nOUTPUT>/opt/IBM/cpit/decompressed/TDS/tdsV6.3/tds \nERROR>./install_tds.bin: line 1956: warning: here-document at line 1956 delimited by end-of-file (wanted `/dev/null') \nOUTPUT>ERROR: /opt/IBM/ldap/V6.3/sbin/idsldif2db not found. TDS installation failed. \nProcess completed with exit code: 1 \nERROR in InvokeScripts-function - Terminate the remaining scripts. ***Aborting InvokeScripts-Install function. \n\nDIAGNOSING THE PROBLEM\nFrom the error, it seems like a file is missing from the package (see\"/opt/IBM/ldap/V6.3/sbin/idsldif2db not found. TDS installation failed.\"). \nIf review the installTDS63.sh shell script, the script uses the following method to install ITDS: \n\n"}]}, {"id": "TRAIN_Q234", "question": "How do I create a windows service for WebSphere Application Server version 7.0.X?\n\nIs there a tool that can help me create the windows service in an automated form?", "answer": "Yes, there is a tool that can help you create the Windows service in an automated form. According to Document 2, you can open the Windows Services Control Panel, look for the service name of WAS V6.1, open a command window, and run the command WASService.exe -remove [service_name]. Then restart RAD and you should be able to successfully start your WASv6.1.x server. Additionally, Document 3 suggests placing the WASServiceCmd.exe utility in the specified directory and launching the command from the command line to reduce the time it takes to create a Windows service for WebSphere Application Server and reduce the opportunity for user errors.", "documents": [{"filename": "swg21201697.txt", "chunk_id": "doc_10931_chunk_0001", "text": " Window > Preferences \n     * Expand the Servers section and then select WebSphere  * In version 7.x a list of runtime environments are shown above. \n        * Select the runtime you want to create a profile for so that it is highlight\n       \n       \n     * Version 6 and 7: Click the Create Profile button to launch the WebSphere profile creation tool \n     * Version 7.5: Click the Run Profile Management Tool button to launch the profile management tool\n       \n    \n    \n 2. Step through the profile creation wizard, paying attention to the following:\n     * The ports selected are based on a simple incremental scheme. Ensure the selected ports are available on your machine and change them if necessary\n       \n     * For the best integration with Rational Application Developer, disable the option to configure the profile as a Windows service.\n       \n     * More information is located in the WebSphere Application Server information center, see \"Related URLs\" below.\n    \n    \n\n\n"}, {"filename": "swg21368020.txt", "chunk_id": "doc_12459_chunk_0001", "text": "ication as a Windows Service. \n\n\nSteps describing how to do this can be found in the Related URL section.\n\nAlternatively, you can do the following:\n\n\n 1. Open Windows Services Control Panel (Start > Settings > Control Panel > Administrative Tools > Services).\n    \n    \n 2. Look for the service name of WAS V6.1:\n    \n    \"IBM WebSphere Application Server V6.1 - [service_name]\".\n    \n    \n 3. Open a command window and go to [RAD_Installation]\\runtimes\\base_v61\\bin\n    \n    \n 4. Run the command:\n    \n    WASService.exe -remove [service_name]\n    \n    You should see a message \"Successfully removed service\". \n\n\nRestart RAD and you should now be able to successfully start your WASv6.1.x server. \nRELATED INFORMATION\n#Create WAS v6.1 Profile [http://www.ibm.com/support/docview.wss?uid=swg21263551]"}, {"filename": "swg21397335.txt", "chunk_id": "doc_12889_chunk_0001", "text": "led information: (Link at the bottom of this document) \n\nSYMPTOM\nCreating and removing a WebSphere service in Windows is confusing and error prone.\n\n\nCAUSE\nThis application takes several parameters which can be confusing to the user along with several long path strings leaving opportunities to setup incorrectly.\n\nENVIRONMENT\nWindows\n\nRESOLVING THE PROBLEM\n\n\n\n 1. Place the WASServiceCmd.exe utility in the following directory:\n    \n    install_root\\bin \n    \n 2. Launch the command from the command line. \n    \n    \n 3. The WASServiceCmd utility prompts you to select specific options and settings from a list and then calls the WASService.exe command passing all selected parameters. This greatly reduces the time it takes to create a Windows service for WebSphere Application Server and reduces the opportunity for user errors.\n\n\n[/support/docview.wss?uid=swg21397335&amp;aid=1] Flash demonstration [http://public.dhe.ibm.com/software/websphere/appserv/support/tutorials/wasservicecmd.swf] \n\nNote: This also creates an entry in the WASServiceCmd.log in the current directory which contains the actual WASService.exe command used to create the service. \n\nExample of a log entry: \n\n"}]}, {"id": "TRAIN_Q256", "question": "Error running krzgrant.sql script provided with 6.3.1.2-TIV-ITM_KRZ-IF0003.tar\n\nWhen running the krzgrant.sql script provided in the package - 6.3.1.2-TIV-ITM_KRZ-IF0003.tar get the following errors:\n\nERROR at line 1:\nORA-00942: table or view does not exist ORA-06512: at line 50 \n\nHow to correct this?", "answer": "INSUFFICIENT_INFORMATION", "documents": [{"filename": "swg1IZ95428.txt", "chunk_id": "doc_05239_chunk_0000", "text": "Title: IBM IZ95428: KRZGRANT.SQL RETURNS ORA-01722 ERROR IN AN ORACLE ENVIRONMENT USING A NON-STANDARD NLS_NUMERIC_CHARACHTERS STRING - United States\n\nText:\n  A FIX IS AVAILABLE\nITCAM Extended Agent for Oracle Database: 6.3.1-TIV-ITM_EXT-FP0002 [http://www-01.ibm.com/support/docview.wss?uid=swg24035571]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Approver: Hua Ming Zhong/China/IBM\n   \n   Compid:   5724B96SO\n   \n   Release:  6.31\n   Environment: Extended Oracle Agent 6.31\n   OS: ANY\n   \n   Problem Description:\n   krzgrant.sql returns ORA-01722: invalid number error in an\n   Oracle\n   environment using a non-standard NLS_NUMERIC_CHARACHTERS string\n   that changes the decimal marker to a non-dot, for example comma.\n   Detailed Recreation Procedure:\n   1) Log in to the Oracle database server.\n   2) The following statement changes the decimal marker to a\n   comma.\n   alter session set NLS_NUMERIC_CHARACTERS=',.'\n   3) Execute krzgrant.sql or run the statement directly:\n   select\n   to_number(substr(banner,instr(banner,'Release')+8,instr(banner,'\n   .',1,2)-\n   8-instr(banner,'Release')))*10 from V$VERSION where  banner like\n"}, {"filename": "swg24035571.txt", "chunk_id": "doc_26837_chunk_0039", "text": "xecuted only if there is a situation or \nyou click \"Link to SQL Result\" in the workspace \"Customized SQLs ->\nRDB Customized SQL Summary Definition\".\n\n- Problem: agent environment variable or error trace level do not take\neffective.\n- Workaround: If you must edit an environment variable such as setting a new\nerror trace level, the new variable must be modified in both the \ninstalldir/config/rz.ini file and the installdir/config/rz_<instance>.config\nfile, and you must restart agent.\n\n- Problem: agent report ORA-00942 error message in the log files like\nfollowing. Oracle Database Server is 10.1.0.2.\nERROR at line 1:\nORA-00942: table or view does not exist\nORA-06512: at line 128\n- Workaround: Run the krzgrant.sql script in 6.3.1-TIV-ITM_KRZ-FP0001 to resolve\nthis error.\n\n- Problem: tacmd listsystems command does not display proper version\nfor offline agent's subnode.\nFor subnode e.g. RZ:HOSTNAME-INSTANCE-CONNECTION:RDB, version is\ndisplaying as 06.31.01.XX, Status is 'N'.\n- Workaround: Check the version from the root node of the agent to get the correct\nversion, for example, for INSTANCE:HOSTNAME:RZ, the version is displayed as \n06.31.01.00. \n\n"}, {"filename": "swg21438832.txt", "chunk_id": "doc_13691_chunk_0002", "text": "he expected one by using the following commands:\nlsnrctl status \nlsnrctl service \n\n4) Problems with access rights on Oracle dynamic views (v$,gv$). \n\nExtended Agent requires access rights on Oracle dynamic views (v$,gv$).\nDouble check that you have already successfully executed the krzgrant.sql script.\nIf it has not been executed, the following SQL script needs to be run on the Oracle server itself:\n\nkrzgrant.sql user_id temporary_directory \n\nScript krzgrant.sql can be found into:\n<ITM_HOME>/<arch>/rz/bin (unix) \n<ITM_HOME>/tmaitm6 (windows) \n\nIn order to check for additional possible issues concerning dynamic views or Oracle system tables, you can connect to the server using the userid/password used to start the agent, and then execute the following commands:\n\nselect decode(upper(value),'RDBMS','RDB',upper(value)) DBTYPE \nfrom v$parameter where name='instance_type\n\nIf the query returns an error like the following:\n\nERROR at line 1: ORA-00942: table or view does not exist \n\nyou may need to check with Oracle DBA for the availability of these tables or the dynamic views.\nCheck with him if the catalog.sql Oracle script has been executed and if necessary run it again.\n\n \n\n"}, {"filename": "swg1PI63424.txt", "chunk_id": "doc_07339_chunk_0001", "text": "et of data\n   warehouse upgrade scripts\n   2. Run each script one by one with a database ID without DBA\n   access.  When executing the second script:\n   grantCoreSchemaReadAccess.sql, notice the error \"ORA-00942:\n   table or view does not exist\" is returned after running the\n   following SQL statement within the script:\n   Â GRANT SELECT ON RIDW.VW_F_REQUEST_METRICS TO RPTUSER\n   \n   Workaround: Run the fourth script: upgradeCalmSchema.sql first,\n   then re-run the second script: grantCoreSchemaReadAccess.sql to\n   avoid the grant error.\n   \n   See details from the following jazz.net defect work item:\n   \n   Change the sequence of generate data warehouse upgrade scripts\n   to avoid grant errors (392385)\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   * All                                                          *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * In IBM Rational Collaborative Lifecycle Management (CLM)     *\n   * environment with Oracle database server hosting repository   *\n"}, {"filename": "swg21263950.txt", "chunk_id": "doc_11465_chunk_0004", "text": "w.wss?uid=swg21263950&aid=3] \n   \n   iii. After the script has been successfully run, continue configuring where you left off.\n   \n   \n\nProcedure 3 \n\nSQL error: 942 - \"User does not have MAXIMO access privileges\" in MAXIMO Signature Security: \nIf you get this error in the Signature Security application, then the views which are created by the VIEW7.ORA script do not exist or cannot be accessed. If the database was imported from an export file, then you need to run VIEW7.ORA as user SYS. This is because tables and views owned by SYS are never exported, even during a full export of the database. The views will have to be recreated. Follow the steps for Procedure 2 on this document. You can then continue working in the Signature Security application. Procedure 4\n\nSQR Error: Program Aborting. Report not created. \n\nSQR reports will not run if grants on or public synonyms for the tables referenced in the report are missing. You will get an error similar to the following: \n\n * \n * SQLBase SQLCOM error 20942 in cursor 3:\n * ORA-00942: table or view does not exist \n * SQL: select name, company, address1, address2, address3, address4 FROM company \n * Error at: select \n * Error on line 104: Error in SQL statement.\n\n\n"}, {"filename": "swg21559816.txt", "chunk_id": "doc_15725_chunk_0004", "text": "PE [SQLBean::Exception]\nSQL Error Code: 942\nSQL State: 42000\njava.sql.SQLException: ORA-00942: table or view does not exist\n\n\nRESOLVING THE PROBLEM\n\n\nThese tables are created by ActiveMQ at startup. The customer had revoked create and drop tables permissions on the GIS user in Oracle. Starting GIS with the permissions as defined in the online documentation solved the issue.\n\n \n\nHISTORICAL NUMBER\n NFX8342 \n\nPRODUCT ALIAS/SYNONYM\n \n\nFunction Area\n\n\nDatabase\n\n\nSeverity\n\n\nNormal"}, {"filename": "swg1PI51466.txt", "chunk_id": "doc_07152_chunk_0002", "text": " PREPARE    *\n   *                      function                                *\n   *                      DSNT408I SQLCODE = -204, ERROR:         *\n   *                      <view_schema>.<view_name> IS AN         *\n   *                      UNDEFINED NAME                          *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   When using Object Compare to drop a temporal table complex,\n   the dependent view created on the history table was not\n   detected as dropped by dropping the history table.  An\n   unneeded DROP VIEW statement was generated which caused\n   the run change job (WSL) to fail with SQLCODEN204 /\n   SQLCODE=-204.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Problem has been resolved.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   PI51466\n   \n   \n * REPORTED COMPONENT NAME\n   DB2 ADMIN TOOL\n   \n   \n * REPORTED COMPONENT ID\n   568851500\n   \n   \n * REPORTED RELEASE\n   B10\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n"}, {"filename": "swg21557351.txt", "chunk_id": "doc_15703_chunk_0001", "text": "oreInfo=\"ORA-00942: table or view does not exist \"> [java] <Stack>java.sql.SQLSyntaxErrorException: ORA-00942: table or view does not exist [java] at oracle.jdbc.driver.SQLStateMapping.newSQLException(SQLStateMapping.java:91)<\/div > [java] at oracle.jdbc.driver.DatabaseError.newSQLException(DatabaseError.java:133) [java] at oracle.jdbc.driver.DatabaseError.throwSqlException(DatabaseError.java:206) [java] at oracle.jdbc.driver.T4CTTIoer.processError(T4CTTIoer.java:455) [java] at oracle.jdbc.driver.T4CTTIoer.processError(T4CTTIoer.java:413) \nRESOLVING THE PROBLEM\n\n\n Resolution:- User might face this issue during a fresh installation and the root cause is that a table or view might be missing in the database. Follow these steps to get rid of the error\n\n1) Run the dbverify. It wil generate the SQL script for database at <Install_dir>\\bin folder 2) Execute the auto generated SQL script on database 3) Finally run the factory setup again. \n\nHISTORICAL NUMBER\n NFX9620 \n\nPRODUCT ALIAS/SYNONYM\n \n\nSeverity\n\n\nNormal"}, {"filename": "swg21512245.txt", "chunk_id": "doc_15341_chunk_0000", "text": "Title: IBM domain_create.pl - United States\n\nText:\ndomain_create.pl TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The domain create perl script fails with 'ORA-00942: table or view does not exist' when using 'schema' parameter - how to correct it? \n\nSYMPTOM\nWhen domain_create.pl is run with following parameters - it fails with following error: \n\n#ncp_perl domain_create.pl -domain XYZ -clone ABC -username ncim -password ncim -server oracle -host serverA.ibm.com -dbname NCIM -schema NCIM \n\nLevel: info Msg: Attempting to connect to database (DBI:Oracle:host=sea-sol-10b;sid=NCIM;port=1521)...\nDB prepare failed: ORA-00942: table or view does not exist (DBD ERROR: error possibly near <*> indicator at char 14 in 'select * from <*>templateType') at /opt/IBM/tivoli/netcool/precision/scripts/perl/scripts/get_policies.pl line 58\n\n\n\n\nCAUSE\nBasically when you supply parameters with schema 'NCIM' - the script is executing few sql queries to copy Poll policies from tables that doesn't exist in NCIM (which are of schema NCMONITOR) - as a result - you get above error.\n\n\n"}, {"filename": "swg21324358.txt", "chunk_id": "doc_12107_chunk_0000", "text": "Title: IBM The error \"ORA-00942: table or view does not exist\" appears when installing DOORS XT. What is the problem? - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n The error \"ORA-00942: table or view does not exist\" appears when installing DOORS XT. What is the problem? \n\nANSWER\nI am in the process of installing DOORS XT 2.1, following the instructions found in the manual \"Installing and Setting Up DOORS XT\" . When running the command: \n\n\n@?\\rdbms\\admin\\xaview.sql \n\nas instructed in the section \"Changing the database using SQL\", I get the error message: \n\nDROP VIEW v$xatrans$ \n* \nERROR at line 1: \nORA-00942: table or view does not exist \n\nDROP VIEW v$pending_xatrans$ \n* \nERROR at line 1: \nORA-00942: table or view does not exist \n\nView created. \n\nView created. \n\n\n\n\nThis message is not an error message as such. Most SQL will try and first drop a table / view before subsequently trying to create a new one, as indicated in this message. You should then be able to carry on your installation of DOORS XT. \n\n\n\n\n\n\n\n\nHISTORICAL NUMBER\n KB10905"}]}, {"id": "TRAIN_Q299", "question": "Installing fixpacks with Installation Manager - when did it change from using updateInstaller,  starting in which version of WebSphere\n\nI was using updateInstaller to install fixpacks, and there was a separate fixpack for WebSphere and separate for the JDK, independent of each other. Now I understand that with Installation Manager there is a single package containing both the WebSphere App server fixpack as well as the JDK. When did this occur, starting with which version of WebSphere ?", "answer": "According to Document 1, starting with WebSphere Application Server V8.0, there is now a single package containing updates for both WebSphere Application Server and Java SDK. This means that applying fixpacks of WebSphere Application Server also upgrades the SDK that is packaged and bundled within the fixpack. Separate Java SDK fixpacks are still available that contain just the SDK updates which can be applied to upgrade the SDK.", "documents": [{"filename": "swg21138332.txt", "chunk_id": "doc_10681_chunk_0000", "text": "Title: IBM Java SDK Upgrade Policy for the IBM WebSphere Application Server - United States\n\nText:\nupgrade policy TECHNOTE (FAQ)\n\nQUESTION\n What is the Java™ SDK upgrade policy for the IBM® WebSphere® Application Server? \n\nCAUSE\nUpdating to the latest compatible Java SDK could help you resolve problems more quickly.\n\nANSWER\nThe IBM WebSphere Application Server Java SDK can be upgraded to the latest service release for the same Java SDK version. \n\nList of WebSphere Application Server fix packs and the corresponding Java SDK versions [http://www.ibm.com/support/docview.wss?rs=180&uid=swg27005002]\n\nPolicy Summary by WebSphere Application Server release:\n\nWebSphere Application Server V8.0, V8.5, V8.5.5\nStarting with V8.0 and applicable to all subsequent releases and fixpacks, there is one install package that contains updates for both WebSphere Application Server and Java SDK. Applying fixpacks of WebSphere Application Server also upgrades the SDK that is packaged and bundled within the fixpack. Additionally, separate Java SDK fixpacks are also available that contain just the SDK updates which can be applied to upgrade the SDK.\n\n"}, {"filename": "swg21655171.txt", "chunk_id": "doc_18645_chunk_0001", "text": "ing_was85.html].\n   \n   For WebSphere software, Version 7.0, you must install at least Fix Pack 29 for WebSphere Application Server and the Java SDK.\n   For information about installing the fix pack for WebSphere Application Server and the Java SDK, see the topic Installing WebSphere Application Server Version 7.0 fix packs [http://www.ibm.com/support/knowledgecenter/SSRQBP_1.0.1.1/com.ibm.ispim.doc_1.0.1.1/Installation_Guide/tasks/installing_was_fixpack.html]. \n * For WebSphere software, Version 8.5.0.2, you must install at least the 8.5.0.0-WS-WASJavaSDK-WinX64-IFPM98574 interim fix for the WebSphere Application Server Java SDK component.\n   For information about installing the fix packs and any interim fixes, see the topic Installing WebSphere Application Server Version 8.5 [http://www.ibm.com/support/knowledgecenter/SSRQBP_1.0.1.1/com.ibm.ispim.doc_1.0.1.1/Installation_Guide/tasks/t_installing_was85.html]. \n * The WebSphere Application Server Web 2.0 and Mobile feature pack are not required for WebSphere Application Server, Version 8.5. These software are only required if you are installing on WebSphere Application Server, Version 7.0. \n"}, {"filename": "swg21427178.txt", "chunk_id": "doc_13499_chunk_0001", "text": "tes:\n    \n     1. WebSphere Application Server \n     2. JDK\n    \n    \n\n * \n * \n * \n * \n * \n * \n * \n * \n * \n\n\n\nHow do I keep up-to-date with the JDK?\n\nFor WebSphere Application Server V8 and higher both JDK and WebSphere Application Server updates are part of a single bundle. Thus latest fixpack of WebSphere Application Server will also update your JDK to the latest. See link below for latest available fixpack. \n\nFor WebSphere Application Server version V7 and below you should down load the latest JDK fix pack and install it using IBM WebSphere's UpdateInstaller - just like an install of WebSphere Application Server fix pack update. The link to the latest available JDK is under \"Java SDK fix pack download page\" in the latest WebSphere fixpacks. \n\nThe following link provides latest WebSphere fixpacks: \nhttp://www-01.ibm.com/support/docview.wss?uid=swg27009661 [http://www-01.ibm.com/support/docview.wss?uid=swg27009661] \n\n\nHow do I obtain fixes for problems discovered with the JDK?\n\n"}]}, {"id": "TRAIN_Q336", "question": "Why does silent install abort indicating files are locked?\n\nSilent installs can fail reporting that there are locked files under the ITM installation directory on Windows platform. Why does this happen?\n\nExample:\n\nC:\\IBM\\ITM\\InstallITM\\\nAbort IBM Tivoli Monitoring 20160203 1832.log\n\n02-03-2016 18:37:10: File C:\\IBM\\ITM\\TMAITM6\\deploy.jar is locked.\n02-03-2016 18:37:10: File C:\\IBM\\ITM\\TMAITM6\\deploy.jar could not be renamed, errors may occur.\n02-03-2016 18:37:17: Directory C:\\IBM\\ITM has locked files.\n02-03-2016 18:37:17: Correct and launch setup again.\n02-03-2016 18:37:17: Directory C:\\IBM\\ITM has locked files, unable to continue.\n02-03-2016 18:37:17: SEVERE: ERROR - Install aborted.", "answer": "The silent install aborting due to locked files typically happens when attempting to install software silently on a Windows machine without shutting down other ITM components first. This is a known limitation of silent installations, designed to ensure that the installer doesn't overwrite product files that are currently running. To resolve this issue, users should ensure that all ITM components, including monitoring servers, portal server, and portal clients, are shut down before performing the silent installation.", "documents": [{"filename": "swg21882989.txt", "chunk_id": "doc_21337_chunk_0001", "text": " - Check[C:\\IBM\\ITM\\InstSpbs\\silent_winos622_64bit_prod.txt] for Locked Files=continue\n4-9-2015 10:15:22 CheckLockedFiles - Locked files not present.\n4-9-2015 10:15:22 CheckLockedFiles - Directory C:\\IBM\\ITM - return TRUE\n4-9-2015 10:15:22 Directory C:\\IBM\\ITM has locked files.\n4-9-2015 10:15:22 Correct and launch setup again.\n4-9-2015 10:15:22 Directory C:\\IBM\\ITM has locked files, unable to continue.\n4-9-2015 10:15:22 SEVERE: ERROR - Install aborted.\n\n\nCAUSE\nA limitation for remote deployment and silent installations indicates:\nA silent installation terminates if product files are locked. This behavior ensures that the installer does not overwrite product files that are currently running. The best practice is to shut down all components, including monitoring servers, portal server, and portal clients before you perform any product upgrade. This limitation only affects silent installations. Installations through the installation wizard is not affected.\n\n\nENVIRONMENT\nAny Windows version \n\nAny ITM component installed silently\n\n\nDIAGNOSING THE PROBLEM\nLook in <ITMHOME>\\InstallITM for a file name with syntax similar to: \nAbortIBMTivoliMonitoring<DATE TIME>.log\n\nFor example:\nAbortIBMTivoliMonitoring20150409 1014.log\n\n\n\n"}, {"filename": "swg1IV59978.txt", "chunk_id": "doc_03684_chunk_0000", "text": "Title: IBM IV59978: IF AN INSTALL ABORTS, LOCKED FILES RENAMED AS FILENAME.EXTENSIONBUSY ARE NOT RENAMED BACK TO - United States\n\nText:\n  A FIX IS AVAILABLE\nIBM Tivoli Monitoring 6.3.0 Fix Pack 4 (6.3.0-TIV-ITM-FP0004) [http://www-01.ibm.com/support/docview.wss?uid=swg24037653]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Abstract: If an install aborts, locked files renamed as\n   filename.extensionbusy are not renamed back to their original\n   file name.\n   This can prevent ITM components from starting after an aborted\n   upgrade\n   or install.\n   Environment:\n     Windows only where ITM install or upgrade is unable to stop\n   ITM\n   components. If the installer finds locked files it renames them\n   to\n   filename.extensionbusy so they can be upgraded.\n   Problem Description:\n     During an upgrade or install if locked (busy) files are found\n   they are\n   renamed filename.extensionbusy so they can be replaced during\n   the\n   upgrade or install. If the install then aborts for some reason\n   the files\n   are not renamed back to their original name. This can cause ITM\n   components to fail upon start because the original files are\n"}, {"filename": "swg1IT07768.txt", "chunk_id": "doc_02547_chunk_0004", "text": "rrect and launch setup again.\n   12-16-2014 10:09:23: Directory\n   D:\\Program_Files\\Tivoli\\TSM\\reporting\\ITM has locked files,\n   unable to continue.\n   12-16-2014 10:09:23: SEVERE: ERROR - Install aborted.\n   \n   The error indicates that the install of the ITM language\n   packages for ITM 6.3 FP2 failed.\n   On Windows, when the ITM or ITM language pack install fails then\n   it generates an \"Abort*\".log file that is the Windows MSI log\n   file for the Windows ITM install.\n   On a failure, this log file gets moved over into the native log\n   directory so that it'll get included in install log file\n   collection.\n   \n   \n   \n   Tivoli Storage Manager Versions Affected:\n   IBM Tivoli Monitoring for Tivoli Storage Manager version 7.1 on\n   all Windows supported platforms\n   \n   \n   \n   Initial Impact:\n   Medium\n   \n   \n   \n   Additional Keywords:\n   TSM lock file lang language pack installation failure ANRI0033E\n   ANRI0044E ITM TSM \"reporting and monitoring\" zztsm71 tivoli\n   monitoring\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Contact the IBM Technical Support to get the e-fix for this\n   problem.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg1IZ73700.txt", "chunk_id": "doc_05070_chunk_0002", "text": "f where ITM is really\n   installed. This will allow the test for the NON C: drive to\n   pass and the NT agent will be upgraded.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  Windows silent install (including Remote Deploy) may fail if the\n   install directory inside the silent install file points to a\n   drive that does not exist on the target system.  This occurs if\n   Windows is not installed on the C: drive and the C: drive does\n   not exist for the target system.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Changed test to verify that the IBM Tivoli Monitoring registry\n   key and values exist.  If registry key\n   HKLM\\Software\\Candle\\Omegamon exists and it has a Directory\n   value present then we know IBM Tivoli Monitoring has been\n   installed and the install does not need to test for a valid\n   install directory.\n   \n   The fix for this APAR is included in the following maintenance\n   vehicle:\n       | fix pack | 6.2.1-TIV-ITM-FP0003\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg21608744.txt", "chunk_id": "doc_16943_chunk_0000", "text": "Title: IBM Silent Install - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Silent install of any of the Tivoli Monitoring components fails. \n\nCAUSE\nWhen the complete path to the silent response file is not specified as part of the command invoking the silent install, it fails with the following error message in the log file: \n\n------------------------------------------------------------\n08-16-2012 09:52:31: Silent install configuration file: silent_response.txt\n08-16-2012 09:52:31: \n08-16-2012 09:52:31: AgentDeployRunning=FALSE.\n08-16-2012 09:52:31: \n08-16-2012 09:52:31: SEVERE: You must agree to the License Agreement.\n08-16-2012 09:52:31: SEVERE: Silent install config error.\n08-16-2012 09:52:31: Silent install config error.\n------------------------------------------------------------\n\n\n\nRESOLVING THE PROBLEM\nSpecify the complete path to the silent response file while launching the silent install. \n\ne.g.\nsetup /z\"/sfE:\\TEMP\\silent_response.txt\" /s /f2\"C:\\temp\\itm6_agent_setup.log\""}]}, {"id": "TRAIN_Q360", "question": "Is it possible to monitor Memory/LPAR metrics using ITM HMC agent?\n\nI understand the ITM AIX Premium agent captures these metrics but like to know if it is possible to monitor Memory/LPAR metrics using ITM HMC agent?", "answer": "Yes, it is possible to monitor Memory/LPAR metrics using ITM HMC agent. The ITM HMC agent can capture memory and LPAR metrics such as CPU utilization, which can then be viewed through the HMC interface.", "documents": [{"filename": "swg21683210.txt", "chunk_id": "doc_19961_chunk_0001", "text": "s should know about:\n\n--- \nInstall and run the following agents to monitor your System P environment (see General Considerations above for details):\n\n1) HMC Base agent v6.2.2.3 on any AIX LPAR to monitoring the HMC and the Servers, including CPU metrics on the servers and LPARs.\n2) UNIX OS agent v6.3 FP2 or above on each AIX LPAR to monitor all LPAR metrics, including specific AIX metrics that have been ported from the AIX Premium agent.\n3) VIOS Premium agent v6.2.2.2 on every VIOS (pre-installed), and install Interim Fix 6.2.2.2-TIV-ITM_VIOS_PREM-IF0005.\n4) Remove the CEC Base agent if running the HMC Base agent v6.2.2.3.\n5) Remove the AIX Premium agent if running the UNIX OS agent on each AIX LPAR.\n\n \n\nPRODUCT ALIAS/SYNONYM\n IBM Tivoli Monitoring V6.2.2 System P Agents"}, {"filename": "swg21597868.txt", "chunk_id": "doc_16666_chunk_0000", "text": "Title: IBM AIX Premium agent CPU Availability and CPU Utilization metrics inconsistency - United States\n\nText:\nITM 6.2 System P TECHNOTE (FAQ)\n\nQUESTION\n Why values displayed on AIX Premium agent CPU Availability graph and sum of CPU Utilization values for individual LPARs don't match ? \n\nWhy CPU Availability metrics do not match with output of nmon command? \n\nCAUSE\nCPU Availability shows the percentage of CPU used out of the total CPU the LPAR is entitled to. This can have higher percentage idle if LPAR is entitled to a lot more CPU than it's using. The CPU Utilization view shows how each logical CPU distributed the cycles it actually used.\n\nANSWER\nCPU Availability workspace can be referred to as the mpstat workspace since it shows what \nthe mpstat command shows. This is the \"ALL\" line in the mpstat output. The CPU Utilization view shows the CPU usage for each Logical CPU out of the time that CPU was actually executing. These 2 views will \"match\" when the LPAR is using all of it's entitlement. \n\nNote: \nThe CPU_Detail attribute group contains the User, System, Wait, and Idle %'s as well as the number of CPU units actually consumed by that Logical CPU (Physical_Consumption). \n\n"}, {"filename": "swg21609678.txt", "chunk_id": "doc_16984_chunk_0000", "text": "Title: IBM Multiple kuxagent processes on an AIX box - United States\n\nText:\nITM_UNIX_OS_AGENT 5724C040U TECHNOTE (FAQ)\n\nQUESTION\n Why are multiple kuxagent processes seen on an AIX LPAR? \n\nCAUSE\nIf the AIX LPAR has multiple WPARs and each WPAR is running IBM Tivoli Monitoring Unix (UX) agent process they all show up as kuxagent processes on the LPAR. Hence, multiple kuxagent processes are seen on a single LPAR.\n\nANSWER\nDo not install the ITM UX agent on a WPAR as a stand-alone machine. Run ITM UX agent (6.23 FP01 or above) on the LPAR to collect WPAR metrics (for all WPARs under the individual LPAR). \n\nNOTE: ITM UX OS Agent can be installed on WPAR starting from 6.23 but it can be used just for Remote Deployment of other agents, WPAR can't be used to collect metrics as a stand-alone AIX machine. Each LPARs can run ITM UX agent as stand-alone machines.\n\n \n\n\nCross reference information Segment Product Component Platform Version Edition Systems and Asset Management Tivoli Monitoring V6"}, {"filename": "swg21600322.txt", "chunk_id": "doc_16761_chunk_0000", "text": "Title: IBM CPU metrics inconsistency in Tivoli Monitoring Agent for Unix OS on AIX - United States\n\nText:\nCPU; AIX; ITM Unix Aggregate; SMP TECHNOTE (FAQ)\n\nQUESTION\n Why aggregate values for CPU metrics collected by the Tivoli Monitoring Agent for Unix OS are not equivalent to the average of the values for the different CPUs on AIX? \n\nANSWER\nThe methods to collect the metrics for a single CPU and the aggregate row by the Tivoli Monitoring Agent for Unix OS, referred to as the agent here after, are changed using the APAR IZ42543. The fix for the APAR IZ42543 is included in Tivoli Monitoring v6.2.0 Fix Pack 3 and higher versions.\n\nThe purpose of the APAR IZ42543 is to make the CPU metrics calculations by the agent match with the output of AIX OS commands vmstat, mpstat and lparstat in a shared CPU LPAR. The agent calculated the aggregate CPU values as average of the values of single CPUs prior to this fix. However, they are incorrect for a shared CPU LPAR.\n\n"}, {"filename": "swg1IZ65316.txt", "chunk_id": "doc_04974_chunk_0001", "text": ": When running the AIX Premium agent on\n   * AIX 5.3 TL5 or TL6, SPMI does not supply all the\n   * metrics.  The result is that all metrics, even the\n   * ones SPMI does supply, are displayed as zero for LPAR\n   * CPU Utilization, LPAR Attributes and CPU Entitlement.\n   **************************************************************\n   * RECOMMENDATION: Install Interim Fix\n   * 6.2.0.1-TIV-ITM_AIX_PREM-IF0002 or IBM Tivoli Monitoring:\n   * AIX Premium Agent, Version 6.2.1.\n   **************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  The fix for this APAR is contained in the following maintenance\n   package:\n   \n   | interim fix | 6.2.0.1-TIV-ITM_AIX_PREM-IF0002\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   IZ65316\n   \n   \n * REPORTED COMPONENT NAME\n   ITM SE SYSP AIX\n   \n   \n * REPORTED COMPONENT ID\n   5724C04AP\n   \n   \n * REPORTED RELEASE\n   620\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n   2009-11-16\n   \n   \n * CLOSED DATE\n   2009-11-24\n   \n   \n * LAST MODIFIED DATE\n   2012-07-02\n   \n   \n\n"}]}, {"id": "TRAIN_Q380", "question": "How do I view Custodian Notes in Atlas Preservation Plan?\n\nHow do I view Custodian Notes in Atlas Preservation Plan?", "answer": "To view Custodian Notes in Atlas Preservation Plan:\n\n1. Click on the Notes tab in a Preservation Plan.\n2. It will display either Plan Notes or Custodian Notes depending on the current setting.\n3. To view Custodian Notes, click the \"Show Custodian Notes\" button.\n4. To return to Plan Notes, click the \"Show Plan Notes\" button.\n\nIf you need to add new custodians to a preserved plan while it's in \"On Hold\" status, follow these steps:\n\n1. Move the plan to \"On Hold\" status.\n2. Add new custodians.\n3. Resume the plan.\n4. The plan will automatically move back to \"Execute\" status with the updated custodians.", "documents": [{"filename": "swg21981880.txt", "chunk_id": "doc_23346_chunk_0000", "text": "Title: IBM Viewing Custodian Notes in Atlas Preservation Plan - United States\n\nText:\nAtlas Notes Preservation Plan TECHNOTE (FAQ)\n\nQUESTION\n How do I view Custodian Notes in Atlas Preservation Plan? \n\nCAUSE\nWhen you click on the Notes tab in a Preservation Plan, you see a blank page without any notes listed\n\nANSWER\nWhen you click on the Notes tab in a Preservation Plan it only lists the Plan Notes. Click the \"Show Custodian Notes\" button which lists the custodian notes. If you would like to go back to Plan Notes, click the \"Show Plan Notes\" button"}, {"filename": "swg27044173.txt", "chunk_id": "doc_28051_chunk_0001", "text": "olds > preservation-plan-name. For both collection and preservation plans, you see a set of tabs that includes the Notes tab and the Custodians tab.\n\nThe Notes tab can show two types of notes: plan notes and custodian notes. The default setting is to show plan notes. To change the type of notes that are shown, you click a button whose label changes when you click the button. When the collection Notes tab shows plan notes, the button label is Show Custodian Notes. When the Notes tab shows custodian notes, the button label is Show Plan Notes.\n\nTo show only plan notes in the Notes tab, click the button so its label changes to Show Custodian Notes. \n\nYou can still view the custodian notes in the Custodians tab. To view the custodian notes, click the Custodians tab and click the custodian whose notes you want to view. The custodian page is opened and shows all the notes that belong to the custodian."}, {"filename": "swg1HE11993.txt", "chunk_id": "doc_01247_chunk_0001", "text": "list of custodians for the\n   preservation plan, and click the link for another custodian,\n   the full details wil be returned.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  In the My Tasks page, when you view custodians for a\n   preservation plan, there are lots of details displayed for the\n   first custodian.  If you then press the \"Next\" or Previous\"\n   buttons to show other custodians, less information is\n   displayed.  Even if you navigate back to the original\n   custodian, there will be less information displayed than the\n   first time that custodian was displayed.\n   You can show the full details for a custodian by going back to\n   the list of custodians for the preservation plan, and clicking\n   the link to the other custodian.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  This fix is available now in Fix Central as part of IBM Policy\n   Atlas 601 Fix Pack 5.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   HE11993\n   \n   \n * REPORTED COMPONENT NAME\n   ATLAS EDISCOVER\n   \n   \n * REPORTED COMPONENT ID\n   5725D7500\n   \n   \n * REPORTED RELEASE\n   601\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n"}, {"filename": "swg21639241.txt", "chunk_id": "doc_18041_chunk_0000", "text": "Title: IBM Adding New Custodians to Published Preservation Plans in Atlas - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n Once a Preservation Plan in Atlas has been moved from \"Execute\" status to \"On Hold\" status, the ability to add new custodians is removed. How can new custodians be added at this point? \n\nCAUSE\nWhen a preservation plan is first drafted, custodians can be easily added and removed. Even after it is published, as long as the plan is still in \"Execute\" status, the ability to add new custodians remains. The \"Execute\" status is basically letting the owner(s) of the plan know that work still needs to be done. When the owner(s) of the preservation plan finish the work and place all the custodians on hold, they update the plan status to \"On Hold\". At this point, the plan is locked down and there is no longer an option to add new custodians.\n\nANSWER\nWhen a plan is \"On Hold\", in order to add any additional custodians it must first be suspended. Only then will the option to add custodians be available again. After adding the new custodians and resuming the plan, it will be placed back in \"Execute\" status, as there is additional work for the owner(s) to do. "}, {"filename": "swg21989919.txt", "chunk_id": "doc_23993_chunk_0000", "text": "Title: IBM Custodian Status in a Atlas Preservation  or Collection Plan - United States\n\nText:\nAtlas Preservation Plan status TECHNOTE (FAQ)\n\nQUESTION\n What are the various custodian status in a Preservation or Collection Plan? \n\nCAUSE\n Custom Process using a custom query was only looking at \"On Hold\" status to perform a release and ignoring other status\n\nANSWER\n \n\nStatus for custodians in a Atlas Preservation or Collection Plan are as follows: \n\n 1.  Not Executed \n 2.  Failed \n 3.  Release \n 4.  Inactive \n 5.  Complete \n 6.  On Hold \n 7.  Completed \n 8.  Collected \n 9.  Hold Failed \n 10. Completion Failed \n 11. Released \n 12. Release Failed"}]}, {"id": "TRAIN_Q414", "question": "Is MQ V7.0 is going out of support?\n\nIs Websphere MQ V7.0 is going out of support?", "answer": "Yes, WebSphere MQ V7.0 clients and WebSphere MQ File Transfer Edition V7.0.1 and V7.0.0 agents go out of support at the same time as the server.", "documents": [{"filename": "swg21674407.txt", "chunk_id": "doc_19486_chunk_0012", "text": "e/] \n * \n * Back to top\n\n\n\n\nWHEN AN WEBSPHERE MQ SERVER PRODUCT GOES OUT OF SUPPORT, DOES THE CLIENT AND FILE TRANSFER AGENT ALSO GO OUT OF SUPPORT?\n\n * Yes. WebSphere MQ V7.0 clients and WebSphere MQ File Transfer Edition V7.0.1 and V7.0.0 agents go out of support at the same time as the server.\n * \n * Back to top\n\n\n [/support/docview.wss?uid=swg21674407&amp;aid=3] \n\n\n\n\nARE THESE PRODUCTS STILL SUPPORTED WHEN THEY ARE BUNDLED WITH ANOTHER IBM PRODUCT?\n\n * Yes, support is available for all bundled components until the IBM product that includes them is withdrawn from support. However, they are only supported when used by the bundling IBM product. Unrelated usage is not supported.\n * \n *  Find the end of support date for your IBM software product [http://www.ibm.com/software/support/lifecycle/index_a_z.html] \n * \n * Back to top\n\n\n\n\nIS THE WEBSPHERE MQ V7.0 RESOURCE ADAPTER SUPPORTED IN WEBSPHERE APPLICATION SERVER?\n\n * Yes, the WebSphere MQ V7.0 Resource Adapter [http://www.ibm.com/support/docview.wss?uid=swg21248089#7dotx_0] shipped with WebSphere Application Server V8.0 and V7.0 is supported through 30 April 2018 "}, {"filename": "swg21426198.txt", "chunk_id": "doc_13468_chunk_0000", "text": "Title: IBM WebSphere MQ Series v7.0 and  WebSphere Partner Gateway v6.2 compatibility - United States\n\nText:\nMQ WMQ v7.0 v7 v700 700 7 7.0 version TECHNOTE (FAQ)\n\nQUESTION\n Is WebSphere MQ Series v7.0 supported on WebSphere Partner Gateway v6.2? \n\nANSWER\nWhile IBM has not officially tested nor supports WPG 6.2 with the use of WMQ version 7.0, we do understand the need and reasons for such. IBM WPG support is planning this testing, however we do not have an estimated time when it will be complete or when the official statement will be released. \n\n\nSince other products frequently ship fixes, updates, and new releases, testing every configuration is not possible by the IBM WPG support team. While IBM support understands that client may have a need to upgrade, you may install and run with updates to supported product minimum levels, but only if those updates are forward compatible (meaning that they are above the minimum requirements defined by WPG). Users should note that they are running at their own risk if they are using a fix, update, or new release other then what is claimed by IBM WPG Support. If an issue was found IBM WPG support will provide best effort in determining and resolving the issue. "}, {"filename": "swg1IZ63758.txt", "chunk_id": "doc_04956_chunk_0000", "text": "Title: IBM IZ63758: SEGMENTED MESSAGES ARE RECEIVED OUT OF ORDER WHEN CLIENT        APPLICATION IS LINKED AGAINST WEBSPHERE MQ V7.0 CLIENT LIBRARIES - United States\n\nText:\n  FIXES ARE AVAILABLE\nWebSphere MQ V7.0 Fix Pack 7.0.1.1 [http://www-01.ibm.com/support/docview.wss?uid=swg24024528]\nWebSphere MQ V7.0.1 for i5/OS Fix Pack 7.0.1.1 [http://www-01.ibm.com/support/docview.wss?uid=swg24025627]\nWebSphere MQ V7.0 Fix Pack 7.0.1.2 [http://www-01.ibm.com/support/docview.wss?uid=swg24026518]\nWebSphere MQ V7.0.1 for i5/OS Fix Pack 7.0.1.2 [http://www-01.ibm.com/support/docview.wss?uid=swg24026566]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  When applications retrieving segmented messages are linked\n   against WebSphere MQ v7.0 client libraries,the segmented\n   messages are not received in order. The application receives\n   segmented messages randomly from different logical messages,\n   from a queue that contains multiple logical messages.\n   \n   If the application is linked with WMQ v7.0 server libraries\n   the segmented messages are received in order.\n   \n   \n   KEYWORDS : MQGMO_LOGICAL_ORDER , arcW_TRUNCATED_MSG_FAILED\n   \n   \n    \n   \n"}]}, {"id": "TRAIN_Q415", "question": "Unable to login to FileNet Workplace XT 1.1.5.x. Getting error, Problem initializing encryption/decryption with keyID.\n\n\n\nWe are having issue while trying to login Workplace XT. Getting the error message below as soon as I hit after giving credentials.\n\nError Message: com.filenet.wcm.api.EncryptionException: Problem initializing encryption/decryption with keyId 7d3f93e3, size 256 bits. java.home=/opt/IBM/WebSphere/AppServer/java/jre. Cause: java.security. InvalidKeyException: Illegal key size or default parameters\n\nIBM WAS 8.5.5.9 Workplace XT 1.1.5", "answer": "Based on the retrieved documents, it appears that there is an issue with the encryption/decryption process in FileNet Workplace XT 1.1.5.x. The specific error encountered is related to a key ID of 7d3f93e3 with a size of 256 bits, which results in an InvalidKeyException: Illegal key size or default parameters. This indicates that the key used for encryption/decryption does not meet the expected requirements, likely due to an incorrect or unsupported key size. The cause seems to be related to Java security settings or arguments being improperly configured during the deployment of the application. To resolve this issue, ensure that the correct JVM arguments are set up properly for Workplace XT's Application Integration functionality, as mentioned in Document 2. Additionally,", "documents": [{"filename": "swg21501900.txt", "chunk_id": "doc_15038_chunk_0000", "text": "Title: IBM Unable to log on to FileNet WorkplaceXT receive an AE SecurityCheckFilter error - United States\n\nText:\nAE SecurityCheckFilter; JSSE; unlimited strength TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Unable to log on to FileNet WorkplaceXT - AE SecurityCheckFilter error \n\nSYMPTOM\nWhen attempting to log on to FileNet WorkplaceXT deployed on an IBM WebSphere Application Server, the following error is displayed : \n\nException Message: [Filter AE SecurityCheckFilter]: filter is unavailable. \nFilter AE SecurityCheckFilter: filter is unavailable. \n\n\nDIAGNOSING THE PROBLEM\nSystemOut.log may contain the following exception : \n\n\nProblem initializing encryption/decryption with keyId abcd1234, size 256 bits. java.home=<<WAS_home>>\\AppServer\\java\\jre. Cause: java.security.InvalidKeyException: Illegal key size or default parameters\ncom.filenet.wcm.api.EncryptionException: Problem initializing encryption/decryption with keyId abcd1234, size 256 bits. java.home=<<WAS_home>>\\AppServer\\java\\jre. Cause: java.security.InvalidKeyException: Illegal key size or default parameters\nat com.filenet.wcm.api.impl.CryptoHelper.getCipher(CryptoHelper.java:93)\nat com.filenet.wcm.api.impl.CryptoHelper.doEncryptOrDecrypt(CryptoHelper.java:104)\n"}, {"filename": "swg21568109.txt", "chunk_id": "doc_15824_chunk_0000", "text": "Title: IBM First time login to Office Integration fails - United States\n\nText:\nFIMO; BCS; App Int; Application Integration TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n User attempts login to FileNet Workplace XT Office Integration for the first time and receives an error \n\nSYMPTOM\nWhen attempting to login the following error is received in the user interface: \n\nCredentials Error: 0x80040794 - User Login Failed! \n\nFollowing errors seen in the FileNetLog.txt: \n\nResultXml: <?xml version=\"1.0\"?><response><errorcode>1940<\/errorcode><description>com.filenet.api.exception.EngineRuntimeException;The user is not authenticated. [Code=null]; OMFC/TheNetwork/NoOp//E_NOT_AUTHENTICATED<\/description><\/response>\n\n\nCAUSE\nThe Generic JVM argument required for application integration setup in Workplace XT is either not in the JVM argument or is incorrect.\n\nThis argument is referenced in the IBM FileNet Workplace XT 1.1.x.x Installation and Upgrade Guide under the following heading, \"To configure WebSphere to support user tokens and WebDav connections for Workplace XT (for Application Integration, eForms, Records Manager, and others)\"\n\n\n\nDIAGNOSING THE PROBLEM\nUnable to login to Office Integration\n\n\n\n"}, {"filename": "swg21446945.txt", "chunk_id": "doc_13898_chunk_0000", "text": "Title: IBM Getting Credentials Error: 0x80040794 when trying to login to FileNet Content Manager  Workplace using Application Integration from Microsoft Office applications and from eForms Designer. - United States\n\nText:\nencryption problem Encryption Exception App Int TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Trying to login to Workplace thru Application Integration, produced Credentials Error: 0x80040794.\n\n\nSYMPTOM\n \n\nThe Application Integration dialog box showed the following error:\n\nCredentials Error: 0x80040794 - User Login Failed!\n\nThe Application Integration log showed the following error:\n\nERROR http-8080-Processor22 com.filenet.wcm.api.EncryptionException - [throw] Problem initializing encryption/decryption with keyId c708ec77, size 448 bits. java.home=C:\\Program Files\\Java\\j2re1.4.2_08. Cause: java.lang.SecurityException: Unsupported keysize or algorithm parameters \ncom.filenet.wcm.api.EncryptionException: Problem initializing encryption/decryption with keyId c708ec77, size 448 bits. java.home=C:\\Program Files\\Java\\j2re1.4.2_08. Cause: java.lang.SecurityException: Unsupported keysize or algorithm parameters \nat com.filenet.wcm.api.impl.CryptoHelper.getCipher(CryptoHelper.java:77) \n"}]}, {"id": "TRAIN_Q456", "question": "zonecfg error while starting nodeagent and dmgr\n\n\n\nI saw zonecfg error while starting nodeagent and dmgr in solaris server\n\nMy env is Oracle Solaris 11.2 SPARC, and WAS is 8558, jave 1.7. [1/22/16 21:31:18:379 AEDT] 00000001 SystemOut O java.lang.Exception: command /usr/sbin/zonecfg failed with 1 at com.ibm.ws.xd.agent.hypervisor.SolarisHypervisor.executeCommand(SolarisHypervisor.java:357) at com.ibm.ws.xd.agent.hypervisor.SolarisHypervisor.access$100 (SolarisHypervisor.java:30) at com.ibm.ws.xd.agent.hypervisor.SolarisHypervisor$Zone.processZoneCfg(SolarisHypervisor.java:570) at com.ibm.ws.xd.agent.hypervisor.SolarisHypervisor$Zone.(SolarisHypervisor.java:461) at com.ibm.ws.xd.agent.hypervisor.SolarisHypervisor ..... Is that normal behavior and what's the exactly meaning of the error?", "answer": "Yes, this is normal behavior. When WebSphere Application Server is started as a non-root user, it does not have permission to run certain native commands required by the system. The error message indicates that the 'command /usr/sbin/zonecfg' failed with return code 1, which likely means there was an issue executing the command due to insufficient permissions. To resolve this, you need to run WebSphere Application Server under a root user. If your environment is not virtualized, ignoring these errors during startup would not impact a non-virtualized environment.", "documents": [{"filename": "swg21626683.txt", "chunk_id": "doc_17635_chunk_0000", "text": "Title: IBM Exceptions starting WAS 8.5 as non root user on Solaris - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n You notice the exceptions below at start up. \n\nSYMPTOM\nException: command /usr/sbin/zonecfg failed with 1\nand \nFFDC Exception:java.lang.Exception SourceId:com.ibm.ws.xd.vv.nodedetect.NetworkInterfaceUtil.getMacAddresses ProbeId:2\njava.lang.Exception: dlopen() returned error; rc=128\n\n\nCAUSE\nWhen WebSphere Application Server is run as a non-root user it will not be able to run native commands. This limited access causes the exceptions.\n\nRESOLVING THE PROBLEM\nTo resolve the problem, run WebSphere Application Server under a root user. If the environment is not virtualized, that is if Solaris zones are not being used then the errors can be ignored as these will only occur at start up and will not affect a non-virtualized environment"}, {"filename": "swg21551427.txt", "chunk_id": "doc_15643_chunk_0000", "text": "Title: IBM ITM UNIX OS Agent on Solaris won't start - United States\n\nText:\nITM_UNIX_OS_AGENT 5724C040U - UX OS Agent Solaris TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n ITM UNIX OS Agent on Solaris won't start. This happened for 6.22 FP02 but could also occur on 6.2, 6.2.1 and 6.2.3 versions of the agent\n\n# ./itmcmd agent start ux\nStarting Monitoring Agent for UNIX OS ...\nKCIIN0198E Unable to start agent. Please, check log file. \n\nSYMPTOM\nThe following is the error in the logfile: \n\nld.so.1: kuxagent: fatal: librtld_db.so.1: version `SUNWprivate_1.1' not found (required by file /lib/sparcv9/libproc.so.1)\nld.so.1: kuxagent: fatal: librtld_db.so.1: open failed: No such file or directory\n\n\nCAUSE\nSUNWprivate_1.1 is missing under /lib/64/librtld_db.so.1. This is contained in a Solaris patch provided by Sun.\n\n\nENVIRONMENT\n6.2, 6.2.1, 6.2.2, 6.2.3 (64-bit)\n\n\n\nDIAGNOSING THE PROBLEM\n# /export/opt/IBM/ITM/bin/itmcmd execute ux \"ldd /export/opt/IBM/ITM/sol*/ux/bin/kuxagent\" \n\n\n** If \"ldd\" cannot be found, use the fully qualified path of \"ldd\" (\"which ldd\" should give you the path). All the libraries used by the kuxagent will be listed here (based on the version of the agent running)\n\n"}]}, {"id": "TRAIN_Q463", "question": "Can Portal prevent the usage of simultaneous logins with the same userID?\n\nIs it possible for WebSphere Portal to limit the usage of a userID to one authenticated session as a time? In other words, prevent authenticating to Portal as \"user1\" from one browser and then simultaneously authenticating to Portal again as \"user1\" from another browser?", "answer": "No, WebSphere Portal does not have a built-in mechanism or configuration setting to limit the number of times a user ID may log in. The retrieval of documents indicates that unexpected behavior may occur if the same ID is logged in more than once without proper handling. It is recommended to contact IBM Services for assistance to undertake a project involving custom tracking code to prevent multiple logins.", "documents": [{"filename": "swg21227799.txt", "chunk_id": "doc_11096_chunk_0000", "text": "Title: IBM Multiple logins using the same user ID - United States\n\nText:\nConcurrentModificationException; log in; login; multiple; userid; multiple login TECHNOTE (FAQ)\n\nQUESTION\n \"ConcurrentModificationException\" and other errors may occur if the same user id is logged in to IBM WebSphere Portal multiple times.\n\n\nANSWER\nWebSphere Portal has no built-in mechanism or configuration setting to limit the number of times a user id may log in. Unexpected behavior may occur if the same id is logged in more than once and this is not supported. \n\n\"ConcurrentModificationException\" and other errors may be logged.\n\nMost of the related issues were resolved in WebSphere Portal 5.1. However, you may still encounter exceptions or side-effects if you access the Portal in multiple browser windows using the same user id, whether or not the authentication requests take place on separate physical hosts.\n\nIt may be possible to prevent multiple logins by writing custom \"tracking code.\" Contact IBM Services for assistance to undertake such a project. WebSphere Portal Development does not have any sample code.\n\nIf you wish to write your own code, some of the issues to be aware of are (this is not an inclusive list):\n\n"}, {"filename": "swg21224029.txt", "chunk_id": "doc_11074_chunk_0001", "text": "e. Instead, you see the Portal login page, a session timeout error, or the ESM's login page once again.\n\nHow can these issues be prevented? \n\nANSWER\n\nThese issues are common in environments where WebSphere Portal has been integrated with a third-party security product that handles authentication (such as Tivoli Access Manager [TAM]). To remedy one or more of these scenarios, WebSphere Portal Support suggests the following:\n\n\n * Add timeout.resume.session=true to the ConfigService for WebSphere Portal. This will prevent the Portal server from displaying the session timeout page and will force the ESM to handle idle session time-outs. Refer to Document #1253578, \"Implementing the timeout.resume.session parameter in WebSphere Portal [http://www.ibm.com/support/docview.wss?rs=688&uid=swg21253578]\", for more information about the usage of this parameter. \n\n * Set the redirect.logout.url parameter in ConfigService for WebSphere Portal to redirect to a page that also destroys the session cookie established by the third-party authentication manager. For example, in TAM, the parameter would look like redirect.logout.url = https://<host>/pkmslogout.\n\n"}]}, {"id": "TRAIN_Q504", "question": "OMNIBUS   nco_p_mttrapd : Malformed traps\n\nHow can you determine why the MTTrapd [SNMP] probe drops traps?", "answer": "To determine why the MTTrapd [SNMP] probe drops traps, follow these steps based on the provided documents:\n\n1. Ensure that the traps are being dropped from specific devices under normal load. Monitor the probe server ports where traps are received.\n\n2. Use tools like snoop, tcpdump, or Wireshark to capture the traps that are being dropped on the probe server port. Review the captured data visually.\n\n3. Verify if the traps are missing enterprise-oid and uptime fields, which would cause them to be dropped during probe processing by the NET-SNMP libraries.\n\n4. Try setting the Protocol to 'ALL' in case the trap is being sent as TCP|UDP.\n\n5. For SNMPv3 trap and inform processing, refer to the available online FAQ's and supplementary", "documents": [{"filename": "swg21468340.txt", "chunk_id": "doc_14315_chunk_0000", "text": "Title: IBM MTTrapd [SNMP] probe drops traps from specific devices - United States\n\nText:\nnco_p_mttrapd; snmp; snmp traps; traps; dropped; drop; dropping; malformed; TCP TECHNOTE (FAQ)\n\nQUESTION\n MMTrapd probe : Why are SNMP traps dropped from specific devices? \n\nCAUSE\nSNMP packets can be dropped for a number of reasons, including overloading, malformed packets, malformed traps/informs and incorrectly configured/non-compliant MIBS.\n\nANSWER\nTraps can be dropped during high loading, so ensure that the traps are being dropped from specific devices under normal load. \n\nUse snoop, tcpdump or Wireshark to capture the traps that are being dropped on the probe servers port, as defined in the property file. \n\ne.g.\nPort : 162\n\n\nLoad the PCAP file into the Wireshark GUI and review the trap[s] visually. \n\n\nFor traps to be processed they must have enterprise-oid and uptime, otherwise they will be dropped during probe processing by the NET-SNMP libraries.\n\nTry setting Protocol to 'ALL' in case the trap is being sent as TCP|UDP.\n\nFor SNMPv3 trap and inform processing please refer to the available online FAQ's and supplementary documentation [see related information].\n\n"}, {"filename": "swg21501604.txt", "chunk_id": "doc_15032_chunk_0000", "text": "Title: IBM MTTrapd [SNMP] probe reports : Dropping trap! - United States\n\nText:\nnco_p_mttrapd; snmp; mttrapd; probe; dropping trap; Dropping trap; dropped; drop; trap; gethostbyname; trapqueue; trap queue; queue TECHNOTE (FAQ)\n\nQUESTION\n MTTrapd probe : Warning : Dropping trap : Why does this happen? \n\nANSWER\nThe MTTrapd probe will report that the probe is dropping traps once the trap queue is full. \n\ne.g.\nWarning: W-UNK-000-000: Dropping Trap!\n\nWith the LogStatisticsInterval property set;\nLogStatisticsInterval : 30\n\nThe probe will also provide details on the probes trap queue processing;\nError: E-UNK-000-000: Trap queue size is 50000\nError: E-UNK-000-000: Number of traps read in the last N seconds: I\nError: E-UNK-000-000: Number of traps processed in the last N seconds: J\n\nWhere N is the number of seconds passed, 'I' is the number of traps handled, and 'J' the number traps processed by the probe.\n\nThe reason why the probe drops traps is because the trap queue is full.\nThe trap queue is set using the TrapQueueMax property;\ne.g.\nTrapQueueMax : 50000\n\n"}, {"filename": "swg21624836.txt", "chunk_id": "doc_17559_chunk_0000", "text": "Title: IBM SNMP Probe : APAR  IV15415 : Requirements - United States\n\nText:\nnco_p-mttrapd; snmp v3; snmpv3; traps; gskit; engineid; EngineID; IV15415 TECHNOTE (FAQ)\n\nQUESTION\n SNMPv3 traps : Why are traps not parsed as expected? \n\nCAUSE\n IV15415 comes in two parts - The MTTrapd probe must be at least probe-nco-p-mttrapd-14 and Netcool/OMNIbus 7.3.1 must be at least Fix Pack 5\n\nANSWER\n \n\nThere was a bug fix implemented in both the MTTrapd probe and the Netcool/OMNIbus library: \n\n\nIV15415 - V731:GSKIT LIBNCRYPT CAUSES SOME SNMPV3 TRAPS TO BE DISCARDED BY\nTHE MTTRAPD PROBE \n\nAlthough the README for the probe mentions probe-nco-p-mttrapd-12:\n\n\nPATCH probe-nco-p-mttrapd-12\n============================\nREVISION 1:\n-----------\nIV15415 - Fixed Mttrapd probe not able to receive SNMP v3 traps on Omnibus 7.3.1 (GSKit 8) \n\n\nThe actual GA product release with bug fix in is probe-nco-p-mttrapd-14, released in November 2012.\n\nTherefore for the bug fix to be implemented both Netcool/OMNIbus v7.3.1. fix pack 5 and the probe-nco-p-mttrapd-14 need to be installed. \n\n \n\nListIU.sh should show:\nName: SIU-probe-nco-p-mttrapd Version: 1.14.0.0 \nName: SIU-gskit Version: 8.14.2300.0\nName: SIU-libncrypt Version: 2.0.7.0 \n\n"}, {"filename": "swg21883201.txt", "chunk_id": "doc_21355_chunk_0000", "text": "Title: IBM MTTrapd [SNMP] Probe : Typical system trap sending - United States\n\nText:\nnco_p_mttrapd; trap; destination; forwarding; three stage; uat; testing; p2p TECHNOTE (FAQ)\n\nQUESTION\n MTTrapd probe : What is the minimum number of destinations? \n\nCAUSE\nCustomers who use the standard production, user acceptance testing, and test environments require a description of the options and best practices.\nThe Peer-to-Peer configuration requires two identical trap sources to function, and both probe servers to be allocated the same resources, such that the master and slave probes are processing traps in sequence.\n\n\nANSWER\n \n\nCustomers who use the three stage design in their Netcool/OMNIbus environment can forward traps to three destinations, allowing them to receive traps in their production environment and test environments, as shown below:\n[/support/docview.wss?uid=swg21883201&aid=1] [/support/docview.wss?uid=swg21883201&aid=1] \n\nThe Netcool/ITNM [Precision] now called TNCM includes a trap forwarder [ncp_trapmux] but there are other trap forwarders available, as well as high-availability tcp forwarding solutions. \n\n"}, {"filename": "swg21667679.txt", "chunk_id": "doc_19123_chunk_0000", "text": "Title: IBM The mttrapd probe is unable to receive SNMP v3 traps. - United States\n\nText:\nE-UNK-000-000 unknown net-snmp error config file des DES TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The mttrapd probe is able to receive V1 traps but not V3 traps. \n\nSYMPTOM\nError in debug log of probe:\n\nError: E-UNK-000-000: SNMP Message (priority=3): /usr1/esm/tivoli/netcool/omnibus/probes/linux2x86/mttrapd.conf: line XX: Error: Unknown authentication protocol \nError: E-UNK-000-000: SNMP Message (priority=3): net-snmp: 1 error(s) in config file(s) \n\n\nCAUSE\nThe authentication protocol specified in the createUser command of the mttrapd.conf file is incorrect.\n\nDIAGNOSING THE PROBLEM\nCheck the line number mentioned in the error and in this case it is against the \"createUser\" command that is used to specify the authentication protocol. The authentication protocol was specified in lower case instead of uppercase.\n\n\nRESOLVING THE PROBLEM\nCheck and make sure that the authentication protocol is in upper case and not lower case. That is, it should be \"MD5\" and not \"md5\".\n\n \n\nPRODUCT ALIAS/SYNONYM\n OMNIbus"}]}, {"id": "TRAIN_Q541", "question": "Cognos Workspace Advanced Users are unable to see features. Why?\n\n\n\nCertain Workspace Advanced users cannot open Report Studio. This happens with certain custom roles.\n\nEnvironment: IBM Cognos 10.2.2.x", "answer": "To resolve the issue where certain Workspace Advanced users cannot open Report Studio, follow these steps:\n\n1. **Remove Express Authors Role**: Ensure that the user's associated groups do not contain the 'Express Authors' role. This prevents them from having Report Studio capabilities.\n\n2. **Modify User Interface Profiles**:\n   - Log into Cognos Connection.\n   - Go to IBM Cognos Administration > Security > User Interface Profiles.\n   - Select the 'Express' option.\n   - Right-click and choose 'Properties'.\n   - Remove 'Express Authors' from the groups and roles.\n\nAfter performing these steps, the user should no longer be able to open Report Studio due to the removal of their ability to view the 'Cognos Advanced Workspace' icon from Cognos Connection.", "documents": [{"filename": "swg21617712.txt", "chunk_id": "doc_17300_chunk_0000", "text": "Title: IBM How to remove 'Cognos Advanced Workspace' icon from Cognos Connection - United States\n\nText:\nCAW; capabilities; permissions; report studio; icons TECHNOTE (FAQ)\n\nQUESTION\n How to remove the 'Cognos Advanced Workspace' icon from Cognos Connection thus preventing the user from opening reports within Cognos Advanced Workspace. \n\nANSWER\n- Remove the role/group 'Express Authors' from the user's associated groups. \n\nNote: This also removes Report Studio Capabilities from that user. If you wish the user to still have Report Studio Capabilities but still not be able to view the 'Cognos Advanced Workspace' icon from Cognos Connection, perform the steps outlined below: \n\n\n- Open Cognos Connection.\n- Click 'Launch' -> IBM Cognos Administration.\n- Select the 'Security' tab.\n- Select the 'User Interface Profiles' tab on the left. \n- Click the 'drop down' arrow on the 'Express' selection. \n- Click the Properties button to open up a new window\n- Remove 'Express Authors' from the groups and roles.\n\nYou should now note when you now log on as that particular user, when you check the user's capabilities they will have the Report Studio Capabilities however they will not be able to view the 'Cognos Advanced Workspace' icon."}, {"filename": "swg21984315.txt", "chunk_id": "doc_23571_chunk_0000", "text": "Title: IBM Error when clicking \"Open in Report Studio\" and \"Open in Workspace Advanced\" - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The \"Open in Report Studio\" and \"Open in Workspace Advanced\" features are no longer supported by IBM Cognos Analysis for Microsoft Excel (CAFE) when using Cognos Analytics (CA) Server 11.0 and later as the data source.\n\nUsers will encounter an error message if they click the \"Open in Report Studio\" or \"Open in Workspace Advanced\" button in the IBM CAFE user interface. \n\nSYMPTOM\nIf a user clicks the \"Open in Report Studio\" or \"Open in Workspace Advanced\" button in the IBM CAFE user interface, neither Report Studio nor Workspace Advanced will open and they will encounter the following error message: HAL ERROR: _ELI. PSE()_ must be called in the HTML body\n\n\nCAUSE\n Although support for these features has been dropped, buttons for these features still exist in the IBM CAFE user interface. \n\nRESOLVING THE PROBLEM\nIn order to remove the \"Open in Report Studio\" and \"Open in Workspace Advanced\" buttons from the IBM CAFE interface, users must install: \n\n\n- IBM Cognos Analysis for Microsoft Excel Fix Pack 6 \n\n- CA server version 11.0.3"}, {"filename": "swg21593254.txt", "chunk_id": "doc_16544_chunk_0000", "text": "Title: IBM How to create a custom group/role for Cognos Workspace and/or Cognos Workspace Advanced - United States\n\nText:\n
