const cases=[{"id": "DEV_Q100", "question": "ITCAM Agent for WebSphere DataPower 7.1 agent support for TLS\n\nDoes the ITCAM Agent for WebSphere DataPower 7.1 agent support TLS?", "answer": "Yes, the ITCAM Agent for WebSphere DataPower 7.1 supports TLS. However, ensure that the AD 7.1 DC is at least at 7.1.0.3.8 (or 7.1.0.4) level as there is an issue with heap size values in the GC and Application Server summary workspaces with older AD 7.1 versions.", "documents": [{"filename": "swg21957777.txt", "chunk_id": "doc_21568_chunk_0000", "text": "Title: IBM ITCAM for AD WebSphere Agent 7.1.x and ITCAM WebSphere Agent 7.2 application support files - United States\n\nText:\nCAMADALL CAMADENV Comatible AD 7.1 ITCAM 7.2 support file backward compatible TECHNOTE (FAQ)\n\nTHIS DOCUMENT APPLIES ONLY TO THE FOLLOWING LANGUAGE VERSION(S):\n US English \n\nQUESTION\n Is ITCAM for AD 7.1.x compatible with 7.2 support files? Are these version backward compatible?\n\n\nANSWER\nYes, it should be compatible. However, make sure that the AD 7.1 DC is at least at 7.1.0.3.8 (or 7.1.0.4) level as there is an issue with heap size values in the GC and Application Server summary workspaces with older AD 7.1 versions. \n\n \n\nPRODUCT ALIAS/SYNONYM\n ITCAM4AD ITCAMfAD ITCAM for App Diagnostics"}, {"filename": "swg27038500.txt", "chunk_id": "doc_27798_chunk_0000", "text": "Title: IBM Webcast Replay: Monitoring DataPower revisited: ITCAM for SOA 7.2, ITCAM Agent for DataPower 7.1, and WAMC 5.0 - United States\n\nText:\nwste_webcast; WSTE; Support Technical Exchange; education; presentation; webcast; STEwebcastDocument; ITCAM for Applications SOA WAMC DataPower WEBCAST\n\nABSTRACT\n IBM Tivoli Composite Application Manager (ITCAM) for SOA, the ITCAM Agent for DataPower, and the WebSphere Appliance Management Center monitor and manage DataPower appliances. We will review the new product versions released in 2012, a few sample problems, and approaches to troubleshooting.\n\n\nLevel of Difficulty: Intermediate \n\nPresenter(s): Dorine Yelton, Yun Wilson, Phillip Johnson\n\nDate: 05 June 2013 \n\nPRESENTATION\n[http://www.ibm.com/i/v16/icons/weblecture.gif]2013MonitoringDPITCAMSOAITCAMAgentDPWAMC.pdf [/support/docview.wss?uid=swg27038500&aid=2]2013MonitoringDPITCAMSOAITCAMAgentDPWAMC.pdf [/support/docview.wss?uid=swg27038500&aid=1]\n\n\nClick the PDF file above to play the slide presentation for this Webcast. Right-click and select Save As to store the file on your local computer for later review.\n\nGet Adobe Reader [http://www.adobe.com/products/acrobat/readstep2.html] to view PDF\n\n\n"}, {"filename": "swg21637725.txt", "chunk_id": "doc_17976_chunk_0000", "text": "Title: IBM Detailed System Requirements for ITCAM Agent for DataPower - United States\n\nText:\nCAMDPALL CAMDPENV Detailed Requirement System Agent Data Power \"Agent for Data Power\" Software Hardware BN TECHNOTE (FAQ)\n\nQUESTION\n The supported version of Operating Systems and Data Power appliances (for ITCAM Agent for Data Power) \n\nANSWER\n \n\n * Supported Operating Systems and Supported versions of WebSphere DataPower Appliance - ITCAM Agent for Data Power Version Link to the documentation Version 7.1 http://publib.boulder.ibm.com/infocenter/tivihelp/v24r1/index.jsp?topic=%2Fcom.ibm.itcama.doc_7.1%2Fprerequisites%2Fitcamfapps71_reqs.htm [http://publib.boulder.ibm.com/infocenter/tivihelp/v24r1/index.jsp?topic=%2Fcom.ibm.itcama.doc_7.1%2Fprerequisites%2Fitcamfapps71_reqs.htm] \n   \n   note: Click on the tab \"DataPower Monitoring Agent\" to access the info. Version 6.3 \n   (EXPIRED, Not in support) http://publib.boulder.ibm.com/infocenter/tivihelp/v24r1/index.jsp?topic=%2Fcom.ibm.itcamsoa.doc_6.2.2%2Frequirements.htm&path=3_7_6_0 [http://publib.boulder.ibm.com/infocenter/tivihelp/v24r1/index.jsp?topic=%2Fcom.ibm.itcamsoa.doc_6.2.2%2Frequirements.htm&path=3_7_6_0] \n\n \n\nPRODUCT ALIAS/SYNONYM\n ITCAM for SOA Platform ITCAM for Data Power"}, {"filename": "swg27024421.txt", "chunk_id": "doc_27672_chunk_0000", "text": "Title: IBM Webcast replay: Monitoring DataPower with ITCAM for SOA, ITCAM Agent for DataPower, and WAMC - United States\n\nText:\nwste_webcast; WSTE; Support Technical Exchange; education; presentation; webcast; STEwebcastDocument; DataPower; ITCAM; SOA Agent; WAMC; SNMP; TEP; WSM WEBCAST\n\nABSTRACT\n IBM Tivoli Composite Application Manager (ITCAM) for SOA, the ITCAM Agent for DataPower, and the WebSphere Appliance Management Center (WAMC) monitors and manages DataPower appliances. This WebSphere Support Technical Exchange is designed to review the different features of these products and a few sample problems and approaches to troubleshooting.\n\n\nLevel of Difficulty: Intermediate \n\nPresenter(s): Dorine Yelton\n\nDate: 3 April 2012 \n\nPRESENTATION\n[http://www.ibm.com/i/v16/icons/weblecture.gif]WSTE-04032012-MonitoringDPITCAMSOAITCAMAgentDPWAMC-Yelton.pdf [/support/docview.wss?uid=swg27024421&aid=2]WSTE-04032012-MonitoringDPITCAMSOAITCAMAgentDPWAMC-Yelton.pdf [/support/docview.wss?uid=swg27024421&aid=1]\n\n\nClick the PDF file above to play the slide presentation for this Webcast. Right-click and select Save As to store the file on your local computer for later review.\n\n"}, {"filename": "swg21639861.txt", "chunk_id": "doc_18065_chunk_0000", "text": "Title: IBM Installing ITCAM Agent for WebSphere Applications Reports V7.2 on Tivoli Common Report 3.1 - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How do I install ITCAM Agent for WebSphere Applications Reports V7.2 on Tivoli Common Report 3.1? \n\nANSWER\nYou can install ITCAM Agent for WebSphere Applications Reports 7.2, provided with ITCAM for Applications V7.2.0.0.1, on Tivoli Common Reporting V2.1.1 or V3.1 by performing a manual installation or by using the Reports installer. \nPrerequisites and pre-installation tasks\n\nBefore installing ITCAM Agent for WebSphere Applications Reports, verify that you have met the following prerequisites: \n\n * Tivoli Monitoring 6.2.2 fix pack 3 or higher \n * Tivoli Common Reporting 2.1.1 or version 3.1 \n * ITCAM Agent for WebSphere Applications 7.1 Fix Pack 2, interim fix 3, or higher \n * Tivoli Data Warehouse (including Summarization and Pruning agent [SnP]) \n * You must have Java Runtime Environment (JRE) 1.5 or higher installed on the systems where you are plan to run the reports installer\n\n\nThe databases that are supported are the same as the databases supported by Tivoli Data Warehouse. \n\nInstalling using the Reports installer \n\n"}]}, {"id": "DEV_Q101", "question": "Help with Security Bulletin: WMB and IIB Toolkit cannot connect to a remote WMB broker or IIB node with a TLS-compliant cipher (CVE-2015-0118)\n\nI need to understand details regarding Security Bulletin: WebSphere Message Broker Toolkit and IBM Integration Toolkit cannot connect to a remote WebSphere Message Broker broker or IBM Integration Bus node with a TLS-compliant cipher (CVE-2015-0118). Where can I find this information?", "answer": "To find more detailed information about the security bulletin related to the inability of WebSphere Message Broker Toolkit and IBM Integration Toolkit to connect to a remote WebSphere Message Broker broker or IBM Integration Bus node with a TLS-compliant cipher, you should refer to Document 1:\n\n\"IBM Security Bulletin: WebSphere Message Broker Toolkit and IBM Integration Toolkit cannot connect to a remote WebSphere Message Broker broker or IBM Integration Bus node with a TLS-compliant cipher (CVE-2015-0118) - United States\"\n\nThis document provides comprehensive details including the summary, vulnerability details, CVSS scores, affected products and versions, and remediation fixes.\n\nFor additional context and specific configurations required to resolve the issue, consult Document 2:\n\n\"IBM IIB or WMB Toolkit connection failure - United", "documents": [{"filename": "swg21957998.txt", "chunk_id": "doc_21580_chunk_0000", "text": "Title: IBM Security Bulletin: WebSphere Message Broker Toolkit and IBM Integration Toolkit cannot connect to a remote WebSphere Message Broker broker or IBM Integration Bus node with a TLS-compliant cipher (CVE-2015-0118) - United States\n\nText:\nWMB IIB Toolkit SECURITY BULLETIN\n\nSUMMARY\n WebSphere Message Broker Toolkit and IBM Integration Toolkit cannot connect to remote WebSphere Message Broker or IBM Integration Bus node with a TLS-compliant cipher. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2015-0118 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-0118]\nDESCRIPTION: IBM Integration Toolkit cannot connect to a remote IBM Integration Bus node with a TLS-compliant cipher because the IBM MQ client JARs are back level. The connection fails because the IBM MQ client JAR files included with the toolkit do not support the stronger TLS cipher suites.\nCVSS Base Score: 1.5\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/100349 [https://exchange.xforce.ibmcloud.com/vulnerabilities/100349] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:L/AC:M/Au:S/C:P/I:N/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\nWebSphere Message Broker Toolkit V7 and V8. \n\n IBM Integration Toolkit V9\n\n"}, {"filename": "swg21615685.txt", "chunk_id": "doc_17226_chunk_0000", "text": "Title: IBM IIB or WMB Toolkit connection failure - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The IBM Integration Bus (IIB) or WebSphere Message Broker (WMB) Toolkit fails to connect to a remote broker, with error MQRC 2059 \n\nSYMPTOM\nYou have correctly configured your WebSphere Message Broker Toolkit to connect to a remote broker, by using the configuration steps [http://www.ibm.com/support/knowledgecenter/SSKM8N_8.0.0/com.ibm.etools.mft.doc/be10200_.htm] from the product documentation. \n\nYour queue manager has been given the correct authorisation, but attempting to connect to the remote broker by using the WebSphere Message Broker Toolkit results in error MQRC 2059.\nYou can connect to your remote broker from the same machine without error by using the WebSphere Message Broker Explorer, or by completing the following steps:\n1. Set the following environment variable: \n\n * \n * set MQSERVER=ChannelName/TCP/server-address(port) \n * \n * export MQSERVER=ChannelName/TCP/'server-address(port)' \n\n2. Open a WebSphere Message Broker command prompt, and enter the following test command:  * \n\n\nCAUSE\nThe network configuration of your IIB or WMB Toolkit installation is incorrect.\n\n"}, {"filename": "swg21677891.txt", "chunk_id": "doc_19689_chunk_0000", "text": "Title: IBM Security Bulletin : IBM Websphere Message Broker and IBM Integration Bus are affected by SSL Vulnerability in DataDirect ODBC drivers ( CVE-2014-0224) - United States\n\nText:\nWMB IIB PSIRT SECURITY BULLETIN\n\nSUMMARY\n Security vulnerabilities have been discovered in OpenSSL that were reported on June 5, 2014 by the OpenSSL Project. \n\nVULNERABILITY DETAILS\nOpenSSL Security Vulnerability in DataDirect Drivers shipped with WebSphere Message Broker 8.0 and IBM Integration Bus 9.0. (CVE-2014-0224) . This only affects users of DataDirect ODBC SSL connectivity.\nLinks to latest fix packs\nWebSphere Message Broker 8.0.0.4 [http://www.ibm.com/support/docview.wss?uid=swg24037264] \nIBM Integration Bus 9.0.0.2 [http://www.ibm.com/support/docview.wss?uid=swg24037877] [http://www-01.ibm.com/support/docview.wss?uid=swg24037877]\n\nCVE-ID: CVE-2014-0224 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-0224]\n\nDESCRIPTION: OpenSSL is vulnerable to a man-in-the-middle attack, caused by the use of weak keying material in SSL/TLS clients and servers. A remote attacker could exploit this vulnerability using a specially-crafted handshake to conduct man-in-the-middle attacks to decrypt and modify traffic. \n\n"}, {"filename": "swg22005331.txt", "chunk_id": "doc_25208_chunk_0000", "text": "Title: IBM Security Bulletin: WebSphere Message Broker and IBM Integration Bus are affected by Open Source Tomcat vulnerability - United States\n\nText:\nWMB IIB SECURITY BULLETIN\n\nSUMMARY\n WebSphere Message Broker and IBM Integration Bus are affected by Open Source Apache Tomcat vulnerability \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-6816 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-6816]\nDESCRIPTION: Apache Tomcat is vulnerable to HTTP response splitting attacks, caused by improper validation of user-supplied input. A remote attacker could exploit this vulnerability to inject arbitrary HTTP headers and cause the server to return a split response, once the URL is clicked. This would allow the attacker to perform further attacks, such as Web cache poisoning or cross-site scripting, and possibly obtain sensitive information.\nCVSS Base Score: 6.1\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/119158 [https://exchange.xforce.ibmcloud.com/vulnerabilities/119158] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n IBM Integration Bus V10.0.0.0- 10.0.0.8 \n\nIBM Integration Bus V9.0.0.0- 9.0.0.7 \n\n"}, {"filename": "swg21969672.txt", "chunk_id": "doc_22361_chunk_0000", "text": "Title: IBM Security Bulletin: WebSphere Message Broker and IBM Integration Bus are affected by confidentiality vulnerability (CVE-2015-7399) - United States\n\nText:\nWMB IIB SECURITY BULLETIN\n\nSUMMARY\n WebSphere Message Broker and IBM Integration Bus could allow a potential attacker to identify the technology used to handle incoming HTTP requests \n\nVULNERABILITY DETAILS\nCVEID: CVE-2015-7399 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-7399]\nDESCRIPTION: IBM Integration Bus could allow a potential attacker to identify the technology used to handle incoming HTTP requests. This could allow them to search for other known vulnerabilities to exploit.\nCVSS Base Score: 5.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/107104 [https://exchange.xforce.ibmcloud.com/vulnerabilities/107104] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n IBM Integration Bus V9, V10 \n\n WebSphere Message Broker V8, V7\n\nREMEDIATION/FIXES\n \n\n"}]}, {"id": "DEV_Q122", "question": "Importing Asset GL Errors\n\n When importing or syncing with assets, I receive the following error for the glaccount.\n\nInternal Server Error\nError 500: nested exception is: psdi.util.MXAccessException: BMXAA4198E - The GL attribute TLOAMNEWGLACCOUNT on object {1} requires an organization. Specify a value in the Organization field.", "answer": "The error message indicates that the GL attribute TLOAMNEWGLACCOUNT on object {1} requires an organization, and it specifies that a value must be specified in the Organization field. This error can occur when attempting to import or sync assets using the Integration Framework, specifically when applying an IFIX or FIXPACK. The fix required by the error involves including the neworgid in the message.", "documents": [{"filename": "swg21969653.txt", "chunk_id": "doc_22354_chunk_0000", "text": "Title: IBM BMXAA4198E - The GL attribute TLOAMNEWGLACCOUNT on object {1} requires an organization. - United States\n\nText:\nTAPEINTEGRATION; asset; MIF TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When importing ASSET using the Integration Framework you receive the following error after applying an IFIX or FIXPACK:\n\nBMXAA4198E - The GL attribute TLOAMNEWGLACCOUNT on object {1} requires an organization. Specify a value in the Organization field. \n\nCAUSE\nThis error is occurring due to a fix made for APAR IV67500 and included in a Maximo 7.5.0.6 or later ifix. The fix requires that the neworgid is included in the message.\n\nDIAGNOSING THE PROBLEM\nYou will see a stack trace similar to the following in the system out log: \n\npsdi.util.MXAccessException: BMXAA4198E - The GL attribute TLOAMNEWGLACCOUNT on object {1} requires an organization. Specify a value in the Organization field. \nat psdi.mbo.Mbo.getOrgForGL(Mbo.java:6976) \nat psdi.mbo.MboGLValue._setValue(MboGLValue.java:59) \nat psdi.mbo.MboValue.setValue(MboValue.java:1141) \nat psdi.mbo.Mbo.setValue(Mbo.java:2175) \nat \npsdi.app.asset.FldMoveModifyAssetNewGLAccount.initValue(FldMoveModifyAssetNewGLAccount.java:53) \nat psdi.mbo.MboValue.initValue(MboValue.java:404) \n"}, {"filename": "swg1IZ89276.txt", "chunk_id": "doc_05204_chunk_0001", "text": "*************\n   * PROBLEM DESCRIPTION: BMXAA4198E - \"Organization needed for   *\n   *                      GL attribute GLACCOUNT on object  1\"    *\n   *                      encountered in Service Requests when    *\n   *                      trying to set the GLAccount before the  *\n   *                      AssetOrgId has been set.  This error    *\n   *                      would be expected if user tries to type *\n   *                      the GL Account directly into the ui     *\n   *                      without first setting the AssetSiteId   *\n   *                      (which in turn sets the AssetOrgId      *\n   *                      needed for the GL Account validation).  *\n   *                      However, this problem occurs when using *\n   *                      the GL Account Navigator (which         *\n   *                      requires the user to choose an OrgId).  *\n   *                      When the GL Account Navigator dialog is *\n   *                      used, the GL Account should be set      *\n   *                      without seeing this error.              *\n   *                                                              *\n   ****************************************************************\n"}, {"filename": "swg1IV83104.txt", "chunk_id": "doc_04047_chunk_0001", "text": " get\n   error\n   BMXAA4198E - The GL attribute GLACCOUNT on object {1}\n   requires an organization. Specify a value in the Organization\n   field.\n   \n   EXPECTED RESULT: No error message should be thrown.\n   \n   \n   Below are the child issues/errors which was triggered from above\n   GLACCOUNT issue. So, all have impact on the application\n   behavior.\n   \n   1 - Asset's and Location's description disappearing after\n   change the\n   affected user\n   2 - BMXAA5577e - Specify a site for the asset or location\n   \n   STEPS:\n   1. login as wilson/wilson\n   go to the People application, bring up Rogers\n   populate the person's site field with MCLEAN\n   save\n   2. go to Self Service module > Service Request > Create Service\n   Request\n   application\n   3. Click Select Value besides the asset field\n   select asset 11470\n   location Repair has been automatically populated\n   4. click the lookup besides the affected user field\n   select ROGERS\n   tab out\n   Notice that both asset's and location's description disappeared\n   \n   ACTUAL RESULT:  asset's description and location's description\n   disappeared\n   \n   EXPECTED RESULT: asset's description and location's description\n   should NOT disappeared\n   \n   5. click Submit\n   \n"}]}, {"id": "DEV_Q224", "question": "How do we set HttpOnly and secure flag in Oracle Weblogic 12c to secure IBM Atlas?\n\nHow do we set HttpOnly and secure flag in Oracle Weblogic 12c to secure IBM Atlas?", "answer": "To set the HttpOnly and secure flags in Oracle Weblogic 12c to secure IBM Atlas, follow these steps:\n\n1. Undeploy any existing PolicyAtlas deployments using Oracle Weblogic console.\n2. Open the PolicyAtlas.ear file using a tool like 7zip or similar and update the weblogic.xml file with the changes below:\n\n```xml\n<wls:session-descriptor>\n<wls:cookie-secure>true<\/wls:cookie-secure>\n<wls:cookie-http-only>true<\/wls:cookie-http-only>\n<wls:url-rewriting-enabled>false<\/wls:url-rewriting-enabled>\n<\/wls:session-descriptor>\n```\n\n3. Save the changes by updating the ear file.\n4. Redeploy the updated ear file using Oracle", "documents": [{"filename": "swg21696267.txt", "chunk_id": "doc_20795_chunk_0000", "text": "Title: IBM Setting HttpOnly and secure flag in Oracle Weblogic 12c - United States\n\nText:\nweblogic; weblogic.xml; secure cookies Atlas TECHNOTE (FAQ)\n\nQUESTION\n How do we set HttpOnly and secure flag in Oracle Weblogic 12c to secure IBM Atlas? \n\nCAUSE\nTo prevent session hijacking and securing the cookie\n\nANSWER\n \n\nPerform steps as mentioned below:\n\n1. Undeploy any existing PolicyAtlas deployments using Oracle Weblogic console\n\n2. Open the PolicyAtlas.ear file using a tool like 7zip or similar and update weblogic.xml file with the changes below:\n\n\n<wls:session-descriptor>\n<wls:cookie-secure>true<\/wls:cookie-secure>\n<wls:cookie-http-only>true<\/wls:cookie-http-only>\n<wls:url-rewriting-enabled>false<\/wls:url-rewriting-enabled>\n<\/wls:session-descriptor>\n\n3. Save the changes by updating the ear file.\n\n4. Redeploy the updated ear file using Oracle Weblogic console"}, {"filename": "swg27042922.txt", "chunk_id": "doc_27992_chunk_0000", "text": "Title: IBM Configuring security in IBM Atlas Policy Suite - United States\n\nText:\n PRODUCT DOCUMENTATION\n\nABSTRACT\n To ensure that your IBM Atlas Policy Suite is secure and to prevent session hijacking, set the HttpOnly flag and the secure flag. \n\nCONTENT\n \n\nThe secure flag is an option that can be set by the application server when sending a new cookie to a user within an HTTP Response. This can be used only on HTTPS. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties due to the transmission of the cookie in clear text.\n\nIf the HttpOnly flag (optional) is included in the HTTP response header, the cookie cannot be accessed through client side script. The HttpOnly flag must be supported by the browser. Most modern browsers support this feature.\n\nTo set the HttpOnly flag and the secure flag, complete the following actions for your application server.\n\nWebLogic \nIn the $DOMAIN_HOME/servers/<APPSERVER NAME>/tmp/_WL_user/<APPLICATION NAME>/<random_string>/war/WEB-INF directory, open the Weblogic.xml file and add the following lines:\n\n"}, {"filename": "swg21422185.txt", "chunk_id": "doc_13383_chunk_0000", "text": "Title: IBM Setting the HTTPOnly and Secure Flags on Tivoli Access Manager/WebSphere Application Server Cookies - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How to configured the HTTPOnly and Secure Flags for cookies in integration between Tivoli Access Manager and WebSphere Application Server. \n\nANSWER\n\nLtpaToken2 cookie:\n\n\n * Secure Flag:\n\n *  WebSphere Application Server - some older released Secure flag can be set by using the administrative interface and selecting Security->Secure Administration->Applications->Infrastructure. Under “Authentication”, click Web Security->Single Sign-on (SSO), and check “Requires SSL”. This flag secure LtpaToken and LtpaToken2 cookie WebSphere Application Server v7.0 and Higher - Global security > Single sign-on (SSO) \n * [/support/docview.wss?uid=swg21422185&amp;aid=1]\n * \n * HTTPOnly Flag:\n\n *  The HTTPOnly flag are enabled by setting the WebSphere Application Server property: com.ibm.ws.security.addHttpOnlyAttributeToCookies. By default in newer released its already set to enable as seen in screen image. \n\n\nPD-S-SESSION-ID cookie: \n * Secure Flag\n\n *  The Secure flag is already enabled by default. \n * \n * HTTPOnly Flag:\n\n"}, {"filename": "swg1HE12127.txt", "chunk_id": "doc_01274_chunk_0000", "text": "Title: IBM HE12127: NEED DOCUMENTATION ON HOW TO SET HTTPONLY AND SECURE FLAGS - United States\n\nText:\n  DIRECT LINKS TO FIXES\n6.0.1-ATLAS-WINDOWS-FP0007 [http://www.ibm.com/support/fixcentral/quickorder?product=ibm%2FInformation+Management%2FGlobal+Retention+Policy+and+Schedule+Management&fixids=6.0.1-ATLAS-WINDOWS-FP0007&source=SAR]\n6.0.1-ATLAS-SOLARIS-FP0007 [http://www.ibm.com/support/fixcentral/quickorder?product=ibm%2FInformation+Management%2FGlobal+Retention+Policy+and+Schedule+Management&fixids=6.0.1-ATLAS-SOLARIS-FP0007&source=SAR]\n6.0.1-ATLAS-LINUX-FP0007 [http://www.ibm.com/support/fixcentral/quickorder?product=ibm%2FInformation+Management%2FGlobal+Retention+Policy+and+Schedule+Management&fixids=6.0.1-ATLAS-LINUX-FP0007&source=SAR]\n6.0.1-ATLAS-FP0007-README.pdf [http://www.ibm.com/support/fixcentral/quickorder?product=ibm%2FInformation+Management%2FGlobal+Retention+Policy+and+Schedule+Management&fixids=6.0.1-ATLAS-FP0007-README&source=SAR]\nDownload IBM Atlas Suite V6.0.1 Fix Pack 7 [http://www-01.ibm.com/support/docview.wss?uid=swg24039392]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS DOCUMENTATION ERROR.\n    \n   \n   \n\n"}, {"filename": "swg21967575.txt", "chunk_id": "doc_22197_chunk_0000", "text": "Title: IBM HTTP Secure Flag not set on JSESSION and Commerce Session Cookies. - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n Security scans often report that there are Commerce Session cookies and JSESSIONID do not have the HTTP Secure Flag set. Is this a security concern? \n\nCAUSE\nWhen looking in the browser, you notice many cookies without the HTTP Secure Flag set, resulting in these cookies being allowed to be sent over non-SSL or non-TLS.\n\nANSWER\nFor users to access secure pages, clients need to have both the WC_AUTHENTICATION cookie along with other session cookies like WC_USERACTIVITY. We only require that the WC_AUTHENTICATION cookie have the secure flag set, as without this cookie, no secure pages can be accessed. So long as you are noticing that WC_AUTHENTICATION has the secure flag set, then this is the designed behavior, and is expected.\n\nFor more information on our cookies both secure and non-secure cookies, you can refer to the following page:\n\nhttp://www-01.ibm.com/support/knowledgecenter/SSZLC2_7.0.0/com.ibm.commerce.admin.doc/concepts/csesmsession_mgmt.htm [http://www-01.ibm.com/support/knowledgecenter/SSZLC2_7.0.0/com.ibm.commerce.admin.doc/concepts/csesmsession_mgmt.htm]"}]}, {"id": "DEV_Q232", "question": "CICS TS support for IBM SDK Java Version 8\n\nDo any of the current releases of CICS Transaction Server for z/OS (CICS TS) support the new IBM SDK, Java™ Technology Edition V8?", "answer": "INSUFFICIENT_INFORMATION", "documents": [{"filename": "swg21570324.txt", "chunk_id": "doc_15897_chunk_0000", "text": "Title: IBM Java 1.4.2 applications running on CICS TS 3.1 End of Support statement - United States\n\nText:\nCICS TS 3.1 Java 1.4.2 142 1.4 14 End of Support EOS announcement 5655M1500 R640 640 R400 400 HCI6400 5655-M15 5655M15 kixinfo retention31 PRODUCT LIFECYCLE\n\nABSTRACT\n The End of Support (EOS) date for IBM SDK for z/OS Java™ 2 Technology Edition V1.4 (5655-I56) was 30 September, 2011. IBM will continue to support clients with CICS Transaction Server for z/OS (CICS TS) V3.1 running CICS applications using Java V1.4.2 on z/OS V1.11 until 30 September 2013 with the caveats outlined in this document. \n\nCONTENT\nThe Software service discontinuance announcement letter that says IBM SDK for z/OS Java 2 Technology Edition V1.4 (5655-I56) was withdrawn from support 30 September 2011 is 909-187 [http://www.ibm.com/common/ssi/cgi-bin/ssialias?infotype=an&subtype=ca&appname=Demonstration&htmlfid=897/ENUS909-187].\n\nIBM will continue to support clients with CICS TS V3.1 running CICS applications using Java V1.4.2 on z/OS V1.11 until the end of September 2013. But, you should be aware of the caveats: \n\n"}, {"filename": "swg27011919.txt", "chunk_id": "doc_27357_chunk_0003", "text": "on 5.0 \n * IBM SDK for z/OS, Java 2 Technology Edition, Version 6.0 \n * IBM Runtime Environment, Java Technology Edition 7.0 and future fix packs. \n\n\nNotes:  1. ASF adapter is supported on the following 64-Bit JREs, when it is loaded into WAS:  * IBM 64-bit SDK for z/OS, Java 2 Technology Edition, Version 1.4.2 \n     * IBM 64-bit SDK for z/OS, Java 2 Technology Edition, Version 5.0 \n     * IBM 64-bit SDK for z/OS, Java 2 Technology Edition, Version 6.0\n    \n    \n\nTransactions Managers [/support/docview.wss?uid=swg27011919&amp;aid=1] CICS:  * CICS Transaction Server 2.3 [http://www.ibm.com/software/htp/cics/tserver/sysreqs/] \n * CICS Transaction Server for z/OS V3.1 [http://www-01.ibm.com/software/htp/cics/tserver/sysreqs/] \n * CICS Transaction Server for z/OS V3.2 [http://www-01.ibm.com/software/htp/cics/tserver/sysreqs/] \n * CICS Transaction Server for z/OS 4.1 [http://www-01.ibm.com/software/htp/cics/tserver/sysreqs/] \n * CICS Transaction Server for z/OS 4.2 [http://www-01.ibm.com/software/htp/cics/tserver/sysreqs/] \n * CICS Transaction Server for z/OS 5.1 [http://www-01.ibm.com/software/htp/cics/tserver/sysreqs/]\n\n\n"}, {"filename": "swg21474617.txt", "chunk_id": "doc_14445_chunk_0000", "text": "Title: IBM Announcement letter for CICS Transaction Server for z/OS 4.2 - United States\n\nText:\nCICS TS 4.2 announcement Letter ; CICS Transaction Server for z/OS 4.2 ; announcements ; letters ; general availability ; 5655S9700 R670 670 R700 700 HCI6700 5655-S97 5655S97 kixinfo retention42 PRODUCT LIFECYCLE\n\nABSTRACT\n CICS Transaction Server for z/OS (CICS TS) V4.2 general availability (GA) date was 24 June 2011. CICS TS V4.2 delivers additional support for event processing, Java, the CICS Explorer, and more. This document contains a list of the key enhancements, a link to the announcement letter, and additional ways that you can become familiar with the capabilities of CICS TS 4.2. \n\nCONTENT\nCICS TS V4.2 builds upon the new and enhanced capabilities developed and delivered in V4.1, to enable you to compete in the marketplace, comply with standards and regulations, and control your IT processes. CICS TS V4.2 delivers technical innovation and significant business value in five main focus areas, satisfying in excess of fifty customer and user group enhancement n for other country announcements is available on the IBM Offering Information page [http://www.ibm.com/common/ssi/index.wss]. \n\n\nFor more details about CICS TS see:  * CICS TS web page [http://www.ibm.com/software/cics/tserver/] \n * Detailed System Requirements for CICS TS [http://www.ibm.com/support/docview.wss?uid=swg27006382] \n * Finding CICS product documentation [https://developer.ibm.com/answers/questions/170485/finding-cics-product-documentation-in-ibm-knowledg.html]\n   \n   \n\n"}, {"filename": "swg22014730.txt", "chunk_id": "doc_26121_chunk_0001", "text": " Transaction Server for z/OS V5.4 \nCICS VSAM Recovery for z/OS V5.2.0 \nDB2 11 for z/OS V11.1 \nDB2 12 for z/OS V12.1 \nIBM Batch Pipes for OS/390 V2.1 \nIBM 31-bit SDK for z/OS, Java Technology Edition V7.1.0 \nIBM 31-bit SDK for z/OS, Java Technology Edition V8.0.0 \nIBM 64-Bit SDK for z/OS Java Technology Edition V7.1.0 \nIBM 64-Bit SDK for z/OS Java Technology Edition V8.0.0 \nIBM CICS TS Feature Pack for Dynamic Scripting V2.0 \nIBM CICS TS Feature Pack for Mobile Extensions V1.0 \nIBM CICS TS Feature Pack for Modern Batch V1.0 \nIBM CICS TS Feature Pack for Security Token Extensions V1.0 \nIBM Compiler for REXX on zSeries 1.4.0 \nIBM Data Interfile Transfer, Testing, and Operations Utility for MVS, VSE, VM (DITTO) 1.3 \nIBM Data Set Commander for z/OS V8.1.0 \nIBM DB2 Accessories Suite for z/OS V3.3 \nIBM DB2 Accessories Suite for z/OS V4.1 \nIBM DB2 Administration Tool for z/OS V11.2.0 \nIBM DB2 Object Comparison Tool for z/OS, V11.2.0 \nIBM DB2 Utilities Suite for z/OS, V11.1 \nIBM DB2 Administration Tool for z/OS V12.1 \nIBM DB2 Object Comparison Tool for z/OS, V12.1 \nIBM DB2 Utilities Suite for z/OS, V12.1 \nIBM DB2 QMF for z/OS, V12.1 \nIBM Debug for z Systems V14.1.0 \nIBM Developer for z Systems V14.1.0 \n"}, {"filename": "swg27035673.txt", "chunk_id": "doc_27715_chunk_0005", "text": "bit \n * z/OS\n   \n\nA download is provided for each platform. You can also download and install the documentation in the CICS Explorer if preferred. \n\n\nRelated Information \n * Ensure that the latest levels of service are applied to each IBM product listed in the Software Compatibility Product Reports. In some cases, a specific version of a product might be required to take advantage of new function in CICS TS V5.1. \n * The system requirements also apply to the CICS Transaction Server for z/OS Developer Trial V5.1 that is intended as a try-before-you-buy version of the full CICS TS V5.1 product. CICS TS Developer Trial V5.1 is free of charge and for evaluation (non-production) use only, offering a full set of features but with restricted performance and limited operational lifespan. For more information see the Announcement Letter for CICS Transaction Server for z/OS V5.1 (212-325) link below and Support for CICS TS Developer Trial 5.1 [http://www.ibm.com/support/docview.wss?uid=swg21648341].\n   \n   \n * Announcement Letter for CICS Transaction Server for z/OS V5.1 [http://www.ibm.com/common/ssi/cgi-bin/ssialias?subtype=ca&infotype=an&appname=iSource&supplier=897&letternum=ENUS212-325] \n"}]}, {"id": "DEV_Q233", "question": "How does configuring \"hung threads detection\" impact performance of a production WAS server?\n\nI took a pmr about hung issue on Solaris. Customer said he couldn't collect MG data because the issue always happened at night. So I let him to configure hung detection policy by adding JVM arguments (alarm threads hung). He said it was production server and worried about any impact performance.", "answer": "Configuring \"hung threads detection\" in a production WebSphere Application Server can have both positive and negative impacts on performance. On one hand, enabling this feature allows administrators to identify and address potential issues with hanging threads, which could lead to more efficient resource utilization and improved application stability. This can result in better overall system performance and reduced downtime due to unexpected crashes caused by hung threads.\n\nOn the other hand, excessive monitoring of threads can consume additional CPU resources and memory, especially during high-load periods. This increased overhead can indirectly affect other parts of the system, leading to degraded performance. Additionally, generating detailed thread dumps every time a thread hangs can significantly increase the amount of logging information, potentially overwhelming the system's ability to process and store logs efficiently.\n\nTherefore, while configuring \"hung threads detection\" can improve", "documents": [{"filename": "swg21448581.txt", "chunk_id": "doc_13945_chunk_0000", "text": "Title: IBM Configuring the WebSphere Application Server hung thread detector to automatically produce a javacore or thread dump on a WSVR0605W message - United States\n\nText:\nWSVR0605W; hung thread javacore TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The SystemOut.log contains a WSVR0605W message, also called a hung thread message. A javacore, or thread dump on Solaris and HP-UX, is needed in order to determine how to resolve the potentially hung threads. \n\nCAUSE\nWebSphere Application Server attempts to report potentially hung threads using the hung thread detector. Depending on how the hung thread detector policy is configured, a thread running for a certain interval (default 10 minutes) might be reported as hung and a WSVR0605W message is printed in the SystemOut.log file:\nWSVR0605W: Thread <threadname>has been active for <time>and may be hung. There are <totalthreads>in total in the server that may be hung.\n\n\n\nBy setting a WebSphere custom property, the hung thread detector will automatically generate a javacore, or print a thread dump in the native_stdout.log for Solaris and HP-UX, when a WSVR0605W message is written out to the SystemOut.log file. "}, {"filename": "swg21668348.txt", "chunk_id": "doc_19152_chunk_0000", "text": "Title: IBM Hung Threads Monitoring - United States\n\nText:\nHung Threads Detection; CAMADALL CAMADAGENT TECHNOTE (FAQ)\n\nQUESTION\n What is the purpose and usage of Hung Threads Monitoring feature? \n\nANSWER\nThis feature is enabled by default. You can check this accessing the \"WebSphere Agent Configuration\" workspace or \"Application Server Configuration\" workspace and the Application Diagnostic Configuration view, \"Collection (Advanced)\" tab:\n[/support/docview.wss?uid=swg21668348&amp;aid=1]\n\n\nAny web-container thread that is hung for a time greater than \"Hung Thread Detection Timeout\" (default is 300 seconds) will be tracked as follows.\n\n1) In the Application Server Summary view you will find non-zero values for the hung threads attributes\n\n[/support/docview.wss?uid=swg21668348&amp;aid=2]\n\n2) There is a predefined situation \"WASHungThreadsDetected\" that will alert if \"Hung Thread Total > 0\"\n\n3) In addition, if the thread is still hung, you can run the Take Action \"WAS_Dump_Hang_Threads_Info\" to generate a complete stack trace in the TEMA msg log file\n\ne.g. for Unix: <ITMHOME>/<arch>/logs/kyn-tema-msg.log\n\nHere is an example of generated track trace:\n\n"}]}, {"id": "DEV_Q252", "question": "How to resolve the StaleConnectionException in WebSphere Application Server?\n\nI see this exception in WebSphere Application Server J2c and RRA traces:\n\nWSRdbManagedC > preTestConnection Entry WSRdbManagedConnectionImpl@51a507f2 query: SELECT 1 FROM DUAL WSRdbManagedC 3 Exception java.sql.SQLException: ORA-02396: exceeded maximum idle time, please connect again DSRA0010E: SQL State = 61000, Error Code = 2,396 at oracle.jdbc.driver.T4CTTIoer.processError(T4CTTIoer.java:440) at \n...\nEntry java.sql.SQLException: ORA-01012: not logged on ..... OracleDataSto < findMappingClass return Exit class com.ibm.websphere.ce.cm.StaleConnectionException", "answer": "To resolve the StaleConnectionException in WebSphere Application Server, follow these steps based on the information provided:\n\n1. Review the logs for detailed error messages related to the StaleConnectionException.\n\n2. Identify the root cause of the stale connection, which could be due to various factors like database server downtime, firewall timeouts, or application logic errors.\n\n3. Address the underlying issue causing the stale connection. For example, ensure the database server is running and accessible before attempting to establish a connection.\n\n4. Implement proper connection management practices within your application to avoid closing connections prematurely without properly disposing them.\n\n5. Configure the connection pooling settings appropriately to handle transient failures gracefully without purging unused connections unnecessarily.\n\n6. Monitor the performance and health of both the application and the database servers closely to detect and address potential", "documents": [{"filename": "swg21456175.txt", "chunk_id": "doc_14140_chunk_0000", "text": "Title: IBM Stale Connection exception because of default commit while using Stored Procedures - United States\n\nText:\nStale Connection Exception; StaleConnectionException; Websphere JCC driver -4499 db2/z zOS; 0x2413; 0x2408 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n \nWebsphere Application aborts after calling z/OS stored procedure because of stale connection exceptions. \n\nSYMPTOM\nStaleConnectionException may be seen after upgrade JCC driver. \n\nWebsphere log file: \n\n SystemOut.log:[10/6/10 17:29:01:089 MST] 0000005e ConnectionEve A \nJ2CA0056I: The Connection Manager received a fatal connection error \nfrom the Resource Adapter for resource jdbc/db2xa/ear/PUX1Q/DB_MIND. \nThe exception which was received is com.ibm.websphere.ce.cm. \nStaleConnectionException: [jcc][t4][2028][11149][3.58.136] Actual code \npoint, 0x2413 does not match expected code point, 0x2408. ERRORCODE=- \n4499, SQLSTATE=null:com.ibm.db2.jcc.am.qo: [jcc][t4][2028][11149] \n[3.58.136] Actual code point, 0x2413 does not match expected code \npoint, 0x2408. ERRORCODE=-4499, SQLSTATE=null \n\n\n"}, {"filename": "swg21207584.txt", "chunk_id": "doc_10958_chunk_0000", "text": "Title: IBM WebSphere Application Server StaleConnectionException - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n What causes com.ibm.websphere.ce.cm.StaleConnectionException to be thrown and what can you do about it? \n\nCAUSE\nWhile there are some specific SQL return codes that IBM® WebSphere Application Server will map to a StaleConnectionException (SCE), such as ResourceAllocation, DuplicateKey, TableAlreadyExists, TableDoesNotExist, more frequently, a SCE occurs after a connection has been created and used, then returned to the connection free pool for re-use. If an event occurs outside of the WebSphere Application Server to cause the connection to become invalid, such as a firewall connection timeout, database server drop, or network problem, when the WebSphere application attempts to re-use the connection and discovers the connection is no longer valid, the SCE results. \nAt that time, the default configuration option is to purge any remaining connections in the free pool, assuming if one is invalid, the remaining connections in the free pool are invalid as well, and a subsequent connection request will result in a new connection being created. \n\n\n"}, {"filename": "swg21580731.txt", "chunk_id": "doc_16207_chunk_0000", "text": "Title: IBM Stale connection exception when attempting to access an idle Portal server - United States\n\nText:\nstale connection; unable to access database TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM\nStale connections can occur after Portal server has been idle for a period of time and attempts to access the database. \n\n[1/19/12 22:16:42:351 EST] 00000036 SchedulerDaem E SCHD0104E: The\nScheduler poll daemon WPSTaskScheduler (wps/Scheduler) failed to load\ntasks from the database due to an exception: com.ibm.websphere.\nscheduler.SchedulerNotAvailableException: com.ibm.websphere.ce.cm.\nStaleConnectionException: IO Error: A remote host did not respond\nwithin the timeout period.\n\n\nSYMPTOM\nAfter a period of inactivity, the Portal server becomes unresponsive.\n\n\nCAUSE\nThe Portal connection to the database is closed externally by a firewall or by the remote database due to inactivity. Because Portal is still holding onto this connection, we still think the connection is available, and so receive the stale connection exception.\n\n\n\nDIAGNOSING THE PROBLEM\nReviewing the Portal's systemOut.log we see the stale connection exception when attempting to access the database.\n\n\n\n"}, {"filename": "swg21063645.txt", "chunk_id": "doc_10483_chunk_0000", "text": "Title: IBM Demystifying the WebSphere StaleConnectionException - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n What is the StaleConnectionException, why is it issued by WebSphere Application Server, and what should be done about it? \n\nRESOLVING THE PROBLEM\nIn WebSphere Application Server, the StaleConnectionException is issued when the database vendor issues an exception indicating that a connection currently in the connection pool is no longer valid. This can happen for many reasons, including: \n\n * The application tries to get a connection and fails, as when the database is not started.\n   \n   \n * A connection is no longer usable due to a database failure. When an application tries to use a connection it has previously obtained, the connection is no longer valid. In this case, all connections currently in use by an application can get this error when they try to use the connection.\n   \n   \n * The application using the connection has already called close() and then tries to use the connection again.\n   \n   \n * The application tries to use a JDBC™ resource, such as a statement, obtained on a now-stale connection.\n\n\n"}]}, {"id": "DEV_Q266", "question": "How to install Packaging utility?\n\nHow to install Packaging utility?", "answer": "To install Packaging Utility:\n\n1. Ensure internet access and Installation Manager is installed.\n2. Download the fix pack package for Packaging Utility (pu.update_version.zip).\n3. Add the fix pack as a repository in Installation Manager.\n4. Use the package to update Packaging Utility.\n5. For more information, refer to the Installation Manager Knowledge Center and Packaging Utility documentation.", "documents": [{"filename": "swg24037641.txt", "chunk_id": "doc_26914_chunk_0003", "text": " running the install command. You can also add this package as a repository in Installation Manager and use the package to update Packaging Utility.\n\nThe fix pack package for Packaging Utility is pu.update_version.zip. The fix pack contains files for all supported platforms. You can add this fix pack as a repository to update Packaging Utility. You cannot install Packaging Utility or Installation Manager with this fix pack.\n\nPackaging Utility is available in 64-bit mode. Review information information about bit mode for installation or updates: Packaging Utility bit mode information [https://www.ibm.com/support/knowledgecenter/SSDV2W_1.8.0/com.ibm.cic.auth.ui.doc/topics/r_pu_bit_mode.html].\n\nFor more information about Packaging Utility and Installation Manager, Review the Installation Manager Knowledge Center [http://www.ibm.com/support/knowledgecenter/SSDV2W/im_family_welcome.html].\n\n\nINSTALL OR UPDATE PACKAGING UTILITY WITHOUT DOWNLOADING FILES\nYou must have Internet access and Installation Manager must be installed to install or update Packaging Utility without downloading files. The Packaging Utility repository located on www.ibm.com contains the latest version of Packaging Utility.\n\n"}, {"filename": "swg27023080.txt", "chunk_id": "doc_27615_chunk_0001", "text": "Values os aix \nhpux \nlinux \nos400 \nsolaris \nwin32 \nzos arch ia64\nia64_32 \nPA_RISC \nPA_RISC64 \nppc \nppc64 \ns390 \ns390x \nsparc \nsparc64 \nx86\nx86_64 \n\n\n\nCopy a package by platform by using th e - platform option \n\n1. Install IBM Packaging Utility versions 1.5 or 1.5.1 or use the stand-alone version of Packaging Utility versions 1.5 or 1.5.1. \n\n2. Open a command-line utility. \nNOTE: The -platform option is available only for the command line. \n\n3. Open the Packaging Utility directory:  * \n * \n * \n\n\n4. Identify the repository that you are copying from. \n\n5. If you do not know the ID and version for the package, run the listAvailablePackages command: \n\nPUCL listAvailablePackages -repositories source_repository \n\nThe returned information is a list of packages in the format: \npackageID_version \n\n6. Copy the files for a specific platform to a new repository: \nPUCL copy packageID_version -repositories source_repository -platform os=os,arch=arch -target destination_repository -acceptLicense \n\nUse the -prompt option if the repository requires authentication. You can use the -keyring and -password options to save the credentials. \n\n"}, {"filename": "swg21688209.txt", "chunk_id": "doc_20269_chunk_0000", "text": "Title: IBM Using Packaging Utility for Netcool/OMNIbus repositories - United States\n\nText:\nimcl; installation manager; omnibus; packaging utility TECHNOTE (FAQ)\n\nQUESTION\n How do I use the IBM Packaging Utility to manage a Netcool/OMNIbus repository for IBM Installation Manager? \n\nANSWER\nOverview of IBM Packaging Utility\nIBM Packaging Utility is a partner utility to IBM Installation Manager. While Installation Manager can install, uninstalls, and maintains applications from their installation repositories, Packaging Utility is used to manage the installation repositories themselves.\n\nNetcool/OMNIbus core repositories\nThe Netcool/OMNIbus core repositories for Installation Manager are available to entitled users that use the Installation Manager or Packaging Utility applications to install directly from the IBM website or to copy the repository to a local file system respectively. The repositories are also available as zip files downloadable from IBM Fix Central. Whichever method is used to access the files, the Netcool/OMNIbus install repositories are all platform-sliced repositories. This means that they were created by the IBM Packaging Utility application with the -platform parameter set.\n\n"}, {"filename": "swg24019074.txt", "chunk_id": "doc_26447_chunk_0001", "text": "on describes the content of Packaging Utility, version 1.1.2.\n\n\n * Cumulative updates\n * Prerequisites\n * Installing the fix pack\n * Known problems\n\n\nFor the most up-to-date information about working with Packaging Utility, visit the Documentation Information Center at: http://publib.boulder.ibm.com/infocenter/install/v1m0r0/index.jsp [http://publib.boulder.ibm.com/infocenter/install/v1m0r0/index.jsp]. \n\n\n\n\n\n\nCumulative updates \n\nThis version includes all fixes, enhancements, and new features from the following fix packs: \n * \n * Packaging Utility, Version 1.1.1 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/111/docs/readme/readme.html]\n * \n * Packaging Utility, Version 1.1.0 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/110/docs/readme/readme.html]\n\n\n\n\n\n\n\n\nPrerequisites \nRefer to the section \"Prerequisites\" below in this document for hardware, software, and other requirements for installing this fix pack. \n\n\n\n\n\nInstalling this fix pack \nRefer to the section \"Installation instructions\" below in this document for instructions on downloading and installing this fix pack. \n\n\n\n\n\n"}, {"filename": "swg24021020.txt", "chunk_id": "doc_26469_chunk_0001", "text": "on describes the content of Packaging Utility, version 1.2.1.\n\n\n * Cumulative updates\n * Prerequisites\n * Installing the fix pack\n * Known problems\n\n\nFor the most up-to-date information about working with Packaging Utility, visit the Documentation Information Center at: http://publib.boulder.ibm.com/infocenter/install/v1r2/index.jsp [http://publib.boulder.ibm.com/infocenter/install/v1r2/index.jsp]. \n\n\n\n\n\n\nCumulative updates \n\nThis version includes all fixes, enhancements, and new features from the following fix packs: \n * \n * Packaging Utility, Version 1.2.0 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/120/docs/readme.html]\n * \n * Packaging Utility, Version 1.1.2 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/112/docs/readme.html]\n * \n * Packaging Utility, Version 1.1.1 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/111/docs/readme/readme.html]\n * \n * Packaging Utility, Version 1.1 [http://download.boulder.ibm.com/ibmdl/pub/software/rationalsdp/v7/pu/110/docs/readme/readme.html]\n\n\n\n\n\n\n\n\nPrerequisites \nRefer to the section \"Prerequisites\" below in this document for hardware, software, and other requirements for installing this fix pack. \n\n\n\n\n\n"}]}, {"id": "DEV_Q295", "question": "Why are we seeing high CPU and hung threads in WebSphere Application Server?\n\nDuring the job execution in WebSphere Compute Grid we are seeing high CPU along with many hung threads reporting\nWSVR0605W from BatchFileLoggerInfo.getDirectoryList method.\nIn Sysprint many threads are hung with this stack:\nBossLog: { 0426} <time stamp> SYSTEM=CPU4 CELL=FGDCELL NODE=FGDNODE4 CLUSTER=WFGDS1 SERVER=WFGDS14 PID=0X060835 TID=0 X2ED98E0000000162 t=8897F0 c=UNK ./bbgrjtr.cpp+733 tag= ... BBOO0221W: WSVR0605W: Thread \"WebSphere WLM Dispatch Thread t=008a6b70\" (0000006a) has been active for 683953 milliseconds and may be hung.\n....", "answer": "The high CPU and hung threads observed during job execution in WebSphere Application Server could be due to threads being in an idle state rather than actively performing operations. These threads may appear as problematic based on thread dumps taken at high CPU times, but they are actually inactive.\n\nTo diagnose this issue, one should collect additional information such as system performance metrics and Java core dumps. Additionally, gathering data according to the guidelines provided in Document 2 can help identify potential causes of high CPU usage or system hangs.\n\nSetting up the hung thread detector in WebSphere Application Server allows for automatic generation of a javacore or thread dump upon encountering a WSVR0605W message, which indicates a potentially hung thread. This feature helps in determining whether the detected thread is indeed idle or if it needs further investigation", "documents": [{"filename": "swg21672204.txt", "chunk_id": "doc_19373_chunk_0000", "text": "Title: IBM Identifying idle threads in thread dumps taken against WebSphere Application Server - United States\n\nText:\njavacore; javacores; threaddump; native_stdout.log; idle; wait; hanging TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When reviewing thread dumps taken against the WebSphere Application Server, there are several thread states that appear to be hanging, but are actually in an idle state. This document will explain what threads would usually be misidentified as a problem thread when actually it's idle. \n\nDIAGNOSING THE PROBLEM\nDuring high CPU, threads are likely performing operations rapidly, and as a result thread dumps taken that are correlated with the CPU utilization data will map the highest CPU usage thread to a thread that is actually in a wait/idle state. The thread dump is only capturing a single instance of all the running threads and rapidly executing operations may have completed their workload just before the javacore was taken, and new workload likely was being handled by a different thread. \nSometimes a hung thread is misinterpreted in the same manner as the thread in the wait state never changes when multiple thread dumps are captured and compared.\n\n\n\n"}, {"filename": "swg21976593.txt", "chunk_id": "doc_22913_chunk_0004", "text": " [http://www.ibm.com/support/knowledgecenter/SSQP76_8.8.0/com.ibm.odm.dserver.rules.res.console/topics/tsk_rescons_res_xu_debug_trace.html?lang=en] \n\n4 Other info to gather for high CPU usage or system hang\nIf you also encounter high CPU usage or system hang, please also capture the system performance info and java cores as documented in the following must gather depending \non your OS. Although the MustGathers are for WebSphere Application Server, you should provide similar info if DS is deployed on other application server: [http://www-01.ibm.com/support/docview.wss?uid=swg21115785] \n\n * MustGather: Performance, hang, or high CPU issues with WebSphere Application Server on Linux [http://www-01.ibm.com/support/docview.wss?uid=swg21115785] \n * MustGather: Performance, hang, or high CPU issues with WebSphere Application Server on Windows [http://www-01.ibm.com/support/docview.wss?uid=swg21111364] \n * MustGather: Performance, hang, or high CPU issues with WebSphere Application Server on AIX [http://www-01.ibm.com/support/docview.wss?uid=swg21052641]\n\nRELATED INFORMATION\n Collecting Data: Read first for all IBM Operational Dec [http://www-01.ibm.com/support/docview.wss?uid=swg21653691]\n\n\n \n\n\n"}, {"filename": "swg21448581.txt", "chunk_id": "doc_13945_chunk_0000", "text": "Title: IBM Configuring the WebSphere Application Server hung thread detector to automatically produce a javacore or thread dump on a WSVR0605W message - United States\n\nText:\nWSVR0605W; hung thread javacore TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The SystemOut.log contains a WSVR0605W message, also called a hung thread message. A javacore, or thread dump on Solaris and HP-UX, is needed in order to determine how to resolve the potentially hung threads. \n\nCAUSE\nWebSphere Application Server attempts to report potentially hung threads using the hung thread detector. Depending on how the hung thread detector policy is configured, a thread running for a certain interval (default 10 minutes) might be reported as hung and a WSVR0605W message is printed in the SystemOut.log file:\nWSVR0605W: Thread <threadname>has been active for <time>and may be hung. There are <totalthreads>in total in the server that may be hung.\n\n\n\nBy setting a WebSphere custom property, the hung thread detector will automatically generate a javacore, or print a thread dump in the native_stdout.log for Solaris and HP-UX, when a WSVR0605W message is written out to the SystemOut.log file. "}, {"filename": "swg1LO40464.txt", "chunk_id": "doc_06109_chunk_0000", "text": "Title: IBM LO40464: WEBFORM SERVER THREADS GET HUNG WHILE UNDER HEAVY LOAD. - United States\n\nText:\n SUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS FIXED IF NEXT.\n    \n   \n   \n\nERROR DESCRIPTION\n *  While running a form in Webform Server under a high load the\n   threads may get into a hung state.\n   \n   You will see the following messages in your WebSphere\n   SystemOut.log for the associated server:\n   \n   [4/24/09 15:57:35:664 EDT] 000003ea ThreadMonitor W   WSVR0606W:\n   Thread \"WebContainer : 762\" (000003ea) was previously reported\n   to be hung but has completed.  It was active for approximately\n   940198 milliseconds.  There is/are 1 thread(s) in total in the\n   server that still may be hung.\n   [4/24/09 15:57:35:830 EDT] 0000036b ThreadMonitor W   WSVR0606W:\n   Thread \"WebContainer : 664\" (0000036b) was previously reported\n   to be hung but has completed.  It was active for approximately\n   1913979 milliseconds.  There is/are 0 thread(s) in total in the\n   server that still may be hung.\n   \n   When in this state the server process will continue to grow in\n   memory until all the memory on the server is exhausted which\n   results in a crash.\n   \n   USER/PRODUCTS AFFECTED\n"}, {"filename": "swg21610001.txt", "chunk_id": "doc_16998_chunk_0002", "text": "a number of different ways to determine if a thread has been executing on socketRead for a prolonged period of time. Here are two specific methods: \n\n * \n * Method One: Using a series of javacores / thread dumps\n * With a series of javacores or thread dumps, the state of a particular thread over a period of time can be analyzed. If a specific thread is executing on socketRead over the course of a series of javacores or thread dumps, this is likely to be an issue that warrants further investigation. \n * Method Two: Using hung thread warning messages from the SystemOut.log \n * By default, WebSphere Application Server will print a hung thread warning message to the SystemOut.log if a thread has been executing on the same method for more than 10 minutes. Further, in more recent versions of WebSphere Application Server the message also includes the stack of the potentially hung thread. If a thread has been marked as potentially hung and is executing on socketRead, a deeper investigation is likely in order.\n\n\n"}]}, {"id": "TRAIN_Q061", "question": "Getting hung threads,  sometimes followed by OutOfMemory error\n\nOur application is hanging, we see lots of hung threads in the SystemOut.log, occasionally followed by OutOfMemory error.", "answer": "Based on the retrieved documents, getting hung threads and occasional OutOfMemory errors in your application could be due to an Enterprise JavaBean's ORB.init() call causing multiple ORB threads to be created, leading to insufficient resources for creating new threads. This results in high memory usage and potential OutOfMemoryErrors. To resolve this issue, consider changing the updateMailboxLastModification property in mailbox.properties.in to false temporarily until a more permanent fix is found.", "documents": [{"filename": "swg21670780.txt", "chunk_id": "doc_19290_chunk_0001", "text": "ith AIO enabled. This problem will not occur on WebSphere Application Server V8.5, and it will not occur on other operating systems besides Windows.\n\nWhen this problem occurs, the SystemOut.log will show many WSVR0605W messages indicating that there are possibly hung threads. The stack traces for these threads can be seen in the SystemOut.log or in a Javacore that is taken while the threads are hung. Many threads will be hung with a stack trace similar to the following:\n\nJava callstack:\nat com/ibm/io/async/AsyncLibrary.terminateIOCB(AsyncLibrary.java:788(Compiled Code))\nat com/ibm/io/async/AsyncSocketChannel.close(AsyncSocketChannel.java:314(Compiled Code))\nat com/ibm/ws/tcp/channel/impl/AioSocketIOChannel.close(AioSocketIOChannel.java:435(Compiled Code))\nat com/ibm/ws/tcp/channel/impl/TCPConnLink.destroy(TCPConnLink.java:530(Compiled Code))\nat com/ibm/wsspi/channel/base/OutboundConnectorLink.close(OutboundConnectorLink.java:50(Compiled Code))\nat com/ibm/ws/tcp/channel/impl/TCPConnLink.close(TCPConnLink.java:506(Compiled Code))\nat com/ibm/ws/http/channel/inbound/impl/HttpInboundLink.close(HttpInboundLink.java:785(Compiled Code))\nat com/ibm/ws/http/channel/inbound/impl/HttpICLReadCallback.error(HttpICLReadCallback.java:141)\n"}, {"filename": "swg21224719.txt", "chunk_id": "doc_11076_chunk_0000", "text": "Title: IBM java.lang.OutOfMemoryError or Java process hang and a significant number of ORB threads in the thread dumps - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This problem would likely manifest itself as a hung Application Server. In the javacore or thread dump of the process, a large number of ORB threads with thread ids beginning with RT=# or LT=# will be observed. \n\nCAUSE\nThis problem is a fairly specific problem caused by an Enterprise JavaBeans having an ORB.init() call in it. When the ORB.init() call is made, it causes an ORB instance to be created. When an ORB instance is created it will create five threads: four listener threads and 1 reader thread. These threads would only get destroyed if the ORB instance is destroyed. If over time, more ORB instances are created, eventually the Application Server performance will be affected. It may also cause java.lang.OutOfMemoryErrors to be thrown.\n\n\nThe javacore file or thread dump shows that there are a large number of ORB listener threads and ORB reader threads. \n\n"}, {"filename": "swg21552635.txt", "chunk_id": "doc_15655_chunk_0000", "text": "Title: IBM OutofMemory and processing hangs. A large number of mailbox threads contained within thread dumps. - United States\n\nText:\nSTERLINGNFX TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n OutofMemory and processing hangs. A large number of mailbox threads contained within thread dumps. \n\nSYMPTOM\n\n\n \n\nSymptoms: 1. High Memory usage by JVM and Garbage Collection not giving memory back 2. Many Mailbox threads revolving around mailbox add/deletes. See attached thread dump. 3. Processing appear to be hanging 4. Eventual JVM OOM Signatures: thread Dump with many threads that pass through a class: at com/sterlingcommerce/woodstock/mailbox/impl/repositoryImpl/RepositoryDB.updateMa ilboxLastModification(RepositoryDB.java:2077(Compiled Code)) Also the heap dump shows the memory growing and not reducing for: com/sterlingcommerce/woodstock/mailbox/impl/repositoryImpl/RepositoryDB$5<\/ div>  \n\nError Message  Potential 'OutofMemory' error, OOM\n\n\nRESOLVING THE PROBLEM\n\n\n Within mailbox.properties.in change:\n\nupdateMailboxLastModification=false (By default this is true. Changing this to false is a temporary workaround. A more permanent fix is being researched with case#307120.) run setupfiles and restart GIS  \n\nHISTORICAL NUMBER\n NFX11306 \n\n"}, {"filename": "swg21633466.txt", "chunk_id": "doc_17804_chunk_0001", "text": "Java stack, and a native stack.\n- There are too many threads already running and the system has run out of internal resources to create new threads.\n\nSample error stack:\njava.lang.OutOfMemoryError: Failed to create a thread: retVal -1073741830, errno 11\nat java.lang.Thread.startImpl(Native Method)\nat java.lang.Thread.start(Thread.java:891)\nat java.util.concurrent.ThreadPoolExecutor.addIfUnderMaximumPoolSize(ThreadPoolExecutor.java:738)\nat java.util.concurrent.ThreadPoolExecutor.execute(ThreadPoolExecutor.java:668)\nat sun.rmi.transport.tcp.TCPTransport$AcceptLoop.executeAcceptLoop(TCPTransport.java:396)\nat sun.rmi.transport.tcp.TCPTransport$AcceptLoop.run(TCPTransport.java:353)\nat java.lang.Thread.run(Thread.java:738)\n...\n\nNote: The native, or system heap, is different from Java heap. The Java heap contains the instances of Java objects and is maintained by Garbage Collection. The maximum size of the Java heap is preallocated during JVM startup as one contiguous area, even if the minimum heap size setting is lower. Meanwhile the native heap is allocated by using the underlying malloc and free mechanisms of the operating system, and is used for the underlying implementation of Java objects. \n"}, {"filename": "swg1LO70092.txt", "chunk_id": "doc_06241_chunk_0003", "text": "e log, you can find the following information which\n   indicates OutOfMemoryError occurred in Java\n   ----------Java Core log Information------------\n   1TISIGINFO     Dump Event \"systhrow\" (00040000) Detail\n   \"java/lang/OutOfMemoryError\" \"Failed to create a thread: retVal\n   -1073741830, errno 12\" received\n   1TIDATETIME    Date:                 2011/06/02 at 18:26:28\n   1TIFILENAME    Javacore filename:    C:/Documents and\n   Settings/Administrator/Local Settings/Application\n   3XMTHREADINFO      \"Worker-46\" J9VMThread:0x1760AB00,\n   j9thread_t:0x1558611C, java/lang/Thread:0x00B77170, state:R,\n   prio=5\n   3XMTHREADINFO1            (native thread ID:0x9A0, native\n   priority:0x5, native policy:UNKNOWN)\n   3XMTHREADINFO3           Java callstack:\n   4XESTACKTRACE                at\n   com/ibm/workplace/noteswc/NotesNativeCalls.sendMessageDlg(Native\n   Method)\n   4XESTACKTRACE                at\n   com/ibm/workplace/noteswc/NotesNativeCalls.sendMessage(Bytecode\n   PC:20(Compiled Code))\n   4XESTACKTRACE                at\n   com/ibm/workplace/noteswc/ipc/NotesDispatcherService.sendMessage\n   (Bytecode PC:109(Compiled Code))\n   4XESTACKTRACE                at\n   com/ibm/workplace/noteswc/ipc/NotesDispatcherService.sendMessage\n"}]}, {"id": "TRAIN_Q075", "question": "Where can I get Tivoli Monitoring Agent for Sybase Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002)?\n\nWhere can I get Tivoli Composite Application Manager for Applications 721 FP2: Monitoring Agent for Sybase Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002)? I can't find this on Fix Central.", "answer": "To obtain the Tivoli Monitoring Agent for Sybase Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002), you should visit the official IBM website at http://www-01.ibm.com/support/docview.wss?uid=swg24044440. The link provided there will direct you to the download page where you can access the required software.", "documents": [{"filename": "swg24044440.txt", "chunk_id": "doc_27256_chunk_0000", "text": "Title: IBM Tivoli Composite Application Manager for Applications 721 FP2: Monitoring Agent for Sybase Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002) - United States\n\nText:\nSybase Agent; OY; KOY; 5724B96SO; ITM; ITCAM DOWNLOADABLE FILES\n\nABSTRACT\n This fix resolves the APARs and defects and provides the enhancements listed \nin the \"Problems Fixed\" section below. \n\nDOWNLOAD DESCRIPTION\nCopyright International Business Machines Corporation 2018.\n\n\nAll rights reserved.\n\nComponent: IBM® Tivoli® Composite Application Manager for Applications 721 FP2: \nMonitoring Agent for Sybase® Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002)\n\nFix Pack: 0002\nComponent ID: 5724B96SO\nDate: December 8, 2017\n\nTable of contents:\n\n1.0 General description\n2.0 Problems fixed\n3.0 Architecture and prerequisites\n4.0 Image directory contents\n5.0 Installation instructions\n6.0 Additional installation information\n7.0 Known problems and workarounds\n8.0 Additional product information\n9.0 Copyright and trademark information\n10.0 Notices\n\n1.0 General description\n=======================\nThis fix contains the APARs and defects that are specified in the \"Problems \nfixed\" section. \n\n2.0 Problems fixed\n==================\nThe following problems are addressed by this fix.\n\n"}, {"filename": "swg1IV95149.txt", "chunk_id": "doc_04219_chunk_0000", "text": "Title: IBM IV95149: SYBASE AGENT PREREQ CHECKER SCRIPT USED FOR FINDING VERSION TAKES TOO LONG ON SYSTEMS WITH LARGE DISK/HIGH VOLUME MOUNTS. - United States\n\nText:\n  A FIX IS AVAILABLE\nTivoli Composite Application Manager for Applications 721 FP2: Monitoring Agent for Sybase Server 620 FP2 (6.2.0-TIV-ITM_SYB-FP0002) [http://www-01.ibm.com/support/docview.wss?uid=swg24044440]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  While installing Sybase agent, prereqchecker invokes the\n   SybaseVersion_plug.sh script which executes the \"find\" command\n   from root for finding Sybase server version.\n   This \"find /\" command takes a long time on systems with large\n   disks, high volume of mounts.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Run a silent install with PREREQ_CHECK=NO in the response file.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  While installing Sybase agent, prereqchecker invokes the\n   SybaseVersion_plug.sh\n   script which executes the \"find\" command from root for finding\n   Sybase server version. modfiied script to\n   minimize search time.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in\n   06.20.02.00\n   \n   \n    \n   \n   \n\n"}]}, {"id": "TRAIN_Q086", "question": "I can't find the JDBC driver for my DB2.\n\nI am running BPM 8.0.1 with DB2 10.1.0.\n\n \n\nReading this technote:\nhttp://www-01.ibm.com/support/docview.wss\n\n\"Use the JDBC driver of your database product instead of the JDBC delivered with IBM Business Process Manager (BPM)\"I am trying to download the latest JDBC driver from the following technote:\n\nhttp://www-01.ibm.com/support/docview.wss\n\nIt looks like the link for the JDBC driver download for DB2 10.1.0 is greyed out. Where can I download this driver?", "answer": "The JDBC driver for DB2 10.1.0 cannot be downloaded directly from the provided link due to it being greyed out. To resolve this issue, you should follow these steps:\n\n1. Update the JDBC driver to the latest version compatible with your DB2 10.1.0 installation.\n2. Verify that the updated JDBC driver is correctly installed by checking the log files for any relevant entries related to the JDBC driver version.\n3. Ensure that the correct JDBC driver is referenced in your application's connection string when connecting to the DB2 database.\n\nIf you need further assistance, please refer to the official documentation or contact IBM Support for more detailed guidance.", "documents": [{"filename": "swg21640661.txt", "chunk_id": "doc_18091_chunk_0004", "text": "ivered with IBM Business Process Manager is older than the latest available from the database vendor, update the JDBC driver to the latest driver. \n\n\nTo determine what the current JDBC driver version is from the logs, look for something similar to the following example from IBM BPM 8.5.5.0 on DB2 10.5 FP3:\n\nDatabase product name : DB2/NT64 DSRA8204I: Database product version : SQL10053 DSRA8205I: JDBC driver name : IBM Data Server Driver for JDBC and SQLJ DSRA8206I: JDBC driver version : 4.11.69 DSRA8218I: JDBC driver specification level : 4.0 DSRA8212I: DataStoreHelper name is: com.ibm.websphere.rsadapter.DB2UniversalDataStoreHelper@67c85533. DSRA8208I: JDBC driver type : 4\n\n \n\n\nCross reference information Segment Product Component Platform Version Edition Business Integration IBM Business Process Manager Standard Databases AIX, Linux, Linux zSeries, Solaris, Windows 8.5.5, 8.5, 8.0.1, 8.0, 7.5.1, 7.5 Business Integration IBM Business Process Manager Express Databases Linux, Windows 8.5.5, 8.5, 8.0.1, 8.0, 7.5.1, 7.5 \nPRODUCT ALIAS/SYNONYM\n BPM"}]}, {"id": "TRAIN_Q111", "question": "How to find details of Corrupted Object from the entries in db2diag.log?\n\nWe have corruption in DB2 Database and got entries for corrupted Object in db2diag.log ,Need to find details of the Object using information dumped in db2diag.log", "answer": "To find details of the corrupted object from the entries in db2diag.log:\n\n1. Look for entries mentioning \"bad page\", \"invalid page checksum\", or \"corruption\".\n2. Identify the specific object by examining the object descriptor in the log message.\n3. Use the object ID and type to determine the object's nature (e.g., table, view, index).\n4. Refer to Document 2 for more detailed information on how to resolve index corruption issues.\n5. Consult Document 5 for guidance on resolving LOB corruption issues in DB2 databases.\n6. Review Document 4 for troubleshooting steps related to DB2TSCHG.HIS file corruption.\n7. Ensure to follow local fix procedures mentioned in relevant documents for handling these types of errors effectively.", "documents": [{"filename": "swg21983129.txt", "chunk_id": "doc_23470_chunk_0000", "text": "Title: IBM How to find details of Corrupted Object from the entries in db2diag.log? - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How to find details of Corrupted Object from the entries in db2diag.log? \n\nANSWER\nWhen we have corruption in the database we may received following kind of entries in db2diag.log \nThese also notify object where we t where we have detected corruption in the Database.\n\nSample db2diag.log entry for Corruption.\n\n2016-05-04-03.13.05.261082-360 I3442A358 LEVEL: Error \nPID : 393470 TID : 1 PROC : db2pfchr 0 \nINSTANCE: db2inst1 NODE : 000 \nFUNCTION: DB2 UDB, buffer pool services, sqlbReadAndReleaseBuffers,probe:13 \nRETCODE : ZRC=0x86020001=-2046689279=SQLB_BADP \"page is bad\" \nDIA8400C A bad page was encountered. \n\n2016-05-04-03.13.05.264301-360 I3801A437 LEVEL: Error \nPID : 393470 TID : 1 PROC : db2pfchr 0 \nINSTANCE: db2inst1 NODE : 000 \nFUNCTION: DB2 UDB, buffer pool services, sqlbReadAndReleaseBuffers, \nprobe:13 \nDATA #1 : String, 158 bytes \nObj={pool:3;obj:21;type:0} State=x27 Parent={3;21}, EM=1120, PP0=1152 \nPage=51235 Cont=17 Offset=2848 BlkSize=15 \nsqlbReadAndReleaseBuffers error: num-pages=16\n\n\n"}, {"filename": "swg22001505.txt", "chunk_id": "doc_24878_chunk_0000", "text": "Title: IBM How to resolve index corruption in db2 ? - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How to resolve index corruption in db2 ? \n\nANSWER\nWe may met index corruption in some situation, and in db2diag.log there are similar entries like this:\n2017-03-30-12.38.31.971346+480 I135403A5507 LEVEL: Severe\nPID : 4456656 TID : 42583 PROC : db2sysc 0\nINSTANCE: db2inst1 NODE : 000 DB : SAMPLE\nAPPHDL : 0-26926 APPID: LOCALHOST.47117.17033002510\nAUTHID : DB2INST1 HOSTNAME: HOST1\nEDUID : 42583 EDUNAME: db2agent (SAMPLE) 0\nFUNCTION: DB2 UDB, buffer pool services, sqlb_verify_page, probe:0\nMESSAGE : ZRC=0x86020019=-2046689255=SQLB_CSUM \"Bad Page, Checksum Error\"\nDIA8426C A invalid page checksum was found for page \"\".\nDATA #1 : String, 64 bytes\nError encountered trying to read a page - information follows : \nDATA #2 : String, 23 bytes\nPage verification error\nDATA #3 : Page ID, PD_TYPE_SQLB_PAGE_ID, 4 bytes\n30460385\nDATA #4 : Object descriptor, PD_TYPE_SQLB_OBJECT_DESC, 96 bytes\nObj: {pool:2;obj:2;type:1} Parent={2;2} \n\n \n\nThis error means the object 2 in tablespace 2 is corrupted, and the type of the object is type:1 which means index corruption. \n\n \n\n"}, {"filename": "swg1IT00510.txt", "chunk_id": "doc_02372_chunk_0002", "text": "ult from this page\n   corruption.  Possible symptoms include but are not limited to:\n   - Crash recovery might fail if DB2 tries to use the corrupted\n   page.  An example of an error you might see in the db2diag.log\n   file if that occurs is: sqliRedoAddKey, probe:1101.\n   - Incorrect results might be returned queries using this index.\n   - An infinite loop might occur while scanning or updating this\n   index.\n   - The SQL0901N Reason \"Key data mismatch error might be\n   encountered during key delete\".  Note that this is a common\n   symptom to other problems so seeing this is not conclusive that\n   you hit this problem.\n   - Further corruption might occur as a result of this corruption.\n   - The db2dart tool might report other index problems such as\n   'Offset Location = 0  (x0)   Error: invalid offset!'.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  If you have this problem you will need to recreate the corrupted\n   indexes.  If this problem causes crash recovery to fail, you\n   will need to mark the problem index invalid in order to get\n   crash recovery to complete.  Please contact db2support for help\n   with this task.\n   \n   To avoid this problem in the future avoid running REORG\n"}, {"filename": "swg21666034.txt", "chunk_id": "doc_19047_chunk_0000", "text": "Title: IBM DB2TSCHG.HIS corruption - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n DB2TSCHG.HIS file may get corrupted and dump error messages in the db2diag.log \n\nSYMPTOM\nThe following messages can be seen in the db2diag.log\n\nFUNCTION: DB2 UDB, recovery manager, sqlpVerifyEntry, probe:41\nMESSAGE : Checksum violation in DB2TSCHG.HIS file\n\n\nFUNCTION: DB2 UDB, recovery manager, sqlpPruneTsChgHistoryFile, probe:24\nDATA #1 : <preformatted>\nFile corruption in DB2TSCHG.HIS file, size is: 17236096\n\n\n\n\nCAUSE\nCorrupt DB2TSCHG.HIS file\n\nRESOLVING THE PROBLEM\nRename the existing DB2TSCHG.HIS file and let DB2 recreate a new one"}, {"filename": "swg22001502.txt", "chunk_id": "doc_24877_chunk_0000", "text": "Title: IBM How to resovle LOB corruption in DB2 ? - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How to resovle LOB corruption in DB2 ? \n\nANSWER\nWe may met some LOB corruptions in DB2 database occasionally. \n\n1. check db2diag.log, following error can be find \n\n\n2017-02-19-21.12.23.384920+540 I28467A526 LEVEL: Severe\nPID : 5636212 TID : 4113 PROC : db2sysc 1\nINSTANCE: db2inst1 NODE : 001 DB : SAMPLE\nAPPHDL : 1-26947 APPID: LOCALHOST\nAUTHID : db2inst1\nEDUID : 4113 EDUNAME: db2agent (SAMPLE) 1\nFUNCTION: DB2 UDB, lob manager, sqldxRbsHunt, probe:2927\nMESSAGE : INDENTIFIERS:\nDATA #1 : String, 72 bytes\n\nTablespace ID = 2, Tablespace Seed = 2, Object ID = 7, Object Type = 4 \n\n......\n2017-02-19-21.12.23.385221+540 I29944A1001 LEVEL: Severe\nPID : 5636212 TID : 4113 PROC : db2sysc 1\nINSTANCE: db2inst1 NODE : 001 DB : SAMPLE\nAPPHDL : 1-26947 APPID: LOCALHOST\nAUTHID : MBC000 \nEDUID : 4113 EDUNAME: db2agent (SAMPLE) 1\nFUNCTION: DB2 UDB, lob manager, sqldxRbsHunt, probe:2927\nDATA #1 : Buddy Space Hint Array, PD_TYPE_BSPACE_HINTARRAY, 34 bytes\n0x070000008A82EA3C : FFFF 0000 0080 0080 0080 0080 0080 0000 ................\n0x070000008A82EA4C : FFFF FFFF FFFF FFFF FFFF FFFF FFFF FFFF ................\n0x070000008A82EA5C : FFFF ..\n"}]}, {"id": "TRAIN_Q157", "question": "Help with Security Bulletin: IBM WebSphere MQ 7.0.1 potential denial of service (CVE-2015-2013)\n\nI need to understand details regarding Security Bulletin: IBM WebSphere MQ 7.0.1 potential denial of service (CVE-2015-2013). Where can I find this information?", "answer": "To find more detailed information on the Security Bulletin: IBM WebSphere MQ 7.0.1 potential denial of service (CVE-2015-2013), you should refer to Document 1, which provides comprehensive details including the summary, vulnerability details, affected products and versions, remediation/fixes, and CVSS scores.", "documents": [{"filename": "swg21962479.txt", "chunk_id": "doc_21897_chunk_0000", "text": "Title: IBM Security Bulletin: IBM WebSphere MQ 7.0.1 potential denial of service (CVE-2015-2013) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere MQ 7.0.1 is susceptible to a client issuing an MQI call that could cause the channel agent to abend, causing a denial of service to other channels that are running under the same MCA process. \n\nVULNERABI
