=8.5.0.0&platform=Linux+PPC&function=all] Language Independent 4000000000 ODM 8.5.1.0 Linux x86 [http://www-933.ibm.com/support/fixcentral/swg/selectFixes?parent=ibm~WebSphere&product=ibm/WebSphere/WebSphere+Operational+Decision+Management&release=8.5.0.0&platform=Linux+x86&function=all] Language Independent 4000000000 ODM 8.5.1.0 Linux zSeries "}, {"filename": "swg24044043.txt", "chunk_id": "doc_27232_chunk_0000", "text": "Title: IBM Operational Decision Manager V8.8.1.3 Fix Pack - United States\n\nText:\n DOWNLOADABLE FILES\n\nABSTRACT\n This cumulative fix pack updates Operational Decision Manager V8.8 or V8.8.1 to V8.8.1.3. \n\nDOWNLOAD DESCRIPTION\nThis fix pack is entitled. Only customers who have Operational Decision Manager V8.8 or V8.8.1 can use this fix pack. You do not have to install the latest version to apply this fix pack.\n\n\nHow to install the fix pack\nFor each Operational Decision Manager component that you use: \n\n 1. Download its file in the following table. \n    Change <OS> to match your platform: AIX, HPUX, LIN_PPC, LIN_S390, LIN_X86, OS400, SOL_SPARC, SOL_X86, and WIN. \n 2. Extract the contents of the download file to a new folder. Use the corresponding folder name in the table. \n 3. If you use WebSphere Application Server, download the profile templates for your component.\n\nComponent Download file Folder name (InstallDir) Note Decision Server Insights 8.8.1-WS-ODM_DSI-<OS>-FP003.zip DSI Only available for Linux (LIN) and Windows (WIN). Decision Center 8.8.1-WS-ODM_DC-<OS>-FP003.zip WDC For Windows and Linux, use <install path of ODM 8.8.1>/jdk/bin/jar xf to extract files in the WDC directory. "}, {"filename": "swg24037227.txt", "chunk_id": "doc_26886_chunk_0003", "text": "e=8.0.1.0&platform=Linux&function=fixId&fixids=8.0.1-WS-ODM_DC-LINUX-FP002&includeRequisites=1&includeS] Language Independent 4000000000 ODM Decision Center 8.0.1.2 AIX [http://www-933.ibm.com/support/fixcentral/swg/downloadFixes?parent=ibm~WebSphere&product=ibm/WebSphere/WebSphere+Operational+Decision+Management&release=8.0.1.0&platform=AIX&function=fixId&fixids=8.0.1-WS-ODM_DC-AIX-FP002&includeRequisites=1&includeSuper] Language Independent 4000000000 ODM Decision Center 8.0.1.2 HPUX [http://www-933.ibm.com/support/fixcentral/swg/downloadFixes?parent=ibm~WebSphere&product=ibm/WebSphere/WebSphere+Operational+Decision+Management&release=8.0.1.0&platform=HPUX&function=fixId&fixids=8.0.1-WS-ODM_DC-HPUX-FP002&includeRequisites=1&includeSup] Language Independent 4000000000 ODM Decision Center 8.0.1.2 OS/400 [http://www-933.ibm.com/support/fixcentral/swg/selectFixes?parent=ibm~WebSphere&product=ibm/WebSphere/WebSphere+Operational+Decision+Management&release=8.0.1.0&platform=OS/400&function=fixId&fixids=8.0.1-WS-ODM_DC-OS400-FP002&includeRequisites=1&include] Language Independent 4000000000 ODM Decision Center 8.0.1.2 Solaris "}]}, {"id": "TRAIN_Q070", "question": "How do I search for a string which has reserved words or characters when searching in documents in Atlas?\n\nHow do I search for a string which has reserved words or characters when searching in documents in Atlas?", "answer": "To search for a string with reserved words or characters in documents in Atlas, you need to use double quotes around the string. This allows the reserved characters to be treated literally rather than as delimiters. For example, to search for \"AT&T\" without enclosing it in quotes, you would use \"AT&T\" in the search query. To search for \"AT&T\" enclosed in quotes, you would use \"AT&T\".", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg21982451.txt", "chunk_id": "doc_23398_chunk_0000", "text": "Title: IBM Search option for a reserved word or character in documents in Atlas - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How do I search for a string which has reserved words or characters when searching in documents in Atlas? \n\nCAUSE\nThere are specific options to use in oracle when you search for certain strings\n\nANSWER\nWhen there is a \"-\" in a string you are searching for, you need to use \"\\\" in front of the \"-\" \n\nFor example - \"String1-String2\" should be searched as \"String1\\-String2\" \n\nPlease refer to the oracle documentation for Special Characters in Oracle Text Queries"}, {"filename": "swg21100436.txt", "chunk_id": "doc_10530_chunk_0001", "text": "dded within a word; however, Notes does not recognize them if they located are at the beginning or the end of a word:\n\n\n * \n * \n * \n * \n * \n * \n * \n\n\nThe words \"cc:mail\" and \"boot.bat,\" for example, are treated differently than \"cc mail\" and \"boot bat.\" In addition, note that the ampersand (&) is a reserved character; to search for a string such as \"AT&T,\" enclose the word in quotes (in the query). These four symbols are ignored by a query if they are located at the beginning or end of the word. You can search for any of these characters if they are contained within spaces. For example, you can search for \"AT & T\" or \"Mr / Mrs\". \n\nHyphens are one of the characters that is treated as white space (even if embedded within a word). In addition, the forward slash ( /) cannot be used in a query. The forward slash is often used in text as a delimiter between words such as \"our fly/drive plan\" and \"and/or.\""}, {"filename": "swg21246286.txt", "chunk_id": "doc_11274_chunk_0001", "text": " document contains the text, \"\\nice\". You do an Edit --> Find, type \"\\nice\" as the string to find, and receive a \" '[NL]ice' was not found\" message.\n\nAll other characters preceded by backslash are treated as literals. For example, your document contains the text, \"\\apple\". You do an Edit --> Find, type \"\\apple\" as the string to find, and the search will find it. \n\n\n\nCAUSE\nThe backslash (\"\\\") in a search string is treated as a delimiter for specifying special characters: \n\n\n-- \\f or \\F matches the special ASCII character for Form Feed, which is how you can find form feeds in the document.\n\n-- \\n or \\N matches the special ASCII character for New Line, which is how you can find hard returns in the document.\n\n-- \\t or \\T matches the special ASCII character for tab, which is how you can find tabs in the document.\n\n\nANSWER\nIf you want to search for the strings, \"\\f\", \"\\n\", and \"\\t\", double the backslash character (\"\\\\f\" or \"\\\\n\" or \"\\\\t\"). With this syntax, the first backslash serves as an escape character, indicating that the second backslash should be treated as the literal backslash character. \n\n\n"}, {"filename": "swg21102586.txt", "chunk_id": "doc_10534_chunk_0000", "text": "Title: IBM What are the reserved Keywords used by Domino's Full Text search engine - United States\n\nText:\nsyntax; verity; Domino Server; Notes; Incident 1451588; Server; Full Text Search TECHNOTE (FAQ)\n\nQUESTION\nCertain words are reserved for use by the Full Text search engine. What are these words, and how can you search for them in a document?\n\nANSWER\nThe following words are reserved keywords for the full text search engine: \n\n * \n * \n *   *   *   *   * \n            \n            \n         \n         \n      \n      \n   \n   \n\nYou can search on these words only by placing them inside double quotes, either individually or in a phrase (e.g., \"Field properties\").  *   *   *   *   * \n            \n            \n         \n         \n      \n      \n   \n   \n\nNon-alphanumeric characters used by the search engine are also reserved. Most, but not all, of these characters can be searched for in a document by placing them in double quotes. Due to the number of non-alphanumeric characters available, these are not listed here.  *   *   *   *   * \n            \n            \n         \n         \n      \n      \n   \n   \n\n"}, {"filename": "swg21996232.txt", "chunk_id": "doc_24471_chunk_0000", "text": "Title: IBM Special characters, such as ‘, –  etc. when copied from MS Word are not supported in Atlas search, . - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When you copy a matter name containing special characters from MS Word and paste it in the Search Matters field in Atlas, it does not display the desired results. \n\nSYMPTOM\nIn the Matter Name field, type “Department of Property's audit”. \n\n 1.  In the subsequent fields, enter the required information and click Save and Close. A new matter is created. \n 2. Type the same matter name, “Department of Property's audit” in MS word. The special character (’) is depicted differently. \n 3. Copy this matter name from MS Word and paste it in Search Matters field in Atlas. The desired search result is not displayed.\n\n\n[/support/docview.wss?uid=swg21996232&aid=1] [/support/docview.wss?uid=swg21996232&aid=1] \n\nRESOLVING THE PROBLEM\n \n\nTo resolve this problem, you must either type the matter name in the Search Matters field or copy it from text editors, such as Notepad or Notepad++."}]}, {"id": "TRAIN_Q071", "question": "Why does my upgrade to BigFix version 9.2.5 take a very long time?\n\nMy upgrade to BigFix version 9.2.5 takes a very long time. What do I need to do?", "answer": "The upgrade to BigFix version 9.2.5 takes a very long time because most of the time is spent upgrading the database. It's important to allow the upgrade to complete when in this state, and not attempt to cancel or kill the upgrade process. To verify the upgrade is still active, check that the BESAdmin utility is still running on Windows or the message \"Configuring the database for the server component, please wait ...\" is reported on Linux.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg22011128.txt", "chunk_id": "doc_25761_chunk_0002", "text": "ING THE PROBLEM\nUpgrade the BigFix deployment to at least version 9.5.7. See the following documentation for upgrade procedures and best practices: \n\n * Upgrading BigFix [https://www.ibm.com/developerworks/community/wikis/home?lang=en#!/wiki/Tivoli%20Endpoint%20Manager/page/Upgrading] \n * Upgrading Best Practices [https://www.ibm.com/developerworks/community/wikis/home?lang=en#!/wiki/Tivoli%20Endpoint%20Manager/page/Upgrading%20Best%20Practices]"}, {"filename": "swg21962862.txt", "chunk_id": "doc_21914_chunk_0000", "text": "Title: IBM Verify an IEM server upgrade is still in progress - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How can I tell if the IBM Endpoint Manager (BigFix) server database upgrade is progressing? \n\nCAUSE\nWhen upgrading a BigFix server, most of the time is usually spent upgrading the database. The installer launches the BESAdmin utility to complete this part of the upgrade, but does not provide detailed progress during this phase. For some long running upgrades, it may appear that the upgrade is hung or not progressing: \n\nOn Windows, the BESAdmin UI will indicate \"Not Responding\" if clicked on at this point. \n\nOn Linux, the message \"Info: Configuring the database for the server component, please wait ... \" is reported.\n\n\nANSWER\nIt is important to allow the upgrade to complete when in this state, and not attempt to cancel or kill the upgrade process. To verify the upgrade is still active, check that the following process is still running: \n\nWindows: BESAdmin.exe \n\nLinux: BESAdmin \n\n"}, {"filename": "swg1IV88883.txt", "chunk_id": "doc_04120_chunk_0001", "text": "as been upgraded from a release earlier than 9.2.5.\n   In such a case it is required to upload a newer version of\n   catalog and run data import.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * ERROR DESCRIPTION:\n   * When you upload the same version of the software catalog that\n   * is already uploaded, some software components are not properly\n   * recognized. The problem occurs on Windows\n   * EXPECTED RESULTS:\n   * The problem does not occur.\n   * GUIDs of signatures that are used in the catalog-based scan\n   * are not regenerated during first update of the catalog after\n   * product installation. If you have the BigFix Inventory server\n   * installed on Windows and did not update the catalog yet,\n   * upgrade BigFix Inventory to version 9.2.5 to avoid the\n   problem.\n   ****************************************************************\n   * RECOMMENDATION: Apply appropriate update when available.\n   ****************************************************************\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21995816.txt", "chunk_id": "doc_24438_chunk_0006", "text": " the file and it should bring up the BigFix Console UI. Follow the wizard to complete the import. Be sure to select the correct site to place it in. \n 8. When all duplications are resolved, you need to run an Import in BigFix Compliance, which should resolve all duplicate records inside the BigFix Compliance database. \n 9. After a successful import, make sure to rerun the query again to ensure no return result. If there are still records shown on the provided query, you would have to repeat de-duplication steps. Otherwise you may upgrade to BigFix Compliance 1.9."}]}, {"id": "TRAIN_Q081", "question": "'Access is denied' install errors with ICC\n\nInstalling ICC 4.0.1 and then FP2 gives the 'Access is denied' error on WASSERVICE.exe. How to resolve this?", "answer": "To resolve the 'Access is denied' error during the installation of ICC 4.0.1 and FP2, you should follow these steps based on the provided documents:\n\n1. **Check Existing WASService.exe File**: Ensure that an existing copy of the WASService.exe file is available from a previous installation. This can help the upgrade process continue without creating a new WASService.exe file.\n\n2. **Run UtilityConnector.exe**: Follow the instructions provided in Document 2 to integrate Content Classification for use in IBM Content Collector (ICC) task routes. Specifically, ensure that the utilityConnector.exe file is executed correctly according to the ICC documentation.\n\n3. **Review Registry Permissions**: Verify that the necessary permissions are set for the WASService.exe file. You may need administrative privileges to", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg1HE12537.txt", "chunk_id": "doc_01368_chunk_0001", "text": "86)\\ibm\\ContentCollector\\AFUWeb\\ewas\\bin\\WASService.exe\n   (Access is denied.)\n   \n   As part of the installation process the WASService.exe file can\n   be deleted but a new one can not be created and the\n   installation can not proceed from this point\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  If an existing copy of the WASService.exe file is copied from a\n   previous installation the upgrade can continue\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  When trying to install a new ICC version or fixpack on an\n   already existing system the installation can fail with an error\n   such as:\n   \n   Install File: C:\\Program\n   Files(x86)\\IBM\\ContentCollector\\AFUWeb\\ewas\\bin\\WASService.exe\n                            Status: Fehler\n    Zusatzliche Hinweise: Fehler - Flexeraak4: C:\\Program Files\n   (x86)\\ibm\\ContentCollector\\AFUWeb\\ewas\\bin\\WASService.exe\n   (Access is denied.)\n   \n   As part of the installation process the WASService.exe file can\n   be deleted but a new one can not be created and the\n   installation can not proceed from this point.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Starting with 4.0.1.3-IBM-ICC-FP003 release, this issue has been\n    fixed.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg21980994.txt", "chunk_id": "doc_23274_chunk_0000", "text": "Title: IBM Content Collector utilityConnector.exe execution fails with Error 0x1584 : Cannot remove service entries from registry - United States\n\nText:\nICC; utlityConnector.exe; Access is denied; server registry TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n To intigrate Content Classification for use in IBM Content Collector (ICC) task routes, the utilityConnector.exe file found at:\n\n<ICC_Installation_Directory>/ctms\n\nneeds to be run as detailed in the ICC documentation here:\n\nhttp://www.ibm.com/support/knowledgecenter/en/SSAE9L_4.0.0/com.ibm.content.collector.doc/icm/t_afu_enabling_rc_icm_integration.html [http://www.ibm.com/support/knowledgecenter/en/SSAE9L_4.0.0/com.ibm.content.collector.doc/icm/t_afu_enabling_rc_icm_integration.html]\n\nThe utilityConnector.exe file can fail with an \"Access is denied\" error as detailed below. \n\nSYMPTOM\nThe utilityConnector.exe file fails with: \n\nError 0x1584 Cannot remove service entries from regis \ntry. Reason: Error accessing key \n'HKEY_LOCAL_MACHINE\\Software\\IBM\\EMRC\\4.0\\Servi \nceDeclarations3 \n\nError 0x1584 Failed to open service control manager. \n(error 0x5 - Access is denied.) \n\n"}, {"filename": "swg24042387.txt", "chunk_id": "doc_27141_chunk_0002", "text": "ww.ibm.com/support/docview.wss?uid=swg1HE12537] CONTENT COLLECTOR INSTALLATION FAILS WITH ACCESS IS DENIED ERROR ON WASSERVICE.EXE FILE PREREQUISITES\nIBM Content Collector V4.0.1 Fix Pack 3 can be used with the following IBM Content Collector version: \n\nURL LANGUAGE SIZE(Bytes) Prerequisites for IBM Content Collector V4.0.1 [http://www-01.ibm.com/support/docview.wss?uid=swg27042658] English 1 \nINSTALLATION INSTRUCTIONS\nRead the fix pack readme files for specific information about installing the fix pack packages.\n\nURL LANGUAGE SIZE(Bytes) 4.0.1.3-IBM-ICC-FP003 [https://www-945.ibm.com/support/fixcentral/swg/downloadFixes?parent=Enterprise%2BContent%2BManagement&product=ibm/Information+Management/Content+Collector&release=All&platform=All&function=fixId&fixids=4.0.1.3-IBM-ICC-FP003&includeRequisites=1&includeSup] English 1 \nDOWNLOAD PACKAGE\nThe IBM Content Collector V4.0.1 Fix Pack 3 download package consists of the following files: \n\n"}, {"filename": "swg21971485.txt", "chunk_id": "doc_22466_chunk_0000", "text": "Title: IBM .NET API error when installing IBM Content Collector (ICC) 4.0.1 - United States\n\nText:\nICC; .NET API; CPE 5.2.1.2 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n A .NET API error is thrown when attempting to install ICC 4.0.1. The error claims that either an incorrect version of the IBM FileNet P8 Content Processing Engine (CPE) .NET API 5.2.1.2 is installed or that it is missing some components. \n\nCAUSE\nA corrupt installation of the CPE 5.2.1.2.\n\nDIAGNOSING THE PROBLEM\n1. Check in \"Programs and features\"\n2. .NET API will not be listed there\n\nRESOLVING THE PROBLEM\nRe-installing the CPE 5.2.1.2 .NET API will solve this issue:\n\n\n\n\n1. Copy the software on a local disk.\n2. Start the re-installation of the .NET API.\n3. Select all sub-components of .NET framework 45 that were not listed before (select them all if unsure). \n\nDuring the next installation of ICC there are no further errors regarding missing components."}]}, {"id": "TRAIN_Q094", "question": "Test MDB with Multiline message.\n\n\n\nHi, I need to test my MDB injecting a multiline message into my Local WAS server. I have tried the WAS Integrated Universal Client and SIBExplorer. But the only accept on line mesage. How can I inject a multiline message into my Local WAS?\n\nI have tryid to config HermeJMS but without success.", "answer": "To inject a multiline message into your Local WAS server when developing an MDB, follow these steps:\n\n1. Ensure you have the necessary resources installed on your system, including WebSphere MQ V7 as the JMS provider and WebSphere Application Server V7.\n\n2. Create a new project in Rational Application Developer (RAD) 7.5.\n\n3. Design and implement your Message Driven Bean (MDB). Make sure it's set up to handle incoming messages and display their contents.\n\n4. Configure the MDB to connect to the WebSphere MQ queue manager where the multiline messages will be stored.\n\n5. Use the integrated Universal Client or SIBExplorer to send a multiline message to the queue manager.\n\n6. In the MDB, process the received message and ensure it handles multiline messages correctly.\n\n7.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg27016507.txt", "chunk_id": "doc_27431_chunk_0000", "text": "Title: IBM Developing and testing an MDB using RAD 7.5, WebSphere Application Server V7 and MQ V7 as JMS Provider - United States\n\nText:\ndevelop Developing testing MDB RAD 7.5 WebSphere Application Server V7 MQ V7 JMS Provider WHITE PAPER\n\nABSTRACT\n Demonstrate the steps to develop and test a Message Driven Bean (MDB) using Rational Application Developer (RAD) 7.5 and WebSphere Application Server V7, while using WebSphere MQ V7 as Java ™ Messaging Service (JMS) Provider. \n\nCONTENT\nThe document is provided in the attached file: Developing_and_testing_MDB_on_RAD7.pdf\n\n\nThis demonstrates the steps required to develop and test a Message Driven Bean (MDB) using Rational Application Developer (RAD) 7.5 and WebSphere Application Server V7, while using WebSphere MQ V7 as the Java Messaging Service (JMS) Provider.\n\nThe testing scenario shows how the Listener Port for WebSphere Application Server gets a message from an MQ Queue (Point to Point) and passes it to the MDB, which displays the contents of the text message. This MDB is a simple but functional application.\n\nThe following file (available with this techdoc) includes the MDB as it was developed, tested and exported as described in this document:\nEAR file with MDB: SampleMDBEJB.ear \n\n"}, {"filename": "swg27020701.txt", "chunk_id": "doc_27549_chunk_0001", "text": "Definition Table (CCDT)\nChapter 3: Defining a Connection Factory that uses the CCDT\nChapter 4: Switchover testing of the Sample MDB - Listener Port \n\n *  Test 1: Messages are passed to the MDB, from host-1 \"veracruz\" \n *  Test 2: Doing a switchover of the Queue Manager from host-1 \"veracruz\" to host-2 \"cbeech\" \n *  Test 3: MDB gets message that is put into the other instance of the queue manager (host-2 \"cbeech\")\n\nChapter 5: Switchover testing of the Sample MDB - Activation Specification  *  Similar steps as in Chapter 4\n\nChapter 6: Troubleshooting \n\nIt is highly recommended that you review the details described in the following technote: \nhttp://www.ibm.com/support/docview.wss?uid=swg21508357 [http://www.ibm.com/support/docview.wss?uid=swg21508357] \nTechnote: 1508357 \nUsing WebSphere MQ automatic client reconnection with the WebSphere MQ classes for JMS \n\nSection added on 19-Jun-2012: Using CCDTURL custom property in WAS 6.1 \n\nFile attachment: How_to_use_MQ_701_Multi-Instance_QMgrs_from_WAS-CCDT.pdf \nHow_to_use_MQ_701_Multi-Instance_QMgrs_from_WAS-CCDT.pdf [/support/docview.wss?uid=swg27020701&aid=2]How_to_use_MQ_701_Multi-Instance_QMgrs_from_WAS-CCDT.pdf [/support/docview.wss?uid=swg27020701&aid=1] \n\n"}, {"filename": "swg27016582.txt", "chunk_id": "doc_27434_chunk_0000", "text": "Title: IBM Using an MDB that always rolls back a message to test the handling of poison messages (WebSphere MQ V7.x, V8, V9, and WebSphere Application Server V7, V8.x, V9) - United States\n\nText:\n WHITE PAPER\n\nABSTRACT\n Demonstrate the use of a simple Message Driven Bean (MDB) in WebSphere Application Server V7, which interacts with WebSphere MQ V7 as the Java™ Messaging Service (JMS) provider. This MDB always rolls back a message and therefore indicating it as a “poison message”. This MDB can be used to better understand the handling of poison messages by the WebSphere Application Server and MQ. \n\nCONTENT\nThe document is provided in the attached file: WAS7_MQ7_MDB_PoisonMessages.pdf \n\nThis demonstrates the use of a simple Message Driven Bean (MDB) in WebSphere Application Server V7 and later, which interacts with WebSphere MQ as the Java Messaging Service (JMS) provider. \n\nShipped version of MQ RA with WAS:\n- WAS 7.x and 8.0 ship MQ 7.0 Resource Adapter\n- WAS 8.5 ships MQ 7.1 Resource Adapter\n- The MQ V7.5 and V8 JMS clients are NOT shipped with any version of WAS.\n- WAS 9.0 ships MQ 9.0 Resource Adapter.\n\n"}]}, {"id": "TRAIN_Q165", "question": "Is Java 8 supported for EJBDeploy on WebSphere Application Server 8.5.5.9 or later?\n\nIs Java 8 supported for EJBDeploy on WebSphere Application Server 8.5.5.9 or later?", "answer": "Yes, Java 8 is supported for EJBDeploy on WebSphere Application Server 8.5.5.9 or later. However, it's important to note that after applying this fix, EJBDeploy cannot be used with Java 6.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg24043474.txt", "chunk_id": "doc_27199_chunk_0000", "text": "Title: IBM PI73197:Enable Java 8 Support for EJBDeploy on WebSphere Application Server - United States\n\nText:\nPI73197; PI73197; PI73197 DOWNLOADABLE FILES\n\nABSTRACT\n Enable Java 8 Support for EJBDeploy on WebSphere Application Server 8.5.5.9 or later.\nNOTE: After this fix is applied, EJBDeploy can no longer be used with Java 6 \n\nDOWNLOAD DESCRIPTION\nPI73197 resolves the following problem:\n\nERROR DESCRIPTION: \nJava 8 is not supported for EJBDeploy on WebSphere Application Server 8.5.5.9 or later \n\nLOCAL FIX: \n\nPROBLEM SUMMARY\n\nUSERS AFFECTED:\nAll users of IBM WebSphere Application Server\n\nPROBLEM DESCRIPTION:\nEJBDeploy does not run on Java 8\n\nRECOMMENDATION:\nNone\n\nEJBDeploy does not run on Java 8\n\nPROBLEM CONCLUSION: \nThe fix for this APAR is targeted for inclusion in 2Q2018. \n\nPlease refer to the Recommended Updates page for delivery information: \nhttp://www.ibm.com/support/docview.wss?rs=180&uid=swg27004980 [http://www.ibm.com/support/docview.wss?rs=180&uid=swg27004980]\n\nPREREQUISITES\nNone\n\nINSTALLATION INSTRUCTIONS\nPlease review the readme.txt for detailed installation instructions.\n\n"}, {"filename": "swg1PI73197.txt", "chunk_id": "doc_07480_chunk_0000", "text": "Title: IBM PI73197: Enable Java 8 Support for EJBDeploy on WebSphere Application Server - United States\n\nText:\n  A FIX IS AVAILABLE\nPI73197:Enable Java 8 Support for EJBDeploy on WebSphere Application Server [http://www-01.ibm.com/support/docview.wss?uid=swg24043474]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Java 8 is not supported for EJBDeploy on WebSphere\n   Application Server 8.5.5.9 or later\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:  All users of IBM WebSphere Application      *\n   *                  Server                                      *\n   ****************************************************************\n   * PROBLEM DESCRIPTION: EJBDeploy does not run on Java 8        *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   EJBDeploy does not run on Java 8\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21994742.txt", "chunk_id": "doc_24370_chunk_0003", "text": "8.5.5.9 or lower is a known limitation [http://www.ibm.com/support/knowledgecenter/SSAW57_8.5.5/com.ibm.websphere.nd.doc/ae/rtrb_ejbdeploy390.html].\n\n- Use PI73197 iFix [http://www.ibm.com/support/docview.wss?uid=swg24043474] which provides an EJBDeploy that supports Java 8 and Java 7 on WebSphere 8.5.5.9, 8.5.5.10,8.5.5.11,8.5.5.12\nand 8.5.5.13\nNote : This EJBDeploy does not support Java 6 however.\n\nPI73197:Enable Java 8 Support for EJBDeploy on WebSphere Application Server [http://www.ibm.com/support/docview.wss?uid=swg24043474]\n\n- Use EJBDeploy with Java 7 or lower to deploy your application, and then run that deployed application on the server configured with Java 8\n\n- Upgrade your WebSphere to version 9 or version 8.5.5.14 where EJBDeploy is supported for use with Java 8\n\nNull Pointer Exception in BootLoader when Loading org.eclipse.core.runtime.platform. When running EJBDeploy in the command line or through a WAS admin console or ANT task, the following exception occurs:\n"}, {"filename": "swg1PI53589.txt", "chunk_id": "doc_07182_chunk_0001", "text": "  \n   \n   \n\nERROR DESCRIPTION\n *  Add Java 8 as an optional JDK to be installed with WebSphere\n   8.5.5.9 and later.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:  All users of IBM WebSphere Application      *\n   *                  Server that would like to use Java 8        *\n   ****************************************************************\n   * PROBLEM DESCRIPTION: Add Java 8 as an optional SDK for       *\n   *                      WebSphere Application Server            *\n   ****************************************************************\n   * RECOMMENDATION:  Java 8 is shipped as an optional SDK for    *\n   *                  WebSphere Application Server 8.5.5.9.       *\n   *                  Install the new package to use Java 8.      *\n   ****************************************************************\n   Java 8 is now available as an option for use with WebSphere\n   Application Server 8.5.5.9.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21994741.txt", "chunk_id": "doc_24369_chunk_0001", "text": "ployment tools alter the bytecode of your application classes rather than generating code ;however, the end result is similar. \n\nThe EJBDeploy Tool \n\nHistorically, EJB deployment in the Application Server product has been performed by the EJBDeploy tool, which is included with WebSphere® Application Server and packaged with the development tools for the WebSphere products. \nThe EJBDeploy tool inspects the external interfaces for your enterprise beans, generates wrapper code as .java files, and compiles the code using the javac compiler. The resulting .class files are packaged in your EJB module with your application code. For modules including and previous to EJB 2.1, the EJBDeploy tool must be invoked manually. \nPlease note that in WebSphere Application Server 8.5.5.x and below, the tool can only deploy Java EE applications compiled with a JDK level of 7 or below. To deploy JDK 8 compiled web applications, please upgrade to WebSphere Application Server V9."}]}, {"id": "TRAIN_Q231", "question": "Netcool/Impact (all versions): OMNIbusEventReader Filter Analyzer error \"rule includes an unsupported expression\"\n\nNetcool/Impact (all versions): OMNIbusEventReader Filter Analyzer error \"rule includes an unsupported expression\"\n\nThis occurs when comparing two ObjectServer fields against each other in a Filter.", "answer": "The error \"rule includes an unsupported expression\" occurs when comparing two ObjectServer fields against each other in a Filter using the OMNIbusEventReader Filter Analyzer in NetCool/Impact. To resolve this issue, add the following properties to the eventreader's props file:\n\n```properties\nimpact.<readername>.consolidatefilters=false\nimpact.<readername>.uselikeoperator=true\n```\n\nThese properties allow displaying filters using 'like'. However, they also disable consolidation of filters, which might affect the ability of the event reader to parse the filter.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg1IZ54766.txt", "chunk_id": "doc_04897_chunk_0001", "text": "an event reader filter or when comparing a field\n   with getdate an error occurs: \"rule includes an unsupported\n   expression\".\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  This is actually a limitation in the available functionality of\n   the filter analyzer in Impact 5.1.\n   In order to get a clearer idea of how your filters are set up\n   without relying on the filter analyzer, you can set these\n   properties. Add:\n   \n   \n   impact.<readername>.consolidatefilters=false\n   \n   to $NCHOME/impact/etc/ServerName_<readername>.props\n   \n   You should be able to see the filters in the GUI and the event\n   reader log file as well as in netcool.log, excepting when the\n   'like' condition is used. In order to display filters using\n   'like', a further property needs to be added to the same file:\n   \n   impact.<readername>.uselikeoperator=true\n   \n   Note: all of the above relates purely to the filter analyzer and\n   should not effect the ability of the event reader to parse the\n   filter.\n   \n   Tech note released to state this\n   http://www-01.ibm.com/support/docview.wss?rs=3124&context=SSSHYH\n"}, {"filename": "swg21624345.txt", "chunk_id": "doc_17538_chunk_0000", "text": "Title: IBM EventReader error with empty Filter - United States\n\nText:\nnetcool; impact; netcool/impact; nci; event; reader; eventreader; omnibus; omnibuseventreader; error; syntax; lexical; warn; warning; filter; eventfilter; blank; empty; null TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n An error message is produced in the netcool.log by running an EventReader configured with a blank Filter, the associated Policy still runs as desired. \n\nSYMPTOM\n \n\nThe error message is found in the netcool.log file only and is of the format:\n\nWARN [EventFilter] EventFilter.getMatchingPoliciesForEvent: Could not parse the Expression:\njava.lang.RuntimeException:\ncom.micromuse.common.parser.internal.core.ParseException: Encountered \";\" at line 1, column 10.\nWas expecting one of:\n<INTEGER_LITERAL> ...\n<FLOAT_LITERAL> ...\n<DATETIME_LITERAL> ...\n<DATE_LITERAL> ...\n\"-\" ...\n\"~\" ...\n\"!\" ...\n\"(\" ...\n\"{\" ...\n\"@\" ...\n\"true\" ...\n\"false\" ...\n<IDENTIFIER> ...\n\"\\\"\" ...\n\"\\'\" ...\n\n"}, {"filename": "swg1IZ73857.txt", "chunk_id": "doc_05072_chunk_0000", "text": "Title: IBM IZ73857: EVENTREADER FILTER ANALYZER THROWS ERROR WHENEVER CERTAIN FILTER CONDITIONS ARE ANALYZED - United States\n\nText:\n SUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Impact 5.x produces error when using certain EventReader\n   Restriction filter conditions. If one runs into this it throws\n   the error \"rule includes an unsupported expression\" when\n   clicking on Analyze Filter button. Here's and example of when\n   the Filter Analyzer errors out with the following type of filter\n   condition:\n   Summary != '' AND Summary NOT LIKE 'string'\n   \n   This same filter condition may have worked fine on Impact\n   version 4.0.2.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  You manually add both the following properties to your\n   eventreader's props file, i.e. within the\n   $NCHOME/impact/etc/NCI_omnibuseventreader.props file:\n   --------------------\n   impact.<readername>.uselikeoperator=true\n   impact.<readername>.consolidatefilters=false\n   --------------------\n   Please note this will get the actual filter condition working in\n   the eventreader (which is the most important thing), however\n"}, {"filename": "swg21566480.txt", "chunk_id": "doc_15767_chunk_0000", "text": "Title: IBM EventReader Filters not applied to SQL select statement - United States\n\nText:\nnetcool; impact; netcool/impact; nci; eventreader; omnibus; omnibuseventreader; event; reader; like; uselikeoperator; operator; filter; filters; use; uselike; likeoperator TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The contents of the Filters in the EventReader are not being applied to the SQL statement being sent out by the EventReader \n\nSYMPTOM\nThe outgoing SQL statements are simply: \n\n * \n * \n\n\nand ALL events in the ObjectServer are being captured and processed over and over again. \n\n* except for Class 10500 events (Impact Self Monitoring synthetic events) - see TechNote \"EventReader filters out Class 10500 event by default\" [ link below]. \n\nCAUSE\nIf any of the Filters use a \"like\" operator - for example: \n\n\n\n\n * \n\n\nImpact strips out the Filter to avoid any complication with other databases. This is a default protective action. \n\n\nDIAGNOSING THE PROBLEM\nImpact fails to acquire the expected events from the ObjectServer or acquires events that are not supposed to be processed by Impact or repeated reprocesses events that have been marked as processed. Examine the SQL query being created by the Impact EventReader. \n\n\n\n\n\n"}]}, {"id": "TRAIN_Q343", "question": "Help with Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Service Registry and Repository (CVE-2017-1681)\n\nI need to understand details regarding Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Service Registry and Repository (CVE-2017-1681). Is WAS Liberty affected?", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "ANSWER_NO", "documents": [{"filename": "swg22013233.txt", "chunk_id": "doc_25958_chunk_0000", "text": "Title: IBM Security Bulletin:  A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Service Registry and Repository (CVE-2017-1681) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped as a component of WebSphere Service Registry and Repository. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Information disclosure in WebSphere Application Server (CVE-2017-1681) [http://www-01.ibm.com/support/docview.wss?uid=swg22010419] for vulnerability details and information about fixes. \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Service Registry and Repository V8.5 WebSphere Application Server Network Deployment V8.5.5 WebSphere Service Registry and Repository V8.0 WebSphere Application Server Network Deployment V8.0 WebSphere Service Registry and Repository V7.5 WebSphere Application Server Network Deployment V7.0 WebSphere Service Registry and Repository V7.0 WebSphere Application Server Network Deployment V7.0 GET NOTIFIED ABOUT FUTURE SECURITY "}, {"filename": "swg22013204.txt", "chunk_id": "doc_25955_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Service Registry and Repository (CVE-2017-1731) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped as a component of WebSphere Service Registry and Repository. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Potential Privilege Escalation in WebSphere Application Server Admin Console (CVE-2017-1731) [http://www-01.ibm.com/support/docview.wss?uid=swg22012345] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Service Registry and Repository V8.5 WebSphere Application Server Network Deployment V8.5.5 WebSphere Service Registry and Repository V8.0 WebSphere Application Server Network Deployment V8.0 WebSphere Service Registry and Repository V7.5 WebSphere Application Server Network Deployment V7.0 WebSphere Service Registry and Repository V7.0 WebSphere Application Server Network Deployment V7.0 GET NOTIFIED "}, {"filename": "swg21965152.txt", "chunk_id": "doc_22049_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Service Registry and Repository (CVE-2015-1946, CVE-2015-1927 ) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped as a component of WebSphere Service Registry and Repository. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Security Bulletin: Multiple Security Vulnerabilities fixed in IBM WebSphere Application Server 8.5.5.6 [http://www.ibm.com/support/docview.wss?uid=swg21959083] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Service Registry and Repository V8.5 \n(affected by CVE-2015-1946 and CVE-2015-1927) \nWebSphere Application Server Network Deployment V8.5.5 WebSphere Service Registry and Repository V8.0 \n(affected by CVE-2015-1927 only) \nWebSphere Application Server Network Deployment V8.0 WebSphere Service Registry and Repository V7.5 \n(affected by CVE-2015-1927 only) \n"}, {"filename": "swg22003005.txt", "chunk_id": "doc_25022_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Remote Server (CVE-2017-1137) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped with WebSphere Remote Server. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nRefer to the security bulletin(s) listed in the Remediation/Fixes section\n\nAFFECTED PRODUCTS AND VERSIONS\nWebSphere Remote Server 8.5\n\nREMEDIATION/FIXES\nRefer to the following security bulletins for vulnerability details and information about fixes addressed by WebSphere Application Server which is shipped with WebSphere Remote Server. \n\nPrincipal Product and Version(s) Affected Supporting Product and Version Affected Supporting Product Security Bulletin WebSphere Remote Server 8.5 WebSphere Application Server 8.0, 8.5, 8.5.5 Potential security vulnerability in WebSphere Application Server Administrative Console (CVE-2017-1137) [http://www.ibm.com/support/docview.wss?uid=swg21998469] GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n"}, {"filename": "swg21992907.txt", "chunk_id": "doc_24227_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability identified in IBM WebSphere Application Server shipped with IBM WebSphere Service Registry and Repository (CVE-2016-5983) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped as a component of IBM WebSphere Service Registry and Repository. Information about a security vulnerability affecting IBM WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin:\nSecurity Bulletin: Code execution vulnerability in WebSphere Application Server (CVE-2016-5983). [http://www.ibm.com/support/docview.wss?uid=swg21990060]\n\nfor vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Service Registry and Repository V8.5 WebSphere Application Server V8.5.5 WebSphere Service Registry and Repository V8.0 WebSphere Application Server V8.0 WebSphere Service Registry and Repository V7.5 WebSphere Application Server V7.0 REMEDIATION/FIXES\nNone\n\nWORKAROUNDS AND MITIGATIONS\nNone\n\n"}, {"filename": "swg22000421.txt", "chunk_id": "doc_24773_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Remote Server (CVE-2017-1151) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped with WebSphere Remote Server. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nRefer to the security bulletin(s) listed in the Remediation/Fixes section\n\nAFFECTED PRODUCTS AND VERSIONS\nWebSphere Remote Server 8.5\n\nREMEDIATION/FIXES\nRefer to the following security bulletins for vulnerability details and information about fixes addressed by WebSphere Application Server which is shipped with WebSphere Remote Server. \n\nPrincipal Product and Version(s) Affected Supporting Product and Version Affected Supporting Product Security Bulletin WebSphere Remote Server 8.5 WebSphere Application Server 8.0, 8.5, 8.5.5, 9.0 Privilege Escalation Vulnerability in WebSphere Application Server (CVE-2017-1151) [http://www-01.ibm.com/support/docview.wss?uid=swg21999293] GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n"}, {"filename": "swg21990928.txt", "chunk_id": "doc_24091_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability identified in IBM WebSphere Application Server shipped with IBM WebSphere Service Registry and Repository (CVE-2016-5986) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped as a component of IBM WebSphere Service Registry and Repository. Information about a security vulnerability affecting IBM WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin:\nSecurity Bulletin: Potential Information Disclosure vulnerability in WebSphere Application Server (CVE-2016-5986) [http://www.ibm.com/support/docview.wss?uid=swg21990056]\n\nfor vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Service Registry and Repository V8.5 WebSphere Application Server V8.5.5 WebSphere Service Registry and Repository V8.0 WebSphere Application Server V8.0 WebSphere Service Registry and Repository V7.5 WebSphere Application Server V7.0 REMEDIATION/FIXES\nNone\n\nWORKAROUNDS AND MITIGATIONS\nNone\n\n"}, {"filename": "swg22006456.txt", "chunk_id": "doc_25331_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Remote Server (CVE-2017-1380) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped with WebSphere Remote Server. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nRefer to the security bulletin(s) listed in the Remediation/Fixes section\n\nAFFECTED PRODUCTS AND VERSIONS\nWebSphere Remote Server 7.0, 7.1, 8.5\n\nREMEDIATION/FIXES\nRefer to the following security bulletins for vulnerability details and information about fixes addressed by WebSphere Application Server which is shipped with WebSphere Remote Server. \n\nPrincipal Product and Version(s) Affected Supporting Product and Version Affected Supporting Product Security Bulletin WebSphere Remote Server 7.0, 7.1, 8.5 WebSphere Application Server 7.0, 8.0, 8.5, 9.0 Cross-site scripting vulnerability in Admin Console for WebSphere Application Server (CVE-2017-1380) [http://www.ibm.com/support/docview.wss?uid=swg22004786] GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n"}, {"filename": "swg22013167.txt", "chunk_id": "doc_25952_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Remote Server (CVE-2017-1681) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped with WebSphere Remote Server. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nRefer to the security bulletin(s) listed in the Remediation/Fixes section\n\nAFFECTED PRODUCTS AND VERSIONS\nThis vulnerability affects the following versions and releases of IBM WebSphere Remote Server:\n• 7.0, 7.1, 8.5, 9.0\n\nREMEDIATION/FIXES\nRefer to the following security bulletins for vulnerability details and information about fixes addressed by WebSphere Application Server which is shipped with WebSphere Remote Server.\n\n\n\nPrincipal Product and Version(s) Affected Supporting Product and Version Affected Supporting Product Security Bulletin WebSphere Remote Server 7.0, 7.1, 8.5, 9.0 WebSphere Application Server 7.0, 8.0, 8.5, 9.0 Information disclosure in WebSphere Application Server [http://www.ibm.com/support/docview.wss?uid=swg22010419] GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n"}, {"filename": "swg21997507.txt", "chunk_id": "doc_24547_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in WebSphere Application Server shipped with WebSphere Remote Server (CVE-2016-8919) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n WebSphere Application Server is shipped with WebSphere Remote Server. Information about a security vulnerability affecting WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nRefer to the security bulletin listed in the Remediation/Fixes section\n\nAFFECTED PRODUCTS AND VERSIONS\nWebSphere Remote Server 7.0, 7.1, 7.1.1, 7.1.2, 8.5\n\nREMEDIATION/FIXES\nRefer to the following security bulletin for vulnerability details and information about fixes addressed by WebSphere Application Server which is shipped with WebSphere Remote Server. \n\nPrincipal Product and Version(s) Affected Supporting Product and Version Affected Supporting Product Security Bulletin WebSphere Remote Server 7.0, 7.1, 7.1.1, 7.1.2, 8.5 WebSphere Application Server 7.0, 8.0, 8.5, 8.5.5,9.0 Denial of Service with WebSphere Application Server (CVE-2016-8919) [http://www.ibm.com/support/docview.wss?uid=swg21993797] GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n"}]}, {"id": "TRAIN_Q385", "question": "Where in the WAS admin console can I set the java nursery sizes? (-Xmns256M -Xmnx256M)\n\nSo, when GC=GENCON the HEAP gets split up into a nursery and tenured HEAP space. Can I ,in the Admin console, set the nursery size?? In the console, if I go here: A. WAS 8.X where to set these:\n\nServers => Application servers => server_name Now find the \"System Infrastructure\" section -> Java and Process Management -> (Lower right ) -> Process definition -> (Additional Properties section) -> Java Virtual Machine (Right hand side)\nB. Now in the Configuration window I only see the general MIN/MAX HEAP JVM settings. (These are the (-Xmos756M (Min) -Xmox1024M (Max)) tenured heap settings settings.\n\nShows near bottom I only see: Inital heap size (MIN) Maximum Heap size (MAX)\nHowever, I need to also set the nursery (-Xmns256M -Xmnx256M). How/where can this get set in the WAS admin console? (I'd rather not try and go hacking through the server.xml file...) I know in WAS 6.1 and 7.X we used to add these java parms in the \"generic JVM arguments\" section or directly into the ..\\WebSphere\\AppServer\\bin\\startServer.bat . However, it looks like some some WAS editions and versions do NOT have the \"Generic JVM arguments\" section on the JVM page. What can you do in this case?", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "ANSWER_NO", "documents": [{"filename": "swg21377874.txt", "chunk_id": "doc_12558_chunk_0001", "text": "ucture > Java and Process Management > Process Definition. \n 4. On the Process Management page, select Additional Properties > Java Virtual Machine. \n 5. On the Java Virtual Machine page, type 512 as the Initial heap size and 1024 as the Maximum Heap Size. Note: You can set the Maximum Heap Size to a higher value if needed. \n 6. Save your changes. \n 7. Restart WebSphere. \n\n\n\nStep 2. Rerun the DWE Administration Console Configuration Tool to restore the Generic JVM arguments. \n\nBefore you rerun the Configuration Tool:  * You need to backup the metadata database before you rerun the Configuration Tool. \n * Your metadata tables could contain deployed applications, schedules that you have created, etc. When you rerun the Configuration Tool, do not recreate the metadata tables or the information that you have created could be deleted. \n\n\nTo check that the JVM settings in WebSphere are correct:  1. From the Websphere Administrative Console, select Servers > Application Servers > server1. \n 2. In the Server Infrastructure section, expand Java and Process Management. \n 3. Select Process Definition. \n"}, {"filename": "swg21597180.txt", "chunk_id": "doc_16635_chunk_0001", "text": "rease the WebSphere JVM heap size, by navigating from Tivoli Integrated Portal to:\n> Settings -> WebSphere Administrative Console -> Launch console \n\nIn the WebSphere web console, select: \n>Servers -> Server Types -> WebSphere application servers -> server_name->\nServer Infrastructure -> Java and Process Management -> Process definition -> \n\nIn Additional Properties section, select Java Virtual Machine and increase the value for \"Maximum heap size\". \n\nIn cases where the panel is not available to the user (for example after upgrading TIP to 2.2.0.7)\nyou can use the following workaround:\n\n- please search for server.xml file in path like <eWAS_dir>/profiles/profile_name/config/cells/cell_name/nodes/node_name/servers/server1/\n\n- you should find information similar to the following:\n<jvmEntries xmi:id=\"JavaVirtualMachine_1343815583563\" \nverboseModeClass=\"false\" verboseModeGarbageCollection=\"false\" verboseModeJNI=\"false\" initialHeapSize=\"256\" maximumHeapSize=\"1024\" runHProf=\"false\" hprofArguments=\"\" debugMode=\"false\" debugArgs=\"-Djava.compiler=NONE -Xdebug -Xnoagent -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=11078\" genericJvmArguments=\"\">\n\n"}, {"filename": "swg21397042.txt", "chunk_id": "doc_12886_chunk_0000", "text": "Title: IBM How to change the maximum JVM heap size for Rational RequisitePro Web - United States\n\nText:\nJVM; heap; maximum; maximumheapsz; heapsize; WAS; tuning; performance; optimization; console TECHNOTE (FAQ)\n\nQUESTION\n How can you change the maximum Java Virtual Machine (JVM) heap size for IBM Rational RequisitePro Web (ReqWeb) version 7.1? \n\nCAUSE\nAdjusting the JVM heap size allows the application (ReqWeb) to consume more system resources, and is recommended for systems with a high amount of concurrent users to ensure performance is optimal.\n\nANSWER\nThe maximum JVM heap size can be adjusted using the IBM WebSphere Application Server administration console included in the 7.1 release. The following steps describe how to change this setting:\n\n\n 1. Launch the WebSphere Application Server administration console by entering the following URL in a web browser: http://[server name]:11061/ibm/console \n 2. Leave the user ID blank, and click \"Log in\" to enter the console \n 3. Once logged in, navigate to Servers > Application Servers > Server1 > Server Infrastructure > Java and Process Management > Process Definition > Java Virtual Machine \n"}, {"filename": "swg21653445.txt", "chunk_id": "doc_18572_chunk_0004", "text": "creases as needed e.g. wrapper.java.additional.1, wrapper.java.additional.2, and so on. You may use this to specify JVM arguments like the following:\n1. -Xss argument which sets the thread stack size where the thread stores its local execution state. Thread stacks are memory areas allocated for each Java thread for their internal use.\n2. Xmso<size> argument which sets the default stack size for Operating System threads.\n... And so on\n- wrapper.java.command : The command to use when launching a JVM e.g. $JAVA_HOME/bin/java.\n\nFrom version 11 onwards, memory is managed by Websphere Application Server (WAS) and it can be monitored through Websphere Admin Console. WAS has automated garbage collection to reclaim unused memory and to prevent memory leaks. \n\nThe heap's size can also be controlled from the Java command line using the -Xmx and -Xms options (mx is the maximum size of the heap, ms is the initial size). If we wish to do so from the console user interface, we can specify parameters like maximum and initial heap size at the following screen: Servers > Application servers > \"Application Name\" > Java and Process Management > Process Definition > Java Virtual Machine. \n\n"}, {"filename": "swg1PI87963.txt", "chunk_id": "doc_07690_chunk_0002", "text": "  perform the following procedure to set the initial and maximum\n   heap sizes. The procedure applies also to Node Agents and\n   Deployment Managers.\n   1. In the Administrative Console, select the target server\n   to configure.\n   For Application Servers\n   Servers > Server Types > WebSphere application servers\n   Select the server you want to work with -- for\n   example, server1\n   For Node Agents\n   System Administration > Node Agents\n   Select the Node agent you want to work with\n   For Deployment Managers\n   System Administration > Deployment Manager\n   2. On the Configuration tab, under Server Infrastructure,\n   expand Java and Process Management, and click Process\n   Definition.\n   For z/OS the following tasks must be performed for each\n   of the regions (Control, Servant, and Adjunct) as applicable\n   to each Application Server, Node Agent, and Deployment Manager.\n   3. Under the Additional Properties section, click Java\n   Virtual Machine.\n   4. In the Initial heap size field, enter the initial heap size\n   available to the JVM, in megabytes -- for example, 512\n   5. In the Maximum heap size field, enter the maximum heap size\n   available to the JVM, in megabytes -- for example, 1024\n"}, {"filename": "swg21508584.txt", "chunk_id": "doc_15274_chunk_0001", "text": "n’t have 6GB of ram installed – as an example a system only have 4GB of ram, with a few modifications that system will start, but not run as fast. \n\n\nIn the case of, after the installation the application server won’t start because the configured JVM heap settings is greater than the memory resources available. \n\n1. Adjust the test/dev system Xmx/Xms to 3072m/2048m (based off of 4GB of installed RAM memory)\n\nWebSphere 7.0 Administrative console -> Servers -> Server Types > WebSphere Application servers -> click on application server (usually MXServer) -> \nJava and Process Management-> Process Definition -> Java Virtual Machine:\nMaximum Heap size (Xmx): 3072\nInitial Heap size (Xms): 2048\n\n2. Restart application server.\n\n3. If the application server still won’t start and there was another error in the log relating to Xmn:\n\nError in Native_stderr.log:\nJVMJ9VM015W Initialization error for library j9gc24(2): Failed to initialize\nCould not create the Java virtual machine.\nJVMJ9GC019E -Xmn too large for –Xms\n\n"}, {"filename": "nas8N1021871.txt", "chunk_id": "doc_00736_chunk_0000", "text": "Title: IBM Setting Maximum  and Initial  Heap Size in WebSphere Application Server - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How do I set the maximum or initial heap size for WebSphere Application Server? \n\nANSWER\n\n1. log on to the administrative console. For example: systemname:9090/ibm/console/.\n2. Navigate to the Java virtual machine settings. \na. Expand Servers > Server Types and select WebSphere application servers.\nb. Click the name of your server.\nc. Under the Server Infrastructure group, click to expand Java and Process Management.\nd. Click Process Definition.\ne. Under the Additional Properties group, click Java Virtual Machine.\n3. The following are recommendations for 32 bit JVM. \n\n * Initial Heap Size: 512 \n * Maximum Heap Size: 1024\n\n4. Click OK. \n5. In the messages box, click Save. \n6. Click OK. \n7. In the messages box, click Save. \n8. Restart the WebSphere Application Server."}, {"filename": "swg1PK71528.txt", "chunk_id": "doc_08560_chunk_0002", "text": "n should\n   not become significantly slower. The garbage collector\n   should continue to free memory as it is needed by the JVM\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  This may be a WebSphere Application Server configuration\n   issue. Try these settings.\n   \n   1)  Increase the heap size to 1700 or more if you have 3.5GB\n   of memory.  Do not exceed a heap size of 2048.\n   Servers -? Application servers -? Java and process\n   management -? Process definition -? Java virtual machine -?\n   Initial heap size and Maximum heap size.\n   \n   2) Set the GC policy to -Xgcpolicy:gencon\n   Servers -? Application servers -? ?Server name? -? Java and\n   process management -? Process definition -? Java virtual\n   machine -? Generic JVM arguments.\n   \n   It's normal for the java process to grow in size until it\n   reaches the maximum heap size, but the application should\n   not become significantly slower. The garbage collector\n   should continue to free memory as it is needed by the JVM\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg1PK39891.txt", "chunk_id": "doc_08256_chunk_0003", "text": "            *\n   ****************************************************************\n   * PROBLEM DESCRIPTION: The JVM Initial or Maximum heap size    *\n   *                      couldn't be set more than 2 GB.         *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   After upgrade from Service Pack 6.1.0.2 to 6.1.0.3, it is not\n   possible to set the JVM heap size bigger than 2GB via the\n   Administrative Console in the fields :\n   \"Maximum heap size\"/\"Initial Heap Size\"\n   \n   Navigate through the path:\n   Application servers > server_name >\n   Process Definition > Environment Entries >\n   Java Virtual Machine.\n   \n   When trying to put a value more than 2048, the following error\n   message is displayed:\n   \"Maximum/Initial Heap Size should be an integer in the range\n   0 through 2048.\"\n   \n   The validation rule of disallowing a heap size greater than\n   2048 is applicable to Z/OS only. It was incorrectly applied to\n   all platforms.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21596474.txt", "chunk_id": "doc_16624_chunk_0001", "text": "dir}/etc/jvm.options\n       \n       This will take effect for all JVMs that do not have a locally defined jvm.options file.\n       \n       \n    \n    \n 4. Restart the server to enable changes. You can verify that the new settings have been picked up after the restart by following the steps at the below link to generate a javacore.\n    \n    http://www-01.ibm.com/support/docview.wss?uid=swg21597830 [http://www-01.ibm.com/support/docview.wss?uid=swg21597830]\n    \n    You may then inspect the javacore to ensure the changes were successful.\n\n\n\n\n\n\nCommon settings \n * Setting the Java heap:\n   You can specify the minimum and maximum Java heap sizes as follows:\n   \n   Minimum Java Heap: -Xms<value in MB>m\n   Maximum Java Heap: -Xmx<value in MB>m\n   \n   For example:\n   \n   -Xms128m //This would configure a 128MB minimum Java heap\n   -Xmx512m //This would configure a 512MB maximum Java heap\n   \n   Note: Heap settings will vary based on the needs of the application and demand of the workload.\n\n"}]}, {"id": "TRAIN_Q392", "question": "KD4SoapHeaderV2 in WebServices messages\n\nThe following header appears in the WebServices messages after configuring ITCAM for SOA DC:\n\n<soapenv:Header> <KD4NS:KD4SoapHeaderV2 xmlns:KD4NS=\"www.ibm.com/KD4Soap\" >AFIAAgAkYzViZmRmOTUtYmY3Mi0zNGY1LWExNDItNTNlMGI3MzUxNmRmACRjYTdmZTQwYi1 mNDFlLTMxNzUtYjExYi04MzY1MmMyMTliNjUABA==<\/KD4NS:KD4SoapHeaderV2> <\/soapenv:Header>\nIs it possible to remove the KD4SoapHeaderV2 header appearing in the WebServices messages after that ITCAM for SOA monitoring has been enabled?", "answer": "Yes, it is possible to remove the KD4SoapHeaderV2 header appearing in the Web Services messages after enabling ITCAM for SOA DC. The problem occurs because the header is added only if there is a child element for Header under the SOAP envelope for JAXWS implementation of Axis2 used by WebSphere. To resolve this, one needs to either add the header manually or configure the appropriate mediation primitive in the SCA component to nullify the value of the SOAP header before sending the message back to the web service client.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg1PI41634.txt", "chunk_id": "doc_07012_chunk_0000", "text": "Title: IBM PI41634: ITCAM SOAP HEADER ELEMENTS (KD4,TT CORRELATOR) ARE NOT ADDED IF SOAPENV:HEADER ELEMENT IS NOT PRESENT IN THE ENVELOPE. - United States\n\nText:\n SUBSCRIBE TO THIS APAR\nBy subscribing, you receive periodic emails alerting you to the status of the APAR, along with a link to the fix after it becomes available. You can track this item individually or track all items by product.\n\nNotify me when this APAR changes.\n\nNotify me when an APAR for this component changes.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  ITCAM adds its SOAP headers (ITCAMTOOLKITSyncSoapHeader,\n   ITCAMCorrelator, KD4SoapHeaderV2) only when there is a child\n   element for Header under the SOAP envelope for JAXWS\n   implementation of Axis2 that is used by WebSphere.  If the\n   header element is not added or\n   stripped out by other handlers in the chain, then the elements\n   are not added.  This prevents the linking between multiple\n   systems through which the request flows (WAS->WAS, WAS->DP,\n   etc.) in SOA, Transaction Tracking or even in the Managing\n   server GPS functionality.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  l3 has a local fix\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg1IC56835.txt", "chunk_id": "doc_01496_chunk_0002", "text": "T PREVENT THE HEADER FROM BEING RETURNED TO THE INVOKING\n   SERVICE.\n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n\nPROBLEM CONCLUSION\n\nTEMPORARY FIX\n\nCOMMENTS\n * IF YOU EXPERIENCE THIS ISSUE, AND REQUIRE TO REMOVE THE\n   INVOKING MESSAGE'S SOAP HEADER, THEN YOU SHOULD SET THE VALUE OF\n   THE SOAP HEADER TO BE NULL IN THE SCA COMPONENT. FOR EXAMPLE,\n   IF YOU ARE USING AN MFC, YOU COULD INSERT A CUSTOM MEDIATION\n   PRIMITIVE INTO THE RESPONSE FLOW, WITH CODE OF THE FOLLOWING\n   FORM TO NULL THE VALUE OF THE FIRST SOAP HEADER WITHIN THE SMO:\n   \n   COM.IBM.WEBSPHERE.SIBX.SMOBO.SOAPHEADERTYPE SOAPHEADER =\n   (COM.IBM.WEBSPHERE.SIBX.SMOBO.SOAPHEADERTYPE)\n   SMO.GETHEADERS().GETSOAPHEADER().GET(0);\n   SOAPHEADER.SETVALUE(NULL);\n   OUT.FIRE(SMO);\n   \n   THE RESULT OF THIS WILL BE THAT THE RESPONSE MESSAGE WHICH IS\n   PASSED BACK TO THE WEB SERVICE CLIENT IN THE ABOVE EXAMPLE\n   WILL NOT CONTAIN THE NULLED SOAP HEADER. IF THERE WAS MORE\n   THAN ONE SOAP HEADER, THEN EACH ONE WOULD NEED TO BE NULLED.\n   \n   NOTE THAT THE FOLLOWING SCENARIO, EVEN IF THE SOAP HEADER\n   VALUE IS NULLED OUT IN MFC2, IT WILL STILL BE SEEN IN MFC1,\n   AND SUBSEQUENTLY WILL STILL BE PASSED BACK TO THE WEB SERVICE\n   CLIENT.\n   \n"}, {"filename": "swg21662577.txt", "chunk_id": "doc_18895_chunk_0000", "text": "Title: IBM ITCAM for SOA v7.1.1 FP3 WMB Data Collector - SOA Header - United States\n\nText:\nCAMSOAMBDC CAMSOAALL TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n How are the SOA message headers removed completely from the WMB Message flows? \n\nSYMPTOM\nAfter disabling, recreating the message flows, and un-installing the SOA D4 agent, running with TT Data Collector, the SOA headers are still present in the WMB Message flows.\n\n\nRESOLVING THE PROBLEM\n1. Drop the entire WMB flow. Install a new fresh flow. Confirm SOA Agent is not installed at all in their system.\n\n2. Checked original SOA v7.2 FP1 install and configuration directories make sure no remaining files present.\n\n3. Enabled all KK3 UserExits on WMB Flows and Restarted WMB.\nNavigate to /opt/IBM/ITM_TT directory showing in WMB environment variables\nKKD3.dc.properties file there shows KD4 integration set to false\n‘default.kd4.enabled=false’ \n\n4. Check for active SOA logs in /opt/IBM/ITM_TT KD4 log directories\n\n5. From /var/mqsi/common/profiles/KK3UserExitProfile.sh, \nMQSI Exit Path set to /opt/IBM/IBM_TT\n\n6. Stop/Start WMB. \n\n7. Result should be, No SOA in the header in the message flow.\n\n\n \n\nPRODUCT ALIAS/SYNONYM\n ITCAM for SOA"}, {"filename": "swg1PI48106.txt", "chunk_id": "doc_07099_chunk_0001", "text": " reason), ITCAM should create the header\n   block and insert the KD4 header.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  See L2 support\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   USERS AFFECTED:\n   \n   ITCAM for Transaction Tracking for WebSphere environments where\n   ITCAM for SOA Data Collector is present.\n   \n   ****************************************************************\n   PROBLEM DESCRIPTION:\n   \n   1. Web service requests from clients that do not have ITCAM for\n   WAS (like DataPower) does not generate the correct Transaction\n   tracking events STARTED_INBOUND and OUTBOUND_FINISHED.  The SFID\n   and SFID Correlation IDs are absent from these events that\n   prevents the proper stitching between these systems.\n   \n   2. If the SOAP response does not have a header (not created or\n   stripped out for some reason), ITCAM should create the header\n   block and insert the KD4 header.\n   \n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  The fix for this APAR is contained in the following maintenance\n   release:\n   \n    | interim fix | 7.2.0.0-TIV-ITCAM_DC-IF0013\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\n"}]}, {"id": "TRAIN_Q410", "question": "how to disable clickjacking at ICN?\n\nWe need to secure IBM Content navigator 2.0.3 Fixpack (FileNet P8 5.2.1 FP5, OS AIX 7.1) on our Production environment against malicious activity in the following ways:\n\nDisable clickjacking i.e. it was observed that the server didn't return an X-Frame-Options header. The X-Frame-Options HTTP response header can be used to indicate whether or not a browser should be allowed to render", "answer": "To disable clickjacking in IBM Content Navigator 2.0.3 Fixpack (FileNet P8 5.2.1 FP5, OS AIX 7.1), follow these steps:\n\n1. Ensure the headers module is loaded in your Apache configuration file (httpd.conf). Add the following line to enable it:\n   ```\n   LoadModule headers_module modules/mod_headers.so\n   ```\n\n2. Append the following header to your Apache configuration file to enforce the X-Frame-Options policy:\n   ```\n   Header always append X-Frame-Options DENY\n   ```\n\n3. Restart your Apache web server after making these changes.\n\nBy implementing these configurations, you will ensure that the server returns the X-Frame-Options header, preventing potential clickjacking vulnerabilities", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg21988481.txt", "chunk_id": "doc_23884_chunk_0000", "text": "Title: IBM Clickjacking through X-Frame-Option Header - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n After a security scan on the Inspector or webreport UI, our scan revealed a vulnerability to Clickjacking by using the X-Frame-Options header. The guidance was along the lines of: \"To protect against Clickjacking, it is recommended that any page that contains forms which require a user to enter sensitive information use the X-Frame-Options header set to either DENY or SAMEORIGIN.\" \n\nCAUSE\nThere are three possible values for the X-Frame-Options header:\n1. DENY, which prevents any domain from framing the content. The \"DENY\" setting is recommended unless a specific need has been identified for framing.\n2. SAMEORIGIN, which only allows the current site to frame the content.\n3. ALLOW-FROM uri, which permits the specified 'uri' to frame this page. (e.g., ALLOW-FROM http://www.example.com [http://www.example.com]) Check Limitations Below this will fail open if the browser does not support it.\n\n"}, {"filename": "swg21642477.txt", "chunk_id": "doc_18160_chunk_0000", "text": "Title: IBM Frameable Content : Potential Clickjacking - United States\n\nText:\nClickjacking TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The web server does not appear to prevent the hosted application being loaded by a 3rd party site within an iframe. As such, the web applications hosted on the server are open to clickjacking style attacks. \n\nCAUSE\ndisplaying the TSAM UI in a frame within another application is working as designed. \n\nWhy? \n\nTSAM UI originally had methods to prevent it from being displayed within a frame. However, many clients wanted to integrate the ootb UI with their own \ncustom UI and complained about that. Therefore, the behavior was changed \nagain for the sake of better integration capabilities.\n\n\nRESOLVING THE PROBLEM\nIf the client decides that they do not want to integrate the UI and run \n\nit stand-alone, they can configure their IHS so that the UI may not be displayed in a frame. \nHow? \nIn httpd.conf add the line \n\nHeader always append X-Frame-Options DENY \n\nto the configuration of your host or vhost. \nFor this to work you need to load the headers module, which is not loaded by default. \nTo load it, uncomment the line \n\n#LoadModule headers_module modules/mod_headers.so \n\nAnd restart the webserver. \n\n"}]}, {"id": "TRAIN_Q419", "question": "Does double the number of instances equal double through put in IIB / WMB?\n\nIf I double the number of instances of an IBM Integration Bus (IIB) or WebSphere Message Broker (WMB) flow should I get double the through put?", "answer": "Yes, doubling the number of instances of an IBM Integration Bus (IIB) or WebSphere Message Broker (WMB) flow should theoretically result in double the throughput if each instance is designed with sufficient resources and load balancing capabilities. However, actual throughput will depend on various factors including system capacity, network bandwidth, hardware specifications, and effective resource allocation across all instances. It's important to monitor and adjust configurations based on observed performance metrics to ensure optimal throughput.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg21137319.txt", "chunk_id": "doc_10675_chunk_0000", "text": "Title: IBM How additional message flow instances scale for performance - United States\n\nText:\nMQIINFO TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Additional IBM Integration Bus (IIB) or WebSphere Message Broker (WMB) message flow instances can be scaled to improve performance. \n\nRESOLVING THE PROBLEM\nEach message flow in IIB/WMB can be configured for a number of instances defined by the number of concurrent threads assigned to the message flow. These message flows can be run in a single broker on a number of different execution groups. The number of execution groups, which may vary depending on the number of processors in the physical machine where the broker is running, is also a factor in the scaling of the solution. \n\nAdditionally multiple brokers can be defined in a WebSphere MQ clustering environment to further provide scaling. \nWhen you design your broker environment, it would be a good idea to review the following documents as part of your performance planning:\nPerformance planning [http://www.ibm.com/support/knowledgecenter/SSMKHH_9.0.0/com.ibm.etools.mft.doc/ae24000_.htm?cp=SSMKHH_9.0.0%2F1-5-3-3]\nWMB performance reports [http://www.ibm.com/support/docview.wss?uid=swg27007150]\n"}]}, {"id": "TRAIN_Q436", "question": "Can you delete temporary data that is generated by IBM Business Process Manager?\n\nIn the OS temporary directories, there are many files generated for BPM. These files are created on the following operations:\ncreate TWX snapshot for export\naccess a managed asset during process execution\ncreate offline install package\nThe following temporary directories are used for storing temp files:Operating system temporary directory:/tmp (Linux)c:\\windows\\temp (Windows)\n\nHow can these files be cleaned up?", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "ANSWER_NO", "documents": [{"filename": "swg1JR45163.txt", "chunk_id": "doc_05545_chunk_0000", "text": "Title: IBM JR45163: SRVC - BPM GENERATES FILES IN TEMPORARY DIRECTORIES THAT ARE NOT CLEANED UP - United States\n\nText:\n SUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS FIXED IF NEXT.\n    \n   \n   \n\nERROR DESCRIPTION\n *  BPM uses three temporary directories for storing temp files.\n   /tmp\n       /opt/ibm/BPM/v7.5/profiles/ProcCtr01/temp/com.ibm.bpm.fds\n       /opt/ibm/BPM/v7.5/profiles/ProcCtr01/wstemp\n   The WSTEMP folder has some auto-clean up but manual clean up is\n   sometimes needed; refer to:\n   -\n   https://developer.ibm.com/answers/questions/168151/content-and-m [https://developer.ibm.com/answers/questions/168151/content-and-m]\n   aintenance-of-the-wstemp-directory-fo/\n   -\n   https://www.ibm.com/developerworks/community/blogs/aimsupport/en [https://www.ibm.com/developerworks/community/blogs/aimsupport/en]\n   try/deleting_temporary_files_in_websphere_application_server\n   For the OS temporary and BPM temp directory. These are not\n   cleaned up from BPM.\n   The following files can be found in the directories:\n   -application imports (twx, saved as zip)\n   -application exports (tw saved as zip)\n   -managed asset files - CSS, JAR, png, etc. These gnenerally do\n   not have extensions\n"}, {"filename": "swg1JR54367.txt", "chunk_id": "doc_05861_chunk_0000", "text": "Title: IBM JR54367: TEMP FILES ARE NOT DELETED AFTER YOU DEPLOY PROCESS APPLICATIONS ONLINE - United States\n\nText:\n  FIXES ARE AVAILABLE\nVersion 8.5.0 Fix Pack 2 for the IBM Business Process Manager products [http://www-01.ibm.com/support/docview.wss?uid=swg24040683]\nVersion 8.5 Refresh Pack 7 for the IBM Business Process Manager products [http://www-01.ibm.com/support/docview.wss?uid=swg24041575]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  When you deploy process apps from IBM Process Center, many\n   temporary files are generated in the /tmp or %TEMP% folder.\n   After several attempts to deploy process apps, the /tmp or\n   %TEMP% folder is filled with temp files. These temp files are\n   not cleaned up automatically.\n   \n   PRODUCTS AFFECTED\n   IBM Business Process Manager (BPM) Advanced\n   IBM BPM Standard\n   IBM BPM Express\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Delete files from the /tmp or %TEMP% folder.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  No additional information is available.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg1JR48411.txt", "chunk_id": "doc_05638_chunk_0000", "text": "Title: IBM JR48411: TEMPORARY FILES IN USER TEMP DIRECTORY ARE NOT ALWAYS DELETED WHEN UPLOADING DOCUMENT IN DOCUMENT LIST - United States\n\nText:\n  A FIX IS AVAILABLE\nDownload Version 8.0.1 Fix Pack 3 for the IBM Business Process Manager products [http://www-01.ibm.com/support/docview.wss?uid=swg24037734]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Monitoring the file creation and noticed in my user temp\n   directory, files with this name pattern are created:\n   \n   upload_*.tmp\n   \n   These files do not get deleted.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  N/A\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ==>The uploaded temporary file is not deleted after it was\n   processed.\n   \n   EDITIONS AFFECTED:\n   ==>IBM Business Process Manager (BPM) V8.0.1.1 and V8.0.1.2\n   Advanced, Standard, and Express\n   \n   PROBLEM DETAILED DESCRIPTION:\n   ==>When you create Enterprise Content Management (ECM) documents\n   using the Document List Coach view, you notice that temporary\n   files that are named upload
