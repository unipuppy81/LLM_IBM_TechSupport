_*.tmp are created in the temp\n   directory (for example, C:\\Windows\\Temp) for each uploaded file.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21416015.txt", "chunk_id": "doc_13240_chunk_0000", "text": "Title: IBM About IBM Rational DOORS local data temporary directories - United States\n\nText:\nlocal data directories; Temp TECHNOTE (FAQ)\n\nQUESTION\n Can you delete the directories in the Rational DOORS temp area with the prefix \"LD_\" ? \n\nCAUSE\nThere are a number of directories in the local data area; some of these are empty, other contain subdirectories or files.\n\nANSWER\nNever remove any temporary files or directories when the DOORS client is running. As long as there is no DOORS client running, these directories are safe for deletion.\n\n\nRational DOORS uses a local data area for temporary file storage and use. These directories and files are created and used during a DOORS client session.\n\n\nBelow is a sample directory list tree: \n\nC:\\Documents and Settings\\Administrator\\Application Data\\Telelogic\\DOORS\\Temp \n\n * \n * Telelogic\n *  \n   DOORS  * \n    * Temp\n    *  \n      LD_0a07252  * \n       * cache_36677@IBM-613E51529A5_1261486378\n       *  \n         v6data  * \n          * 20\n          *  \n            m00000024.mod  * \n             * current.ver"}, {"filename": "swg1JR47686.txt", "chunk_id": "doc_05613_chunk_0002", "text": "y folder    *\n   *                      and the contents are parsed. After      *\n   *                      the import, export or install           *\n   *                      operation are completed, the            *\n   *                      temporary content remains on the file   *\n   *                      system.  On Linux machine, the          *\n   *                      temporary folder is  /tmp.\n   *                      Windows machine, the temporary folder   *\n   *                      is the same as %TEMP% system variable   *\n   *                      defined.                                *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   IBM BPM does not remove temporary content after a snapshot has\n   been imported, exported, or installed.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21338680.txt", "chunk_id": "doc_12264_chunk_0000", "text": "Title: IBM What are the files and directories located in the ../cognos/temp directory used for ? - United States\n\nText:\ntemporary space temp files disk disc TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n What are the files and directories located in the temp directory used for? \n\nRESOLVING THE PROBLEM\nBy default IBM Cognos stores temporary files created in operation in the ../temp directory of the installation.\n\n\nThe amount of space required depends on several factors, including the number and the type of reports that are created and run by a user, and how many users are on the system. \n\nThe files created are the UDA file and the CCLVPage file as the main ones for a report running in Windows or UNIX. \n\nThe UDA file is the file with the data that is retrieved from the Database, and is the data workfile. \n\nThe CCLVPage file is the file that contains the report output, in the format specified by the report. \n\nThe dmbTempxxxxx.dmc file is the file that holds \"cube\" data for the report, and is also a temporary file that gets created during the Report Run. \n\nThe Axisxxxaxis file is created by Event Studio. This file is not removed by the Event Studio. It has to be removed manually. \n\n"}, {"filename": "swg21423485.txt", "chunk_id": "doc_13412_chunk_0001", "text": "rm periodic cleanup of old DataStage files in these directories to prevent performance problems relating to the number of files in the directories. \n\nDataStage writes temporary files to the following locations. Normally these files are cleaned up when the job ends, though jobs which aborted may leave behind files. Check these temporary directories for old DataStage files which can be removed, or a large number of files in general (since other programs also write to these directories). \n\nThe directories are pointed to by the following environment variables (you can refer to the job log of any DataStage job to determine the value of these variables at job run time): \n\n * TEMP \n * TMPDIR \n * TMP \n\n\nOn Unix systems, also check location /tmp \n\nAdditionally, DataStage writes non-temporary files to the following locations which will not automatically be cleaned up. You can remove DataStage files from these directories that are older than longest job run time or older than the last DataStage engine restart. Unless you have very long running jobs or \"always-on\" web service jobs, it is generally safe to remove files more than 2 days old from these directories:  * The &PH& directory within each project directory. \n"}, {"filename": "swg21130325.txt", "chunk_id": "doc_10651_chunk_0000", "text": "Title: IBM About temporary syncs files and ClearCase MultiSite - United States\n\nText:\nsyncs; temporary; lockfiles; 1130325 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This technote provides a brief overview of why syncs files may exist within a temporary directory after performing a syncreplica with IBM® Rational® ClearCase® MultiSite®. \n\nRESOLVING THE PROBLEM\n \n\nWhat are these syncs files? \n\nThese files are created as a result of a syncreplica operation. These files are used as temporary place holders while ClearCase writes the cleartext and checks the data before importing. They are created in the form of syncs<pid> where the <pid> is the process id number of the pending import operation related to that packet. \n\n\nWhere are these files typically found? \n\nClearCase creates syncs<pid> files in a temporary directory. \n\nOn UNIX® and Linux® operating systems this directory is typically /var/tmp \n\nOn Microsoft® Windows® platforms, this directory is the directory specified by TEMP or TMP environment variable (default is \"%USERPROFILE%\\Local Settings\\TEMP\") . \n\n \n\nWhy are these files not removed? \n\nClearCase normally deletes these files after the syncreplica operation is finished. \n\n"}, {"filename": "swg21415507.txt", "chunk_id": "doc_13236_chunk_0000", "text": "Title: IBM On the Controller server C:\\Windows\\Temp is filling up with files - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Customer noticing that the 'TEMP' folder (on the Controller application server) is filling up with random files.\n\nSpecifically, when the users perform data imports (via \"Transfer - External Data - Import\", such as importing a flat file via an import specification) the Controller system is creating some temporary files. \n\nUnfortunately these files are not being deleted (cleaned up) after the import has completed. \n\nSYMPTOM\nOn the Controller application server, inside the Windows temp folder (C:\\Windows\\temp) there are many files with the following extensions: \n\n *  .trz .tr1 .iml .lg1 .lg2 .lg3 .lg4 rad*****.tmp \n\n\nCAUSE\nDefect (reference APAR PM55971) in Controller.\n\nDIAGNOSING THE PROBLEM\nOpen the folder C:\\Windows\\TEMP on the Controller application server.\n\n\n\nRESOLVING THE PROBLEM\nFix: \n\nUpgrade to Controller 10.1.1 (10.1.1305) or later. \n\n \n\nWorkaround: \n\nCreate a script to delete existing temporary files, and run it (via Windows Task Scheduler) to run periodically. \n\n * TIP: Contact IBM Support for more details.\n\n"}, {"filename": "swg21524285.txt", "chunk_id": "doc_15505_chunk_0002", "text": "erify that TEMP exist. \nIf any of the TEMP directories do not exist as defined within Windows Environmental Variables, then they must be recreated. \n\n4. If the hard drives have a large amount of free space, and the TEMP directories exist as defined within Windows Environmental Variables, then verify that directories do not contain a large number of files. If a large number of file exists (even if the files are 0kb in size) in any of the TEMP directories, delete all or most of the files as possible.\n\nOnce the TEMP directories have been cleaned out and adequate space on the hard drives has been made, test the process that generated the error."}]}, {"id": "TRAIN_Q482", "question": "Is there a limit to the number of items that can be listed within an \"in\" list as part of a where clause?\n\nIs there a limit to the number of items that can be listed within an \"in\" list as part of a where clause?", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "GENERATOR_ABSTAINED", "documents": [{"filename": "swg22009834.txt", "chunk_id": "doc_25636_chunk_0000", "text": "Title: IBM limit to the number of values within 'in list' as part of a where clause - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n Is there a limit to the number of items that can be listed within an \"in\" list as part of a where clause?\n\n\nANSWER\nNo, there is not a limit.\nThe only limit with large \"in list\" statements would need large memory to compile the query. If the query is too complex, you can potentially run out of memory."}, {"filename": "swg21698950.txt", "chunk_id": "doc_21000_chunk_0000", "text": "Title: IBM Is there a limit to the number of items that can be listed within an \"in\" list as part of a where clause? - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Is there a limit to the number of items that can be listed within an \"in\" list as part of a where clause? \n\nCAUSE\nEvery time the query optimizer finds a \"(NOT) IN\" statement in the query, a decision must be made:\nOption A: Evaluate the condition sequentially for every member of the IN-list, or \nOption B: create a temporal virtual table from this list and use JOIN logic for evaluation. \n\nIf the amount of members in the IN-list is smaller than the value of INLIST_THRESHOLD, then option A is used. \nIf the amount of members in the IN-list is equal or bigger than the value of INLIST_THRESHOLD, then option B is used.\n\n\nENVIRONMENT\nAny IBM PureData System for Analytics with any NPS Release\n\n\n\nRESOLVING THE PROBLEM\nThe short answer is no limit.\n\n\nBy default we create a virtual table for any \"in list\" with more than 5 values.\n\n"}, {"filename": "swg21341684.txt", "chunk_id": "doc_12309_chunk_0000", "text": "Title: IBM How To: Limit the number of rows displayed in a list - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This document describes how to limit the number of entries displayed in a list. \n\nExample: X is a number (for example 10) In a \"Top X\" report, there is a tie for Xth place. This results in two entries having \"X\" as their rank, so the filter [Rank] <= X will actually return eleven entries. \n\nThe technique described below will remove one of these entries. The entry removed depends on the order in which the data is returned from the data source. \n\nRESOLVING THE PROBLEM\nUse the running-count function to create a data item that increments at every row, and filter on that running-count.\n\nSteps:1) Add a data item to the query: running-count([data item to limit]). \n\nIf there are multiple sets of data being ranked, the running-count will need to reflect that instead:\n\nrunning-count([data item] for [grouping data item])\n\n2) Add a filter to the query:\n\n[running count data item] <= 10\n\nAlternate solution: \n\n1) In Query 1, add every data item you want in the list report\n\n2) In the same query, create the query calculation rank.\n\nrank([dataitem] for report)\n\n3) Go to the Query explorer and click on Queries.\n\n"}, {"filename": "swg1IT11555.txt", "chunk_id": "doc_02654_chunk_0001", "text": "USION\n *  Description of fix:  Modified the query to use multiple\n   IN(.....) clauses , if needed, each containing 1000 items.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n *  Description of issue: The following SQL error occurred when\n   running a \"Netmap Connections Summary Report\": ORA-01795:\n   maximum number of expressions in a list is 1000.  This occurs if\n    the query contains more 1000 items in an IN(......) clause when\n    using an Oracle database.\n   \n   Description of fix:  Modified the query to use multiple\n   IN(.....) clauses , if needed, each containing 1000 items.\n   \n   \n    \n   \n   \n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   IT11555\n   \n   \n * REPORTED COMPONENT NAME\n   STR CONTROL CEN\n   \n   \n * REPORTED COMPONENT ID\n   5725D0200\n   \n   \n * REPORTED RELEASE\n   542\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n   2015-10-02\n   \n   \n * CLOSED DATE\n   2015-10-12\n   \n   \n * LAST MODIFIED DATE\n   2015-10-12\n   \n   \n\n * APAR IS SYSROUTED FROM ONE OR MORE OF THE FOLLOWING:\n   \n   \n   \n * APAR IS SYSROUTED TO ONE OR MORE OF THE FOLLOWING:\n   \n   \n   \n\n"}, {"filename": "swg1HD50577.txt", "chunk_id": "doc_01053_chunk_0001", "text": " maximum number\n   of expressions in a list is 1000.\n   The problem comes when trying to run the\n   command on a specific CATPart, stored in VPM as a\n   DOCCAD. This CATPart has about 80 publications\n   and 40 external references.\n   \n   .\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  THIS PROBLEM WILL BE FIXED ON ENOVIA VPM 1.5\n   PTF37 (HD53533).\n   .\n   Incident Diagnosis\n   The code has been rewritten to accept large data.\n   ORACLE cannot support actually more than 1000\n   items in a list ( select in (?,?,...,?,?) ) and more\n   than 250 items in a complex list (select .. from ..\n   where ((coid=? and compid=?) and ... and (coid=?\n   and compid=?)))\n   .\n   The treatment is automatically switched to a \"lot\n   treatment\".\n   .\n   Answer and By-Pass\n   NONE\n   \n   .\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   HD50577\n   \n   \n * REPORTED COMPONENT NAME\n   ENOVIA VPM SOLA\n   \n   \n * REPORTED COMPONENT ID\n   569104900\n   \n   \n * REPORTED RELEASE\n   150\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n   2006-03-08\n   \n   \n * CLOSED DATE\n   2006-06-23\n   \n   \n * LAST MODIFIED DATE\n   2006-06-23\n"}, {"filename": "swg21336526.txt", "chunk_id": "doc_12244_chunk_0000", "text": "Title: IBM ORA-01795 maximum number of expressions in a list is 254 - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Unable to select all items in a prompt. \n\nSYMPTOM\nORA-01795: maximum number of expressions in a list is 254\n\nThis error occurs when you are selecting all items in a prompt.\n\nORA-00920--Invalid relational operator\n\nCause: A search condition was entered with an invalid or missing relational operator.\nAction: Include a valid relational operator such as =, !=, ^=, <>, >, <, >=, <=, ALL, ANY, [NOT] BETWEEN, EXISTS, [NOT] IN, IS [NOT] NULL, or [NOT] LIKE in the condition.\n\n\nRESOLVING THE PROBLEM\nFor error ORA-00902:\nThis is a limitation of Oracle that is fixed in Oracle 8.0 and above. In pre-8.0 versions you cannot use more than 254 values with the IN operator. Contact Oracle to get a patch or a release that doesn't have this limit. Please note that IBM Cognos ReportNet and IBM Cognos 8 BI do not support Oracle pre-8.1 releases.\n\nOtherwise, within Impromptu, create a new Type-in prompt to select the 'ALL' value or individual data items :\n\nEXAMPLE:\n\n"}, {"filename": "swg21315664.txt", "chunk_id": "doc_11988_chunk_0002", "text": "y simplified assumptions) \nbe rewritten as \n\"man | manager | managers | managerial | managed\", \ni.e. into a compound search term with 5 components. \n\nAs your index grows, and consequently also your dictionary grows, the \nlist of such disjunctions can become quite large, and require large \namounts of memory to rewrite and execute the query. \n\nTo limit the memory requirements, a default 'expansion limit' applies, \nthat limits the number of candidate matches in the expanded expression. \nNote that in the above example, the candidates were not sorted alphabe- \ntically, and in general, you cannot rely on them being in any particular \norder. \n\nIf you have more than expansion limit many candidates in your index, \nthey will never be even considered for the actual search. This can lead \nto unexpected results when the word list is very large, and the \nexpansion limit relatively low. \n\nThe default expansion limit is 2000 (match candidates). \n\n"}, {"filename": "swg1PI43232.txt", "chunk_id": "doc_07041_chunk_0001", "text": "\n   This is caused when you have a query which is using a list with\n   more than 1000 elements as part of its query.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   * All                                                          *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * Using an Oracle database with IBM UrbanCode Deploy, you will *\n   * see                                                          *\n   * this error:                                                  *\n   * Caused by:                                                   *\n   * java.sql.SQLSyntaxErrorException: ORA-01795: maximum number  *\n   * of                                                           *\n   * expressions in a list is 1000  when running some reports, if *\n   * the                                                          *\n   * number of applications on a server is greater than 1000.     *\n   *                                                              *\n"}, {"filename": "swg1LI75512.txt", "chunk_id": "doc_06060_chunk_0002", "text": "d:;\n   nested exception is:\n    java.sql.SQLException: ORA-01795: maximum number of expressions\n   in a list is 1000\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  USERS AFFECTED:\n   WebSphere Commerce users on v6.0 and v7.0 who have shoppers\n   entitled to more than 1000 price lists.\n   \n   PROBLEM ABSTRACT:\n   The SQL statement in finder\n   findEffectiveOffersByTimestampCatentriesPredicateOffersStoreAndP\n   riceLists contains an IN condition clause, which causes\n   ORA-01795 exception when more than 1000 price list identifiers\n   are in the IN clause.\n   \n   BUSINESS IMPACT:\n   Exception would be thrown when retrieving price from more than\n   1000 price lists.\n   \n   RECOMMENDATION:\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Installing Interim Fix LI75512 resolves the issue and WebSphere\n   Commerce will allow the price to be fetched from more than 1000\n   price lists.\n   \n   -------------------------------------------------------------\n   The latest available maintenance information can be obtained\n   from the Recommended Fixes for WebSphere Commerce technote:\n   http://www.ibm.com/support/docview.wss?rs=3046&uid=swg21261296 [http://www.ibm.com/support/docview.wss?rs=3046&uid=swg21261296]\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21634811.txt", "chunk_id": "doc_17853_chunk_0003", "text": "ListOfString example. For single-valued properties the maximum will be slightly higher (2729) if there are no additional columns added to the index.\n\nHowever in practice, for many languages, 3 bytes per character for all string characters will not be required. It is up to the site if the character limit can be relaxed. There would be an error trying to insert too long of a value in terms of the byte storage requirements, if the generated column is not large enough to hold a lot of characters requiring multiple bytes of storage.\n\n3. There are restrictions on when an index can be used. For example on DB2, the LIKE operator will not allow index use in a query plan when using FCIS. Refer to the following technote for information on that, as well as additional performance-critical information when performing a multi-valued property search:\n\nhttps://www.ibm.com/support/docview.wss?uid=swg21634810 [https://www.ibm.com/support/docview.wss?uid=swg21634810]\n\nReference:\nhttp://pic.dhe.ibm.com/infocenter/p8docs/v5r2m0/topic/com.ibm.p8.ce.admin.tasks.doc/properties/pr_create_db_column_indexes.htm [http://pic.dhe.ibm.com/infocenter/p8docs/v5r2m0/topic/com.ibm.p8.ce.admin.tasks.doc/properties/pr_create_db_column_indexes.htm]\n\n\n"}]}, {"id": "TRAIN_Q493", "question": "Help with Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition (CVE-2017-1741).\n\nI need to understand details regarding Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition (CVE-2017-1741) Where can I find this information?", "answer": "To find more detailed information on the security vulnerability in IBM WebSphere Application Server that affects IBM Tivoli Network Manager IP Edition, you should refer to the following sources:\n\n1. **Security Bulletin**: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition.\n   - Source: swg2201331313.txt\n   - Content: This bulletin provides comprehensive details including summary, vulnerability details, affected products and versions, remediation/fixes, and links to specific security bulletins like \"Potential Privilege Escalation in WebSphere Application Server Admin Console (CVE-2017-1731)\" and \"Information Disclosure", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg22013313.txt", "chunk_id": "doc_25967_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition. - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped with IBM Tivoli Network Manager IP Edition versions 3.9 and 4.1.1; IBM WebSphere Application Server is a required product for IBM Tivoli Network Manager IP Edition version 4.2. Information about a security vulnerability affecting IBM WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Potential Privilege Escalation in WebSphere Application Server Admin Console (CVE-2017-1731) [http://www-01.ibm.com/support/docview.wss?uid=swg22012345] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Tivoli Network Manager 3.9, 4.1.1 and 4.2 \n\n"}, {"filename": "ibm10717345.txt", "chunk_id": "doc_00027_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition (CVE-2018-1621). - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\nIBM WebSphere Application Server is shipped with IBM Tivoli Network Manager IP Edition versions 3.9 and 4.1.1; IBM WebSphere Application Server is a required product for IBM Tivoli Network Manager IP Edition version 4.2. Information about a security vulnerability affecting IBM WebSphere Application Server has been published in a security bulletin.\n\nVULNERABILITY DETAILS\nPlease consult the security bulletinInformation Disclosure in WebSphere Application Server [http://www-01.ibm.com/support/docview.wss?uid=swg22016821]for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Tivoli Network Manager IP Edition 3.9, 4.1.1 and 4.2\n\nREMEDIATION/FIXES\n"}, {"filename": "swg22013044.txt", "chunk_id": "doc_25933_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition. - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped with IBM Tivoli Network Manager IP Edition versions 3.9 and 4.1.1; IBM WebSphere Application Server is a required product for IBM Tivoli Network Manager IP Edition version 4.2. Information about a security vulnerability affecting IBM HTTP Server, a product which is a component in IBM WebSphere Application Server, has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Security Vulnerabilities in IBM HTTP Server (CVE-2017-9798, CVE-2017-12618) [http://www-01.ibm.com/support/docview.wss?uid=swg22009782] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Tivoli Network Manager IP Edition 3.9, 4.1.1 and 4.2 \n\n"}, {"filename": "swg22016123.txt", "chunk_id": "doc_26283_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition (CVE-2017-1743). - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped with IBM Tivoli Network Manager IP Edition versions 3.9 and 4.1.1; IBM WebSphere Application Server is a required product for IBM Tivoli Network Manager IP Edition version 4.2. Information about a security vulnerability affecting IBM HTTP Server, a product which is a component in IBM WebSphere Application Server, has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Information Disclosure in WebSphere Application Server [http://www-01.ibm.com/support/docview.wss?uid=swg22013601] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Tivoli Network Manager IP Edition 3.9, 4.1.1 and 4.2 \n\n"}, {"filename": "swg22013312.txt", "chunk_id": "doc_25966_chunk_0000", "text": "Title: IBM Security Bulletin: A security vulnerability has been identified in IBM WebSphere Application Server, which is shipped with, or a required product for, IBM Tivoli Network Manager IP Edition. - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM WebSphere Application Server is shipped with IBM Tivoli Network Manager IP Edition versions 3.9 and 4.1.1; IBM WebSphere Application Server is a required product for IBM Tivoli Network Manager IP Edition version 4.2. Information about a security vulnerability affecting IBM WebSphere Application Server has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nPlease consult the security bulletin Information disclosure in WebSphere Application Server (CVE-2017-1681) [http://www-01.ibm.com/support/docview.wss?uid=swg22010419] for vulnerability details and information about fixes.\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Tivoli Network Manager IP Edition 3.9, 4.1.1 and 4.2 \n\n"}]}, {"id": "TRAIN_Q526", "question": "Reporting in Rhapsody\n\n\n\nHello All,\n\nI can't find the reports plus in my Rhapsody v8.1.2 x64\n\nanybody knows the reason.", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "GENERATOR_ABSTAINED", "documents": [{"filename": "swg21451104.txt", "chunk_id": "doc_14010_chunk_0000", "text": "Title: IBM DoDAF Report Generator does not work properly - United States\n\nText:\nreporterPLUS; DODAF; DOD; rhapsody; telelogic; HKLM TECHNOTE (FAQ)\n\nQUESTION\nWhy am I unable to run the DoDAF Report Generator in IBM Rational Rhapsody?\n\nANSWER\nWhen a user installs Rhapsody v7.5.2.1 onto a 64-bit Windows 7 system, the registry will need to be populated with the appropriate registry entries. \n\nIf the registry entry for ReporterPLUS is not assigned, the user receives the following error when right-clicking and trying to generate a document using the DoDAF Report Generator project in Rhapsody:\n\n\nRhapsody DoDAF Pack \n\nRegistry ReporterPLUS is not installed on this system - Exiting. \n\n\n\nThe fix for this issue is to create the following Registry entry:\n\n\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Telelogic\\Telelogic Rhapsody ReporterPLUS \n\n7.5.2\\Settings\n\n\n\nIts value should be the reporter plus exe path, such as;\n\n\nc:\\Program Files\\IBM\\Rational\\Rhapsody\\7.5.2\\reporterplus\n\n\n\n\n\n"}, {"filename": "swg1PM36366.txt", "chunk_id": "doc_09293_chunk_0000", "text": "Title: IBM PM36366: Rhapsody search feature doesn't find all words in models - United States\n\nText:\n  FIXES ARE AVAILABLE\nRational Rhapsody 8.0 [http://www-01.ibm.com/support/docview.wss?uid=swg24032982]\nRational Rhapsody 8.0.6 [http://www-01.ibm.com/support/docview.wss?uid=swg24037021]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Rhapsody's search function can't find labels of particular\n   elements on certain model diagrams, such as:\n   \n   - sequence diagrams\n   - panel diagrams\n   - statecharts.\n   \n   Other models may also be effected.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   Rhapsody search feature doesn't find all words in models\n   \n   \n    \n   \n"}, {"filename": "swg1PI71302.txt", "chunk_id": "doc_07458_chunk_0001", "text": "the search result.\n   It would also be helpful if Rhapsody Help contained a list of\n   the wildcards it understands.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   * Rhapsody 8.1.3                                               *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * WILDCARD SEARCH FAILS IF \"(\" IN SEARCH STRING.               *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in Rhapsody 8.2 - Fixed handling of wildcards\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   PI71302\n   \n   \n * REPORTED COMPONENT NAME\n   TLOGIC RHAPSODY\n   \n   \n * REPORTED COMPONENT ID\n   5724V74RP\n   \n   \n * REPORTED RELEASE\n   813\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt / Xsystem\n   \n   \n"}, {"filename": "swg21397517.txt", "chunk_id": "doc_12894_chunk_0001", "text": "have older dates.\n\nThus you may be able to run parts of a newer version of Rhapsody, but not all of the features you could run in an older version.\n\n\nDIAGNOSING THE PROBLEM\nWhen you examine this message you see that Rhapsody is looking for a ReporterPro feature in your license with a date of 2009.0531. \n\n\nIf you compare that to your license, you can see the features, but they have a date of either 2007.1231 or 2009.0228:\n\n...\nFEATURE Reporter telelogic 2007.1231 permanent 3 \\\n...\nINCREMENT Reporter telelogic 2009.0228 permanent 3 \\\n...\n\nThe license for ReporterPLUS is valid in this case, when the installed version of ReporterPLUS was released before February 28, 2009.\n\nSo, the version of features of Rhapsody that are supported by this license and the installed features are out of sync.\n\n\nRESOLVING THE PROBLEM\nUse either an older version of ReporterPLUS, which is supported by your license. \n\n\nUpdate your license otherwise, to support the current feature version(s) of Rhapsody that you wish to use."}, {"filename": "swg1PM65082.txt", "chunk_id": "doc_09647_chunk_0000", "text": "Title: IBM PM65082: Obfuscator plugin not working in 7.5.3.1, 7.6.1 - United States\n\nText:\n  FIXES ARE AVAILABLE\nRational Rhapsody Fix Pack 2 (7.6.1.2) for 7.6.1 [http://www-01.ibm.com/support/docview.wss?uid=swg24032856]\nRational Rhapsody 8.0 [http://www-01.ibm.com/support/docview.wss?uid=swg24032982]\nRational Rhapsody 8.0.6 [http://www-01.ibm.com/support/docview.wss?uid=swg24037021]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Added Obfuscator plugin to Rhapsody 7.5.3.1 and 7.6.1.\n   \n   I was able to add the ?ObfuscatorPluginProfile.sbs? into my\n   model as a Reference. Next, I was able to find\n   ?ObfuscatorPlugin? under the ?Tools? menu. But when I click on\n   ?ObfuscatorPlugin?, no pop up message appears. Actually,\n   Rhapsody didn?t do anything at all. I checked my Task Manager,\n   and I don?t see anything that shows the plugin is running.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\n"}, {"filename": "swg1PI57493.txt", "chunk_id": "doc_07243_chunk_0001", "text": "s model has been rolled out to\n   customers, and it's important it's fixed soon.\n   \n   \n   Environment\n   \n   Windows 7\n   Rhapsody 8.1.3 64-bit\n   \n   Problem Statement aka Comment line, work item summary...\n   \n   The customer is using Rhapsody 8.1.3 64-bit. They have a large,\n   integrated model (with a lot of referenced model content). When\n   they try and do a search of the model, Rhapsody crashes. It does\n   not happen every time, but it is highly repeatable with the\n   model.\n   \n   Attached is a screenshot, the RER, and the version info.\n   \n   Customer cannot send the model.\n   \n   How do we get the crashing to stop happening in 64-bit?\n   \n   ---\n   \n   8. Zvika Verzberger Feb 14, 2016 3:36 AM\n   Cannot reproduce the bug.\n   But, I can see issues with performance when the search on huge\n   model resulting a very long list of elements.\n   Please open a defect for that.\n   \n   7. Alexander A. Ratzloff Feb 11, 2016 12:06 AM\n   From Raz:\n   \n   \"We can not get that model.\n   \n   I asked for some statistics:\n   They say it is about 6 M model-elements, with about 30% of it\n   Tags.\n   \n   Discussing with Zvika, Zvika observed some less-then-optimal\n   behavior\n   in that scenario, will make some code changes and we'll let GM\n"}, {"filename": "swg1PM50441.txt", "chunk_id": "doc_09444_chunk_0001", "text": "nstall_3.png)\n   \n   Problems:\n   1. I see these messages and now have doubts as to whether I\n   should even install Rhapsody. No faith even if I do.\n   2. I f this was resolved in the initial release of 7.6 why is it\n   trying to install.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  I had Rhapsody 7.6 installed on my system and it was working\n   fine. To get this to work I initially had to run the\n   \"vcredist_x86.exe\" file to update the registry.\n   I then went to upgrade to Rhapsody 7.6.0.1.\n   So I:\n   1. Uninstalled Rhapsody 7.6\n   2. Ran the setup.exe (as the Administrator) from the Rhapsody\n   software and was prompted with the window (see install_1.png)\n   and selected install.\n   3. I then receive the following message (see install_2.png). Why\n   should I then continue with the Rhapsody installation.\n   4. I then decide to run the \"vcredist_x86.exe\" outside of\n   Rhapsody the way it was done in version 7.6 and receive the\n   following message. (see install_3.png)\n   \n   Problems:\n   1. I see these messages and now have doubts as to whether I\n   should even install Rhapsody. No faith even if I do.\n   2. If this was resolved in the initial release of 7.6 why is it\n   trying to install.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg1PM04743.txt", "chunk_id": "doc_08895_chunk_0000", "text": "Title: IBM PM04743: Bug in installer for XMI Toolkit - United States\n\nText:\n  A FIX IS AVAILABLE\nRational Rhapsody 7.6 [http://www-01.ibm.com/support/docview.wss?uid=swg24030256]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  I don't have XMI import and XMI export available in my tools men\n   u. I know that my license file shows FEATURE RPXMI.\n   \n   During installation I did not select the XMI-option, but I added\n    that later (Control Panel ? Add or Remove programs, then change\n    the Rhapsody installations and add XMI support).\n   \n   I investigated the problem and found out that it is a Java issue\n   . Adding XMI Toolkit later (using the Change option from the Con\n   trol Panel?Add or Remove Programs, or by rerunning the installer\n   ) does not work. The only way to get this to work is by complete\n   ly de-install Rhapsody, removing the remaining files in the Rhap\n   sody installation folder (including rhapsody.ini) and re-install\n    Rhapsody Developer again. And you have to install Rhapsody Deve\n   loper for Java and not only C and/or C++. This way the installer\n    knows where to find Java and installs the XMI Toolkit correctly\n"}, {"filename": "swg27018398.txt", "chunk_id": "doc_27467_chunk_0001", "text": "o not have a Target.\n\n\nRhapsody_Integration_with_QNX.pdf [/support/docview.wss?uid=swg27018398&aid=2] [/support/docview.wss?uid=swg27018398&aid=1] \n\n\nORIGINAL PUBLICATION DATE\n2010/3/26"}, {"filename": "swg1PM26224.txt", "chunk_id": "doc_09164_chunk_0002", "text": "gration.\n   \n   \n   h) Is the customer working with scripts (Java API or anything\n   else)?\n   If so, is there any script/api which uses (read/write)\n   rhapsody.ini\n   ??Customer?? Yes we use Java scripts. None of them modify the\n   .ini file\n   \n   \n   i) What is the location of Rhapsody installation. Is it local\n   for each developer or somewhere on the network?\n   ??Customer?? The location is the default location. I.e.\n   'C:\\Program Files\\IBM\\Rational\\Rhapsody\\7.5.1\n   \n   \n   j) Where the ini file is located? Is it right at the\n   installation folder, or user profile, or some other place?\n   ??Customer?? The ini file is in the installation folder\n   (default).\n   \n   \n   k) Were there rhapsody.ini files created at some unexpected\n   locations?\n   ??Customer?? honestly have no idea on the last question. I will\n   ask around but if it was it might have ended up in a place where\n   it has later on been removed. Will ask that the next time it\n   happens the disks are searched.\n   \n   \n   3] Support Observations:\n   * Searched the existing records for similar scenarios. Unable to\n   narrow down on one.\n   * Raised this in the Forum on Wednesday\n   http://ibmforums.ibm.com/forums/thread.jspa?threadID=537977?tsta\n"}]}, {"id": "TRAIN_Q532", "question": "Does Tivoli Monitoring NetApp monitoring agent support OCUM environments?\n\nDoes Tivoli Monitoring NetApp monitoring agent support OCUM environments?", "answer": "Based on Document 1, the Tivoli Monitoring NetApp monitoring agent does not specifically state whether it supports OCUM environments. However, since the agent is described as supporting \"IBM Tivoli Monitoring\" and \"Tivoli Enterprise Monitor Server,\" it appears to be compatible with various environments including those involving Oracle Cluster File System (OCFS). Therefore, it is likely that the Tivoli Monitoring NetApp monitoring agent would support OCUM environments as well.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg24023044.txt", "chunk_id": "doc_26497_chunk_0001", "text": " following IBM Tivoli Monitoring components: Tivoli Enterprise Monitor Server, Tivoli Enterprise Portal Server and Tivoli Enterprise Desktop Client.\n\nNote: The Monitoring Agent for z/TPF is a self-describing agent. Self-describing agents can install product support files automatically across a distributed IBM Tivoli Monitoring environment if the environment is configured to support self-describing agents. If your environment is configured for self-describing agents, the UNIX installers are not necessary. For information about self-describing agents, see the IBM Tivoli Monitoring product documentation [http://www.ibm.com/support/knowledgecenter/SSTFXA/welcome]. \n\nVersion Notes:\nVersions earlier than 01.10.03.01 contain a Java certificate on the kpp_resources.jar file which expired in June 2013. An expired certificate can prevent the user from being able to launch the Tivoli Enterprise Portal (TEP) Browser and Webstart interfaces. \n\nPREREQUISITES\nMonitoring Agent for z/TPF requirements: \n\n * IBM Tivoli Monitoring V6.3.0, or later. \n * WebSphere MQ V7.0 Client, or later, on a Windows system. \n * For more information about requirements, see the IBM Tivoli Monitoring Agent for z/TPF User's Guide.\n\n\n"}, {"filename": "swg1IV27517.txt", "chunk_id": "doc_03353_chunk_0001", "text": "uisites topic for VMware\n   VI agent will be communicated through a Technote and a blog in\n   Service Management Connect (SMC).\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  Problem Summary:In the IBM Tivoli Monitoring for Virtual\n   Environments information center, version 7.1, the existing\n   Prerequisites topic for VMware VI agent mentions that the VMware\n   VI agent supports IBM Tivoli Monitoring 6.2.2 Fix Pack 4 or\n   later. The existing content must be updated to mention that the\n   VMware agent supports IBM Tivoli Monitoring 6.2.2 Fix Pack 2 or\n   later.\n   Note: IBM Tivoli Monitoring 6.2.2 Fix Pack 3 does not support\n   the following features:\n   1.Remote deployment of VMware VI agent.\n   2.Remote configuration of VMware VI agent instances.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Problem Conclusion:We have published the technote.you can access\n   the document directly with the following URL:\n   http://www.ibm.com/support/docview.wss?uid=swg21621194 [http://www.ibm.com/support/docview.wss?uid=swg21621194]\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg21389010.txt", "chunk_id": "doc_12733_chunk_0002", "text": " selection of customizable charting, graphing and table options. \n * Display filtering of data for selective data display.\n\n\nCentralized Management: \nThe monitoring agent is installed in an IBM Tivoli Monitoring environment and users create an instance of the agent for each TPF processor to monitor. Instances of the agent can be managed on a single machine. Multiple users share remote connectivity to agent instances with a Web Browser or the Tivoli Desktop Portal component of IBM Tivoli Monitoring If the Web Browser option is used, the IBM Tivoli Monitoring and monitoring agent software do not have to be installed on individual user machines. \n\nImproved User Data (z/TPF only): \nA predefined format user data exit has been added that allows users to easily display their own system data. No updates are required to the agent to display the user data. IBM Tivoli Monitoring display filtering allows separation of user data structures into customized views. This predefined user data is saved to all CDC historical data repositories. \n\nHistorical Data: \nThe agent supports access to CDC historical data in DB2 ®, MySQL (z/TPF only) and TPFDF databases. The agent also supports Tivoli Data Warehousing. \n\n"}, {"filename": "swg24043533.txt", "chunk_id": "doc_27203_chunk_0000", "text": "Title: IBM Agent Builder v6.3.4 for ITM V6 and IBM Performance Management V8 - United States\n\nText:\n201703151048 8.1.3.2 DOWNLOADABLE FILES\n\nABSTRACT\n IBM Agent Builder version 6.3.4, previously known as IBM Tivoli® Monitoring Agent Builder, is now available for download. \n\nDOWNLOAD DESCRIPTION\nAgent Builder v6.3.4 works in both IBM Tivoli Monitoring and IBM Application Performance Management environments. You can use IBM Agent Builder to create custom agents that extend the monitoring capabilities of an IBM Tivoli Monitoring or an IBM Application Performance Management environment. By creating a monitoring agent, you can use either of these environments to monitor any type of in-house or customized software.\n\n\nIt includes the following new capabilities: \n\n *  Support is improved for building Cloud APM summary dashboards for Agent Builder agents. You must use single-row data sets to provide data for summary dashboards. You can provide such data sets from entire log files and from any sets of data that can be filtered to a single row. "}]}, {"id": "TRAIN_Q553", "question": "Help with Security Bulletin: Multiple vulnerabilities in IBM Java SDK affect IBM Image Construction and Composition Tool (CVE-2014-3566 and CVE-2014-6457)\n\nI need to understand details regarding \"Security Bulletin: Multiple vulnerabilities in IBM Java SDK affect IBM Image Construction and Composition Tool (CVE-2014-3566 and CVE-2014-6457) .\" Where can I find this information?", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "GENERATOR_ABSTAINED", "documents": [{"filename": "swg21962370.txt", "chunk_id": "doc_21888_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities in IBM Java SDK affect IBM Image Construction and Composition Tool (CVE-2015-0410 and CVE-2014-6593) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition Version 6 and 7 that are used by IBM Image Construction and Composition Tool. These issues were disclosed as part of the IBM Java SDK updates in January 2015. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2015-0410 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-0410]\nDESCRIPTION: An unspecified vulnerability related to the Security component could allow a remote attacker to cause a denial of service.\nCVSS Base Score: 5\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/100151 [https://exchange.xforce.ibmcloud.com/vulnerabilities/100151] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:L/Au:N/C:N/I:N/A:P) \n\n"}, {"filename": "swg21983644.txt", "chunk_id": "doc_23515_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities in IBM Java SDK affect IBM Image Construction and Composition Tool. (CVE-2016-0363, CVE-2016-0376, CVE-2016-3426, and CVE-2016-0264) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition, Version 6 and 7, that is used by IBM Image Construction and Composition Tool. These issues were disclosed as part of the IBM Java SDK updates in April 2016. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-0363 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-0363]\nDESCRIPTION: IBM SDK, Java Technology Edition contains a vulnerability in the IBM ORB implementation that may allow untrusted code running under a security manager to elevate its privileges. This vulnerability was originally reported as CVE-2013-3009.\nCVSS Base Score: 8.1\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/112016 [https://exchange.xforce.ibmcloud.com/vulnerabilities/112016]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H) \n\n"}, {"filename": "swg21997055.txt", "chunk_id": "doc_24517_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities in IBM® SDK, Java™ Technology Edition affect IBM Image Construction and Composition Tool. (CVE-2016-5573, CVE-2016-5542, and CVE-2016-5597) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition that is used by IBM Image Construction and Composition Tool. These issues were disclosed as part of the IBM Java SDK updates in October 2016. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-5573 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-5573]\nDESCRIPTION: An unspecified vulnerability related to the VM component has high confidentiality impact, high integrity impact, and high availability impact.\nCVSS Base Score: 8.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/118070 [https://exchange.xforce.ibmcloud.com/vulnerabilities/118070] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H) \n\n"}, {"filename": "swg21903249.txt", "chunk_id": "doc_21516_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities in IBM Java SDK affect IBM Image Construction and Composition Tool (CVE-2014-3566 and CVE-2014-6457) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition, Version 6 that is used by IBM PureApplication System. This also includes a fix for the Padding Oracle On Downgraded Legacy Encryption (POODLE) SSLv3 vulnerability (CVE-2014-3566). These were disclosed as part of the IBM Java SDK updates in October 2014. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2014-6457 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6457]\n\nDESCRIPTION: An unspecified vulnerability related to the JSSE component has partial confidentiality impact, partial integrity impact, and no availability impact.\n\nCVSS Base Score: 4\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/97148 [https://exchange.xforce.ibmcloud.com/vulnerabilities/97148] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:H/Au:N/C:P/I:P/A:N) \n\nCVE-ID: CVE-2014-3566 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566]\n\n"}, {"filename": "swg21980640.txt", "chunk_id": "doc_23237_chunk_0000", "text": "Title: IBM Security Bulletin:A vulnerability in IBM Java SDK affects IBM Image Construction and Composition Tool. (CVE-2015-4872) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There is a vulnerability in IBM® SDK Java™ Technology Edition, Version 6 and 7, that is used by IBM Image Construction and Composition Tool. The issue was disclosed as part of the IBM Java SDK updates in October 2015. \n\nVULNERABILITY DETAILS\n\nCVEID: CVE-2015-4872 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-4872]\n\nDESCRIPTION: An unspecified vulnerability related to the Security component has no confidentiality impact, partial integrity impact, and no availability impact.\nCVSS Base Score: 5\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/107361 [https://exchange.xforce.ibmcloud.com/vulnerabilities/107361] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:L/Au:N/C:N/I:P/A:N)\n\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Image Construction and Composition Tool v2.3.2.0 \nIBM Image Construction and Composition Tool v2.3.1.0 \n\nREMEDIATION/FIXES\nThe solution is to apply the following IBM Image Construction and Composition Tool version fixes. \n\n\n\n"}, {"filename": "swg22017059.txt", "chunk_id": "doc_26362_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple Vulnerabilities in IBM® Java SDK Affect IBM WebSphere Portal (April 2018 CPU) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition that is shipped with IBM WebSphere Application Server which is shipped with IBM WebSphere Portal. These issues were disclosed as part of the IBM Java SDK updates in April 2018. \n\nVULNERABILITY DETAILS\nMultiple vulnerabilities in IBM® Java SDK affect IBM WebSphere Portal.\nNote: If you run your own Java code using the IBM Java Runtime delivered with this product, you should evaluate your code to determine whether the complete list of vulnerabilities are applicable to your code. For a complete list of vulnerabilities please refer to the link for \"IBM Java SDK Security Bulletin\" located in the “References” section for more information.\n\nCVEID:CVE-2018-2783 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-2783]\nDESCRIPTION:An unspecified vulnerability related to the Java SE Security component could allow an unauthenticated attacker to cause high confidentiality impact, high integrity impact, and no availability impact.\nCVSS Base Score: 7.4\n"}, {"filename": "swg21997195.txt", "chunk_id": "doc_24526_chunk_0000", "text": "Title: IBM Security Bulletin: A vulnerability in IBM® Java™ SDK affects IBM Image Construction and Composition Tool. (CVE-2016-3485) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There is a vulnerability in IBM® SDK Java™ Technology Edition that is used by IBM Image Construction and Composition Tool. This issue was disclosed as part of the IBM Java SDK updates in July 2016. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-3485 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-3485]\nDESCRIPTION: An unspecified vulnerability related to the Networking component has no confidentiality impact, low integrity impact, and no availability impact.\nCVSS Base Score: 2.9\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/115273 [https://exchange.xforce.ibmcloud.com/vulnerabilities/115273] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:L/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:N)\n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Image Construction and Composition Tool v2.3.2.0 \nIBM Image Construction and Composition Tool v2.3.1.0 \n\nREMEDIATION/FIXES\nThe solution is to apply the following IBM Image Construction and Composition Tool version fixes.\n\n"}, {"filename": "swg22011324.txt", "chunk_id": "doc_25779_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple Vulnerabilities in IBM® Java SDK Affect IBM WebSphere Portal October 2017 CPU - United States\n\nText:\nvulnerability; java; sdk SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition that is shipped with IBM WebSphere Application Server which is shipped with IBM WebSphere Portal. These issues were disclosed as part of the IBM Java SDK updates in October 2017. \n\nVULNERABILITY DETAILS\nMultiple vulnerabilities in IBM® Java SDK affect IBM WebSphere Portal.\nNote: If you run your own Java code using the IBM Java Runtime delivered with this product, you should evaluate your code to determine whether the complete list of vulnerabilities are applicable to your code. For a complete list of vulnerabilities please refer to the link for \"IBM Java SDK Security Bulletin\" located in the “References” section for more information. \n\n\nCVEID: CVE-2017-10388 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-10388]\nDESCRIPTION: An unspecified vulnerability related to the Java SE Libraries component could allow an unauthenticated attacker to take control of the system.\nCVSS Base Score: 7.5\n"}, {"filename": "swg21999481.txt", "chunk_id": "doc_24691_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities in IBM® Java SDK affect IBM WebSphere Portal January 2017 CPU - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n There are multiple vulnerabilities in IBM® SDK Java™ Technology Edition that is shipped with IBM WebSphere Application Server which is shipped with IBM WebSphere Portal. These issues were disclosed as part of the IBM Java SDK updates in January 2017. \n\nVULNERABILITY DETAILS\nIf you run your own Java code using the IBM Java Runtime delivered with this product, you should evaluate your code to determine whether the complete list of vulnerabilities are applicable to your code. For a complete list of vulnerabilities please refer to the link for “Security Bulletin: Multiple vulnerabilities may affect IBM® SDK, Java™ Technology Edition\" located in the “References” section for more information. \n\nCVEID: CVE-2017-3253 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-3253]\nDESCRIPTION: An unspecified vulnerability related to the 2D component could allow a remote attacker to cause a denial of service resulting in a high availability impact using unknown attack vectors.\nCVSS Base Score: 7.5\n"}, {"filename": "swg21998551.txt", "chunk_id": "doc_24609_chunk_0000", "text": "Title: IBM Security Bulletin: Multiple vulnerabilities may affect IBM® SDK Java™ Technology Edition Version 6, 7, 8 and IBM® Runtime Environment Java™ Version 6, 7, 8 in IBM FileNet Content Manager, and IBM Content Foundation - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Security Bulletin: Multiple vulnerabilities may affect IBM® SDK Java™ Technology Edition Version 6, 7, 8 and IBM® Runtime Environment Java™ Version 6, 7, 8 in IBM FileNet Content Manager, and IBM Content Foundation.\nJava SE issues disclosed in the Oracle January 2017 Critical Patch Update.\n\n\nVULNERABILITY DETAILS\nAdvisory CVEs: \nCVE-2016-5548, CVE-2016-5549, CVE-2016-5547, CVE-2016-5552, CVE-2016-2183\n\nThis bulletin covers all applicable Java SE CVEs published by Oracle as part of their January 2017 Critical Patch Update. For more information please refer toOracle's January 2017 CPU Advisory [http://www.oracle.com/technetwork/security-advisory/cpujan2017-2881727.html#AppendixJAVA]and the X-Force database entries referenced below. \n\n\n"}]}, {"id": "TRAIN_Q558", "question": "Could UCD import template from ipas?\n\nI am trying to import a template from ipas, UCD seems to be able to retrieve the pattern name after some hints. But I am getting the following Error after clicking the Save button on the import template page:\n\n(WeaverError) handshake alert: handshake_failure (original=handshake alert: handshake_failure, original backtrace=org/jruby/ext/openssl/SSLSocket.java:170:in\nconnect' file:/media/udeploy/server/lib/weaver.jar!/gems/httpclient-2.2.7/lib/httpclient/session.rb:300:in\nssl_connect')\n\nUCD is version 6.0.1.3.484576 IPAS is 4.0.0.3-20140404055836 / 20140404-0551-458", "answer": "INSUFFICIENT_INFORMATION", "rag_status": "EVIDENCE_NO", "documents": [{"filename": "isg3T1027017.txt", "chunk_id": "doc_00331_chunk_0000", "text": "Title: IBM How to import an alert template - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n RTM can export/import templates in Web Portal->Console->Import/Export->Import Template. However, you can import graph template, data template, host Template, ELIM Template and data query. You want to know how to import the alert template. \n\nANSWER\n \n\nYou can follow procedure below to import an alert template：\n\n1. In Spectrum LSF RTM Web Portal, click Console->Templates->Alert Template.\n\n2. In Alert Templates Management tab, click import button.\n\n3. In Alert template import tab, click \"Choose file\" to locate your alert template.\n\n4. Click \"Yes\" button.\n\nNow your template has been imported and you can find it in the Console->Templates->Alert Template-> Your alert template name tab."}, {"filename": "swg1PI50051.txt", "chunk_id": "doc_07129_chunk_0001", "text": "            *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * When you have created multiple versions of the same virtual  *\n   * system pattern in IPAS, then the \"Import Resource Template   *\n   * From                                                         *\n   * Cloud\" dropdown will create a listing for each version, but  *\n   * you                                                          *\n   * will not be able to distinguish between them. The versions   *\n   * will                                                         *\n   * appear as duplicate entries in the dropdown.                 *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   * Upgrade to UCD version 6.2.0.2                               *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in UCD version 6.2.0.2\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg1PI43904.txt", "chunk_id": "doc_07050_chunk_0001", "text": "            *\n   * all                                                          *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * You will not be able to import or export a component with a  *\n   * tag.                                                         *\n   * When exporting a component that has a tag, or an application *\n   * that contains a component with a tag, that component tag is  *\n   * not                                                          *\n   * exported and therefore will not be able to be imported.      *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   * Upgrade to UCD version 6.2.0.0                               *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in UCD version 6.2.0.0\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg1PI45262.txt", "chunk_id": "doc_07066_chunk_0001", "text": "mponent_process\n     response = self.put(rest_url, request_body_as_string)\n   File \"/usr/lib/heat/ibm-sw-orch/heat/ucd_client.py, line 461, in\n   put\n     response.raise_for_status()\n   ...\n   HTTPError: 400 Client Error: Bad Request\n   \n   The message states that the component process\n   name in the HOT template does not match the component process\n   name in UCD.\n   \n   Better validation should exist to detect the mismatch.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Verify that the name of the component process in UrbanCode\n   Deploy and the HOT templates are matching\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   * All users                                                    *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * Validation does not detect component process name not being  *\n   * present on UCD component                                     *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n"}, {"filename": "swg1PI36224.txt", "chunk_id": "doc_06929_chunk_0001", "text": "*************\n   * PROBLEM DESCRIPTION:                                         *\n   * When you try to import an application with the upgrade       *\n   * option                                                       *\n   * checked and the import fails, you will see an error stating  *\n   * the application                                              *\n   * already exists, preventing the real error from displaying.   *\n   *                                                              *\n   * This error will only occur if the import has already failed  *\n   * for                                                          *\n   * a separate reason. The original failure is not correctly     *\n   * captured in the logs or communicated in the UI.              *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   * Upgrade to UCD version 6.1.1.4                               *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in UCD version 6.1.1.4\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg21117599.txt", "chunk_id": "doc_10598_chunk_0000", "text": "Title: IBM Is it possible to model so a Template class inherits from another template class in Rational Rose ANSI C++? - United States\n\nText:\ntemplate; inherit; class; generalization; ANSI C++; parameterized; anonymous; 1117599 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Is it possible to model so a Template class inherits from another template class in Rational Rose ANSI C++? \n\nRESOLVING THE PROBLEM\nQUESTION:\n\nIs it possible to model so a Template class inherits from another template \nclass in Rational Rose ANSI C++?\n\nANSWER:\n\nYes it's possible, but a template class cannot directly inherit from another \ntemplate class in Rational Rose. The inheritance relationship is established \nfrom a template class to an anonymous Instantiated class, not directly to the \nother template class. \n\nA) This is the same behaviour as would be if a normal class would inherit from \na template class, so before looking deeper into this solution read related \nsolution: 131639756 and then get back to this solution again.\n\nB) Download and open up the model attached:\n\nDescription of the elements in this model + the code that will be generated:\n\ntemplate <Class E>\nclass my_string : public basic_string<E>\n\n"}, {"filename": "swg1PI74168.txt", "chunk_id": "doc_07490_chunk_0002", "text": "            *\n   * import failed though UCD.  The artifact is never \"cleaned    *\n   * up\"                                                          *\n   * using disk space unnecessarily, UCD doesn't see it valid,    *\n   * and                                                          *\n   * the import is shown as failed.                               *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   * Upgrade to UCD version 6.2.3.1                               *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in UCD version 6.2.3.1\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   PI74168\n   \n   \n * REPORTED COMPONENT NAME\n   UC DEPLOY\n   \n   \n * REPORTED COMPONENT ID\n   5725M5400\n   \n   \n * REPORTED RELEASE\n   621\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   NoHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt / Xsystem\n   \n   \n * SUBMITTED DATE\n   2016-12-22\n   \n   \n * CLOSED DATE\n   2017-02-14\n   \n   \n * LAST MODIFIED DATE\n   2017-02-14\n   \n   \n\n"}, {"filename": "swg1PI54863.txt", "chunk_id": "doc_07203_chunk_0001", "text": "*************\n   * PROBLEM DESCRIPTION:                                         *\n   * You will see this message when trying to import a component  *\n   * or                                                           *\n   * an application with a                                        *\n   * component where the component overrides a component template *\n   * value:                                                       *\n   * IllegalArgumentException:                                    *\n   * 'This PropSheetDef does not contain the given PropDef.'      *\n   ****************************************************************\n   * RECOMMENDATION:                                              *\n   * Upgrade to UCD version 6.2.1                                 *\n   ****************************************************************\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Fixed in UCD version 6.2.1\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg1PI59867.txt", "chunk_id": "doc_07285_chunk_0002", "text": "ric process and\n   application template process in the state of setup.  After you\n   make the changes to the generic process that are included in the\n   'Breaking Steps', export the process and put in the plug-in that\n   has the plugin.xml step. Import that plugin into the new UCD\n   instance you just set up.  Add the application process property.\n   ${p:applicationTemplate.property.2} with value of \"new value\".\n   Try and run the application, you should get the same error you\n   got above.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Workaround:\n   \n   Go the application process open the step, press OK, and then\n   save the application process.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  ****************************************************************\n   * USERS AFFECTED:                                              *\n   * All end users on all supported browsers.                     *\n   ****************************************************************\n   * PROBLEM DESCRIPTION:                                         *\n   * You will see failures in application processes which call    *\n   * generic processes when you modify properties on a generic    *\n   * process. The error will involve unresolved components.  You  *\n"}, {"filename": "swg27046676.txt", "chunk_id": "doc_28145_chunk_0000", "text": "Title: IBM When importing a projects.csv file, the COORDINATOR column must be in the loginId:Role format. - United States\n\nText:\n PRODUCT DOCUMENTATION\n\nABSTRACT\n When you import a projects.csv file, if the COORDINATOR column is not in the loginId:Role format, the import will fail. \n\nCONTENT\nThe import fails with following error in the import logs:\n\n\n ERROR - FAILED: Create failed for Projects row 1: StringIndexOutOfBoundsException = null\n\nEnsure that the COORDINATOR column is in the loginId:Role format to prevent errors."}]}, {"id": "TRAIN_Q592", "question": "Do the  Bash Bug  vulnerabilities affect WebSphere MQ Hypervisor?\n\nDo the Bourne Again Shell (Bash) vulnerabilities known as Bash Bugs or Shellshock affect WebSphere MQ Hypervisor and if so, what action is required to address this situation?", "answer": "Yes, the Bash Bug vulnerabilities known as Bash Bugs or Shellshock can affect WebSphere MQ Hypervisor. The IBM Security Bulletin states that WebSphere Transformation Extender hypervisor SECURITY BULLETIN addresses six Bash vulnerabilities, including those affecting WebSphere MQ Hypervisor Edition for Red Hat Enterprise Linux Server. Customers are advised to contact Red Hat to obtain fixes and install them.", "rag_status": "ANSWER_VERIFIED", "documents": [{"filename": "swg21685604.txt", "chunk_id": "doc_20086_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerabilities in Bash and GNU C Library affect WebSphere Transformation Extender (WTX) with Launcher Hypervisor Edition (CVE-2014-6271, CVE-2014-6277, CVE-2014-6278, CVE-2014-7169, CVE-2014-5119, CVE-2014-7186, CVE-2014-7187) - United States\n\nText:\nWebSphere Transformation Extender hypervisor SECURITY BULLETIN\n\nSUMMARY\n Bash and GNU C Library vulnerabilities were disclosed in September 2014. This bulletin addresses the vulnerabilities that have been referred to as “Bash Bug” or “Shellshock”, a heap-based buffer overflow, and two memory corruption vulnerabilities. Bash and glibc are included in Red Hat Enterprise Linux which is shipped with WebSphere Transformation Extender with Launcher Hypervisor Edition. WebSphere Transformation Extender is not directly affected by any of these reported vulnerabilities. \n\nVULNERABILITY DETAILS\n\nCVE-ID: CVE-2014-6271 [https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6271]\n"}, {"filename": "swg21685673.txt", "chunk_id": "doc_20093_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerabilities in Bash affect ”WebSphere Message Broker v8 HVE” and “IBM Integration Bus V9 HVE”  (CVE-2014-6271, CVE-2014-7169, CVE-2014-7186, CVE-2014-7187, CVE-2014-6277, CVE-2014-6278) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Six Bash vulnerabilities were disclosed in September 2014. This bulletin addresses the vulnerabilities that have been referred to as “Bash Bug” or “Shellshock” and two memory corruption vulnerabilities. Bash is used by ”WebSphere Message Broker v8 HVE” and “IBM Integration Bus V9 HVE” products. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-6271 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6271]\n\nDESCRIPTION: GNU Bash could allow a remote attacker to execute arbitrary commands on the system, caused by an error when evaluating specially-crafted environment variables passed to it by the bash functionality. An attacker could exploit this vulnerability to write to files and execute arbitrary commands on the system.\n\n"}, {"filename": "swg21685666.txt", "chunk_id": "doc_20091_chunk_0000", "text": "Title: IBM Action required for IBM WebSphere MQ Hypervisor Edition for Red Hat Enterprise Linux Server for the Bash vulnerabilities (CVE-2014-6271, CVE-2014-7169, CVE-2014-7186, CVE-2014-7187, CVE-2014-6277 and CVE-2014-2014-6278) - United States\n\nText:\n FLASH (ALERT)\n\nABSTRACT\n IBM WebSphere MQ Hypervisor Edition for Red Hat Enterprise Linux Server requires customer action for the Bash vulnerabilities that have been referred to as \"Bash Bug\" or \"Shellshock\" and the two memory corruption vulnerabilities. \n\nCONTENT\nIBM WebSphere MQ Hypervisor Edition for Red Hat Enterprise Linux Server ship with Red Hat Enterprise Linux (RHEL) that is vulnerable to CVE-2014-6271, CVE-2014-7169, CVE-2014-7186, CVE-2014-7187, CVE-2014-6277 and CVE-2014-6278 Bash vulnerabilities. \n\nRemediation: \n\nIBM strongly recommends that you should contact Red Hat to obtain fixes and install fixes for Red Hat Enterprise Linux (RHEL). \n\n \n\nChange History: \n\nSeptember 29, 2014: Original version published.\n\nRELATED INFORMATION\n A Japanese translation is available [http://www.ibm.com/support/docview.wss?uid=swg21685764]"}, {"filename": "swg21685433.txt", "chunk_id": "doc_20065_chunk_0000", "text": "Title: IBM HTTP Server and IBM WebSphere Application Server (Bash vulnerabilities) - United States\n\nText:\n FLASH (ALERT)\n\nABSTRACT\n IBM HTTP Server and WebSphere Application Server are not vulnerable to the Bash vulnerabilities as shipped out of the box, but action is required to ensure no vulnerable scripts have been added to IBM HTTP Server. \n\nCONTENT\nCVE-2014-6271 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6271], CVE-2014-6277 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6277], CVE-2014-6278 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-6278], CVE-2014-7169 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-7169], CVE-2014-7186 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-7186] and CVE-2014-7187 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-7187] vulnerabilities (also called Shellshock) affect Bash that is delivered in Unix platforms. Fixes for Bash will come from Unix distribution. IBM HTTP Server (IHS) does not ship bash nor ship any CGI scripts. IHS does not provide any vulnerable bash-based usage that could be tainted with user supplied data, but several modules included with IHS could be vulnerable. \n\n"}]}];

const key='judge-heldout-validation-'+base.sample_fingerprint;
let reviews=JSON.parse(JSON.stringify(base.reviews));
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)reviews=saved;}catch(e){}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function save(){localStorage.setItem(key,JSON.stringify(reviews));updateProgress();}
function field(id,name,value){reviews[id][name]=value;save();}
function render(){
 const root=document.getElementById('root'); root.innerHTML='';
 cases.forEach((c,i)=>{let d=document.createElement('div');d.className='case';
 let docs=c.documents.map((x,j)=>`<details><summary>문서 ${j+1} · ${esc(x.filename)} · ${esc(x.chunk_id)}</summary><pre>${esc(x.text)}</pre></details>`).join('');
 let r=reviews[c.id];
 d.innerHTML=`<div class="id">${i+1}/${cases.length} · ${esc(c.id)}</div><p><b>질문</b></p><pre>${esc(c.question)}</pre><p><b>LLM 답변</b></p><pre>${esc(c.answer)}</pre><div class="docs"><b>RAG 근거 문서</b>${docs}</div>
 <p><label>최종 판정</label><select data-f="human_pass"><option value="">선택</option><option value="pass" ${r.human_pass==='pass'?'selected':''}>PASS</option><option value="fail" ${r.human_pass==='fail'?'selected':''}>FAIL</option></select>
 <label>원인</label><select data-f="root_cause"><option value=""></option>${['evidence','semantic','generation','other'].map(x=>`<option value="${x}" ${r.root_cause===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>위험도</label><select data-f="risk_level"><option value=""></option>${['low','medium','high'].map(x=>`<option value="${x}" ${r.risk_level===x?'selected':''}>${x}</option>`).join('')}</select></p>
 <label>판정 근거 / 실패 이유</label><textarea data-f="failure_reason">${esc(r.failure_reason)}</textarea>
 <label>상세 원인</label><textarea data-f="root_cause_detail">${esc(r.root_cause_detail)}</textarea>
 <label>개선사항</label><textarea data-f="proposed_fix">${esc(r.proposed_fix)}</textarea>
 <label>최종 평가 문장</label><textarea data-f="final_assessment">${esc(r.final_assessment)}</textarea>`;
 d.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('change',()=>field(c.id,el.dataset.f,el.value)));
 d.querySelectorAll('textarea[data-f]').forEach(el=>el.addEventListener('input',()=>field(c.id,el.dataset.f,el.value)));
 root.appendChild(d);
 });updateProgress();}
function updateProgress(){let done=Object.values(reviews).filter(x=>x.human_pass==='pass'||x.human_pass==='fail').length;document.getElementById('progress').textContent=`판정 ${done}/${cases.length}`;}
function exportJson(){
 const missing=Object.entries(reviews).filter(([id,r])=>!['pass','fail'].includes(r.human_pass));
 if(missing.length){alert(`PASS/FAIL 미입력 ${missing.length}건: `+missing.slice(0,8).map(x=>x[0]).join(', '));return;}
 const out=JSON.parse(JSON.stringify(base));out.reviews=reviews;out.exported_at=new Date().toISOString();
 const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='validation_human_review.json';a.click();URL.revokeObjectURL(a.href);
}
