erver 2005 is not compatible with versions of WebSphere Application Server prior to version 6.1 - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n Do IBM WebSphere Application Server versions prior to V6.1 work with Microsoft SQL Server 2005? \n\nANSWER\nWebSphere Application Server versions prior to V6.1 were written to be compatible with the Microsoft SQL Server 2000 database. However, Microsoft SQL Server 2005 is not fully forward compatible from Microsoft SQL Server 2000, and therefore WebSphere Application Server versions prior to V6.1 are not fully compatible with Microsoft SQL Server 2005. \n\n * \n * \n * \n * \n * \n * \n * \n * \n * \n * \n * \n * \n * \n\n \n\nCross reference information Segment Product Component Platform Version Edition Application Servers Runtimes for Java Technology Java SDK Application Servers WebSphere Application Server for z/OS z/OS 6.0"}]}, {"id": "TRAIN_Q272", "question": "Why are we seeing MQRC_NOT_AUTHORIZED errors after upgrading Websphere from V7.0 to V8.5.5?\n\nhttps://www-01.ibm.com/support/docview.wss?uid=swg21662193", "answer": "After upgrading from WebSphere MQ V7.0 to V8.5.5, you may encounter MQRC_NOT_AUTHORIZED errors in your Java or JMS applications. This can occur if the userid specified in the client application does not exist in the host of the MQ queue manager or does not have the appropriate authority to access the MQ queue manager. To troubleshoot this issue, you should trace the failure to identify the userid being sent by the MQ client to the MQ queue manager and capture the concurrent trace. Additionally, consider checking the permissions and credentials associated with the userid to ensure they meet the required authorization level for accessing the MQ queue manager.", "documents": [{"filename": "swg21420469.txt", "chunk_id": "doc_13328_chunk_0000", "text": "Title: IBM 2035 MQRC_NOT_AUTHORIZED Java or JMS applications fail after upgrading from MQ V5.3 to V6 or V7 - United States\n\nText:\n2035; JMS; java; MQRC_NOT_AUTHORIZED; client application; upgrade TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n You upgrade from WebSphere MQ V5.3 to V6 or V7 on the box where your client application is running. Now the client application fails with a reason code of 2035 (MQRC_NOT_AUTHORIZED).\n\nHowever, you have a client application that uses the WebSphere MQ V5.3 classes for Java™ or JMS and it is working as expected. \n\nSYMPTOM\nMQRC 2035 2035 MQRC_NOT_AUTHORIZED\n\n\nCAUSE\nStarting with MQ V6, changes were done to the MQ JMS client code to provide to the MQ server the userid of the process (application) that is connecting to the MQ server using the MQ JMS client. \n\n\nIn this case, the MQ queue manager has received a username which either: \n\n * Does not exist in the host of the MQ queue manager. \n * Does exist, but it does not have the proper authority to access the MQ queue manager.\n\nDIAGNOSING THE PROBLEM\nTrace the failure to find the userid that is being sent by the MQ client to the MQ queue manager, it is necessary to capture the concurrent trace. This section provides more details. \n\n"}, {"filename": "swg21636093.txt", "chunk_id": "doc_17912_chunk_0000", "text": "Title: IBM 2035 MQRC_NOT_AUTHORIZED Connecting to WebSphere MQ from WebSphere Application Server via CLIENT Bindings - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This article covers the most common reasons why an application running in WebSphere Application Server receives a 2035 MQRC_NOT_AUTHORIZED error when connecting to MQ as a client over a network. Quick steps to work around the MQRC_NOT_AUTHORIZED errors during development are provided in the 'Resolving the problem' section, as well as considerations for implementing security in production environments. A summary is also provided of behavior for outbound scenarios with container-managed and component-managed security, as well as inbound behavior for listener ports and activiation specifications \n\nSYMPTOM\nJMSCMQ0001: WebSphere MQ call failed with compcode '2' ('MQCC_FAILED') reason '2035' ('MQRC_NOT_AUTHORIZED')\n\n\nCAUSE\nThe two most likely reasons why the connection is refused by MQ are as follows: \n\n"}, {"filename": "swg21138961.txt", "chunk_id": "doc_10686_chunk_0000", "text": "Title: IBM MQJMS2013 (V6) JMSWMQ2013 (V7 and later) invalid security authentication (RC 2035) - United States\n\nText:\nmqminfo permissions sec auth TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n You are running WebSphere MQ and your MQ JMS application fails with security authentication errors. \n\nSYMPTOM\nMQRC 2035 MQRC_NOT_AUTHORIZED \n\nMQRC 2063 MQRC_SECURITY_ERROR \n\nMQ V6:\nMQJMS2013: invalid security authentication supplied for MQQueueManager. \n\nMQ V7 and later:\nJMSWMQ2013: The security authentication was not valid that was supplied for QueueManager 'x' with connection mode 'Client' (or 'Bindings') and host name 'y.com'. Please check if the supplied username and password are correct on the QueueManager you are connecting to.\n\n\nCAUSE\nThe MQJMS2013 exception shown in the WebSphere Application Server logs is generated due to a return code 2035 from the MQ queue manager: MQRC_NOT_AUTHORIZED\n\nThis return code is generated because of these possible conditions:\n\na) The userid that is used to start the JVM (WebSphere Application Server) has not been defined in the host where the MQ queue manager is located.\n... or ...\n\nb) The userid is defined, but it does not have the proper authority to work with the queue manager.\n... or ...\n\n"}]}, {"id": "TRAIN_Q295", "question": "Why are ITNM or Omnnibus WebGUI java applets fail to load with \"Missing Permissions manifest attribute in main jar\"\n\nWhy are ITNM or Omnnibus WebGUI java applets fail to load with \"Missing Permissions manifest attribute in main jar\"", "answer": "ITNM or Omnibus WebGUI java applets fail to load because they lack the \"Permissions\" manifest attribute in their main jar file. This is due to security enhancements introduced in Oracle's Java 7 Update 25, which prevent unsigned, self-signed, or missing permissions attributes applets from running. To resolve this issue, update the firmware to 4.6.2 or higher.", "documents": [{"filename": "swg21653261.txt", "chunk_id": "doc_18569_chunk_0000", "text": "Title: IBM JRE 1.7 up40 errors when accessing WebGUI after patch - United States\n\nText:\nMissing Permissions; Missing Codebase; manifest; jre; 1.7; java console TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n 'Missing Permissions manifest attribute' messages appear in java console when using jre 1.7_u25 or greater when using WebGUI 7.4.0.1 or WebGUI 7.3.1.6 / TIP 2.2.0.7+ \n\nSYMPTOM\nMissing Permissions manifest attribute for: \nhttps:// : /ibm/console/webtop/classes/applets.jar \nMissing Codebase manifest attribute for: \nhttps:// : /ibm/console/webtop/classes/applets.jar \n\n\nCAUSE\n \n\nThese messages are due to the security enhancements introduced in Oracle's Java 7 Update 25. See http://docs.oracle.com/javase/7/docs/technotes/guides/jweb/security/manifest.html for a description of the Permissions and Codebase attributes. These messages will appear for all applets (i.e., not specific to Web GUI, but for other applications such as ITNM and TBSM as well) using JRE 7 Update 25 or later.\n\n\nRESOLVING THE PROBLEM\n\n\nAccording to Oracle these are not error messages, but are warning messages. They can be safely ignored for now. The current JRE 7 updates applets such as the AEL are expected to work despite the warning messages. \n\n\n"}, {"filename": "swg21672355.txt", "chunk_id": "doc_19379_chunk_0003", "text": "higher \n\nWhen running Java 1.7 Update 51 and later and GX firmware 4.6.1 or earlier, some pages will fail to load with messages like the following: \n\nJava applications are blocked by your security settings\n\nMissing Application-Name manifest attribute\n\nMissing required Permissions manifest attribute in main jar \n\nJava has further enhanced security to make the user system less vulnerable to external exploits in Java 7 Update 51 and later. With this update, Java does not allow users to run applications that are not signed (unsigned), are self-signed (not signed by trusted authority), or that are missing permission attributes. See Java's website [https://www.java.com/en/download/help/java_blocked.xml] for further details. \n\nThis issue can be resolved by updating your firmware to 4.6.2. For details on installing firmware updates, see the Installing available updates for Network IPS [http://www.ibm.com/support/knowledgecenter/SSB2MG_4.6.2/com.ibm.ips.doc/tasks/gx_gv_install_updates.htm?lang=en] documentation. \n\n\nMixed code verification options \n\n"}, {"filename": "swg1IC99693.txt", "chunk_id": "doc_02065_chunk_0001", "text": "m.jar [http://ip_address:1581/dsm.jar]\n   \n   \n   Customer/L2 diagnostics:\n   Taking a Java trace, the Java console will show the following\n   error:\n   basic: exception: Missing required Permissions manifest\n   attribute in main jar: http://IP_ADDRESS:1581/dsm.jar. [http://IP_ADDRESS:1581/dsm.jar.]\n   java.lang.SecurityException: Missing required Permissions\n   manifest attribute in main jar: http://IP_ADDRESS:1581/dsm.jar [http://IP_ADDRESS:1581/dsm.jar]\n    at\n   com.sun.deploy.security.DeployManifestChecker.verifyMainJar(Unkn\n   own Source)\n    at\n   com.sun.deploy.security.DeployManifestChecker.verifyMainJar(Unkn\n   own Source)\n    at sun.plugin2.applet.Plugin2Manager.isAppletTrusted(Unknown\n   Source)\n    at sun.plugin2.applet.Plugin2Manager.initAppletAdapter(Unknown\n   Source)\n    at\n   sun.plugin2.applet.Plugin2Manager$AppletExecutionRunnable.run(Un\n   known Source)\n    at java.lang.Thread.run(Unknown Source)\n   basic: Removed progress listener:\n   sun.plugin.util.ProgressMonitorAdapter@105013c\n   security: Reset deny session certificate store\n   \n   The error is caused by the updates that were made to the Java\n   trust and signing requirements starting with Java version\n   1.7.0_51.\n   \n"}, {"filename": "swg21666104.txt", "chunk_id": "doc_19049_chunk_0001", "text": "e following:  * \n * SecurityException\n   Missing required Permissions manifest attribute in main jar: \n * \n * /Workplace/FnJavaV1Files/ji.jar \n   \n\n\n\nClicking on the Ignore or Reload buttons fails to open the Viewer applet. \nCAUSE\nReference Technote 1640073 [http://www.ibm.com/support/docview.wss?uid=swg21640073]\n\n\n\nENVIRONMENT\nFileNet Application Engine (AE) Workplace 4.0.2 FP13 or earlier\nFileNet Workplace XT 1.1.5.2 or earlier\nJava 1.7.0_51 (currently the latest JRE update)\n\n\n\nRESOLVING THE PROBLEM\nIn the Java Control Panel, add the Workplace and/or WorkplaceXT URLs to the Exception Site list to suppress the blocking messages. \n\n \n\n * \n * \n *  On the client, open the Java Control Panel Select the Security tab Select the Restore Security Prompts button - this will allow the security warning to be displayed again and ensure that the proper responses can be selected. Select the Edit Site List button Select the Add button and type in the URLs to the java applet jsp pages (with the correct server and port). For example:\n   For the Image Viewer:\n   http:// :port/Workplace/WcmJavaViewer.jsp http:// :port/WorkplaceXT/WcmJavaViewer.jsp \n   For the Search Designer: \n"}, {"filename": "swg21683575.txt", "chunk_id": "doc_19979_chunk_0000", "text": "Title: IBM Java applet functionality may cause errors when using OpenPages OPX - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n An error may occur when you attempt tasks, such as copying and moving files or folders, or adding a new page, using OpenPages OPX that require Java applet functionality. \n\nSYMPTOM\nIf part of the application fails to load and an error message is shown: “Error. Click for details”. \n\nWhen a user clicks the error message, the following SecurityException error is shown:\n\nMissing required Permissions manifest attribute in main jar: \nhttps://<hostname>/opx/applets/pagespecui.jar\n\n\nCAUSE\nThe Next-generation Java Plug-in is enabled.\n\n\nENVIRONMENT\nUsing Internet Explorer and accessing applet functionality.\n\n\n\nDIAGNOSING THE PROBLEM\nYou encounter this issue when if you see the errors described in the Symptom section.\n\n\n\nRESOLVING THE PROBLEM\nThe Next-Generation Java Plug-in needs to be disabled for every Java entry that exists in the Control Panel.\n\nFollow these steps to disable the Next-Generation Java Plug-in: \n\n \n\n"}]}, {"id": "TRAIN_Q311", "question": "S878 abends during CICS startup after applying PTF for OA45950\n\nAfter applying the PTF for z/OS APAR OA45950, why am I suddenly receiving many S878 abends when I bring up my CICS regions? No CICS system or application software changes were made. \nThe PTF numbers for APAR OA45950 for the various MVS releases are:\nRelease C10 : UA75818 available 15/02/25 (F502 ) \nRelease D10 : UA75819 available 15/02/25 (F502 ) \nRelease 210 : UA75838 available 15/02/25 (F502 )", "answer": "The sudden occurrence of S878 abends during CICS startup after applying the PTF for OA45950 could be due to the change in behavior of the DFHPASY component. The new fix checks for the length of the APPLID parameter and issues message DFHPA1915 if it exceeds 8 characters. This change may cause some CICS regions to invoke predatory takeover of other systems' VTAM sessions and resources, leading to the first region abending with msg DFHSR0606, abend code 0208.", "documents": [{"filename": "swg1PK13835.txt", "chunk_id": "doc_08109_chunk_0003", "text": "eter, this leads to\n   the second CICS region invoking predatory takeover of the first\n   system's VTAM sessions and resources. This in turn leads to\n   the first region abending with msg DFHSR0606, abend code 0208.\n   KEYWORDS: msgdfhsr0606 msgsr0606 abend0208\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  DFHPASY has been changed so that a test is now performed against\n   the APPLID parameter, and message DFHPA1915 is issued if it is\n   found to be greater than 8 characters.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n *              *********\n               * HIPER *\n               *********\n   FIX AVAILABLE BY PTF ONLY\n   \n   \n    \n   \n   \n\nCOMMENTS\n\nAPAR INFORMATION\n * APAR NUMBER\n   PK13835\n   \n   \n * REPORTED COMPONENT NAME\n   CICSTS 3.1 Z/OS\n   \n   \n * REPORTED COMPONENT ID\n   5655M1500\n   \n   \n * REPORTED RELEASE\n   400\n   \n   \n * STATUS\n   CLOSED PER\n   \n   \n * PE\n   NoPE\n   \n   \n * HIPER\n   YesHIPER\n   \n   \n * SPECIAL ATTENTION\n   NoSpecatt\n   \n   \n * SUBMITTED DATE\n   2005-10-25\n   \n   \n * CLOSED DATE\n   2005-11-14\n   \n   \n * LAST MODIFIED DATE\n   2005-12-02\n   \n   \n\n * APAR IS SYSROUTED FROM ONE OR MORE OF THE FOLLOWING:\n    PK13650\n   \n   \n * APAR IS SYSROUTED TO ONE OR MORE OF THE FOLLOWING:\n    UK09024\n   \n   \n\n"}, {"filename": "swg1PI44991.txt", "chunk_id": "doc_07063_chunk_0003", "text": "1PI41584]\n   \n   \n * APAR IS SYSROUTED TO ONE OR MORE OF THE FOLLOWING:\n    UI30323 UI30324\n   \n   \n\nMODULES/MACROS\n *  DFHEIIC\n   \n   \n    \n   \n   \n\nFIX INFORMATION\n * FIXED COMPONENT NAME\n   CICS TS Z/OS V5\n   \n   \n * FIXED COMPONENT ID\n   5655Y0400\n   \n   \n\nAPPLICABLE COMPONENT LEVELS\n * R800 PSY UI30323 [HTTPS://WWW14.SOFTWARE.IBM.COM/WEBAPP/SET2/ORDERMEDIA/SHOPCART?PTFS=UI30323]\n   UP15/08/28 P F508\n   \n   \n * R900 PSY UI30324 [HTTPS://WWW14.SOFTWARE.IBM.COM/WEBAPP/SET2/ORDERMEDIA/SHOPCART?PTFS=UI30324]\n   UP15/08/28 P F508\n   \n   \n\nFIX IS AVAILABLE\n * SELECT THE PTF APPROPRIATE FOR YOUR COMPONENT LEVEL. YOU WILL BE REQUIRED TO SIGN IN. DISTRIBUTION ON PHYSICAL MEDIA IS NOT AVAILABLE IN ALL COUNTRIES."}]}, {"id": "TRAIN_Q404", "question": "Why do I get \"error: The admin task reported the following: null\" if uploading a DataPower scrypt3 firmware image file WAS 8.x DataPower Appliance Manager?\n\nHow can I manage a set of DataPower appliances that shall run v7 firmware images by using WebSphere Application Server 8.x DataPower Appliance Manager?I get \"error: The admin task reported the following: null\" if uploading a DataPower scrypt3, while scrypt2 works fine.", "answer": "The error \"error: The admin task reported the following: null\" occurs when attempting to upload a DataPower scrypt3 firmware image file using the 8.x DataPower Appliance Manager. To resolve this issue, ensure that you are using the \"boot image\" command instead of any other scrypt tool commands like \"reinitialize\" or \"boot reflash\". This should allow the firmware update process to proceed without encountering the null error.", "documents": [{"filename": "swg21637997.txt", "chunk_id": "doc_17987_chunk_0000", "text": "Title: IBM DataPower returns \"Reflashing firmware failed\" running scrypt tools with commands other than the \"boot image\" command - United States\n\nText:\nxs xg xi xb xm 600limitation datapower Reflashing firmware failed boot image scrypt tool TECHNOTE (FAQ)\n\nQUESTION\n When you attempt to run a scrypt tool file for license or component firmware upgrades, the DataPower appliance might return the following message:\n\n% Reflashing firmware failed: (null)\n\n\nCAUSE\nDataPower appliances use the \"scrypt\" file format for both firmware upgrades and tools, for example, license upgrades and activators. The use of commands other than the \"boot image\" command, such as \"reinitialize\" or \"boot reflash\", with a scrypt tool might result in confusing error messages, and the system might not automatically reboot as required.\n\nANSWER\nTo run scrypt tools, always use the \"boot image\" command."}, {"filename": "swg1IC91310.txt", "chunk_id": "doc_01914_chunk_0000", "text": "Title: IBM IC91310: FOR 4195 DATAPOWER APPLIANCES, AN ATTEMPT TO COPY A SCRYPT IMAGE FILE ONTO A DEVICE MAY FAIL DURING FIRMWARE UPGRADE - United States\n\nText:\n SUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  For 4195 DataPower Appliances, an attempt to copy a scrypt\n   image file onto a device could fail\n   during firmware upgrade due to insufficient ramdisk allocation\n   accommodate the upgrade.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\nPROBLEM SUMMARY\n *  Affected is 4195 firmware upgrade.\n   \n   Upgrade may fail due to insufficient ramdisk allocation. Fix\n   increases the size of temporary:// and image:// for improved\n   compatibility with future firmware.\n   \n   \n   APAR IC92476 [http://www-01.ibm.com/support/docview.wss?uid=swg1IC92476] affects Virtual DataPower appliance upgrades for\n   the same problem.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  The fix is available in 4.0.1.17, 4.0.2.13 and 5.0.0.8.\n   \n   For a list of the latest fix packs available, please see:\n   http://www-01.ibm.com/support/docview.wss?uid=swg21237631 [http://www-01.ibm.com/support/docview.wss?uid=swg21237631]\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}]}, {"id": "TRAIN_Q422", "question": "Help with Security Bulletin: Vulnerability in SSLv3 affects IID and WID (CVE-2014-3566)\n\nI need to understand details regarding Security Bulletin: Vulnerability in SSLv3 affects IBM Integration Designer and WebSphere Integration Developer (CVE-2014-3566). Where can I find this information?", "answer": "The security bulletin \"Vulnerability in SSLv3 affects IBM Integration Designer and WebSphere Integration Developer (CVE-2014-3566)\" was issued by IBM. This bulletin highlights a vulnerability in SSLv3 protocols used in IBM Integration Designer and WebSphere Integration Developer, which could lead to sensitive information being obtained through a man-in-the-middle attack if SSLv3 is enabled. The CVSS base score for this vulnerability is 4.3, indicating it's considered high severity.", "documents": [{"filename": "swg21687405.txt", "chunk_id": "doc_20208_chunk_0002", "text": "ulletin: \nSecurity Bulletin: Vulnerability in SSLv3 affects IBM HTTP Server (CVE-2014-3566) [http://www.ibm.com/support/docview.wss?uid=swg21687172]\n\nIf you connect directly to SSL-enabled ports served by a WebSphere Server, follow the instructions in the following bulletin to mitigate the problem on your WebSphere server:\nSecurity Bulletin: Vulnerability in SSLv3 affects IBM WebSphere Application Server (CVE-2014-3566) [http://www.ibm.com/support/docview.wss?uid=swg21687173]\n\nIf you use OSLC integrations with Rational Team Concert, follow the instructions in the following bulletin to mitigate your RTC server:\nSecurity Bulletin: Vulnerability in SSLv3 affects multiple IBM Rational products based on IBM Jazz technology (CVE-2014-3566) [http://www.ibm.com/support/docview.wss?uid=swg21687762]\n\nIf you use integrations with IBM Rational ClearCase, follow the instructions in the following bulletin for your ClearCase servers and clients:\nSecurity Bulletin: Vulnerability in SSLv3 affects IBM Rational ClearCase (CVE-2014-3566) [http://www.ibm.com/support/docview.wss?uid=swg21687347]\n\n\n"}, {"filename": "swg21689914.txt", "chunk_id": "doc_20360_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability in SSLv3 affects IBM Integration Designer and WebSphere Integration Developer (CVE-2014-3566) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n SSLv3 contains a vulnerability that has been referred to as the Padding Oracle On Downgraded Legacy Encryption (POODLE) attack. SSLv3 is enabled in IBM Integration Designer and WebSphere Integration Developer. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-3566 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566]\n\nDESCRIPTION: IBM Integration Designer and WebSphere Integration Developer could allow a remote attacker to obtain sensitive information, caused by a design error when using the SSLv3 protocol. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) attack to decrypt SSL sessions and access the plaintext of encrypted connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/97013 [https://exchange.xforce.ibmcloud.com/vulnerabilities/97013] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\n"}, {"filename": "swg21689152.txt", "chunk_id": "doc_20313_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability in SSLv3 affects WebSphere Business Services Fabric  (CVE-2014-3566) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n SSLv3 contains a vulnerability that has been referred to as the Padding Oracle On Downgraded Legacy Encryption (POODLE) attack. SSLv3 is enabled in WebSphere Business Services Fabric. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-3566 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566]\n\nDESCRIPTION: WebSphere Business Services Fabric could allow a remote attacker to obtain sensitive information, caused by a design error when using the SSLv3 protocol. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) attack to decrypt SSL sessions and access the plaintext of encrypted connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/97013 [https://exchange.xforce.ibmcloud.com/vulnerabilities/97013] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\n\n"}, {"filename": "swg21689730.txt", "chunk_id": "doc_20343_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability in SSLv3 affects WebSphere Dynamic Process Edition (CVE-2014-3566) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n SSLv3 contains a vulnerability that has been referred to as the Padding Oracle On Downgraded Legacy Encryption (POODLE) attack. SSLv3 is enabled in WebSphere Dynamic Process Edition. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-3566 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566]\n\nDESCRIPTION: WebSphere Dynamic Process Edition could allow a remote attacker to obtain sensitive information, caused by a design error when using the SSLv3 protocol. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) attack to decrypt SSL sessions and access the plaintext of encrypted connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/97013 [https://exchange.xforce.ibmcloud.com/vulnerabilities/97013] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\n"}, {"filename": "swg21689726.txt", "chunk_id": "doc_20342_chunk_0000", "text": "Title: IBM Security Bulletin: Vulnerability in SSLv3 affects WebSphere Lombardi Edition  (CVE-2014-3566) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n SSLv3 contains a vulnerability that has been referred to as the Padding Oracle On Downgraded Legacy Encryption (POODLE) attack. SSLv3 is enabled in WebSphere Lombardi Edition. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-3566 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566]\n\nDESCRIPTION: WebSphere Lombardi Edition could allow a remote attacker to obtain sensitive information, caused by a design error when using the SSLv3 protocol. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) attack to decrypt SSL sessions and access the plaintext of encrypted connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/97013 [https://exchange.xforce.ibmcloud.com/vulnerabilities/97013] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\nAFFECTED PRODUCTS AND VERSIONS\nThis vulnerability affects some versions and releases of WebSphere Lombardi Edition.\n\n"}]}, {"id": "TRAIN_Q431", "question": "Install path under \"Program Files\"\n\nMy path for the OS agent is e:\\Program Files\\IBM. Is there any issues or underlying problems if I install under \"Program Files\"? Just want to make sure no issues with a \"space\" in the install path.", "answer": "There is no explicit information about issues related to having a space in the install path under \"Program Files\". However, based on Document 1, it states that both paths containing spaces cause issues during installation and uninstallation. Therefore, it would be advisable to avoid using \"Program Files\" for installations and instead choose another directory like \"C:\\Program Files (x86)\\IBM\\ITM\" or create a separate directory without spaces.", "documents": [{"filename": "swg1IV32710.txt", "chunk_id": "doc_03390_chunk_0001", "text": "This happens\n     whether the install directory contains a space or the PATH\n     variable has a segment that contains a space. Uninstall may\n   also\n     fail if something is added after ITM that places an entry in\n   the PATH that contains a space or special character.\n   \n   Recreate Instructions:\n     Install into C:\\Program Files (x86)\\IBM\\ITM or have other\n     software that sets the PATH with a segment that contains a\n     space. Either causes the code to fail.\n   Local Fix:\n     Save the existing PATH variable as PATHX then provide a\n     temporary path of C:\\Windows;C:\\Windows\\system32. Once set\n     install the System Monitor Agent. When complete take the value\n     after the above and add it to the saved system path. Reset the\n     PATH variable to the new PATH variable. Same local fix may\n     have to be used to uninstall the System Monitor Agent.\n   After APAR is created, please email or ST me the number.\n   I have not tested the workaround, but I believe it will work\n   because it\n   eliminates the problem of the special character or blank.\n   ----------------------------------------------------------------\n   Additional notes:\n   When it failed, the install directory was left at the default\n   value of:\n"}, {"filename": "swg21961222.txt", "chunk_id": "doc_21815_chunk_0000", "text": "Title: IBM Trouble installing ITM on Windows OS - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Getting the below error when you try to install ITM on Window OS \n\n\"D:\\Program Files\\IBM\\ITM\" includes blanks. Due to your system settings the installation path cannot include blanks, please specify location with no spaces. \n\nSYMPTOM\nWhen you try to install ITM on \" C:\\Program Files\\IBM\\ITM\" it woks fine but when we try to install it on \"D:\\Program Files\\IBM\\ITM\" we get the below error:\n\n\n\"D:\\Program Files\\IBM\\ITM\" includes blanks. Due to your system settings the installation path cannot include blanks, please specify location with no spaces.\n\nIf you take out the spaces and use D:\\ProgramFiles\\IBM\\ITM, the install will continue. \n\n\nRESOLVING THE PROBLEM\n \n\nCouple of ways to fix this... \n\n \n\n1. Remove the space in the directory path and install the ITM on a directory without spaces. \n\nExample : D:\\IBM\\ITM \n\n \n\n2. Check the NTFS 8.3 name creation and enable the 8.3 naming creation to install the ITM on a directory path with spaces.\n\ncheck the value on the below registry location \n\n\nHKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem\\NtfsDisable8dot3NameCreation\n\n"}, {"filename": "swg21306734.txt", "chunk_id": "doc_11919_chunk_0005", "text": "Manager install root/Eclipse>, in the case of Windows, defaults to\nC:\\Program Files\\IBM\\Installation Manager\\eclipse, unless installed elsewhwere. \n\n\nIf this still does not help, contact the IBM Support Team for the relevant product and ask for IBM Installation Manager assistance to investigate further.\n\nRELATED INFORMATION\n#Relocate IBM Installation Manager agentDataLocation to [http://www.ibm.com/support/docview.wss?uid=swg21307121]\nFinding IBM Installation Manager troubleshooting logs [http://www.ibm.com/support/docview.wss?uid=swg21258203]"}, {"filename": "swg21290142.txt", "chunk_id": "doc_11701_chunk_0004", "text": " temporary folder.\n    \n    \n 5. Go to the temporary folder that you created in step 4 and execute install.exe (Windows) or install (UNIX) \n    \n    \n 6. Follow the instruction in the install wizard.\n    \n    Note: When the install wizard asks you for the install location, select the IBM Installation Manager <installation_folder> that was renamed in step 2.\n    \n    \n 7. Launch IBM Installation Manager after the installation.\n    \n    Note: The IBM Installation Manager.bak and the copied <installation_folder> in steps 1-2 can be removed once Installation Manager is fully functional. \n    \n    If this does not resolve the issue, copy the agentData folder and contact IBM Support. [http://www.ibm.com/software/support/help.html?ratlid=esrfooter] \n\nRELATED INFORMATION\n IBM Installation Manager Knowledge Center [http://www.ibm.com/support/knowledgecenter/SSDV2W/im_family_welcome.html]"}]}, {"id": "TRAIN_Q487", "question": "Security Bulletin: API Connect Portal is affected by multiple Drupal vulnerabilities\n\nI need to understand details regarding Security Bulletin: API Connect Portal is affected by multiple Drupal vulnerabilities (CVE-2017-6924, CVE-2017-6923, CVE-2015-7875, CVE-2017-6925). Where can I find this information?", "answer": "The information about the Security Bulletin: API Connect Portal being affected by multiple Drupal vulnerabilities (CVE-2017-6924, CVE-2017-6923, CVE-2015-7875, CVE-2017-6925) can be found in Document 1, which states \"IBM API Connect has addressed the following vulnerabilities. API Connect Portal is affected by multiple Drupal vulnerabilities.\" The specific details of each vulnerability are provided in subsequent documents such as Document 2, Document 3, and Document 4.", "documents": [{"filename": "swg22008323.txt", "chunk_id": "doc_25495_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Portal is affected by multiple Drupal vulnerabilities - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM API Connect has addressed the following vulnerabilities. \n\nAPI Connect Portal is affected by multiple Drupal vulnerabilities. \n\nVULNERABILITY DETAILS\nVulnerability Details \n\nCVEID:CVE-2017-6924 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-6924]\nDESCRIPTION:Drupal could allow a remote attacker to bypass security restrictions, caused by a flaw in the REST API. An attacker could exploit this vulnerability to post comments without permission.\nCVSS Base Score: 5.3\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/130573 [https://exchange.xforce.ibmcloud.com/vulnerabilities/130573]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N)\n\nCVEID:CVE-2017-6923 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-6923]\nDESCRIPTION:Drupal could allow a remote attacker to bypass security restrictions, caused by improperly restricting access control to the Ajax endpoint. By sending a specially-crafted request, an attacker could exploit this vulnerability to access the Ajax endpoint.\n"}, {"filename": "swg22008902.txt", "chunk_id": "doc_25557_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Portal is affected by multiple Drupal vulnerabilities - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM API Connect has addressed the following vulnerabilities. \n\nAPI Connect Portal is affected by multiple Drupal vulnerabilities. \n\nVULNERABILITY DETAILS\nCVEID:CVE-2017-6925 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-6925]\nDESCRIPTION:Drupal could allow a remote attacker to bypass security restrictions, caused by a flaw in the entity access system. An attacker could exploit this vulnerability to gain access to view, create, update, or delete entities.\nCVSS Base Score: 5.3\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/130574 [https://exchange.xforce.ibmcloud.com/vulnerabilities/130574]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N)\n\nCVEID:CVE-2017-6924 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-6924]\nDESCRIPTION:Drupal could allow a remote attacker to bypass security restrictions, caused by a flaw in the REST API. An attacker could exploit this vulnerability to post comments without permission.\nCVSS Base Score: 5.3\n"}, {"filename": "swg22015105.txt", "chunk_id": "doc_26159_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Developer Portal is affected by Drupal vulnerability (CVE-2018-7600) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM API Connect has addressed the following vulnerabilities. \n\nAPI Connect Developer Portal is impacted by Drupal vulnerability:\n\nDrupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system. \n\nVULNERABILITY DETAILS\n\nCVEID:CVE-2018-7600 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-7600]\nDESCRIPTION:Drupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system.\nCVSS Base Score: 9.8\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/140913 [https://exchange.xforce.ibmcloud.com/vulnerabilities/140913]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}, {"filename": "ibm10713449.txt", "chunk_id": "doc_00000_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Developer Portal is affected by multiple PHP vulnerabilities - United States\n\nText:\nIBM API Connect Developer Portal;IBM API Connect;USN-3646-1;API Connect Ubuntu PHP;API Connect PHP SECURITY BULLETIN\n\nSUMMARY\nIBM API Connect has addressed the following vulnerabilities.\n\nSeveral security issues were fixed in PHP's HTML-embedded scripting language interpreter.\n\n\nVULNERABILITY DETAILS\nCVEID: CVE-2018-10549 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-10549]\nDESCRIPTION: PHP could allow a remote attacker to execute arbitrary code on the system, caused by an out-of-bounds read in exif_read_data in ext/exif/exif.c. By sending specially crafted data, an attacker could exploit this vulnerability to mishandle the case of a MakerNote that lacks a final ''\\0'' character and execute arbitrary code on the system and cause a denial of service.\nCVSS Base Score: 7.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/142564 [https://exchange.xforce.ibmcloud.com/vulnerabilities/142564] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L)\n\n"}, {"filename": "swg22015829.txt", "chunk_id": "doc_26233_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Developer Portal is affected by a Drupal vulnerability (CVE-2018-7602) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM API Connect has addressed the following vulnerability.\n\nDrupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system. \n\nVULNERABILITY DETAILS\n\nCVEID:CVE-2018-7602 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-7602]\nDESCRIPTION:Drupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system.\nCVSS Base Score: 9.8\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/142366 [https://exchange.xforce.ibmcloud.com/vulnerabilities/142366]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}]}, {"id": "TRAIN_Q498", "question": "How do I reduce the amount of CPU being consumed by Just In Time (JIT) compilation?\n\nMy Portal system is experiencing period bursts of high CPU. After reviewing some data, I've determined the primarily culprit behind these CPU bursts are Just In Time (JIT) compilation threads, similar to the following:\n\n 3XMTHREADINFO      \"JIT Compilation Thread-0\"                          \n J9VMThread:0x0000000040004F00, j9thread_t:0x0000010010122040, \n java/lang/Thread:0x00000007011CAA58, state:CW, prio=10                 \n 3XMJAVALTHREAD            (java/lang/Thread getId:0x4, isDaemon:true)  \n 3XMTHREADINFO1            (native thread ID:0x39100EF, native priority:0xB, native policy:UNKNOWN)                      \nWhy is this happening and how can I reduce the amount of CPU that JIT is using?", "answer": "Based on the information provided, it seems that your IBM Portal system is experiencing high CPU consumption due to Just-In-Time (JIT) compilation threads. These threads are consuming significant CPU resources, leading to period bursts of high CPU usage.\n\nTo reduce the amount of CPU that JIT is using, you can try disabling the JIT compiler by appending the following JVM arguments to your startup script:\n\n```bash\n-Xjit:disableDeadTreeElimination\n```\n\nThis option disables the Dead Tree Elimination optimization, which can sometimes lead to high CPU usage when certain patterns of bytecode are encountered.\n\nAdditionally, you can adjust the native stack size to accommodate any recursive native calls that might be causing the stack overflow. Increasing the native stack size can help prevent crashes caused by depletion of the native stack.\n\nRemember to test these changes", "documents": [{"filename": "isg3T1024991.txt", "chunk_id": "doc_00277_chunk_0002", "text": "ocal/NFS file system, the java process could be consuming high CPU and the process threads consuming the CPU have thread stacks that are similar to:\n\nat java/io/UnixFileSystem.getBooleanAttributes0(Native Method)\nat java/io/UnixFileSystem.getBooleanAttributes(UnixFileSystem.java:254(Compiled Code))\nat java/io/File.isDirectory(File.java:855(Compiled Code))\n................\n\nor\n\nat java/io/UnixFileSystem.getBooleanAttributes0(Native Method)\nat java/io/UnixFileSystem.getBooleanAttributes(UnixFileSystem.java:239(Compiled Code))\nat java/io/File.exists(File.java:744(Compiled Code))\n................\n\nTo confirm this scenario, run the following command and look under the 'CP' column(gives % of CPU consumed on the system) in the output to determine which threads are using high CPU time:\n\n# ps -mp JAVA_PID -o THREAD\n\nIf you see small number of threads consuming high CPU, note their thread ids under the 'TID' column of the output and convert them into hexadecimal values.\n\n"}, {"filename": "swg1IV88941.txt", "chunk_id": "doc_04122_chunk_0001", "text": "ng sustained high CPU may look like this:\n   fixUpTree() // likely many frames of this\n   TR_EliminateDeadTrees::process()\n   .\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  This problem can be avoided using the Java command line option\n   -Xjit:disableDeadTreeElimination\n   Note that this may affect performance. This can be limited by\n   only applying the option to the method(s) experiencing the\n   problem.\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  Certain patterns of Java bytecodes can cause the JIT\n   optimization Dead Tree Elimination to get stuck iterating over\n   the same trees in an exponential walk, causing the optimization\n   and compilation to run for a very long time and give the\n   appearance of being stuck in an infinite loop. This causes the\n   JIT compilation thread compiling the method to sustain high CPU\n   usage and potentially prevent JVM shutdown.\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  Checks have been added to the Dead Tree Elimination optimization\n   to prevent the JIT compiler from getting stuck iterating over\n   the same trees in an exponential walk.\n   .\n   This APAR will be fixed in the following Java Releases:\n      7 R1 SR4 FP20  (7.1.4.20)\n      7    SR10 FP20 (7.0.10.20)\n      6 R1 SR8 FP60  (6.1.8.60)\n"}, {"filename": "isg3T1024513.txt", "chunk_id": "doc_00264_chunk_0004", "text": "lled synchronous compilation mode.\n\n-Xjit:count=0\n-Xjit:exclude={java/lang/Math.max*}(count=0,optLevel=hot)\n\n\n\n\n\n\nCommon Questions \n\n1. What is JIT?\n\nJIT stands for Just-In-Time compiler. The purpose of JIT is to compile code that is most frequently used to speed up subsequent calls to those methods. Long running applications will have the most benefit using JIT.\n\n2. When does code get compiled?\n\nClasses or methods that are frequently called will be compiled with the JIT automatically. The more frequently a method is called, the more aggressive the optimization will be. Thread stacks in a javacore that list “ (Compiled Code)” are already compiled.\n\n3. Is there a way to disable the Just-In-Time compiler?\n\nYes. Append one of the following to the generic JVM arguments.\n-Xint\n-Djava.compiler=NONE\n\nIn addition, the deprecated environment variable is still valid in IBM SDK 5.0 and 6.0, and can also be used to disable the JIT compiler:\n\nJAVA_COMPILER=NONE\n\n4. Can multiple options be combined in the same argument?\n\nYes. Here is the general syntax:\n\n-Xjit:param,param=value,...\n-Xjit:exclude={package/class.method}(param,param=value)...\n-Xjit:{package/class.method}(param,param=value),...\n\n"}, {"filename": "swg21974379.txt", "chunk_id": "doc_22680_chunk_0000", "text": "Title: IBM High CPU Noticed After Patching to IBM Sterling B2b Integrator 5.2.6.0 - United States\n\nText:\n5260; High CPU TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n After patching IBM Sterling B2b Integrator (ISBI) to version 5260, high CPU was noticed on the application server in which ISBI is installed on. \n\nSYMPTOM\nSustained CPU spike, of the noapp process. In this case the CPU was spiking 30-40% higher than noted in 525. \n\nOn Linux platforms this is captured with the \"top\" command. \n\nUsing \"top -H\" (show threads) the offending thread within the noapp JVM was found to be a perimeter dispatcher thread\n\n3XMTHREADINFO \"Dispatcher\" J9VMThread:0x00000000C1E87B00, j9thread_t:0x000000018384C580, java/lang/Thread:0x000000004814BED8, state:R, prio=5\n3XMJAVALTHREAD (java/lang/Thread getId:0x169, isDaemon:false)\n3XMTHREADINFO1 (native thread ID:0x49F0E1, native priority:0x5, native policy:UNKNOWN, vmstate:CW, vm thread flags:0x00000001)\n3XMCPUTIME CPU usage total: 343.139513000 secs, user: 93.042105000 secs, system: 250.097408000 secs\n3XMHEAPALLOC Heap bytes allocated since last GC cycle=30243608 (0x1CD7B18)\n3XMTHREADINFO3 Java callstack:\n4XESTACKTRACE at java/lang/Thread.sleep(Native Method)\n"}, {"filename": "swg21162896.txt", "chunk_id": "doc_10763_chunk_0003", "text": "n indicator of stack overflow. This is especially true if the stack appears to repeat (such as recursive method calls). \n\nJIT/HotSpot Compiled Code \n\nThe JIT/HotSpot compiler (JIT) is designed to speed up the JVM execution times by compiling method calls. This can speed up execution time, but as more aggressive optimizations are used, this can inadvertently cause recursion, resulting in stack overflow or crash. The documents linked below explain how to debug JIT and HotSpot compiler issues:  * JIT Problem Determination for IBM SDK 5.0 and 6.0 using -Xjit [http://www.ibm.com/support/docview.wss?rs=0&uid=swg21294023] \n * Debugging HotSpot failures on the Solaris and HP-UX operating environment [http://www.ibm.com/support/docview.wss?rs=0&uid=swg21081179]\n\n\n\nDepleted Native Stack \nIt is almost guaranteed that a crash will occur if the native stack runs out of space. System cores can be used to identify long and possibly recursively looping native thread stacks. \n\nTo resolve, increase the native stack size (usually by adjusting the operating system limit for stack size) to accommodate the recursive native calls; however, identifying the recursive native calls will help determine the root cause of the stack overflow. \n\n\n\n\n"}]}, {"id": "TRAIN_Q537", "question": "Netcool/Impact 6.1.0: How to change the HSQLDB password?\n\nNetcool/Impact 6.1.0: How to change the HSQLDB password?", "answer": "To change the HSQLDB password in NetCool/Impact 6.1.0:\n\n1. Connect to the database using the default ImpactServer name (NCI) and HSQLDB port number (5435).\n2. Execute the following SQL command to change the password:\n   ```\n   SET PASSWORD 'new_password';\n   ```\n\n3. Double-quote the password if necessary.\n\n4. Quit the connection.\n\n5. Log out of the database using the old password.\n\n6. Log back in using the new password.\n\nNote that editing the HSQLDB DataSource may also be required to allow connections with the new password.", "documents": [{"filename": "swg21967958.txt", "chunk_id": "doc_22221_chunk_0000", "text": "Title: IBM Change HSQLDB password - United States\n\nText:\nnetcool; impact; netcool/impact; nci; hsql; database; data; base; db; hsqldb; pass; word; password; pw; sa; system; admin; systemadmin; security; sec; authentication; auth; vulnerable; vulnerability; change; alter; update TECHNOTE (FAQ)\n\nQUESTION\n The default password does not fulfil corporate security requirements. \n\nCAUSE\nThe default password is blank\n\nANSWER\nLooking into guides for this third party software shows HSQLDB command line capability as being: \n\n * \n * SET PASSWORD\n * \n * \n * SET PASSWORD <password>;\n * \n * \n * Changes the password of the currently connected user. Password must be double quoted. Empty password can be set using \"\".\n\n\nAn example of changing the password in HSQLDB as above by connecting to the database: \n\n * \n * \n * \n * \n * \n\n\nand issuing the command: \n\n * \n\n\nquitting: \n\n * \n\n\nand logging back in with the new password: \n\n * \n * \n * \n * \n * \n\n\nThe above example login uses the default ImpactServer name (NCI) and HSQLDB port number (5435). The default password is blank. \n\nOne will have to edit the HSQLDB DataSource to enable it to connect to the database with the new password. \n\n"}, {"filename": "swg22004059.txt", "chunk_id": "doc_25106_chunk_0000", "text": "Title: IBM How to change hostname for an existing installation of Impact 7.1 - United States\n\nText:\nImpact; change; hostname TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n How to change hostname for an existing installation of Impact 7.1 Environment? \n\nRESOLVING THE PROBLEM\nStep1 : Stop both Impact and GUI server.\nStep2 : Update hostname on Impact host.\nStep3 : In a Netcool/Impact split installation, you can have an Impact\nServer server and a separate GUI Server server. If you need to change\nthe host name of the Impact Server server, enter the following command:\nOn the Impact Server server, run the nci_changehost script by entering\nthe command :$IMPACT_HOME/install/tools/nci_changehost\n\nIn a Netcool/Impact combined installation both the Impact Server and\nthe GUI Server are installed into the same home directory in the same\nserver. If you need to change the Impact Server host name, enter the\nfollowing command: On the server run the nci_changehost script, by\nrunning the command : $IMPACT_HOME/install/tools/nci_changehost\nnewhostname.server.com impactadminps\n\n"}]}, {"id": "TRAIN_Q583", "question": "Why does the ITCAM for AD Managing GUI install fail with an end-of-file message?\n\nI am trying to install the ITCAM for AD Managing server and I am seeing the following error when doing either 'launchpad.sh' or 'silent_MS_linux.bin': Initializing InstallShield Wizard........ Launching InstallShield Wizard........\n\n./setup_MS_lin.bin: line 1926: warning: here-document at line 1926 delimited by end-of-file (wanted `/dev/null')\n\nThe installer is unable to run in graphical mode. Try running the installer with the -console for -silent flag.", "answer": "The error message \"Initializing InstallShield Wizard........\" followed by \"Launching InstallShield Wizard........\" indicates that the installer is attempting to run in graphical mode, which is failing due to missing Linux system libraries. The installer is unable to run in graphical mode and requires the -console or -silent flag to be used instead. This issue is related to the compatibility between the ITCAM for AD Managing Server and the Linux operating system, specifically RHEL7. It is recommended to try running the installer with these flags to resolve the problem.", "documents": [{"filename": "swg21972260.txt", "chunk_id": "doc_22534_chunk_0000", "text": "Title: IBM Is using ITCAM for AD Managing Server v7.1.0.4 with RHEL7 supported? - United States\n\nText:\nRHEL7 MS MS v7.1.0.4 CAMADALL CAMADINST Centos TECHNOTE (FAQ)\n\nTHIS DOCUMENT APPLIES ONLY TO THE FOLLOWING LANGUAGE VERSION(S):\n US English \n\nQUESTION\n Is using the ITCAM for AD Managing Server (MS) v7.1.0.4 with RHEL7 supported? \n\nANSWER\n\nThe Managing Server MS v7.1.0.4 is supported with RHEL7 if using the GUI install with default MS_HOME values or by using the silent install to install the product.\n\nDefect 214904 has been opened for the MS v7.1.0.4 MS_HOME display input variable that cannot be changed on RHEL7. If you use the silent install, this is not an issue or if you use the default values in the GUI, this is not an issue, the product installs just fine on RHEL7.\n\nSo.. for now the RHEL7 OS is supported using the silent install or using the default MS_HOME values if using the GUI install.\n\nIn addition to RHEL7, we are now supporting Centos 7. However, you might get this pop-up warning during the install, which can be ignored for now.\n\n[/support/docview.wss?uid=swg21972260&aid=1] [/support/docview.wss?uid=swg21972260&aid=1]\n\n\n\n\nPRODUCT ALIAS/SYNONYM\n ITCAMfAD ITCAM4AD ITCAM for App Diagnostics"}, {"filename": "swg21985630.txt", "chunk_id": "doc_23668_chunk_0000", "text": "Title: IBM Using launchpad.sh or silent_MS_linux.bin results in end-of-file message. - United States\n\nText:\nITCAM compat-libstdc++ libstdc++ libraries silent_MS_linux.bin launchpad.sh errors TECHNOTE (TROUBLESHOOTING)\n\nTHIS DOCUMENT APPLIES ONLY TO THE FOLLOWING LANGUAGE VERSION(S):\n US English \n\nPROBLEM(ABSTRACT)\n Using the DC or MS 'launchpad.sh' script results in the following error message:\n./setup_MS_lin.bin: line 1926: warning: here-document at line 1926 \ndelimited by end-of-file (wanted `/dev/null') \n\nSYMPTOM\nThe following error is seen running when doing either 'launchpad.sh' or 'silent_MS_linux.bin': \n\n Initializing InstallShield Wizard........ \nLaunching InstallShield Wizard........ \n\n./setup_MS_lin.bin: line 1926: warning: here-document at line 1926 \ndelimited by end-of-file (wanted `/dev/null') \n\nThe installer is unable to run in graphical mode. Try running the \ninstaller with the -console for -silent flag.\n\n\nCAUSE\nMissing Linux system libraries.\n\n\nENVIRONMENT\nLinux - RHEL6.x and RHEL7.x 64-bit versions.\n\n\n\n"}, {"filename": "swg21469762.txt", "chunk_id": "doc_14355_chunk_0000", "text": "Title: IBM Graphical User Interface (GUI) Installation of ITCAM Data Collector Fails on 64 bit Linux Operating System - United States\n\nText:\nITCAM; J2EE; WAS; 64-bit Linux; GUI Installer TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Version 6.1 ITCAM for J2EE and ITCAM for WebSphere installer bundles and uses a 32-bit JRE to start GUI installer. On a 64-bit Linux OS, sometimes, the X11 libraries required by 32-bit JRE are not present so the GUI installer fails to start. \n\nSYMPTOM\nAfter issuing setup_DC_lin.bin from DC installation directory, you may get following error message: \n\n\"The installer is unable to run in graphical mode. Try running the installer with the -console or -silent flag.\"\n\n\n\nRESOLVING THE PROBLEM\n1. Perform silent installation. \n\n2. You can use 64-bit JDK/JRE to start GUI installer if 64-bit JDK/JRE is already installed on your machine, switch to DC installation directory and issue:\n\nsetup_DC_lin.bin -is:javahome $JDK_HOME\n\nNote that $JDK_HOME is 64-bit JDK installation directory \n\n \n\n3. If 64-bit JDK/JRE is not present on your machine, follow steps below to downlaod and use 64-bit JDK/JRE to start GUI installer:\n\n"}, {"filename": "swg21613030.txt", "chunk_id": "doc_17121_chunk_0000", "text": "Title: IBM ITCAM for AD 7.1.x Managing Server Install Verification - United States\n\nText:\nITCAM MS INSTALL CAMADMSINST CAMADMSENV TECHNOTE (TROUBLESHOOTING)\n\nTHIS DOCUMENT APPLIES ONLY TO THE FOLLOWING LANGUAGE VERSION(S):\n US English \n\nPROBLEM(ABSTRACT)\n How to verify a successful install of the ITCAM 7.1.x Managing Server Installation \n\nRESOLVING THE PROBLEM\n1. For MS, log onto the MS console (e.g. URL <hostname>.com:9080/am/home\nwhere 9080 is the default port) \n\n2. Go to the Administration Tab > Managing Server > Self-Diagnosis\n\n3. Here you should see the following components connected and running,\n- 1 Kernel\n- 2 Archive Agents\n- 2 Publish Servers\n- 1 Global Publish Server\n- 1 Message Dispatcher\n\n4. An alternate way to verify installation is to open up a terminal and navigate to the MS_HOME/bin directory and run 'am-status.sh' \n\n \n\nPRODUCT ALIAS/SYNONYM\n ITCAM ITCAM4AD ITCAM for App Diagnostics"}]}, {"id": "TRAIN_Q599", "question": "ICC configuration manager error: This implementation is not part of the Windows Platform FIPS validated cryptographic algorithms.\n\nWhen saving changes in ICC configuration manager, an \"Application Error\" window pops up.\n\nError:\n\nA severe error occurred.\n\nProblem:\n\nException has been thrown by the target of an invocation.\n\nSolution:\n\nContact IBM Software Support with this error message (see Details).\n\nClick on the Details button and the following stack trace is reported:\n\nDetails\n\nSystem.Reflection.TargetInvocationException: Exception has been thrown by the target of an invocation. at System.RuntimeMethodHandle.InvokeMethod(Object target, Object[] arguments, Signature sig, Boolean constructor) at System.Reflection.RuntimeConstructorInfo.Invoke(BindingFlags invokeAttr, Binder binder, Object[] parameters, CultureInfo culture)\n\n.....\n\n.....\n\nSystem.InvalidOperationException: This implementation is not part of the Windows Platform FIPS validated cryptographic algorithms.\n\nat System.Security.Cryptography.MD5CryptoServiceProvider..ctor()\n\nWhat is causing this?", "answer": "The error message indicates that the implementation being used does not comply with the Windows Platform FIPS validated cryptographic algorithms. Specifically, it mentions that SHA-1 managed class cannot be instantiated due to this issue. This problem seems to occur during the process of saving changes in the ICC configuration manager, leading to an exception being thrown. To resolve this issue, contact IBM Software Support with the details provided in the error message.", "documents": [{"filename": "swg21991690.txt", "chunk_id": "doc_24142_chunk_0000", "text": "Title: IBM Application Error in IBM Content Collector Configuration Manager when saving a task route - United States\n\nText:\nicc; fips; md5 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n An application error is reported in the IBM Content Collector (ICC) configuration manager when you try to save a task route or other settings. \n\nSYMPTOM\nThe pop up window shows the following message: \n\n * \n * Error: \n * \n   A severe error occurred.\n   \n   \n * Problem:\n * \n   Exception has been thrown by the target of an invocation.\n   \n   \n * Solution:\n * \n   Contact IBM Software Support with this error message (see Details).\n\n\nClick on the Details button and the following stack trace is reported:  \n\n * Details\n * System.Reflection.TargetInvocationException: Exception has been thrown by the target of an invocation.\n   at System.RuntimeMethodHandle.InvokeMethod(Object target, Object[] arguments, Signature sig, Boolean constructor)\n   at System.Reflection.RuntimeConstructorInfo.Invoke(BindingFlags invokeAttr, Binder binder, Object[] parameters, CultureInfo culture)\n   .....\n   .....\n   System.InvalidOperationException: This implementation is not part of the Windows Platform FIPS validated cryptographic algorithms.\n"}, {"filename": "swg21985877.txt", "chunk_id": "doc_23690_chunk_0000", "text": "Title: IBM Microsoft .Net Framework error when saving a chart in IBM i2 Analyst's Notebook - United States\n\nText:\ni2 ANB; ANBP; security; FIPS TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When saving a chart in i2 Analyst's Notebook, the user receives a .Net Framework error, \"Unhandled Exception has occured in a component in your application.\" The environment is required to have FIPS (Federal Information Processing Standard) enabled via Group Policy Security Settings/Local Policies/Security Options/System cryptography: \nUse FIPS compliant algorithms for encryption, hashing and signing = Enabled .\n\n\nSYMPTOM\n\n[/support/docview.wss?uid=swg21985877&amp;aid=1]\n\n************** Exception Text **************\nSystem.InvalidOperationException: This implementation is not part of the Windows Platform FIPS validated cryptographic algorithms.\nat System.Security.Cryptography.SHA1Managed..ctor()\na const key='judge-final-validation-2-'+base.sample_fingerprint;
let reviews=JSON.parse(JSON.stringify(base.reviews));
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)reviews=saved;}catch(e){}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function save(){localStorage.setItem(key,JSON.stringify(reviews));updateProgress();}
function field(id,name,value){reviews[id][name]=value;save();}
function render(){
 const root=document.getElementById('root');root.innerHTML='';
 cases.forEach((c,i)=>{let d=document.createElement('div');d.className='case';
 let docs=c.documents.map((x,j)=>`<details><summary>문서 ${j+1} · ${esc(x.filename)} · ${esc(x.chunk_id)}</summary><pre>${esc(x.text)}</pre></details>`).join('');
 let r=reviews[c.id];
 d.innerHTML=`<div class="id">${i+1}/${cases.length} · ${esc(c.id)}</div><p><b>질문</b></p><pre>${esc(c.question)}</pre><p><b>LLM 답변</b></p><pre>${esc(c.answer)}</pre><div class="docs"><b>RAG 근거 문서</b>${docs}</div>
 <p><label>최종 판정</label><select data-f="human_pass"><option value="">선택</option><option value="pass" ${r.human_pass==='pass'?'selected':''}>PASS</option><option value="fail" ${r.human_pass==='fail'?'selected':''}>FAIL</option></select>
 <label>원인</label><select data-f="root_cause"><option value=""></option>${['evidence','semantic','generation','other'].map(x=>`<option value="${x}" ${r.root_cause===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>위험도</label><select data-f="risk_level"><option value=""></option>${['low','medium','high'].map(x=>`<option value="${x}" ${r.risk_level===x?'selected':''}>${x}</option>`).join('')}</select></p>
 <label>판정 근거 / 실패 이유</label><textarea data-f="failure_reason">${esc(r.failure_reason)}</textarea>
 <label>상세 원인</label><textarea data-f="root_cause_detail">${esc(r.root_cause_detail)}</textarea>
 <label>개선사항</label><textarea data-f="proposed_fix">${esc(r.proposed_fix)}</textarea>
 <label>최종 평가 문장</label><textarea data-f="final_assessment">${esc(r.final_assessment)}</textarea>`;
 d.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('change',()=>field(c.id,el.dataset.f,el.value)));
 d.querySelectorAll('textarea[data-f]').forEach(el=>el.addEventListener('input',()=>field(c.id,el.dataset.f,el.value)));
 root.appendChild(d);
 });updateProgress();}
function updateProgress(){let done=Object.values(reviews).filter(x=>x.human_pass==='pass'||x.human_pass==='fail').length;document.getElementById('progress').textContent=`판정 ${done}/${cases.length}`;}
function exportJson(){
 const missing=Object.entries(reviews).filter(([id,r])=>!['pass','fail'].includes(r.human_pass));
 if(missing.length){alert(`PASS/FAIL 미입력 ${missing.length}건: `+missing.slice(0,8).map(x=>x[0]).join(', '));return;}

}
