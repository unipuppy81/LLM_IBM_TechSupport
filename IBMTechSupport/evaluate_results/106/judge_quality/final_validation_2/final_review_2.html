<script>
const cases=[{"id": "DEV_Q021", "question": "How to refresh a DataPower WebService Proxy which WSDL got changed?\n\nI have made changes to a WSDL stored in DP local filesystem.\n\nHow can I make the WSP reflect this change since DataPower Gateway 7.1.0 WebService Proxy WebGUI doesn't offer the \"Refresh\" button anymore?\n\nIs there a best practice to refresh the WSP if I modified my WSDL?", "answer": "To refresh a DataPower WebService Proxy (WSP) with a changed WSDL:\n\n1. Ensure all configuration changes have been saved.\n2. Remove the WSDL from the WS-Proxy configuration via the WebGUI:\n   - Click Control Panel > Web Service Proxy > Edit appropriate WS-Proxy\n   - Remove the appropriate WSDL from the list of configured WSDLs\n   - Click Apply and Save the configuration changes\n3. Add the updated WSDL back into the WS-Proxy configuration via the WebGUI:\n   - Click Add WSDL\n   - Select the new WSDL file from the local filesystem\n   - Follow any additional prompts or configurations required by the WSDL\n\nRegarding best practices for refreshing the WSP when modifying the WSDL:\n\n1. Always save your configuration", "documents": [{"filename": "swg21330218.txt", "chunk_id": "doc_12209_chunk_0000", "text": "Title: IBM Replacing or updating a WSDL attached to a Web Service Proxy - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n You uploaded your modified WSDL to File Management as a way to update the Web Service Proxy (WS-Proxy) but these WSDL changes did not take effect. \n\nCAUSE\nOnce a WSDL has been compiled and attached to a WS-Proxy, DataPower will not recompile it unless a WSDL Cache Policy is being used or the WSDL is detached from the WS-Proxy and then reattached.\n\nRESOLVING THE PROBLEM\nThe following steps should be followed when updating a WSDL attached to a WS-Proxy: \n\n 1. Ensure all configuration changes have been saved. By doing this, your configuration changes will be persisted should the device reboot or reload. \n 2. Remove the WSDL to be updated from the WS-Proxy configuration. This can be done from the WebGUI using these steps:  1. Click Control Panel \n     2. Click on Web Service Proxy \n     3. Click to edit the appropriate WS-Proxy \n     4. Remove the appropriate WSDL from the list of configured WSDLs displayed. \n     5. Click Apply and Save the configuration changes you just made\n    \n    \n 3. From the Configure Web Service Proxy screen, click Add WSDL to add the updated WSDL. \n"}, {"filename": "swg21298897.txt", "chunk_id": "doc_11808_chunk_0000", "text": "Title: IBM WSDL Cache Policy not refreshing from WSDL in local:/// directory - United States\n\nText:\ndatapower; wsdl cache refresh; wsdl; cache; refresh TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n You created a Web Service Proxy (WS Proxy) based on a .wsdl file and want to refresh when there are changes in the .wsdl file. The file is located on the DataPower appliance under the \"local\" directory. You created a WSDL Cache Policy to specify the local .wsdl file for the URL Match expression, but the web service proxy state is not being refreshed when there are changes in the file. \n\nSYMPTOM\nThe WSDL Cache Policy is not refreshing from a WSDL in the local:/// directory.\n\n\nRESOLVING THE PROBLEM\nIn a WS Proxy, you can refresh WSDL from an URL using WSDL Cache policy. However, if the WSDL is hosted on the DataPower appliance, such as in local:///, rather than on an external URL, the WSDL Cache Policy does not apply. \n\nFor instance, changes made to local:///test.wsdl are not picked up by WS Proxy although there is a WSDL Cache policy setting the URL Match expression to local:///test.wsdl. \n\n"}, {"filename": "swg21384937.txt", "chunk_id": "doc_12675_chunk_0001", "text": "to Off so DataPower does not try to reload the WSDLs in the event that an error occurs. To enable this option, follow these steps. From the WebGUI: \n\n1. Click OBJECTS -> Web Service Proxy (Service Configuration section)\n2. Click to edit the appropriate Web Service Proxy\n3. The Automatic Retry option can be found on the Main tab."}, {"filename": "swg21574515.txt", "chunk_id": "doc_16009_chunk_0000", "text": "Title: IBM DataPower Web Service Proxy Local Endpoint Handler disappears when updates are made on the remote WSDL - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The WSP Local Endpoint Handler seems to disappear or gets un-configured on the WebSphere DataPower WebGUI after certain updates are made on the remote WSDL \n\nSYMPTOM\nAfter certain updates are made on the remote WSDL, the WSP Local Endpoint Handler seems to disappear or get un-configured on WebGUI.\n\n\nDIAGNOSING THE PROBLEM\nIf the WSDL cannot compile, the endpoint handler will not be displayed on the WebGUI; however, it should still be there in the configuration.\n\nRESOLVING THE PROBLEM\nCheck at CLI outputs after executing the show wsm-endpoint command and the objects should be there. If the WSDL is then fixed and refreshed again, the endpoint handler should reappear on the WebGUI."}]}, {"id": "DEV_Q026", "question": "DNS cache is not updating even when DNS server is updated\n\n\n\nDatapower DNS is still showing old IP address even after the DNS server was changed few days ago.\n\nHow can i change DNS cache so it shows the new IP Address?", "answer": "To change the DNS cache so it shows the new IP address, follow these steps:\n\n1. Edit the <gis install directory>/jdk/jre/lib/security/java.security file and update the networkaddress.cache.ttl parameter to -1.\n2. Restart the GIS service for the settings to take effect.\n3. Configure the DNS query cache on the iSeries using the CHGTCPDMN command. Execute the command with no parameters to clear the cache.", "documents": [{"filename": "swg21563484.txt", "chunk_id": "doc_15758_chunk_0000", "text": "Title: IBM GIS DNS cache never updates an IP after a DNS name IP changes - United States\n\nText:\nSTERLINGHTG TECHNOTE (FAQ)\n\nQUESTION\n GIS DNS cache never updates an IP after a DNS name IP changes \n\nANSWER\n\n\nBy Default Java uses an infinite time storage for the DNS cache. To change this you need to edit the <gis install directory>/jdk/jre/lib/security/java.security file and update the following parameter after uncommenting it. GIS will need to be restarted for this setting to take effect.\n\nnetworkaddress.cache.ttl=-1\n\n#\n# The Java-level namelookup cache policy for successful lookups:\n#\n# any negative value: caching forever\n# any positive value: the number of seconds to cache an address for\n# zero: do not cache\n#\n# default value is forever (FOREVER). For security reasons, this\n# caching is made forever when a security manager is set.\n#\n# NOTE: setting this to anything other than the default value can have\n# serious security implications. Do not set it unless \n# you are sure you are not exposed to DNS spoofing attack.\n#\n\n \n\nHISTORICAL NUMBER\n HTG1356"}, {"filename": "nas8N1014402.txt", "chunk_id": "doc_00496_chunk_0002", "text": "ddress. This means that the Access for Windows connections kept trying to connect to the old IP address that was being recalled from the DNS server.\n\nTo address this issue, the user attempted to bypass the Host Name look-up to the DNS server by changing the connection still defined to the Host Name of 'iseries' to an IP address look-up frequency of 'Never - specify IP address and entering the new IP address'. This worked with partial success.\n\nNon-Access for Windows Navigator functions like PC5250, Data Transfer, and so on, worked; however, there was significant difficulty with Navigator functions. First, if Navigator was not closed and reopened after making this change, Navigator functions do not work. They fail with a message similar to \"CWBCO1048 - A time-out occurred trying to connect\". If Navigator is not restarted after making the change, it continues to recall the previous setting and communicates to the DNS server and retrieves the old IP address and attempts to connect to that.\n\n"}, {"filename": "swg21392259.txt", "chunk_id": "doc_12800_chunk_0000", "text": "Title: IBM FileNet P8 Business Process Manager: Process Engine client is caching incorrect DNS entry for Process Engine server - United States\n\nText:\nDNS; caching TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When Process Engine (PE) fails over to a different node or IP address is changed, the PE clients such as router or component manager still use the old address, even though the DNS entry for the PE server name is updated \n\nSYMPTOM\nIf you initially start a Process Engine client such as a router, component manager or even the CE, it will look up the ip address of the Process Engine server in DNS. Then if the Process Engine fails over to or is switched to a different node, the client will still try to use the old address even though the DNS is updated to point to the new node's IP address, causing a connection error.\n\n\nCAUSE\nThis is due to the DNS caching mechanism within Java. \n\nTo configure your applications for correct failover in this type of environment you must set the Time-To-Live (TTL) setting for host name caching on the client application, such as Application Engine, to a value that is equal to or less than the TTL for the DNS server. "}, {"filename": "nas8N1017819.txt", "chunk_id": "doc_00560_chunk_0000", "text": "Title: IBM DNS Query Returning Old IP Address - United States\n\nText:\nDNS TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n This document describes how to clear the DNS Query cache on the iSeries. \n\nRESOLVING THE PROBLEM\nThe iSeries acts as a DNS \"client\" (also called \"resolver\"), it caches the responses it receives; much like a DNS server does to queries it makes to other DNS servers. There is a way to clear that cache, without having to IPL. \n\nExecute the Change TCP/IP Domain (CHGTCPDMN) command with no parameters to do this. From the operating system command line, type the following:\n\nCHGTCPDMN\n\nPress the Enter key.\n\nNote: This only clears the cache of the OS/400 system's DNS \"client\" resolver; it does not clear the cache of any DNS \"server\" that may also be running on the same machine. DNS servers can only have their caches flushed by ending them and starting them back up. Also, after issuing this command, you should sign off your interactive session and then sign back on to make the changes take effect for your interactive session.\n\n\n\nHISTORICAL NUMBER\n 19154406"}]}, {"id": "DEV_Q107", "question": "Why the exception \"BO Service is not supported or disabled in this profile\" when trying to publish from IID to a local Process Server?\n\nWhen trying to publish a project from IBM Integration Designer (IID) to the local Process Server, it fails with error ADMA5014E in SystemOut.log. The FFDC log is showing exception of BO Service is not supported or disabled in this profile; Trace:\n\nFFDC Exception:java.lang.ExceptionInInitializerError SourceId:com.ibm.ws.bpm.cmdfrmwrk.task.WBICleanupTask ProbeId:200 java.lang.ExceptionInInitializerError at java.lang.J9VMInternals.initialize(J9VMInternals.java:259) \n....\nCaused by: java.lang.IllegalStateException: BO Service is not supported or disabled in this profile. at com.ibm.ws.bo.BOCore.init(BOCore.java:107) ....", "answer": "The error message \"BO Service is not supported or disabled in this profile\" indicates that the Business Object Services (BO) component required for publishing from IBM Integration Designer (IID) to the local Process Server is either not installed or disabled on the server where the process server is running. This can be due to various reasons such as missing installation during setup, incorrect configuration settings, or issues with the server's software stack.\n\nTo resolve this issue, ensure that the BO service is properly installed and enabled on the target server. You may need to reinstall the BO services or check if there are any updates available for your server's operating system or middleware components that could affect the BO service functionality. Additionally, verify that the necessary permissions and configurations are set up correctly for enabling the BO service on the server.", "documents": [{"filename": "swg21580533.txt", "chunk_id": "doc_16202_chunk_0001", "text": "ang.RuntimeException: Error serializing BO BusinessObject: @29152915 ....\n\nAdditonally, a FFDC file is generated, containing the following errors: \n\n\n[2/23/12 12:25:36:174 EST] FFDC Exception:java.lang.RuntimeException SourceId:com.ibm.ws.uow.UOWManagerImpl.runUnderCurrentUOW ProbeId:1130 Reporter:com.ibm.ws.uow.UOWManagerImpl@76d476d4\njava.lang.RuntimeException: Error serializing BO BusinessObject: @29152915 \n...\nat com.ibm.ws.bo.service.BOXMLSerializerImpl.save\n(BOXMLSerializerImpl.java:559)\nat com.ibm.ws.bo.service.BOXMLSerializerImpl.writeDataObject\n(BOXMLSerializerImpl.java:208)\nat com.ibm.ws.bo.delegate.BOXMLSerializerDelegate.writeDataObject\n(BOXMLSerializerDelegate.java:110)\nat com.ibm.ws.sibx.smobo.util.XMLSerialisationHelper.writeOutputStream\n(XMLSerialisationHelper.java:288)\nat com.ibm.ws.sibx.smobo.util.XMLSerialisationHelper.writeString\n(XMLSerialisationHelper.java:202)\nat com.ibm.ws.sibx.mediation.primitives.logger.MessageLoggerMediation.\nstoreMessage(MessageLoggerMediation.java:1376) \n\n"}]}, {"id": "DEV_Q109", "question": "Help with Security Bulletin: Authentication vulnerability affects IIB V10.0.0.4 onwards (CVE-2016-8918 )\n\nI need to understand details regarding Security Bulletin: Authentication vulnerability affects IBM Integration Bus V10.0.0.4 onwards (CVE-2016-8918 ). Where can I find this information?", "answer": "The authentication vulnerability affecting IBM Integration Bus V10.0.0.4 onwards (CVE-2016-8918) was discovered in non-default configurations of IBM Integration Bus. The vulnerability allows a remote user to authenticate without providing valid credentials. To mitigate this issue, ensure proper configuration settings are applied. For more detailed information, refer to the IBM Security Bulletins available at the provided links.", "documents": [{"filename": "swg21995079.txt", "chunk_id": "doc_24398_chunk_0000", "text": "Title: IBM Security Bulletin: Authentication vulnerability affects IBM Integration Bus  V10.0.0.4 onwards (CVE-2016-8918 ) - United States\n\nText:\nWMB IIB SECURITY BULLETIN\n\nSUMMARY\n Web user accounts can be authenticated against an LDAP server, in IBM Integration Bus V10.0.0.4 and later versions. However, under some circumstances it is possible for a remote user to be authenticated without providing valid credentials. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2016-8918 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-8918]\nDESCRIPTION: In non-default configurations, IBM Integration Bus could allow a remote user to authenticate without providing valid credentials.\nCVSS Base Score: 5.9\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/118528 [https://exchange.xforce.ibmcloud.com/vulnerabilities/118528] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Integration Bus V10\n\nREMEDIATION/FIXES\n \n\n"}, {"filename": "swg22009250.txt", "chunk_id": "doc_25589_chunk_0000", "text": "Title: IBM Security Bulletin: IBM Integration Bus is affected by an Apache Tomcat related vulnerability (CVE-2017-7674) - United States\n\nText:\nIIB SECURITY BULLETIN\n\nSUMMARY\n IBM Integration Bus is affected by an Apache Tomcat related vulnerability (CVE-2017-7674). \n\nVULNERABILITY DETAILS\nCVEID: CVE-2017-7674 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-7674]\nDESCRIPTION: Apache Tomcat could provide weaker than expected security, caused by the failure to add an HTTP Vary header to indicate that the response varies depending on Origin by the CORS Filter. A remote attacker could exploit this vulnerability to conduct client and server side cache poisoning.\nCVSS Base Score: 7.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/130248 [https://exchange.xforce.ibmcloud.com/vulnerabilities/130248] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L) \n\nAFFECTED PRODUCTS AND VERSIONS\nIBM Integration Bus V9.0.0.0 - V9.0.0.8 and V10.0.0.0 - V10.0.0.9 \n\nREMEDIATION/FIXES\n \n\n"}, {"filename": "swg21969672.txt", "chunk_id": "doc_22361_chunk_0000", "text": "Title: IBM Security Bulletin: WebSphere Message Broker and IBM Integration Bus are affected by confidentiality vulnerability (CVE-2015-7399) - United States\n\nText:\nWMB IIB SECURITY BULLETIN\n\nSUMMARY\n WebSphere Message Broker and IBM Integration Bus could allow a potential attacker to identify the technology used to handle incoming HTTP requests \n\nVULNERABILITY DETAILS\nCVEID: CVE-2015-7399 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-7399]\nDESCRIPTION: IBM Integration Bus could allow a potential attacker to identify the technology used to handle incoming HTTP requests. This could allow them to search for other known vulnerabilities to exploit.\nCVSS Base Score: 5.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/107104 [https://exchange.xforce.ibmcloud.com/vulnerabilities/107104] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n IBM Integration Bus V9, V10 \n\n WebSphere Message Broker V8, V7\n\nREMEDIATION/FIXES\n \n\n"}, {"filename": "swg21961734.txt", "chunk_id": "doc_21839_chunk_0000", "text": "Title: IBM Security Bulletin: Websphere Message Broker and IBM Integration Bus are affected by access control  vulnerability (CVE-2015-2018) - United States\n\nText:\nWMB IIB SECURITY BULLETIN\n\nSUMMARY\n Websphere Message Broker and IBM Integration Bus are affected by access control vulnerability. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2015-2018 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-2018]\nDESCRIPTION: IBM Integration Bus can give incorrect results when using multiple security profiles, which could allow an authenticated user to obtain sensitive information about other users.\nCVSS Base Score: 3.5\nCVSS Temporal Score: See http://xforce.iss.net/xforce/xfdb/103993 [http://xforce.iss.net/xforce/xfdb/103993] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:S/C:P/I:N/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n IBM Integration Bus V10 \n\n IBM Integration Bus V9 \n\n WebSphere Message Broker V8 \n\n WebSphere Message Broker V7\n\nREMEDIATION/FIXES\n \n\n"}]}, {"id": "DEV_Q154", "question": "Why are some Datatypes corrupt after Impact cluster failover/failback ?\n\n\n\nRunning Impact 7.1.0.11. The symptom is whenever Impact does a failover, a couple DataTypes\nturn out empty.\n\nI've checked the type files before and after Impact failover and the difference happens in the property\n\n*.SQL.USERPARAMETERS\n\nThis property no longer exists for the corrupted datatypes\".", "answer": "Some DataTypes become corrupt after an Impact cluster failover/failback because the *.SQL.USERPARAMETERS property no longer exists for the corrupted datatypes. To resolve this issue, add the property to the $NCHOME/impact/etc/<SERVERNAME>_server.props file, where the size limit can be 8192, 16384, 32768, etc., and restart the ImpactServer(s) to enable the change. Ensure there are no trailing white-space characters on the property as these invalidate properties in lower versions of Impact.", "documents": [{"filename": "swg21598417.txt", "chunk_id": "doc_16683_chunk_0000", "text": "Title: IBM DataType incorrect on Secondary - United States\n\nText:\nnetcool; impact; netcool/impact; nci; data; type; datatype; .type; replication; cluster; sync; error; 500; mark; invalid TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The DataType is not being correctly replicated across the ImpactServer Cluster \n\nSYMPTOM\nThe .type file of the Secondary ImpactServer configuration is truncated with the error message: \n\n * \n * \n\n\nCAUSE\nAPAR \"IZ81446: IMPACT 511 CLUSTER UNABLE TO REPLICATE DATATYPES WITH USERPARMETERS VALUES IN EXCESS OF 16,000 CHARACTERS.\" [link below] \n\n\n\n\n\nRESOLVING THE PROBLEM\nAdditional comments associated with APAR IZ81446 release notes: \n\n\n\"a new property is added to increase the file size limit:\n\n\n\n * \n\n\nAdd the property to $NCHOME/impact/etc/<SERVERNAME>_server.props file \nwhere size limit can be 8192, 16384, 32768, etc.. \" \n\nThe property would have to be added to all ImpactServers in the Cluster and would require a restart to enable - ensuring that the ImpactServer started as Primary had the correct, uncorrupted .type file to be replicated across the Cluster. Also ensure that there are no trailing white-space characters on the property as these invalidate properties in lower versions of Impact. \n\n"}, {"filename": "swg21588811.txt", "chunk_id": "doc_16400_chunk_0000", "text": "Title: IBM Existing DataType no longer visible through GUI client - United States\n\nText:\nnetcool; impact; netcool/impact; nci; data; type; types; datatype; datatypes; missing; vanish; vanished; gone; deleted; disappear; disappeared; it is an ex-datatype TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Error produced in netcool.log and netcool-errors.log:\nERROR [TaskPaneServlet] Could not get DataTypes for DataSource: <DataSourceName> \n\nSYMPTOM\nThe DataType is not visible in GUI and the Client is unable to save any new DataTypes that are subsequently created.\n\n\nCAUSE\nCorruption of the existing DataType has occurred (potentially as a result of an ungracious shutdown during editing) and this means the ImpactServer GUI cannot load the corrupted .type file and this also prevents saving of new DataTypes.\n\nDIAGNOSING THE PROBLEM\nExamine the .type file of the DataType in question for any missing properties or values or incomplete lines.\n\nRESOLVING THE PROBLEM\nThe DataTypes are corrupted and require a manual rebuild to resolve. This must be performed while the ImpactServer or the Cluster (if there is more than one ImpactServer) is shutdown.\n\n\n\n\n\nThe DataType .type files reside in the directory:\n\n\n\n * \n\n\n"}, {"filename": "swg1IZ81446.txt", "chunk_id": "doc_05145_chunk_0000", "text": "Title: IBM IZ81446: IMPACT 511 CLUSTER UNABLE TO REPLICATE DATATYPES WITH USERPARMETERS VALUES IN EXCESS OF ~16,000 CHARACTERS. - United States\n\nText:\n SUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Netcool/Impact 5.1.1 (both base build and Fix Pack 1) attempting\n   to replicate a DataType with a USERPARMETERS property value in\n   excess of ~16,300 characters fails upon encountering the\n   parameter and the Secondary ImpactServer DataType .type file\n   is truncated and contains the line:\n   \n   Error=500: Mark invalid\n   \n   instead of the USERPARMETERS property.  This adversely affects\n   both resilience and the operation of the Secondary ImpactServer\n   in load balancing as the DataType is rendered useless on the\n   Secondary ImpactServer and any drop and recovery of the\n   Primary ImpactServer would lose the correct configuration all\n   together.\n   \n   The USERPARAMETERS property is the record of the fields in the\n   target database table that mapped by the DataType.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg24039742.txt", "chunk_id": "doc_27008_chunk_0045", "text": "tting, i.e. if no valid FAILOVERPOLICY\nexists, then if DISABLEFAILOVER is true, FAILOVERPOLICY \nwill be set to DISABLED. If DISABLEFAILOVER is false,\nFAILOVERPOLICY will be set to FAILOVER\n\nTake good note of the above. It means that existing data\nsources will have a new FAILOVERPOLICY set, when they are\nfirst saved via the GUI. Previously if FAILOVERPOLICY was\nnot valid, Impact assumed FAILOVER. But if you edit a data\nsource, and the data source has DISABLEFAILOVER = true,\nand no valid policy set, then the new value for\nFAILOVERPOLICY is DISABLED. This is correct behaviour, but\ndifferent to before. The best was to avoid any confusion,\nit to check each .ds file and ensure that a valid\nFAILOVERPOLICY is set. Do this either by editing the files\n(in which case a Data Server restart is required) or by\nopening each data source in the GUI. Not all Data Sources\nwill appear in the GUI (as some are built in). For these,\ncheck the files. If editing files, ensure no spaces at the\nend of settings. The only valid values for FAILOVERPOLICY\nare DISABLED, FAILOVER and FAILBACK.\n\n"}]}, {"id": "DEV_Q186", "question": "Silent uninstall of ITCAM for MQ agent fails\n\nRunning silent uninstall of the ITCAM for MQ agent with this command: start /wait setup /z\"/sfMQ_Silent_Uninstall.txt\" /s /f2\"C:\\temp\\silent_setup.log\" fails with this message in the Abort_*.trc file: SEVERE: You must agree to the License Agreement.\n\nThe MQ_Silent_Uninstall.txt does contain this line: License Agreement=I agree to use the software only in accordance with the installed license.", "answer": "To resolve the silent uninstall of ITCAM for MQ agent failing due to the need to agree to the License Agreement, specify the complete path to the silent response file while launching the silent install. For example:\n\n```shell\nsetup /z\"/sfMQ_Silent_Uninstall.txt\" /s /f2\"C:\\temp\\silent_setup.log\"\n```\n\nEnsure the `License Agreement` field in the silent response file matches your agreement terms.", "documents": [{"filename": "swg21608744.txt", "chunk_id": "doc_16943_chunk_0000", "text": "Title: IBM Silent Install - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Silent install of any of the Tivoli Monitoring components fails. \n\nCAUSE\nWhen the complete path to the silent response file is not specified as part of the command invoking the silent install, it fails with the following error message in the log file: \n\n------------------------------------------------------------\n08-16-2012 09:52:31: Silent install configuration file: silent_response.txt\n08-16-2012 09:52:31: \n08-16-2012 09:52:31: AgentDeployRunning=FALSE.\n08-16-2012 09:52:31: \n08-16-2012 09:52:31: SEVERE: You must agree to the License Agreement.\n08-16-2012 09:52:31: SEVERE: Silent install config error.\n08-16-2012 09:52:31: Silent install config error.\n------------------------------------------------------------\n\n\n\nRESOLVING THE PROBLEM\nSpecify the complete path to the silent response file while launching the silent install. \n\ne.g.\nsetup /z\"/sfE:\\TEMP\\silent_response.txt\" /s /f2\"C:\\temp\\itm6_agent_setup.log\""}, {"filename": "swg21273734.txt", "chunk_id": "doc_11583_chunk_0004", "text": ".exe -silent -W prod_id_uninstall.value=ibmrpt \n * Linux: \n   <installdir>/rpt/DCI/_uninst/uninstall.bin -silent -W prod_id_uninstall.value=ibmrpt\n\n\n\nManually uninstalling the DCI may take 5 minutes or more. \nIf this fails, or leaves items behind, cautiously remove the following items.\nNote: Do not remove these items if you have another product using the RAC or if you installed the RAC without using the IM. \n\n * On Windows, remove the following:\n   C:/Windows/IBM/IBMAGENT_70\n   C:/Windows/vpd.properties \n\n\nDo not delete the vpd.properties file if it has entries other than ITCAM. In that case, remove only ITCAM entries starting with: \"ITCAMTTR|6|0|0|0|6_0_0_0|\";\n\"ITCAMTTR_Base|6|0|0|0|6_0_0_0|\";\n\"ITCAMTTR_win|6|0|0|0|6_0_0_0|\";\n\"ITCAMTTR_linix86|6|0|0|0|6_0_0_0|\" \n\nRemove the following directories: \n\nC:/Program Files/Common Files/InstallShield/Universal/ibmrac\nC:/Program Files/Common Files/InstallShield/Universal/ipotdci \n\nRemove the following registry keys: \n\nHKLM/SOFTWARE/IBM/Rational Agent Controller\nHKLM/SOFTWARE/IBM/Rational/Software Development Platform/products/com.ibm.rational.data.collection.infrastructure\nHKLM/SOFTWARE/Tivoli/Tivoli Transerf Service/parameters \n\n * On Linux, remove the following:\n\n\n"}, {"filename": "swg21432483.txt", "chunk_id": "doc_13608_chunk_0000", "text": "Title: IBM The Tivoli Federated Identity Manager silent install requires the user to accept the license agreement - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The silent install for Tivoli Federated Identity Manager requires the user to accept the license agreement. \n\nSYMPTOM\nThe Tivoli Federated Identity Manager silent installation fails. The installer log file contains the following error: \n\"...com.ibm.lex.lap.isje.LAPanel, err, License not accepted.\"\n\nCAUSE\nThe user has not accepted the license agreement. During a silent install, the LAPanel bean verifies the user has accepted the license agreement by checking the value of the licenseAccepted InstallShield option. This option needs to be specified as a command-line parameter when the installer is launched or in the silent install response file.\n\nRESOLVING THE PROBLEM\nThe silent install for Tivoli Federated Identity Manager 6.2.1 requires the user to configure the licenseAccepted option to confirm acceptance of the license agreement. During a silent install, the LAPanel bean will check the response file or command line for the following entry:\n“-G licenseAccepted=<value>” \n\nThe installation will throw an error if this value is not true.\n\n"}, {"filename": "swg21331026.txt", "chunk_id": "doc_12217_chunk_0004", "text": ".x \n2. Apply the license (Activation Kit) \n3. Uninstall the license in silent mode using the script above \n4. Run the silent update with -updateAll \n\nAlternatively, you can have <updateAll> in a response file with both the Rational Application Developer update repository and license repository (file location) specified. When Installation Manager runs silently it will update Rational Application Developer and apply the license as well.\n\n\n\n\nRELATED INFORMATION\n#Silent installation commands [http://publib.boulder.ibm.com/infocenter/radhelp/v7r5/index.jsp?topic=/com.ibm.rad.install.doc/topics/r_silent_inst_commands12.html]"}]}, {"id": "DEV_Q210", "question": "startNode failed with ADML3000E after a deployment failure\n\nClient had a deployment failure due to \"Too many open files\" error.\n\nAfterwards, the startNode failed with ADML3000E:\n\nWhat could cause the \"Too many open files error?", "answer": "The \"Too many open files\" error can be caused by either a high demand for a common resource like RMI Channels or insufficient limits configured at the operating system level. In the case described, it seems related to excessive file creation during job execution, leading to the exhaustion of open file descriptors. The specific details provided suggest that the primary namenode was dropping due to the generation of too many files, exceeding the nofiles parameter set in the configuration.", "documents": [{"filename": "swg21980823.txt", "chunk_id": "doc_23252_chunk_0000", "text": "Title: IBM Primary namenode failing with \"Too many open files\" error - United States\n\nText:\ndropped failed TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Primary namenode dropping while jobs are running after awhile \n\nSYMPTOM\nhadoop-hdfs-namenode.log entry\n\n(Slf4jLog.java:warn(89)) - EXCEPTION \njava.io.IOException: Too many open files\nat sun.nio.ch.ServerSocketChannelImpl.accept0(Native Method)\nat sun.nio.ch.ServerSocketChannelImpl.accept(ServerSocketChannelImpl.java:241)\nat org.mortbay.jetty.nio.SelectChannelConnector$1.acceptChannel(SelectChannelConnector.java:75)\nat org.mortbay.io.nio.SelectorManager$SelectSet.doSelect(SelectorManager.java:686)\nat org.mortbay.io.nio.SelectorManager.doSelect(SelectorManager.java:192)\nat org.mortbay.jetty.nio.SelectChannelConnector.accept(SelectChannelConnector.java:124)\nat org.mortbay.jetty.AbstractConnector$Acceptor.run(AbstractConnector.java:708)\nat org.mortbay.thread.QueuedThreadPool$PoolThread.run(QueuedThreadPool.java:582)\n\n\n\nCAUSE\nThe jobs are generating too many files, exceeding the nofiles parameter in \n\nENVIRONMENT\nLinux\n\nDIAGNOSING THE PROBLEM\nMonitor the open files using linux command > lsof to see the number of files that are being created.\n\n\n\n\n"}, {"filename": "swg1PM99046.txt", "chunk_id": "doc_10071_chunk_0002", "text": "s - 50%\n   [INFO] Progress - 100%\n   [ERROR] DeployManager -\n   [ERROR] DeployManager - OPERATION ERROR -- Start [hadoop]:\n   [ERROR] DeployManager -\n   -------------------------------------------------------\n   [ERROR] DeployManager - hadoop failed\n   com.ibm.xap.mgmt.DeployException: HDFS failed to start because\n   number of available datanodes:[0] is less than\n   dfs.replication.min:[1]\n           at\n   com.ibm.xap.mgmt.hdm.HadoopDeployer.startService(HadoopDeployer.\n   java:455)\n           at\n   com.ibm.xap.mgmt.DeployManager$StartThread.work(DeployManager.ja\n   va:2595)\n           at\n   com.ibm.xap.mgmt.DeployManager$WorkerThread.run(DeployManager.ja\n   va:2387)\n   [ERROR] DeployManager - Start; SUCCEEDED components: []; FAILED\n   components: [hadoop]; Consumes : 44276ms\n   Error exit.\n   \n   Defect 51920 has created to track this issue.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  run start.sh hadoop twice (once to start HDFS, and once to\n   start mapred which fails the first time).\n   \n   \n    \n   \n   \n\nPROBLEM SUMMARY\n *  See error description\n   \n   \n    \n   \n   \n\nPROBLEM CONCLUSION\n *  This problem is fixed in Version 2.1.0.2 and later fix packs.\n   \n   \n    \n   \n   \n\nTEMPORARY FIX\n\nCOMMENTS\n\n"}, {"filename": "swg21551911.txt", "chunk_id": "doc_15649_chunk_0001", "text": "els. This error happens because of a high demand for a common resource [RMI Channel] and/or because of insufficient limit configured at the OS level. For Example: When system repeatedly makes the RMI calls (because of Item Updates happening at a very high frequency), there is not enough time given for the context closure or release of resources resulting in the channel exhaustion ultimately causing the Socket Exception. Error Message ========ERROR TRACE============\nFailed with error: javax.naming.CommunicationException: Too many open files [Root exception is java.net.SocketException: Too many open files]: YCPRemoteUtils \n2009-06-16 05:17:35,776:ERRORDTL:Thread-16_Hub2ProductDataReceiver: [1245125855775]javax.naming.CommunicationException: Could not obtain connection to any of these urls: <MACHINE IP:PortNO> and discovery failed with error: javax.naming.CommunicationException: Too many open files [Root exception is java.net.SocketException: Too many open files] [Root exception is javax.naming.CommunicationException: Failed to connect to server <MACHINE IP:PortNO> [Root exception is javax.naming.ServiceUnavailableException: Failed to connect to server <MACHINE IP:PortNO> [Root exception is java.net.SocketException: Too many open "}, {"filename": "swg21468765.txt", "chunk_id": "doc_14325_chunk_0000", "text": "Title: IBM Running HPII_start and get error: too many open files using IBM FileNet Image Services - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n Running HPII_start failed, get error: too many open files using Image Services. \n\nCAUSE\nFailed when nofiles exceeded limit after only 245 batches.\nThe status files are being removed prior to closing the HPII data files. \n\n\nRESOLVING THE PROBLEM\nEdit the HPII_cfg file removing or commenting out the 2 lines \n\n;ProgressFileFlag=1 \n;FNProgressDirectory=/fnsw/local/bin/hpii/status\n\nEngineering is working on a fix for future release."}]}, {"id": "DEV_Q220", "question": "Help with Security Bulletin: TLS padding vulnerability affects IBM PureApplication System (CVE-2014-8730)\n\nI need to understand details regarding \"Security Bulletin: TLS padding vulnerability affects IBM PureApplication System (CVE-2014-8730)\". Where can I find this information?", "answer": "To find more detailed information about the \"Security Bulletin: TLS padding vulnerability affects IBM PureApplication System (CVE-2014-8730)\", you should refer to the following sources:\n\n1. Document 1: This document provides general information about the security bulletin, including the title, summary, CVSS scores, and affected products and versions. It also mentions that the vulnerability affects IBM PureApplication System.\n\n2. Document 2: Similar to Document 1, this document offers additional details on the vulnerability affecting IBM PureData System for Operational Analytics.\n\n3. Document 3: This document covers the same topic but specifically addresses IBM PureData System for Transactions.\n\n4. Document 4: This document discusses the vulnerability affecting IBM Security Identity Manager (ISIM).\n\n5. Document 5", "documents": [{"filename": "swg21960375.txt", "chunk_id": "doc_21740_chunk_0000", "text": "Title: IBM Security Bulletin: TLS padding vulnerability affects IBM PureApplication System (CVE-2014-8730) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Transport Layer Security (TLS) padding vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack affects IBM PureApplication System. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2014-8730 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-8730]\nDESCRIPTION: IBM PureApplication Server bundles IBM HTTP Server, which could allow a remote attacker to obtain sensitive information, caused by the failure to check the contents of the padding bytes when using CBC cipher suites of some TLS implementations. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack to decrypt sensitive information and calculate the plain text of secure connections.\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/99216 [https://exchange.xforce.ibmcloud.com/vulnerabilities/99216] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\nAFFECTED PRODUCTS AND VERSIONS\n\n"}, {"filename": "swg21693254.txt", "chunk_id": "doc_20574_chunk_0000", "text": "Title: IBM Security Bulletin: TLS padding vulnerability affects IBM PureData System for Operational Analytics (CVE-2014-8730) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Transport Layer Security (TLS) padding vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack affects IBM PureData System for Operational Analytics. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-8730 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-8730]\n\nDESCRIPTION: \nProduct could allow a remote attacker to obtain sensitive information, caused by the failure to check the contents of the padding bytes when using CBC cipher suites of some TLS implementations. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack to decrypt sensitive information and calculate the plaintext of secure connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/99216 [https://exchange.xforce.ibmcloud.com/vulnerabilities/99216] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\n"}, {"filename": "swg21693255.txt", "chunk_id": "doc_20575_chunk_0000", "text": "Title: IBM Security Bulletin: TLS padding vulnerability affects IBM PureData System for Transactions (CVE-2014-8730) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n Transport Layer Security (TLS) padding vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack affects IBM PureData System for Transactions. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-8730 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-8730]\n\nDESCRIPTION: \nProduct could allow a remote attacker to obtain sensitive information, caused by the failure to check the contents of the padding bytes when using CBC cipher suites of some TLS implementations. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack to decrypt sensitive information and calculate the plaintext of secure connections.\n\nCVSS Base Score: 4.3\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/99216 [https://exchange.xforce.ibmcloud.com/vulnerabilities/99216] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (AV:N/AC:M/Au:N/C:P/I:N/A:N)\n\n"}, {"filename": "swg21694312.txt", "chunk_id": "doc_20650_chunk_0000", "text": "Title: IBM Security Bulletin: TLS padding vulnerability has been fixed in IBM Security Identity Manager (CVE-2014-8730) - United States\n\nText:\nPSIRT SECURITY BULLETIN\n\nSUMMARY\n IBM Security Identity Manager (ISIM) version 7.0 Virtual Appliance is affected by a TLS padding vulnerability, which could allow a remote attacker to obtain sensitive information. \n\nVULNERABILITY DETAILS\n\nThe following vulnerability affects IBM Security Identity Manager\n\nCVEID: CVE-2014-8730 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-8730]\n\nDESCRIPTION: IBM Security Directory Server could allow a remote attacker to obtain sensitive information, caused by the failure to check the contents of the padding bytes when using CBC cipher suites of some TLS implementations. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack to decrypt sensitive information and calculate the plaintext of secure connections.\n\n"}, {"filename": "swg21693877.txt", "chunk_id": "doc_20618_chunk_0000", "text": "Title: IBM Security Bulletin: TLS padding vulnerability affects IBM Data Server Client packages (CVE-2014-8730) - United States\n\nText:\nCVE-2014-8730; TLS Padding vulnerability SECURITY BULLETIN\n\nSUMMARY\n Transport Layer Security (TLS) padding vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack affects IBM Data Server Client packages. \n\nVULNERABILITY DETAILS\nCVE-ID: CVE-2014-8730 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-8730]\n\nDESCRIPTION: Product could allow a remote attacker to obtain sensitive information, caused by the failure to check the contents of the padding bytes when using CBC cipher suites of some TLS implementations. A remote user with the ability to conduct a man-in-the-middle attack could exploit this vulnerability via a POODLE (Padding Oracle On Downgraded Legacy Encryption) like attack to decrypt sensitive information and calculate the plaintext of secure connections. \n\n"}]}, {"id": "DEV_Q223", "question": "Can I use Chrome browser for viewing Monitor 801 Cognos report viewer widget ?\n\nSome users use Chrome browser with Business Monitor and have reported issues when trying to view Cognos reports from Report Viewer widget within Business Space.", "answer": "Yes, you can use Chrome browser for viewing Monitor 801 Cognos report viewer widget. However, there might be issues due to changes in Cognos FixPack 10.2.2.2 that prevent opening Cognos reports on Google Chrome. To resolve this, you need to configure the Cognos gateway to trust OpenPages web site by updating the HTTP response headers.", "documents": [{"filename": "swg21993634.txt", "chunk_id": "doc_24285_chunk_0000", "text": "Title: IBM Cannot open Cognos reports on home page report tabs on Google Chrome after applying Cognos fix pack 10.2.2.2 - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n When you apply Cognos fixpack 10.2.2.2 or higher, the Cognos reports on the OpenPages homepage report tabs cannot be opened on Google Chrome. \n\nSYMPTOM\nWhen you navigate to one of the report tabs in the OpenPages homepage, you get a blank result. If you open the console of Google Chrome developer tool, you find an error message like: \n\nRefused to display 'http://cognosserver:com:8090/ibmcognos/cgi-bin/cognos.cgi'in a frame because it set 'X-Frame-Options' to 'SAMEORIGIN'.\n\n\nCAUSE\nCognos FixPack 10.2.2.2 introduced an HTTP response header for security reason, which prevents OpenPages from embedding cognos reports.\n\n\nRESOLVING THE PROBLEM\nIn order to resolve this, you need to configure the Cognos gateway to trust OpenPages web site by updating the HTTP response headers. \n\n"}, {"filename": "swg1JR43548.txt", "chunk_id": "doc_05501_chunk_0000", "text": "Title: IBM JR43548: SUPPORT FILTERS FROM COGNOS REPORT PROMPT WIDGET FOR SHOW INSTANCES FUNCTION IN COGNOS REPORT VIEWER WIDGET - United States\n\nText:\n  FIXES ARE AVAILABLE\nIBM Business Monitor V8.0 Refresh Pack 1 (8.0.1) [http://www-01.ibm.com/support/docview.wss?uid=swg24033765]\nIBM Business Monitor V8.0.1 Fix Pack 1 (8.0.1.1) [http://www-01.ibm.com/support/docview.wss?uid=swg24034357]\nIBM Business Monitor V7.5.1 Fix Pack 2 (7.5.1.2) [http://www-01.ibm.com/support/docview.wss?uid=swg24036470]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS FIXED IF NEXT.\n    \n   \n   \n\nERROR DESCRIPTION\n *  Cognos Report Studio can be used to add prompts\n   (user-selectable filters on dimensions) to a Cognos Report\n   Viewer widget (accessible in Business Space, supplied by IBM\n   Business Monitor).  The Show Instances function, however, when\n   executed on this widget, does not filter instances displayed in\n   a wired Instances widget based on the filters selected in the\n   prompts.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n\n"}, {"filename": "swg1JR42925.txt", "chunk_id": "doc_05482_chunk_0000", "text": "Title: IBM JR42925: SUPPORT \"FILTER APPEND\" FOR SHOW INSTANCES IN COGNOS REPORT VIEWER WIDGET - United States\n\nText:\n  FIXES ARE AVAILABLE\nIBM Business Monitor V7.5.1 Fix Pack 1 (7.5.1.1) [http://www-01.ibm.com/support/docview.wss?uid=swg24033020]\nIBM Business Monitor V8.0 Refresh Pack 1 (8.0.1) [http://www-01.ibm.com/support/docview.wss?uid=swg24033765]\nIBM Business Monitor V8.0.1 Fix Pack 1 (8.0.1.1) [http://www-01.ibm.com/support/docview.wss?uid=swg24034357]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS FIXED IF NEXT.\n    \n   \n   \n\nERROR DESCRIPTION\n *  The Show Instances function in the Cognos Report Viewer widget\n   does not filter instances in the wired Instances widget based on\n   the filter defined in the Report Viewer widget.  Although not\n   all filters can be supported, it is possible in certain use\n   cases to have the Instances widget append a Cognos filter to the\n   existing filter in the Instances widget to produce the desired\n   result (the default behavior of the Instances widget is to\n   replace its filter with the Cognos filter).  The \"filter append\"\n   capability needs to be added to the Instances widget to support\n"}]}, {"id": "TRAIN_Q003", "question": "How to configure SSL mutual authentication in IBM HTTP Server?\n\n\n\nWe are running IHS v7 and our application team has a specific webservice that they require SSL mutual authentication to be enabled for at the http server. Does anyone know how to set this up on IHS? Or any documentation?\n\nThanks", "answer": "To enable SSL mutual authentication in IBM HTTP Server (IHS), you need to follow these steps:\n\n1. Ensure your IBM HTTP Server is running version 7.\n2. Configure your web service application so that it requires SSL mutual authentication.\n3. Obtain a valid SSL certificate and private key pair.\n4. Install the certificate into the IBM HTTP Server trust store.\n5. In the IBM HTTP Server administration console, navigate to the SSL settings and configure mutual authentication.\n6. Restart the IBM HTTP Server after making changes.\n\nRefer to Document 1 for detailed information on configuring SSL mutual authentication in IBM DataPower MQ Manager, which may also apply to IBM HTTP Server.", "documents": [{"filename": "swg21260155.txt", "chunk_id": "doc_11433_chunk_0000", "text": "Title: IBM Configuring DataPower MQ client to use SSL in mutual authentication mode - United States\n\nText:\ndatapower; mq; websphere mq; ssl; mutual authentication mode; mq manager; 7993; 7993; 7993; machine type 7993 TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The WebSphere DataPower MQ Client can be configured to use SSL in mutual authentication mode with a Remote WebSphere MQ Manager. This step-by-step technote guides DataPower Appliance users on how to configure DataPower MQ Manager Object to use SSL in mutual authentication mode. This technote assumes that MQ queue manager is configured with key database and its associted password file for using SSL connection with other MQ clients. If it is not configured yet, it has to be done first using the URL: http://publib.boulder.ibm.com/infocenter/wmqv7/v7r0/topic/com.ibm.mq.explorer.doc/e_ssl.htm [http://publib.boulder.ibm.com/infocenter/wmqv7/v7r0/topic/com.ibm.mq.explorer.doc/e_ssl.htm] \n\n"}, {"filename": "nas8N1020262.txt", "chunk_id": "doc_00642_chunk_0000", "text": "Title: IBM How To Set Up SSL Client (Mutual) Authentication Between An IBM WebSphere Application Server And The IBM Web Server Plug-in - United States\n\nText:\nWEBSPHERE; SSL; PLUGIN; AUTHENTICATION; WEB SERVER TECHNOTE (FAQ)\n\nQUESTION\n This document will discuss \"How to set up SSL Client (Mutual) Authentication between an IBM WebSphere Application Server and the IBM Web Server Plug-in?\" \n\nANSWER\nSSL Client authentication (AKA Mutual authentication) is similar to regular, server authentication except that the server requests a certificate from the client to verify the client is who they claim to be. The certificate must be an X.509 certificate and signed by a certificate authority (CA) trusted by the server. \n\nWhen a server requests a certificate, the client has the option to send a certificate or attempt to connect without it. The server allows the connection if the client's certificate can be trusted. When a client attempts to connect without a certificate, the server might give the client access but at a lower security level. \n\n"}, {"filename": "swg21973130.txt", "chunk_id": "doc_22588_chunk_0000", "text": "Title: IBM Client certificate authentication support for secure connections to LDAP servers - United States\n\nText:\n TECHNOTE (FAQ)\n\nQUESTION\n How can I configure client certificate authentication support for LDAP server connections that are used when the federation component is communicating with an LDAP server? \n\nANSWER\nIn the local management interface, go to Secure Federations > Global Settings > Server Connections. You can configure client certificate support with the SSL Mutual Authentication Key field under Server properties. This field represents the label of client certificate to be presented when connecting to the LDAP. This property is sourced from SSL Truststore. \n\nNote: This field is required only if mutual SSL authentication is required by the server."}]}, {"id": "TRAIN_Q077", "question": "Why is the test suite execution failing from Decision Center?\n\nWhen executing a test suite from Decision Center the run may fail with an error message similar to:\n XU client error.\n GBRXU0448E: Plugin error.\n Unable to retrieve the engine manager.\n The parsing of the ruleset failed Problem occurred loading translation: Error when translating parameter \"inputParameter\": Cannot translate class \"sample.InputParameter\".\n\nWhat can be causing this error?", "answer": "The error message suggests that there is an issue with the ruleset being parsed due to an empty decision table. To prevent this error, ensure that the decision tables within your rulesets contain at least one group definition before attempting to parse them.", "documents": [{"filename": "swg21615508.txt", "chunk_id": "doc_17217_chunk_0000", "text": "Title: IBM Unable to run Test Suites against clustered SSP from Decison Center console - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n I have a clustered Decision Server where XU and SSP are deployed on cluster members and Rule Execution Server (RES) console is deployed on a standalone server outside of the cluster. IHS and a load balancer is configured on top of the cluster. \nIn Decision Center, the RES server URL is configured with the load balanced IP.\nTest Suite fails to run from Decision Center console in this configuration. \n\nSYMPTOM\nAfter clicking on Run from Decision Center console, the process starts, but after a few seconds, execution stops with a message: Cannot execute the scenario suite xxx. The operation was aborted by user. \n\nNo errors shown in Decision Center and Decision Server server logs. The only error seen is from the browser and no stack trace is displayed.\n\n\nCAUSE\nThere are multiple http requests made from Decision Center to SSP in order to start the test suite run and check its status. When a load balancer is used, it is not guaranteed that each http request from the Decision Center is routed to the same SSP. For instance, assume the first http request is received by SSP1. "}, {"filename": "swg21634188.txt", "chunk_id": "doc_17832_chunk_0000", "text": "Title: IBM Connection with Decision Center has failed - United States\n\nText:\n TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The connection to Rule Team Server or Decision Center might fail with the message \"Connection with [Rule Team Server or Decision Center] has failed\", but with no further indication of what the issue might be. \n\nSYMPTOM\nThe connection to Rule Team Server or Decision Center might fail with the message \"Connection with [Rule Team Server or Decision Center] has failed\" in the Eclipse UI. However, the Eclipse log (<yourWorkspace>\\.metadata\\.log) and the server logs do not show any errors that indicate what the cause of the connection failure might be:\n\n\n[/support/docview.wss?uid=swg21634188&aid=1] [/support/docview.wss?uid=swg21634188&aid=1] \nDIAGNOSING THE PROBLEM\nReview the Eclipse log (<yourWorkspace>\\.metadata\\.log) and the server logs.\n\nRESOLVING THE PROBLEM\nTo identify the error that is causing the connection to fail, run the Decision Center print-config-param ANT task using the same credentials and the exact same Rule Team Server/Decision Center URL that you used when failing to synchronize from Rule Studio/Rule Designer. \n\n"}, {"filename": "swg21507570.txt", "chunk_id": "doc_15243_chunk_0000", "text": "Title: IBM An empty decision table in the ruleset leads to ruleset parsing error: XU.ERROR.10014 - United States\n\nText:\nXU.ERROR.10014 ; XU-WS10010 ; ruleset ; parse error; IlrWsdlGeneratorInteractionExtension; HTDS; Decision service; ilog.rules.res.decisionservice.xu.IlrDSXuWrapper; This ruleset cannot be parsed. It uses a Java XOM; which is not supported by the hosted transparent decision service.; error code: XU-WS10010; javax.resource.ResourceException; ilog.rules.res.decisionservice.plugin.IlrWsdlGeneratorInteractionExtension; createResourceException; IlrWsdlGeneratorInteractionExtension.java TECHNOTE (FAQ)\n\nQUESTION\n When you attempt to execute a ruleset with Rule Execution Server, ruleset parsing fails and logs an error message such as the following:\n\nCompilation error in task MyRuleflow#MyRuleTask:\ncould not find the group MyRulePackage.MyDecisionTable, error code: XU.ERROR.10014\n\nHow can I prevent this error ? \n\nCAUSE\nThe ruleset parsing error happens because the rule task uses the group keyword to reference the Decision Table. Because the Decision Table is empty, no group is generated in the Decision Table, hence the parsing error. \n\n"}]}, {"id": "TRAIN_Q171", "question": "Help with Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2014-8730)\n\nI need to understand details regarding Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2014-8730). Where can I find this information?", "answer": "To find more detailed information on the Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2014-8730), you should refer to Document 1, which provides general information about the security bulletin including affected products and versions. For specific details related to CVE-2014-8730, consult Document 2, which contains vulnerability details and affected products and versions.", "documents": [{"filename": "swg21674944.txt", "chunk_id": "doc_19524_chunk_0000", "text": "Title: IBM Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2014-0907) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM DB2 is shipped as a component of WebSphere Remote Server. Information about security vulnerabilities affecting IBM DB2 has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nFor vulnerability details, see the Local escalation of privilege vulnerability in IBM DB2 (CVE-2014-0907) [http://www.ibm.com/support/docview.wss?uid=swg21672100] document.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Remote Server version 6.1, 6.2, 6.2.1, 7.0, 7.1, 7.1.1, 7.1.2, 8.5 IBM DB2 Workgroup Server Edition \n9.1, 9.5, 9.7, 10.1 GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n Subscribe to My Notifications [ http://www-01.ibm.com/software/support/einfo.html] to be notified of important product support alerts like this. \n\n"}, {"filename": "swg21700633.txt", "chunk_id": "doc_21131_chunk_0000", "text": "Title: IBM Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2014-8730) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM DB2 is shipped as a component of WebSphere Remote Server. Information about security vulnerabilities affecting IBM DB2 has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nFor vulnerability details, see the security bulletin TLS padding vulnerability affects IBM DB2 LUW (CVE-2014-8730) [http://www.ibm.com/support/docview.wss?uid=swg21692618]. \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Remote Server V6.1, 6.2, 6.2.1, 7.0, 7.1, 7.1.1, 7.1.2, 8.5 IBM DB2 Workgroup Server Edition \nV9.1, 9.5, 9.7, 10.1, 10.5 GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n Subscribe to My Notifications [ http://www-01.ibm.com/software/support/einfo.html] to be notified of important product support alerts like this. \n\n"}, {"filename": "swg21676326.txt", "chunk_id": "doc_19615_chunk_0000", "text": "Title: IBM Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote server (CVE-2013-6747, CVE-2014-0963) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM DB2 is shipped as a component of WebSphere Remote Server. Information about security vulnerabilities affecting IBM DB2 has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nFor vulnerability details, see the IBM DB2 is impacted by multiple TLS/SSL security vulnerabilities (CVE-2013-6747, CVE-2014-0963) [http://www.ibm.com/support/docview.wss?uid=swg21671732] document.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Remote Server 6.1, 6.2, 6.2.1, 7.0, 7.1, 7.1.1, 7.1.2, 8.5 IBM DB2 Workgroup Server Edition \n9.1, 9.5, 9.7, 10.1 GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n Subscribe to My Notifications [ http://www-01.ibm.com/software/support/einfo.html] to be notified of important product support alerts like this. \n\n"}, {"filename": "swg21701696.txt", "chunk_id": "doc_21228_chunk_0000", "text": "Title: IBM Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Remote Server (CVE-2015-0138, CVE-2015-0159 and CVE-2014-6221) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM DB2 is shipped as a component of WebSphere Remote Server. Information about security vulnerabilities affecting IBM DB2 has been published in a security bulletin. \n\nVULNERABILITY DETAILS\nFor vulnerability details, see the security bulletin Vulnerabilities in GSKit affect IBM® DB2® (CVE-2015-0138, CVE-2015-0159 and CVE-2014-6221). [http://www.ibm.com/support/docview.wss?uid=swg21699543]\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nPrincipal Product and Version(s) Affected Supporting Product and Version WebSphere Remote Server version V6.2, V6.2.1, 7.0, 7.1, 8.5 IBM DB2 Workgroup Server Edition \nV9.5, 9.7, 10.1, 10.5 GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n Subscribe to My Notifications [ http://www-01.ibm.com/software/support/einfo.html] to be notified of important product support alerts like this. \n\n"}, {"filename": "swg21674593.txt", "chunk_id": "doc_19498_chunk_0000", "text": "Title: IBM Security Bulletin: Security vulnerabilities have been identified in IBM DB2 shipped with WebSphere Enterprise Service Bus (CVE-2013-6747, CVE-2014-0963) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM DB2 is shipped as a component of WebSphere Enterprise Service Bus. Information about security vulnerabilities that affect IBM DB2 have been published in a security bulletin \n\nVULNERABILITY DETAILS\nConsult the security bulletin IBM DB2 is impacted by multiple TLS/SSL security vulnerabilities (CVE-2013-6747, CVE-2014-0963) [http://www.ibm.com/support/docview.wss?uid=swg21671732] for vulnerability details.\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nAffected product and version Product and version shipped as a component WebSphere Enterprise Service Bus v6.2 IBM DB2 Restricted Enterprise Server Edition 9.5 WebSphere Enterprise Service Bus v7.0 IBM DB2 Restricted Enterprise Server Edition 9.5 WebSphere Enterprise Service Bus v7.5 IBM DB2 Enterprise Server Edition 9.7 GET NOTIFIED ABOUT FUTURE SECURITY BULLETINS\n Subscribe to My Notifications [ http://www-01.ibm.com/software/support/einfo.html] to be notified of important product support alerts like this. \n\n"}]}, {"id": "TRAIN_Q208", "question": "Can I run different levels of the Rational Developer for z Systems host and client?\n\nI'd like to know if I can run different versions of the RDz client and host and if so what compatible or supported versions and releases?", "answer": "Yes, it is possible to run different levels of the Rational Developer for z Systems host and client. According to Document 1, IBM Developer for z Systems v14.1.x host/client is compatible with IBM Developer for z Systems v14.1.x client/host, IBM Developer for z Systems v14.0.x client/host and Rational Developer for z Systems v9.5.x client/host. Additionally, Rational Developer for z Systems Fix Pack 5 (9.5.1.6) and Rational Developer for z Systems Fix Pack 7 (9.5.1.7) are available for specific versions. However, there is no explicit information provided about whether these fixes affect compatibility between different versions of the host and client.", "documents": [{"filename": "swg21568844.txt", "chunk_id": "doc_15855_chunk_0000", "text": "Title: IBM Developer for z Systems and Rational Developer for z Systems Backward/Forward compatibility - United States\n\nText:\nRDz; compatible; backward; forward; IDz; Debug Tool: Debugger TECHNOTE (FAQ)\n\nQUESTION\n What levels of the IBM Developer for z Systems and Rational Developer for z Systems host and client are compatible? \n\nANSWER\nClient/Server Compatibility\n\n\n\nIn general, IBM Developer for z Systems, Rational Developer for z Systems and Rational Developer for System z follow a two level backward and forward compatibility tolerance for basic Client /Server functionality. \n\nIBM Developer for z Systems v14.1.x host/client is compatible with IBM Developer for z Systems v14.1.x client/host, IBM Developer for z Systems v14.0.x client/host and Rational Developer for z Systems v9.5.x client/host. \n\nIBM Developer for z Systems v14.0.x host/client is compatible with IBM Developer for z Systems v14.1.x client/host, IBM Developer for z Systems v14.0.x client/host, Rational Developer for z Systems v9.5.x client/host and Rational Developer for System z v9.1.x client/host. \n\n"}, {"filename": "swg1PI84660.txt", "chunk_id": "doc_07639_chunk_0000", "text": "Title: IBM PI84660: RATIONAL DEVELOPER FOR SYSTEM Z (RDZ) CLIENT MAY HANG DURING A PUSH TO CLIENT INSTALL UPDATE - United States\n\nText:\n  FIXES ARE AVAILABLE\nRational Developer for System z Fix Pack 5 (9.5.1.6) for 9.5.1. [http://www-01.ibm.com/support/docview.wss?uid=swg24044335]\nRational Developer for z Systems Fix Pack 7 (9.5.1.7) for 9.5.1. [http://www-01.ibm.com/support/docview.wss?uid=swg24044493]\n\n\nSUBSCRIBE\nYou can track all active APARs for this component.\n\n\n\nAPAR STATUS\n * CLOSED AS PROGRAM ERROR.\n    \n   \n   \n\nERROR DESCRIPTION\n *  IBM Rational Developer for System z - RDz / IDz\n   \n   Attempts to use Push to client to install a client update\n   may cause the client to hang.\n   \n   \n    \n   \n   \n\nLOCAL FIX\n *  Check the <workspace>\\.metadata\\.plugins\\\n   com.ibm.ftt.resources.zos.folder to see what has been\n   downloaded from the host for installation.\n   \n   The client may already have the necessary files downloaded.\n   The following files will be in com.ibm.ftt.resources.zos :\n   runinstallation.bat\n   runrestart.bat\n   \n   If so, you can manually shutdown the RDz/IDz client.\n   Then, start the installation by executing the\n   runinstallation.bat file.\n   \n   \n    \n   \n   \n\n"}, {"filename": "swg21994204.txt", "chunk_id": "doc_24332_chunk_0005", "text": "mponent (of Rational Developer for z Systems V9.5.1)\nz/OS Rational Developer for System z Host Utilities (of Rational Developer for z Systems V9.5.1)\nz/OS Rational Developer for System z subset (of Rational Team Concert V6.0.1)\n\nFor a more detailed listing on the z/OS 2.2 distribution, see z/OS 2.2 ADCD for z Systems Development and Test Environment [https://www.ibm.com/support/knowledgecenter/SSTQBD_10.0.0/com.ibm.zsys.rdt.guide.adcd.doc/topics/t_adcd22_for_zdt.html] in the IBM Knowledge Center.\n\nThe following are Supporting Programs included only with IBM z Systems Development and Test Environment with Parallel Sysplex V10.0:\n\n======================================== *** z/VM 6.3 Distribution *** ======================================== IBM Directory Maintenance Facility for z/VM, function level 630\nIBM Performance Toolkit for VM, function level 630\nIBM RACF Security Server for z/VM, function level 630\nIBM Remote Spooling Communications Subsystem Networking for z/VM, function level 630\nIBM z/VM, version 6 release 3\n\n"}]}, {"id": "TRAIN_Q233", "question": "Help with Security Bulletin: API Connect is affected by a cross-site scripting vulnerability CVE-2018-1382\n\nI need to understand details regarding Security Bulletin: API Connect is affected by a cross-site scripting vulnerability CVE-2018-1382. Where can I find this information?", "answer": "To find more detailed information about the security bulletin related to the cross-site scripting vulnerability CVE-2018-1382 affecting IBM API Connect, you should refer to Document 1, which contains the full text of the IBM Security Bulletin for API Connect that addresses this specific vulnerability. The bulletin provides comprehensive details including CVSS scores, affected products and versions, remediation fixes, and environmental considerations.", "documents": [{"filename": "swg22013054.txt", "chunk_id": "doc_25934_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect is affected by a cross-site scripting vulnerability \nCVE-2018-1382 - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n API Connect has addressed the following vulnerability. \n\nIBM API Connect is vulnerable to cross-site scripting. This vulnerability allows users to embed arbitrary JavaScript code in the Web UI thus altering the intended functionality, potentially leading to credentials disclosure within a trusted session. \n\n\n\nVULNERABILITY DETAILS\n\nCVEID:CVE-2018-1382 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-1382]\nDESCRIPTION:IBM API Connect is vulnerable to cross-site scripting. This vulnerability allows users to embed arbitrary JavaScript code in the Web UI thus altering the intended functionality, potentially leading to credentials disclosure within a trusted session.\nCVSS Base Score: 5.4\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/138079 [https://exchange.xforce.ibmcloud.com/vulnerabilities/138079]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}, {"filename": "swg22013058.txt", "chunk_id": "doc_25935_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Developer Portal is affected by cross-site scripting vulnerability (CVE-2018-1430) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n API Connect Developer Portal has addressed the following vulnerability.\n\nIBM API Connect Developer Portal is vulnerable to cross-site scripting. This vulnerability allows users to embed arbitrary JavaScript code in the Web UI, thus altering the intended functionality and potentially leading to credentials disclosure within a trusted session. \n\nVULNERABILITY DETAILS\n\nCVEID:CVE-2018-1430 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-1430]\nDESCRIPTION:IBM API Connect is vulnerable to cross-site scripting. This vulnerability allows users to embed arbitrary JavaScript code in the Web UI thus altering the intended functionality potentially leading to credentials disclosure within a trusted session.\nCVSS Base Score: 5.4\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/139226 [https://exchange.xforce.ibmcloud.com/vulnerabilities/139226]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}, {"filename": "swg22008372.txt", "chunk_id": "doc_25501_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect is affected by a Cross Frame Scripting vulnerability CVE-2017-1551 - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n API Connect has addressed the following vulnerability. \n\nIBM API Connect could allow a remote attacker to hijack the clicking action of the victim. \n\nVULNERABILITY DETAILS\nCVEID: CVE-2017-1551 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-1551]\nDESCRIPTION: IBM API Connect could allow a remote attacker to hijack the clicking action of the victim. By persuading a victim to visit a malicious Web site, a remote attacker could exploit this vulnerability to hijack the victim's click actions and possibly launch further attacks against the victim.\nCVSS Base Score: 5.4\nCVSS Temporal Score: See https://exchange.xforce.ibmcloud.com/vulnerabilities/131291 [https://exchange.xforce.ibmcloud.com/vulnerabilities/131291] for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N) \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nAffected API Connect Affected Versions IBM API Connect 5.0.0.0-5.0.6.3 IBM API Connect 5.0.7.0-5.0.7.2 REMEDIATION/FIXES\n \n\nAffected Product Addressed in VRMF APAR Remediation/First Fix IBM API Connect \n\n"}, {"filename": "swg22015968.txt", "chunk_id": "doc_26251_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect is affected by an information leakage vulnerability (CVE-2018-1468) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n API Connect has addressed the following vulnerability. \n\nAn API Connect user can get access to internal environment and sensitive API details to which they are not authorized.\n\n\n\nVULNERABILITY DETAILS\nCVEID:CVE-2018-1468 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-1468]\nDESCRIPTION:An API Connect user can get access to internal environment and sensitive API details to which they are not authorized.\nCVSS Base Score: 4.3\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/140399 [https://exchange.xforce.ibmcloud.com/vulnerabilities/140399]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N)\n\nAFFECTED PRODUCTS AND VERSIONS\n \n\nAffected API Connect Affected Versions IBM API Connect 5.0.8.1-5.0.8.2 REMEDIATION/FIXES\n \n\nAffected Product Addressed in VRMF APAR Remediation / First Fix IBM API Connect\n\n5.0.8.1 5.0.8.1iFix_20180107-0316_e0506c4ca64d and above\n\n5.0.8.2 5.0.8.3 LI79980 Addressed in IBM API Connect V5.0.8.3.\n\nManagement Server is impacted.\n\n"}, {"filename": "swg22015105.txt", "chunk_id": "doc_26159_chunk_0000", "text": "Title: IBM Security Bulletin: API Connect Developer Portal is affected by Drupal vulnerability (CVE-2018-7600) - United States\n\nText:\n SECURITY BULLETIN\n\nSUMMARY\n IBM API Connect has addressed the following vulnerabilities. \n\nAPI Connect Developer Portal is impacted by Drupal vulnerability:\n\nDrupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system. \n\nVULNERABILITY DETAILS\n\nCVEID:CVE-2018-7600 [http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-7600]\nDESCRIPTION:Drupal could allow a remote attacker to execute arbitrary code on the system, caused by an error within multiple subsystems. An attacker could exploit this vulnerability using multiple attack vectors to execute arbitrary code on the system.\nCVSS Base Score: 9.8\nCVSS Temporal Score: Seehttps://exchange.xforce.ibmcloud.com/vulnerabilities/140913 [https://exchange.xforce.ibmcloud.com/vulnerabilities/140913]for the current score\nCVSS Environmental Score*: Undefined\nCVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) \n\nAFFECTED PRODUCTS AND VERSIONS\n \n\n"}]}, {"id": "TRAIN_Q264", "question": "Why are data source connections to Microsoft SQL Server failing after upgrading WebSphere Application Server?\n\n\n\nWebSphere Application Server v7 and Java SDK were updated to Fix Pack v7.0.0.37. Afterward, all data source connections to Microsoft SQL Server failed.", "answer": "After updating WebSphere Application Server v7 and Java SDK to Fix Pack v7.0.0.37, data source connections to Microsoft SQL Server failed because the Microsoft SQL Server database does not have the necessary components present. Specifically, it lacks the stored procedure 'master..xp_jdbc_open', which is required for connectivity. This issue arises due to the fact that WebSphere Application Server versions prior to V6.1 were designed to be compatible with Microsoft SQL Server 2000, and thus they are not fully compatible with Microsoft SQL Server 2005. To resolve this problem, ensure that your SQL Server installation includes the necessary components and procedures.", "documents": [{"filename": "swg21168355.txt", "chunk_id": "doc_10784_chunk_0000", "text": "Title: IBM Test connection button in WebSphere Application Server fails when trying to connect to Microsoft SQL Server datasource (XA) - United States\n\nText:\nMS SQL Server; test connection; datadirect; data direct; could not find stored procedure; stored procedure TECHNOTE (TROUBLESHOOTING)\n\nPROBLEM(ABSTRACT)\n The test connection button fails to establish a connection to Microsoft® SQL Server with a \"Could not find stored procedure 'master..xp_jdbc_open' \" error when connecting from WebSphere® Application Server. \n\nSYMPTOM\n[1/31/11 13:39:35:799 EST] 0000002d DSConfigurati W DSRA8201W: DataSource Configuration: DSRA8040I: Failed to connect to the DataSource. Encountered java.sql.SQLException: [IBM][SQLServer JDBC Driver][SQLServer]Could not find stored procedure 'master..xp_jdbc_open2'.DSRA0010E: SQL State = HY000, Error Code = 2,812.\n\n\nCAUSE\nThe following exception occurs due to missing components from the Microsoft SQL Server database: \n\n"}, {"filename": "swg21496900.txt", "chunk_id": "doc_14865_chunk_0004", "text": "here Administrative Console and navigate to Resources > JDBC > Data sources > datasource_name > WebSphere Application Server data source properties\n\n\nYou can find more information on data source properties in the WebSphere Application Server data source properties [http://publib.boulder.ibm.com/infocenter/wasinfo/v7r0/index.jsp?topic=/com.ibm.websphere.express.doc/info/exp/ae/udat_jdbcdatasorprops.html] topic within the WebSphere Application Server Information Center.\n\n\n\nAside from preventing loss of the database connection, there are some recovery options. \n\n\n\nThe property that controls the behavior after a data store connection loss in WebSphere Application Server is sib.msgstore.jdbcFailoverOnDBConnectionLoss. In WebSphere Application Server Version 7, this property value is set to true, by default.. For more information, see the Configuring messaging engine and server behavior when a data store connection is lost [http://www14.software.ibm.com/webapp/wsbroker/redirect?version=compass&product=was-nd-mp&topic=tjm_dsconnloss] topic in the WebSphere Application Server Information Center. Some of the information from that topic is elaborated on in the following text: \n\n\n\n\n"}, {"filename": "swg21254636.txt", "chunk_id": "doc_11359_chunk_0000", "text": "Title: IBM Microsoft SQL S
